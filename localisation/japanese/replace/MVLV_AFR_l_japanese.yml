 AFR_increase_UNF: "国連分担金の改正"
 AFR_increase_UNF_desc: ""
 AFR_EUR: "EUの経済的影響"
 AFR_EUR_desc: "欧州がアフリカへの投資を増やし、両国の関係を緊密化させるにつれて、連合アフリカはアフリカにおける欧州企業の行動を効果的に規制し、アフリカが両国間の貿易からより多くの利益を得ることを可能にするが、それに応じてアフリカは欧州の投資家により多くの見返りを提供する必要がある。"
 AFR_victory_inspiration: "勝利への展望"
 AFR_victory_inspiration_desc: ""
 AFR_nato_intel_network: "NATO情報網"
 AFR_nato_intel_network_desc: ""
 AFR_tsf_eur_factory: "欧州の戦術機工場"
 AFR_tsf_eur_factory_desc: "効率化されたマニュアルにより旧式機の生産は容易になる。"
 AFR_many_ethnic_issues: "多すぎる民族問題"
 AFR_many_ethnic_issues_desc: "BETA戦争の現実を知るのはごくわずかであり、この広大な大陸のほとんどの民族は利権への執着と外人への妨害に明け暮れている。"
 AFR_repair_idea: "スエズの修復技術"
 AFR_repair_idea_desc: "欧州の修復技術によりアフリカの要塞はより一層強固となる。"

