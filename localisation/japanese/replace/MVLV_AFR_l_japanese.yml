l_japanese:
 AFR_focus_tree: "アフリカ連合 国家方針ツリー"
 AFR_SecureSuezFront: "スエズラインの安定化"
 AFR_SecureSuezFront_desc: "将来の計画はすべて、スエズ防衛の安全を確保することから始まる。"
 AFR_ConsolidateCommandingSequence: "指揮系統の統合"
 AFR_ConsolidateCommandingSequence_desc: "対外的にはひとつになっていると主張しているが、指揮系統はまだ分散しすぎており、修正しなければならない。"
 AFR_EvaluateDefenceLineCapabaility: "防衛網の評価"
 AFR_EvaluateDefenceLineCapabaility_desc: "紅海の防衛ラインは何度かの戦闘を乗り越えてきたが、将来起こりうる、より激しい防衛戦の必要性を満たしているのだろうか？"
 AFR_UnbreakableDefence: "破れぬ護り"
 AFR_UnbreakableDefence_desc: "15年前、我々は紅海でBETAとの血みどろの戦いを開始した。流血の15年後、スエズラインはいまだ強固に立ち続け、我々の防衛は金のように堅固で、突破される可能性はない。"
 AFR_FocusOnHomefront: "後方に注力"
 AFR_FocusOnHomefront_desc: "防衛網には当分の間、これ以上のリソースを投入する必要はないのだから、その余剰リソースを後方の開発に充てたほうがいいかもしれない。"
 AFR_AttractInvestment: "投資誘致"
 AFR_AttractInvestment_desc: "私たちの大きな僻地である南アフリカは、アフリカ全体でも最高のインフラを有しており、外国人投資家をこの国に呼び込むことができれば、さらに発展させることができると考えている。"
 AFR_IncreaseResourcesProduction: "資源開発"
 AFR_IncreaseResourcesProduction_desc: "戦争のエンジンは、資源の安定供給なしには機能しない。"
 AFR_ImportAdvancedProductionTech: "高度な生産技術の導入"
 AFR_ImportAdvancedProductionTech_desc: "ヨーロッパ崩壊後、ヨーロッパの亡命者をかなり吸収したが、まだ他国ほど高度な生産ラインは構築できておらず、技術を消化する必要がある。"
 AFR_LiftConsumerGoodsLimitation: "消費財制限の解除"
 AFR_LiftConsumerGoodsLimitation_desc: "長年の戦争で国民は疲弊している。 アフリカが安全になり、あらゆる産業が活況を呈している今こそ、消費財に対するノルマを撤廃し、人々の満足度を高める時だ。 安全な環境はまた、アフリカへの外国投資をさらに引き寄せるだろう。"
 AFR_SafeContinent: "安全な大陸"
 AFR_SafeContinent_desc: "アフリカ大陸はアメリカ大陸と同様、全人類にとって汚れなき地となるだろうと予測できる。"
 AFR_FormOrbitalCorps: "軌道部隊の結成"
 AFR_FormOrbitalCorps_desc: "大陸の安全が確認されたのだから、将来のハイヴ攻略作戦の道を開くために、軌道上の軍隊の結成も考え始めるべきだ。"
 AFR_Re_evaluateOurPosition: "国際連合での役割を見直す"
 AFR_Re_evaluateOurPosition_desc: "アフリカ連合が世界の大国のひとつになったことは否定できない。"
 AFR_SafeHomeFront: "安全な後方"
 AFR_SafeHomeFront_desc: "堅固な防衛のおかげで、アフリカの人々はBETA戦争の恐怖から徐々に脱しつつある。"
 AFR_PrepareForAllPossibilities: "雨の日に備える"
 AFR_PrepareForAllPossibilities_desc: "スエズラインが当面破られることはないだろうという事実は、過去の栄光に甘んじる理由にはならない。"
 AFR_SecondaryDefenceLine: "代替防衛ライン"
 AFR_SecondaryDefenceLine_desc: "もしラインを突破されたら、急いで別の防御線を組織する余裕はない。"
 AFR_FortificationGroupTactics: "要塞戦術"
 AFR_FortificationGroupTactics_desc: "東ドイツや中国統一戦線が戦術を遅らせるために要塞群に頼ったのは、スエズ防衛で実証されたように、ずっと昔に証明された戦術だった。"
 AFR_RequestMilitaryAids: "軍事援助の要請"
 AFR_RequestMilitaryAids_desc: ""
 AFR_ParticipateInTSFDev: "戦術機開発への参加"
 AFR_ParticipateInTSFDev_desc: "世界で最も激しい砂漠地形での戦闘があるが、これは現在主流の戦術機開発の方向性とは異なるものであり、戦闘のニーズを満たすために国際的な戦術機開発に参加すべきである。"
 AFR_LocalizeTSFProduction: "現地での戦術機生産"
 AFR_LocalizeTSFProduction_desc: "戦術機の生産を外国軍に依存することは、結局のところ長期的な解決策にはならない。 しかし、わが国の産業基盤が脆弱であることを考えれば、部品の性能不足は予想されることである。"
 AFR_SeasonedDefenceDoctrine: "実証済みの防衛戦理論"
 AFR_SeasonedDefenceDoctrine_desc: "長年BETAと戦ってきたことで、世界のどの国にも劣らないBETAに対する防衛の経験を蓄積することができた。"
 AFR_PrepareForCounterAttack: "反撃の準備"
 AFR_PrepareForCounterAttack_desc: "アンバールハイヴは最大の脅威であり、反撃の準備をしなければならない。"
 AFR_TargetH09: "剣をアンバールに"
 AFR_TargetH09_desc: "かつて我々のものだった土地を取り戻し、アンバールハイヴの脅威を一掃する時が来た。"
 AFR_NorthAfricaCoastalDefence: "北アフリカ沿岸防衛"
 AFR_NorthAfricaCoastalDefence_desc: "欧州連合軍がシチリア島を保持できず、ジブラルタル方面から地中侵攻を受けた場合、北アフリカ沿岸が直接の第一戦線となることを考慮し、直ちに要塞化の準備をしなければならない。"
 AFR_LessonsFromJihadUnionForce: "中東における連合軍の経験"
 AFR_LessonsFromJihadUnionForce_desc: "中東のムジャヒディーンは、C.S.S.の後、最初にBETAと交戦した。彼らは初戦は善戦したが、最終的には敗北から立ち直ることはできなかった。"
 AFR_ReformAdministrativeSystem: "行政制度改革"
 AFR_ReformAdministrativeSystem_desc: "複雑に入り組んだ行政システムは、効率性を低下させるだけだ。複数の力に引っ張られるのではなく、最近の政府機関に最も必要なのは効率性だ。"
 AFR_aNewAfricaUnion: "より緊密なアフリカ連合"
 AFR_aNewAfricaUnion_desc: "今日のアフリカ連合を構成する国々のもともとの政府も、行政システムの改革を経て、より緊密で効率的な相互協力ができるようになった。"
 AFR_IntimateEuropeanUnion: "欧州連合に近づく"
 AFR_IntimateEuropeanUnion_desc: "私たちは常にEUと緊密な協力関係を築いてきた。"
 AFR_IndependentAfricaUnion: "独立したアフリカ"
 AFR_IndependentAfricaUnion_desc: "EUの協力は私たちに多くの利益をもたらし、上層部の多くはいくつかの問題をEUの独断に委ねることに慣れてしまったが、アフリカ連合の未来を切り開くためには、私たちは自治の道に踏み出さなければならない。"
 AFR_ResourcesForIndustry: "産業用資源"
 AFR_ResourcesForIndustry_desc: "EUに比べれば、私たちはアフリカ大陸を手中に収め、かなり潤沢な資源を供給しており、おそらくその優位性をEUと交換し、追加の産業援助を得ることができるだろう。"
 AFR_CoopDefenceSicily: "シチリア防衛に貢献"
 AFR_CoopDefenceSicily_desc: "EUと手を携えて行くという誠意の証として、シチリア島の防衛を支援するために自国の陸軍をシチリア島に派遣するくらいのことはできるはずだ。"
 AFR_PurchaseEuroTSFs: "ヨーロッパの戦術機を購入"
 AFR_PurchaseEuroTSFs_desc: "EUの戦術機の優秀さは世界でもよく知られており、戦術機部隊を強化するためには、欧州製の戦術機を導入することも選択肢の一つとして考えられる。"
 AFR_SeekDevCoop: "共同研究を求めて"
 AFR_SeekDevCoop_desc: "両国間のより深い協力のより高い段階として、我々はEUと科学技術の共同研究開発に関する合意に達するだろう。"
 AFR_ProvideConsumableForEU: "欧州連合への消費財提供"
 AFR_ProvideConsumableForEU_desc: "欧州連合（EU）には現在、国内人口に消費財を供給する余力がない。"
 AFR_JointH12Suppression: "リヨンハイヴの共同制圧"
 AFR_JointH12Suppression_desc: "ハイヴによる地下掘削の脅威は、EUだけでなく、アルジェ周辺の治安にとっても脅威であり、この脅威を一掃するためには、EUと共同でハイヴを一掃する作戦を開始しなければならない。"
 AFR_LimitedCoopWithEU: "欧州連合との限られた協力"
 AFR_LimitedCoopWithEU_desc: "また、欧州連合（EU）との協力にも限界がある。"
 AFR_IncreaseOurShare: "分担金の増加"
 AFR_IncreaseOurShare_desc: "国際連合とのさらなる協力のためには、誠意を示す必要もある。"
 AFR_WorkWithUNIndustries: "国際連合への産業協力"
 AFR_WorkWithUNIndustries_desc: "国連統合軍は工業能力を強化するためにより多くの地域を必要としており、同様に我々もより多くの工場を必要としている。"
 AFR_ParticipateInUNProject: "国際連合プロジェクトに参加"
 AFR_ParticipateInUNProject_desc: "国連統合軍の科学研究プロジェクトの成果は、参加するすべての加盟国に差別なく提供される。"
 AFR_Rewards: "収穫"
 AFR_Rewards_desc: "プロミネンス計画から得られる貴重なデータは、我々の戦術機開発プログラムを大きく加速させるだろう。"
 AFR_VictoryInspiration: "勝利への展望"
 AFR_VictoryInspiration_desc: "過酷な戦いの末、我々はついにハイヴを突破した。 この勝利は、アフリカ連合のために、BETAを完全に殲滅する出発点となる!"
 AFR_EmployUSMilitaryAdvisors: "米軍事顧問団の参加"
 AFR_EmployUSMilitaryAdvisors_desc: "米陸軍は、われわれに欠けている陸上部隊の横の連携について世界で最も豊富な経験を持っており、米国から軍事顧問を雇うことは、この問題の解決策になるかもしれない。"
 AFR_IncreaseWarthogImportAmount: "A-10の調達拡大"
 AFR_IncreaseWarthogImportAmount_desc: "小型種を制圧するA-10の能力は世界に明らかであり、スエズ防衛のニーズを満たすためには、A-10の輸入を拡大する必要がある。"
 AFR_JoinNATOIntelNetwork: "NATO情報システムへの加盟"
 AFR_JoinNATOIntelNetwork_desc: "米国は我々に、NATOの情報ネットワークシステムに参加し、BETAの動きを共同で観測するという新たな提案をしてきた。 我々はハイテク監視装置を欠いており、拒否する理由はない。"
 AFR_AcceptNATO_AfricaCoalitionForce: "NATOアフリカ連合軍の受け入れ"
 AFR_AcceptNATO_AfricaCoalitionForce_desc: "NATO加盟後、私たちは北米に部隊を派遣して訓練を受け、そして今、このNATOで訓練された精鋭部隊がついに帰国した。"

###ideas
 AFR_eu_support: "欧州連合による積極的支援"
 AFR_eu_support_desc: "アフリカは欧州連合にとって非常に多くの意味を持っており、スエズやシチリアが陥落することは絶対に避けなければならない。そのため欧州連合はアフリカ諸国に多大な投資を行っている。"
 AFR_eua: "経済的植民地"
 AFR_eua_desc: "アフリカは欧州から多大な支援を受けているが、それは欧州や世界に対して発言力が低下していることを示している。工場のライン一つ変更するだけでも欧州企業に伺いを立て無ければならず、旧宗主国による経済的な再植民地化であるとも言われている。"
