l_japanese:
 DOCTRINE_TRACK_INFANTRY_ARTY: "歩兵および支援兵器"
 DOCTRINE_TRACK_INFANTRY_ARTY_DESC: "すべてを支えるのは人民であり支援兵科達だ。"
 DOCTRINE_TRACK_ARMOR: "装甲兵力"
 DOCTRINE_TRACK_ARMOR_DESC: "BETAに対する主力であり、壁であり、火力である。"
 DOCTRINE_TRACK_TSF: "戦術機"
 DOCTRINE_TRACK_TSF_DESC: "戦線を切り開き、勝利に導く人類の切り札。"
 
 GRAND_DOCTRINE_HIGH_LEVEL_WARFARE: "高次元打撃"
 GRAND_DOCTRINE_HIGH_LEVEL_WARFARE_DESC: "豊富な物資と軍質に裏打ちされた多角的な火力投射により、効率的な作戦を行う。"
 GRAND_DOCTRINE_ALL_TSF: "ALL-TSF"
 GRAND_DOCTRINE_ALL_TSF_DESC: "戦術機動兵器は我々の作戦の中核である。よってこれを主軸とした作戦立案を行う。"
 GRAND_DOCTRINE_TRENCH_WARFARE: "総力戦"
 GRAND_DOCTRINE_TRENCH_WARFARE_DESC: "人は資源であり、何一つ余さず総力を持って国土を防衛し、BETAを駆逐する。"

 SUBDOCTRINE_BREAKWATER_OF_HUMANITY: "人民の防波堤"
 SUBDOCTRINE_BREAKWATER_OF_HUMANITY_DESC: "人は盾であり、壁であり、火点であり、全ての基礎である。"
 SUBDOCTRINE_ARTILLERY_GODDESS: "戦場の女神"
 SUBDOCTRINE_ARTILLERY_GODDESS_DESC: "砲を崇め、砲を称え、砲を賛美せよ。圧倒的火力は正義だ。"
 SUBDOCTRINE_GENERAL_SUPPORT: "汎用支援"
 SUBDOCTRINE_GENERAL_SUPPORT_DESC: "広範かつ潤沢な支援により主力部隊の能力を最大限に引き上げる。"
 SUBDOCTRINE_THOROUGH_MAINTENANCE: "徹底整備"
 SUBDOCTRINE_THOROUGH_MAINTENANCE_DESC: "過酷な環境でも常に十全を発揮できるよう整備部隊に重点を置く。"

 SUBDOCTRINE_MOBILE_DEFENCE: "機動防御"
 SUBDOCTRINE_MOBILE_DEFENCE_DESC: "装甲戦力の機動力を活かし、広範な防衛線をより効率よく支える。"
 SUBDOCTRINE_ATTRITION_STRATEGY: "漸減作戦"
 SUBDOCTRINE_ATTRITION_STRATEGY_DESC: "局所的な攻勢で敵軍量を定期的に削減し、防衛の余裕と縦深を確保する。"
 SUBDOCTRINE_HIGH_ROTATION: "高回転運用"
 SUBDOCTRINE_HIGH_ROTATION_DESC: "装甲戦力の整備・補給速度を向上させ、迅速な戦線復帰を行う。"
 SUBDOCTRINE_ARMS_COOPERATION: "諸兵科連携"
 SUBDOCTRINE_ARMS_COOPERATION_DESC: "諸兵科の連携で、より効率的な装甲運用を行う。"

 SUBDOCTRINE_SUPPORT_TSF_OPERATION: "支援運用"
 SUBDOCTRINE_SUPPORT_TSF_OPERATION_DESC: "貴重な機動兵器は支援的な運用にこそ真価を発揮するはずだ。"
 SUBDOCTRINE_MOBILE_ASSAULT: "機動強襲"
 SUBDOCTRINE_MOBILE_ASSAULT_DESC: "囮、ブラフ、機動運用により効率よくBETAを殲滅する。"
 SUBDOCTRINE_CLOSE_QUARTERS_COMBAT: "密集近接"
 SUBDOCTRINE_CLOSE_QUARTERS_COMBAT_DESC: "近接戦は最もハイヴ戦に適しており、少ない弾薬で最大限の戦果を得られる。"
 SUBDOCTRINE_LASER_JAGD_TACTICS: "対光線戦"
 SUBDOCTRINE_LASER_JAGD_TACTICS_DESC: "人類の大敵、光線級からの被害軽減、掃討能力向上の訓練方針を策定する。"

 SUBDOCTRINE_ABSOLUTE_DEFENSE_LINE: "死守"
 SUBDOCTRINE_ABSOLUTE_DEFENSE_LINE_DESC: "我々は下がることを許されず、命を賭して防衛する必要がある。"
 SUBDOCTRINE_FLEXIBLE_OPERATION: "柔軟な運用"
 SUBDOCTRINE_FLEXIBLE_OPERATION_DESC: "余裕を持った運用で被害を軽減し、最大限の戦果を得るべく柔軟な作戦を行う。"
 SUBDOCTRINE_THOROUGH_GUIDANCE: "徹底指導"
 SUBDOCTRINE_THOROUGH_GUIDANCE_DESC: "徹底した作戦指導により屈強な軍隊へと育て上げる。"
 SUBDOCTRINE_COMPREHENSIVE_SUPPORT: "包括支援"
 SUBDOCTRINE_COMPREHENSIVE_SUPPORT_DESC: "真の戦場は前線以外にもある。我々は我々の役目を果たすのだ。"