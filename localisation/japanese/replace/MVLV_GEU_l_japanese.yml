####ideas
 GEU_jp_support: "日本による工場移設"
 GEU_jp_support_desc: "BETAに国土を侵略された日本は東南アジアに軍事物資の生産拠点を数多く移設した。それは移設先である大東亜連合にも恩恵をもたらしている。"
 GEU_ast_support: "オーストラリアからの積極的支援"
 GEU_ast_support_desc: "オーストラリアにとって東南アジアはBETAから国を守る盾である。そのため、オーストラリアは積極的に大東亜連合を支援している。"
 GEU_jacaruta: "ジャカルタ宣言"
 GEU_jacaruta_desc: "大東亜連合は東南アジアやインド朝鮮が合同で設立した共同体であるが、多数の国が集まっているがゆえに軍における装備、作戦は全く統一されておらず、軍事行動に著しい支障をきたしていた。これを解消するために装備の統一、作戦の統一を図る機関の設立を目指すとしたジャカルタ宣言が結ばれた。しかし、未だ機関設立の見通しすら立っておらず、混乱はしばらく続く見込みである。"
 GEU_KODA: "シャン邦共和国問題"
 GEU_KODA_desc: "80年代の東南アジアは麻薬の密売が横行する無法地帯となっていた。終わることのない戦争で退廃した人々の心に麻薬が漬け込んでいったのである。この東南アジアにおける麻薬の密売で大きな利益を上げた者がいる。クン・サというその男は麻薬密売の隠ぺいのために武装し国をでっち上げた。それがシャン邦共和国である。そしてクン・サが去ったのちにこの武装組織はKODAと名乗り暗躍している。"
