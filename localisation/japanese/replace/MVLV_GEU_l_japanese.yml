l_japanese:
 GEU_focus_tree: "大東亜連合 国家方針ツリー"
 geug_1: "密売を阻止しろ"
 geug_1_desc: "大東亜連合内に蔓延るKODA等の麻薬組織は国内を、特に前線地域を荒らしまわっている。前線の将兵に麻薬を売っているという話まであるほどだ。98年から我々も調査しているが、奴らは前線に近い地域で活動しているため発見は困難を極めている。部隊の増派を検討すべきだろう"
 geug_3: "決着"
 geug_3_desc: "一年以上に渡って我々はKODAのアジトを潰して回り、時には敗退することさえあったが、ついに本拠地と思われる場所を発見した。ここで決着を付けよう。"
 geug_4: "有効活用"
 geug_4_desc: "KODAが使用していたと思われる工場から使用できる部品の持ち出しに成功した。単なるテロリストとは思えないほど設備が充実しておりRLF等との関連も疑われているが、ひとまずは我々への脅威を取り除いた事を祝おう"
 geug_5: "思わぬ利益"
 geug_5_desc: "KODAの本拠地での調査を継続している部隊から衝撃的な報告が舞い込んできた。なんとBETAが捕獲され研究されていた施設を発見したというのである。我々はすぐさま科学調査チームを派遣し、これを我々の研究機関に移設することとする。"
 geug_6: "余りに多い"
 geug_6_desc: "KODAの捕虜から資源の蓄積所の位置を聞き出せた我々は 余りにも衝撃的な光景を目にすることになった。何隻もの所属不明の小型輸送艦と簡易な港に山積みされた建築資材を発見したのである。これは我が国の国土防衛に役立てることができるだろう。"
 geug_7: "難民あるいはテロリスト"
 geug_7_desc: "KODAが仕切っていたシャン邦共和国の領域に住んでいた部族やKODAの構成員は予想以上に多かった。彼らの中から兵士を募ることができるが、元テロリストを軍に加えることに反発する者も多い。"
 geug_8: "元テロリスト教導部隊"
 geug_8_desc: "KODAの元構成員は長い間前線地域で生活していたからか異様なほどに対BETA戦に関する知識を持っているものが多かった。彼らを正規部隊にそのまま配属するよりも教導部隊としてまとめた方が有益かもしれない。"
 geug_9: "出自不明な研究員"
 geug_9_desc: "BETA研究施設が移設された研究所に元KODAの研究員が配属された。彼らは異常なほどに多くの知識を有しているが出自を一切語らなかった。しかし、身元の安全を条件に我々に協力することを提案してきた。"
 geu_join: "援助を求める"
 geu_join_desc: "我々が大東亜連合を結成して国連の直接指揮から離れてから何年か経つが、未だに我々は自分たちで装備も開発できなければ戦術も確立できていない。前線も徐々に後退しておりこのままでは連合は崩壊してしまう。加盟国間には未だ軋轢があり、意志の統一は多大な時間がかかってしまう。ならば我々は国外に助けを求めるべきではないのだろうか。"
 geu_rep1: "日本との交流"
 geu_rep1_desc: "本土決戦を行ったばかりの日本は最新の戦術を持っているはずだ。以前から我々の領域に工場を移設するなど積極的に投資してくれた日本ならば我々の助けになってくれるかもしれない。"
 geu_rep2: "援助物資"
 geu_rep2_desc: "我々の窮地を見かねた国連が我々に資金を援助すると通知してきた。我々は国連に大して良い印象は持っていなかったが、これ以上ない申し出を断るわけにいかない。"
 geu_rep3: "資金調達"
 geu_rep3_desc: "我々は活発に外交の場でロビー活動を行いかなりの援助を引き出すことに成功した。これで反攻のための装備を揃えることができる。"
 geu_rep4: "積極投資"
 geu_rep4_desc: "我々が本拠を置いている東南アジアには多くの資源が眠っている。これを積極的に探査することでさらなる資金源が得られるだろう。"
 geu_rep5: "分担金を増額"
 geu_rep5_desc: "国連が分担金の増額を求めてきた。これまでの援助の見返りだという事だが、それと同時に研究員の派遣も行ってくれるという事だ。今まで無償で援助を受けてきた我々はこの申し出を受けざるを得ない。"
 geu_rep6: "枯渇する石油"
 geu_rep6_desc: "長年採掘してきた石油は我々の主要な輸出品だったが、これがいくつかの油田で枯渇しかけているという報告が上がってきた。このままでは大切な資金源を失ってしまう。理事会は代わりとなるガスの採掘にシフトするよう企業に命じる決定を下した。"
 geu_rep7: "戦術機購入"
 geu_rep7_desc: "用意した資金を用いて最新の戦術機を購入できる。"
 geu_rep8: "研究投資"
 geu_rep8_desc: "国連の協力もあり我々の研究機関はその規模を大きく拡大することとなった。"
 geu_rep9: "効率的な軍機構"
 geu_rep9_desc: "国連軍からもたらされた最新の戦術は我が軍の戦闘時における機動性を格段に向上させる結果となった。"
 geu_rep10: "ジャングルハイウェイ"
 geu_rep10_desc: "密林が多い地域での補給路を改善する。"
 geu_rep11: "宇宙軍創設"
 geu_rep11_desc: "国連統合軍の退役した装甲駆逐艦の購入と軌道降下戦術の教導隊を招聘を行い大東亜連合航空宇宙軍を創設する。"
 geu_rep12: "国連と共に"
 geu_rep12_desc: "度重なる国連の支援によって我々の国連に対する感情は非常に良いものになった。かつてのように国連の指揮下に入ることに不満を持つ加盟国も多くはないだろう。今こそ我々は国連旗の下で一致団結する時だ。"
 geu_is_god: "団結を目指して"
 geu_is_god_desc: "国連と一定の距離を置き、東アジアの国々の共同体として結成された我々大東亜連合であるが、結成から数年たっても各国政府の意思を統一することは出来ず、軍ですら統率がとれていないありさまである。このままでは我々は国連からの圧力かBETAからの圧力によって崩壊してしまうだろう。結成の理念を守るためにも我々は団結しなければならない。"
 geu_go1: "支払い拒否"
 geu_go1_desc: "国連に支払っている分担金は我々小国の連合にとっては大きな負担である。国連の支援は減るとしてもこれを払わずに済むならば安い代償だろう。"
 geu_go2: "財務統合"
 geu_go2_desc: "加盟国の財務管理を連合本部で一括管理することで無駄を発見し、ある程度の資金の確保に成功した。"
 geu_go3: "死守"
 geu_go3_desc: "戦術機に頼った戦術が世界的に主流となっているが、我々のような小国では戦術機等到底そろえることはできない。通常戦力による防衛戦術の確立に資金を注ぐべきだ。"
 geu_go4: "意識の変化"
 geu_go4_desc: "連合本部が積極的に動き始めると加盟国も徐々に協力的な姿勢に変化してきた。今まで本部まで上がってこなかった前線の情報や戦術情報が報告されるようになり、我々は多くの戦術的教訓を得ることができた。"
 geu_go5: "対光線戦術"
 geu_go5_desc: "今まで我々は光線級への対応を国連に頼ってきたが、マンダレーハイヴの活発化によって数が増えた光線級への対応は国連軍だけでは追いつかなくなってきている。我々も学び、投資するべきだ。"
 geu_go6: "呼びかけの成功"
 geu_go6_desc: "全加盟国の一致した参謀本部設立の試みは成功しつつある。インドや韓国を筆頭に賛成者が増え、我が軍はさらに強力になるだろう！"
 geu_go7: "修正ジャカルタ宣言"
 geu_go7_desc: "本日、ジャカルタ宣言の修正協定が理事会によって承認された。これは完全に今までの障害を解消したとは言えないが、各国の協力体制確立がより加速することは間違いないだろう！"
 geu_go8: "プロパガンダ"
 geu_go8_desc: "政府間の協力によって連合は国民にも団結を求める宣伝を本格的に開始することとなった。"
 geu_go9: "拡充"
 geu_go9_desc: "無駄の多かった連合の諸機構が改善され、適切な装備生産と徴兵が可能になった影響で、新たな部隊を数多く創設することとなった。"
 geu_go10: "火力向上"
 geu_go10_desc: "砲撃による面制圧能力の向上によって、素早くBETAを殲滅する。"
 geu_go11: "税収改善"
 geu_go11_desc: "本部による財政の管理は税収の増加をももたらすこととなった。"
 geu_go12: "最終的解決"
 geu_go12_desc: "あと一歩だ、あと一歩で我々は真に統一された連合へと変わることができる。そうなった暁には世界と渡り合える強力な連合に変貌することができるだろう。"
 geu_go13: "統合研究所"
 geu_go13_desc: "各国の研究機関の統合で我々の研究効率はかつてないほどに改善されている。"
 geu_go14: "改正ジャカルタ宣言"
 geu_go14_desc: "ついにジャカルタ宣言が改正され、連合本部への集権が規定された。これで我々は数々の利権を乗り越えて一致団結し、祖国奪還へと邁進することができるだろう！"
 geu_go15: "影響力の拡大"
 geu_go15_desc: "外交面でも我々の影響力は拡大した。各国に働きかけて多くの資金を得ることが可能だ。"
 geu_ghard1: "緊急展開"
 geu_ghard1_desc: "まじかに迫るBETAを退けるため、新造の戦術機を緊急展開する。"
 geu_ghard2: "緊急徴用"
 geu_ghard2_desc: "緊急的措置で工場に人を増員する、軍事物資の増産を急がせるのだ。"
 geu_ghard3: "戦術機輸入"
 geu_ghard3_desc: "各国の中古戦術機を緊急購入し、前線に投入する。"
 geu_ghard4: "緊急投資"
 geu_ghard4_desc: "後方を支える基礎工業にも緊急的に投資、徴用された人員の派遣を行って戦線を支える工業を拡充する。"
 geu_ghard5: "軍事顧問招聘"
 geu_ghard5_desc: "連合の危機に形振り等構っていられない。あらゆる国から我々を援助してくれる人材を呼び寄せるのだ。"
 geu_ghard8: "研究の国際化"
 geu_ghard8_desc: "世界的な研究機関に投資することで我々も恩恵に与ることができる。"
 geu_ghard9: "挙国一致"
 geu_ghard9_desc: "国民にはこの局面を耐え忍んでもらうしかないが、不満や恐怖を払いのけるために我々も宣伝努力を怠らない。"
 geu_ghard10: "独自戦術"
 geu_ghard10_desc: "かつて我々の連合の領域における僻地でで生活していた部族の協力を得て我々は我々の領域における戦術の確立に成功した。BETAに地形が食い荒らされる前に反撃を行うべきだ！"
