 SOV_rs33: "帰還"
 SOV_rs33_desc: "我々はついに祖国を奪還した。多大な時間がかかるだろうが全人民が協力して復興に臨む！"
 SOV_ru2: "中央軍事会議"
 SOV_ru2_desc: "中央軍事委員会は参謀本部の上に位置し、全軍を効率的に統率している。"
 SOV_ru4: "効率的な徴兵"
 SOV_ru4_desc: "全人民が徴兵される我が国で、徴兵逃れは許されない。"
 SOV_ru5: "効率的な指導"
 SOV_ru5_desc: "軍学校での教育カリキュラムを見直す"
 SOV_ru6: "打撃力の向上"
 SOV_ru6_desc: "適切に人員が配置されたことで、軍全体の打撃力の向上に繋がった。"
 SOV_ru7: "AL弾改良"
 SOV_ru7_desc: ""
