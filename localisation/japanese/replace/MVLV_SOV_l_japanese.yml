 SOV_main: "祖国奪還に向けて"
 SOV_main_desc: "現在、我が祖国はその9割もの土地を失陥している。現在の体制では遠からず我が国は滅亡してしまうだろう。社会主義の火を消してはならない！改革を断行し、BETAを排除してモスクワへ帰還する方法を早急に策定する必要がある。数々の方法があるだろうが、我々は最善を選ばなければならない。"
 SOV_rs: "共産党宣言"
 SOV_rs_desc: "党の指導力が末端まで行き渡るように腐敗を粛正しなければならない。"
 SOV_rs2: "ソビエト式電気工業"
 SOV_rs2_desc: "コンピュータの発展は祖国奪還に不可欠である。"
 SOV_rs3: "犠牲と経験"
 SOV_rs3_desc: "我が国は世界で最も対BETA戦経験値のある国である。これを軍に徹底的に教育する。"
 SOV_rs4: "赤い津波"
 SOV_rs4_desc: "いよいよ祖国奪還をめざす大反攻作戦計画の準備が開始される。我が国は下等生物には屈しない！"
 SOV_rs5: "工業への注力"
 SOV_rs5_desc: "工業力が無くては何も始まらない。工業力を強化する。"
 SOV_rs6: "軍への注力"
 SOV_rs6_desc: "奪還作戦に際し、正面で戦う軍全体を強化する。"
 SOV_rs7: "装備生産の拡大"
 SOV_rs7_desc: ""
 SOV_rs8: "基盤工業の拡大"
 SOV_rs8_desc: ""
 SOV_rs9: "軍用道路の拡大"
 SOV_rs9_desc: ""
 SOV_rs10: "大規模演習"
 SOV_rs10_desc: ""
 SOV_rs11: "対光線演習"
 SOV_rs11_desc: ""
 SOV_rs12: "沿岸演習"
 SOV_rs12_desc: ""
 SOV_rs13: "追加の研究枠"
 SOV_rs13_desc: ""
 SOV_rs14: "工場の購入"
 SOV_rs14_desc: "党の資産の殆どを売却し、国外の工場を多数購入する。豪華な調度品などソビエトには必要ない。"
 SOV_rs15: "統一された指導部"
 SOV_rs15_desc: "全連邦共産党指導部にもはやロシア人以外は存在しない、反乱を起こすかもしれない危険分子を排除することで更なる産業、作戦の効率化が図れるだろう。"
 SOV_rs16: "知恵を集める"
 SOV_rs16_desc: "民族ごとに分けられた部隊はそれぞれの軍閥に所属し、それぞれ戦っている。これでは貴重な対BETA戦経験値が失われてしまう。民族をまたぐ司令部を設立し、経験値を共有する。"
 SOV_rs17: "指導部の多民族化"
 SOV_rs17_desc: "共産党指導部は全人民を一律に統制するため、あらゆる民族から選抜された党員が指導部を構成し、効率的な指導を展開するべく改革される。"
 SOV_rs18: "完成された戦術"
 SOV_rs18_desc: "あらゆる民族から対BETA戦経験値を吸収したことで革命的な戦術が完成した。ソビエト連邦軍の戦闘力はこれまでとは比較にならない！"
 SOV_rs19: "第三計画の残滓"
 SOV_rs19_desc: "祖国奪還は通常の戦力だけでは成しえない。非人道的なものであっても祖国の役に立つのなら容赦なく使用する。幸い我々にはかの第三計画で使われた技術が残っている。手始めにユーコン基地で試験部隊の運用を開始する必要があるだろう。"
 SOV_rs20: "計画最終段階"
 SOV_rs20_desc: "反攻作戦の準備は整いつつある。我が国は必ず成し遂げるのだ。"
 SOV_rs21: "П3計画"
 SOV_rs21_desc: "第三計画で偶然とはいえ発見されたフェインベルク現象の研究によって、我々はナストロイカ効果の発生とその制御技術を手に入れた。白き結晶から生み出された特殊胚を用いたプラーフカを制御し戦闘で使用できる機体は、通常の有人戦術機とは比べ物にならない程の威力を発揮するだろう。"
 SOV_rs22: "オペレーション レッドストーム"
 SOV_rs22_desc: "あらゆる努力を経てついに作戦の開始準備が整った。全ての人民が同志書記長の命令を待っている！"
 SOV_rs23: "北米に注力"
 SOV_rs23_desc: ""
 SOV_rs24: "極東に注力"
