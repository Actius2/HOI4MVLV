 SOV_ru10: "追加の研究枠"
 SOV_ru10_desc: ""
 SOV_ru11: "砲撃データリンク"
 SOV_ru11_desc: ""
 SOV_AnotherFiveYearPlan: "五ヵ年計画"
 SOV_AnotherFiveYearPlan_desc: "第十四次五ヵ年計画が終わりに近づくにつれ、その成果を総括する時が来た。"
 SOV_RelocateProductionToAlaska: "アラスカへの工場疎開"
 SOV_RelocateProductionToAlaska_desc: "いわゆる -西側の友人 -たちは、-必要な準備 -としてアラスカの土地を与えてくれた。"
 SOV_AbsorbRefugeeAsLabourers: "難民労働力の吸収"
 SOV_AbsorbRefugeeAsLabourers_desc: "極東支配地域からの難民を工場に組織化することは、時に「必要なコスト」を伴うものの、安定への圧力を緩和する効果的な方法となりうる。"
 SOV_WartimeEconomyMobilization: "戦時経済動員"
 SOV_WartimeEconomyMobilization_desc: "情勢が安定すれば、戦争マシンを継続するための新たな五ヵ年計画を準備することができる。"
 SOV_CollectivismPropaganda: "集団主義プロパガンダ"
 SOV_CollectivismPropaganda_desc: "BETAとの戦いは全人類の戦いであり、集団の戦いである。 もちろん、失敗も同様だ。"
 SOV_AtAllCosts: "全力を尽くす"
 SOV_AtAllCosts_desc: "もっと、もっと必要だ。"
 SOV_AllEthnicGroupEquality: "すべての民族の平等を守る"
 SOV_AllEthnicGroupEquality_desc: "126の国籍は連邦の不可分の一部であり、すべての国籍の平等の主張は揺るぎない。"
 SOV_SteadyAdvance: "順調に進む"
 SOV_SteadyAdvance_desc: "-安定、安定の中の進歩-、安定を主要な基調とし、全体的な状況の安定を維持することを前提に進歩を追求する。"
 SOV_ExpandBasicIndustry: "基礎産業の拡大"
 SOV_ExpandBasicIndustry_desc: "建設現場が増え、工場が増え、労働者が増える。"
 SOV_ImportAdvancedEquipmentandTechnology: "先端設備・技術の導入"
 SOV_ImportAdvancedEquipmentandTechnology_desc: "第15次五ヵ年計画は、戦術機の高コストとこの兵器の大きな必要性との矛盾を解決することに基づいている。"
 SOV_InvestInResearch: "研究投資"
 SOV_InvestInResearch_desc: "科学研究への財政投資システムを統合し、戦略的かつ重要な分野に重点を置き、分野分断、小規模化、断片化の状態を改める。 連邦の科学技術プログラムのシステムと運営メカニズムを最適化し、重点分野におけるプロジェクト、拠点、人材、資金の統合的配分を推進する。"
 SOV_ConcludeExperienceFromEquipmentProduction: "機器製造の経験を集約"
 SOV_ConcludeExperienceFromEquipmentProduction_desc: "”工業基礎再建プロジェクトの実施により、基礎部品、基礎材料、基礎技術、工業技術基礎のボトルネックが補われ、単位生産能力が効果的に改善された。”--連邦の第15次五ヵ年開発計画より抜粋。"
 SOV_GElementResearchFacility: "G元素研究施設"
 SOV_GElementResearchFacility_desc: "明星作戦でアメリカが投下した破壊的兵器は、戦略的抑止力のバランスを崩した。"
 SOV_EnhanceControl: "引締める"
 SOV_EnhanceControl_desc: "腐敗を一掃し、党の指導が草の根に届くようにしなければならない。"
 SOV_EthnicGroupsIssue: "民族問題"
 SOV_EthnicGroupsIssue_desc: "主要な民族ではなく、政治的な思想に基づいて形成された連合である以上、建前が崩れそうな時期に民族政策を調整する方が、党にとっても国民にとっても得策かもしれない。"
 SOV_Russianism: "大ロシア主義"
 SOV_Russianism_desc: "ロシア民族がいまだ残存国民の圧倒的多数を占めている現在、彼らの動員を最大化することが最善の利益であることは間違いない。 大ロシア主義を限定的に復活させることも容認できる。"
 SOV_PoliticalCorrectness: "政治的平等"
 SOV_PoliticalCorrectness_desc: "連邦政府内おける少民族地域の人々を増やすことで、民族平等の政策を実行に移すことができる。"
 SOV_SteadyReformation: "着実な改革"
 SOV_SteadyReformation_desc: "民族政策の改革を急ぐことはできないし、急進的すぎる方向性は不必要な損失を招くかもしれない。"
 SOV_LeadershipMadeUpByRussianOnly: "ロシア人だけの指導部"
 SOV_LeadershipMadeUpByRussianOnly_desc: "ロシア系指導者が多数を占めると、他の民族の反発を招きながらも、ロシア系民族主導のプロジェクトに多大な資源を投入し、ロシア系民族の人材を優遇することができる。"
 SOV_UnitedLeadershipClass: "統一された指導部"
 SOV_UnitedLeadershipClass_desc: "ソビエト連邦共産党第30回大会以来、党中央委員会の権威と中央集権的で統一的な指導が強力に保障され、党全体として思想的により統一され、政治的により統一され、行動的により一貫している。"
 SOV_ReturnToOurHome: "祖国復帰へ向けて"
 SOV_ReturnToOurHome_desc: "“雪や風 星も飛べば わがこころは はやとおくに地に いかなる不幸が たび重なるとも 二人の友情 とわにかわらず”——《心さわぐ青春の歌》"
 SOV_ForMotherRussia: "奪還の為に"
 SOV_ForMotherRussia_desc: "今、祖国は国土の90%を失っている。 現在の体制では、祖国はまもなく滅びるだろう。 社会主義の火を消してはならない！ 改革を断行し、BETAを排除し、モスクワ復帰のためのプログラムを早急に策定しなければならない。 方法はたくさんあるが、最善の方法を選択しなければならない。"
 SOV_RestatePartyAndArmyRelationship: "党と軍の関係の再確認"
 SOV_RestatePartyAndArmyRelationship_desc: "党と政府の事務所がアラスカに移転して以来、前線部隊と党中央委員会との関係は次第に弱まり、一部の前線同志は軍隊を私兵として扱い始め、軍閥化する傾向にある。 銃を指揮する党の基本方針を再確認する会議を開き、従わない者は内務省に引き渡すべきである。"
 SOV_EnsureRevolutionariesPositionInArmy: "軍における改革派の地位確保"
 SOV_EnsureRevolutionariesPositionInArmy_desc: "革新派は一連の戦闘で保守派に対して戦術的優位を示したが、今日まで続く戦前の陸軍保守派が依然として支配的であり、陸軍のさらなる改革にはつながらない。 革新派の将校が発言力を持ち、陸軍の進歩の主役となるように昇進させるべきである。"
 SOV_TotalWar: "総力戦"
 SOV_TotalWar_desc: "BETAとの戦争は、歴史上のどの戦争よりもはるかに悲劇的であり、国家の総力を結集して戦わなければならない。"
 SOV_EliteForces: "精鋭軍"
 SOV_EliteForces_desc: "大規模な地上軍でBETAを破壊するのは単純にコストがかかりすぎ、達成するのはほとんど不可能だ。軌道降下作戦は、はるかに成功率が高く、はるかにコストのかからない道である。"
 SOV_FloodOfSteel: "鋼鉄の奔流"
 SOV_FloodOfSteel_desc: "確立された機械化軍隊のシステムをフル活用し、部隊間のシナジーを強化することで、迅速な編成と迅速な増援を可能にする。"
 SOV_GuardianOfTheMotherland: "母なる国の守護者"
 SOV_GuardianOfTheMotherland_desc: "戦術機はBETAに対する重要な武器であり、現在の作戦のニーズに合わせてさらに改良されている。"
 SOV_TacticalPerfection: "戦術的完成"
 SOV_TacticalPerfection_desc: "BETAとの戦いの経験をすべて吸収し、革命的な戦術が成し遂げられた。 ソ連軍の戦闘力は、過去のものとはかけ離れていた。!"
 SOV_FormOrbitalDivers: "赤軍軌道降下兵団"
 SOV_FormOrbitalDivers_desc: "軌道上空からの投下は、ハイヴとの戦闘において地上からの前進よりも実行可能であることが証明されており、軌道上の部隊だけでハイヴに対抗するのに十分な規模があれば、祖国を取り戻すことは手の届くところにある。"
 SOV_ProjectP3Completion: "П3計画"
 SOV_ProjectP3Completion_desc: "第三計画で偶然とはいえ発見されたフェインベルク現象の研究によって、我々はナストロイカ効果の発生とその制御技術を手に入れた。白き結晶から生み出された特殊胚を用いたプラーフカを制御し戦闘で使用できる機体は、通常の有人戦術機とは比べ物にならない程の威力を発揮するだろう。"
 SOV_OperationRedStorm: "レッドストーム作戦"
 SOV_OperationRedStorm_desc: "祖国を取り戻すための大反攻のための戦闘計画を準備し始める時がついに来た。 わが国は、劣った生き物に屈することはない！ 全人民は同志書記長の命令を待っている！"
 SOV_MilitaryLeadershipSummit: "中央軍事会議"
 SOV_MilitaryLeadershipSummit_desc: "参謀本部の上に位置する中央軍事委員会は、事実上、全軍を統治している。"
 SOV_EnhanceArtilleryUnits: "強化砲兵"
 SOV_EnhanceArtilleryUnits_desc: "BETA の大規模破壊は依然として砲兵に依存しており、機動戦における砲兵の訓練をさらに改善する必要があります。"
 SOV_DoctrineImprovement: "战役法的改进"
 SOV_DoctrineImprovement_desc: "BETAに対する広範囲での殺傷は依然として砲兵に頼らざるを得ず、機動戦に砲兵が参加するための訓練はさらに進めなければならない。"
 SOV_FrontlineGuidance: "最前線の指導"
 SOV_FrontlineGuidance_desc: "すべての前線部隊にベテランを第一線指揮官として配置する。"
 SOV_BarrageDataLink: "砲撃データリンク"
 SOV_BarrageDataLink_desc: "砲撃の誘導にデータリンクをフル活用することで、砲撃の精度を大幅に向上させ、前線によりよい支援を提供することができる。"
 SOV_RefugeeConscription: "難民募集"
 SOV_RefugeeConscription_desc: "亡命中のソ連難民は帰国して軍に参加するよう呼びかけられ、アラスカ租界に受け入れられている他の国々からの難民も動員されるべきである。"
 SOV_SeekExternalSupportForWar: "BETA戦争のための海外援助"
 SOV_SeekExternalSupportForWar_desc: "赤軍は長期戦のために疲弊しており、-西側の友人- の援助を求めることが有効かもしれない。"
 SOV_NegotiateWithJapan: "日本との交渉"
 SOV_NegotiateWithJapan_desc: "日本は最近、電磁波兵器について私たちに協力を求めている。"
 SOV_ApproveArmSalesToJapan: "対日武器売却"
 SOV_ApproveArmSalesToJapan_desc: "もちろん、サンプル交換という名目で、古い機材の在庫を少し売ることもできる。"
 SOV_NegotiateWithUSA: "アメリカとの交渉"
 SOV_NegotiateWithUSA_desc: "1980年には、戦後に土地を返して欲しければ、追加分の代金を支払わなければならないという、レンドリースに関する取り決めがあった。"
 SOV_NegotiateWithUN: "国際連合との交渉"
 SOV_NegotiateWithUN_desc: "連邦が一時的に決議するのに不都合な問題に数多く遭遇しているにもかかわらず、私たちはまだ総会で2票の追加票を保持している。"
 SOV_OfferAdditionalInfoAboutAL3ToUN: "オルタネイティヴIIIの情報提供"
 SOV_OfferAdditionalInfoAboutAL3ToUN_desc: "香月博士はプロジェクトП3の結果に強い関心を抱いているようで、より多くの -怪物- のために代償を払うことも厭わないのかもしれない。"


#events
 mvlv_sov.1.t: "オペレーション レッドストーム"
 mvlv_sov.1.d: "ついに祖国奪還の大作戦が開始された！我々ソヴィエトの母なる大地を取り戻す時が来たのだ！"
 mvlv_sov.1.a: "Ураааааааа!!"
 mvlv_sov.2.t: "代償"
 mvlv_sov.2.d: "レッドストーム作戦は圧倒的な物資と資材をもって行われた作戦であり、発動の代償を払わねばならない。"
 mvlv_sov.2.a: "同志諸君、今は耐えるのだ"
 mvlv_sov.3.t: "準備完了"
 mvlv_sov.3.d: "偉大なる祖国、母なる大地、我らの聖地を取り戻す時が来た！全ての準備は完了し、全人民は同志書記長の命令を待っている！"
 mvlv_sov.3.a: "故郷へ帰る時が来た！"

