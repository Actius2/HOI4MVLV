 SOV_rs26: "アメリカとの友好"
 SOV_rs26_desc: ""
 SOV_rs27: "欧州との友好"
 SOV_rs27_desc: ""
 SOV_rs28: "帰還"
 SOV_rs28_desc: "我々はついに祖国を奪還した。多大な時間がかかるだろうが全人民が協力して復興に臨む！"
 SOV_rs31: "日本との友好"
