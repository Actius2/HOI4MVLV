####ideas
 EEA_DDR: "東独ありきの連合"
 EEA_DDR_desc: "西欧諸国より先んじてBETAの侵攻に晒された東欧諸国の大部分は、壊滅的な被害を被っており、その中で唯一国力の維持に成功した東ドイツが東欧州同盟を支えていると言って過言ではない。しかし、この事実上の東ドイツ盟主の体制に反発する加盟国政府も珍しくはない。"
 EEA_WTO: "ワルシャワ条約機構"
 EEA_WTO_desc: "ワルシャワ条約機構は、元はNATOに対抗し結成された軍事同盟でありソ連を盟主としていた。しかしソ連が極東撤退し欧州での影響力を失って以降、東西ドイツの軍事交流等、西欧諸国との距離を縮めつつある。"
 EEA_WTO_2: "ワルシャワ条約機構"
 EEA_WTO_2_desc: "ワルシャワ条約機構は、元はNATOに対抗し結成された軍事同盟でありソ連を盟主としていた。しかしソ連が極東撤退し欧州での影響力を失って以降、東西ドイツの軍事交流等、西欧諸国との距離を縮めつつある。"
 EEA_UNI: "離散した指揮系統"
 EEA_UNI_desc: "国土の失陥と共に影響力を減じた東欧諸国の軍隊は、国連軍指揮下、欧州連合指揮下と離散してしまっており一貫した作戦計画の立案が困難となっている。"
 EEA_I1: "研究補助"
 EEA_P1: "東西融和"
 EEA_P1_desc: "東西ドイツの統一は、東欧諸国全体にとっても新たな一歩を踏み出させる象徴的な出来事である。"
 EEA_P2: "同盟は一つ"
 EEA_P3: "再設計"
 EEA_M1: "優秀な前線技術者"
 EEA_M2: "機動支援隊"
