 EEA_P_1: "同盟組織再編"
 EEA_P_1_desc: "我々は、東欧州社会主義同盟と名乗りこそすれど東ドイツ一国だけに大きく依存し同盟の体制は酷く不安定な物になっている。どのような形であっても改革は必須だ。"
 EEA_P_2_A: "東西統一への歩み"
 EEA_P_2_A_desc: "以前から試みられてきた東西の歩み寄りは未だに実現していない。だが費やされた時間は決して無為なものではなく統一を阻む諸問題は解決しつつある。今こそ東西統一に向けて一歩踏み出すべきだ。"
 EEA_P_3_A: "軍事的知見の共有"
 EEA_P_3_A_desc: "西ドイツ軍との軍事的な共闘は既に行われているが真の意味で統一国家が成った時、軍の指揮系統も一本化されるのは必然でありその準備が必要だ。"
 EEA_P_4_A: "東西の装備統一"
 EEA_P_4_A_desc: "西ドイツは欧州連合の主要国の一つであり彼らの装備は、主に西側製のものが多くを占める。今すぐでは無くとも将来的な装備統一は必要だろう。"
 EEA_P_5_A: "研究協定"
 EEA_P_5_A_desc: "対BETA戦争に於いて近しい二国が共同で研究に当たる事は、当然と言える。"
 
 EEA_P_6_AA: "鉄のお嬢さん"
 EEA_P_6_AA_desc: "きっかけとは些細なことだ。\nそう例えば、たまたまそこに居た小さな少女が\n西と東の結束を強固なものにするとは誰も思わなかった。"
 
 EEA_P_6_A: "灯火"
 EEA_P_6_A_desc: "1983年のベルリンで起きた出来事は人々の記憶に焼き付いている。\nあの温かな灯火を夢見て今日まで歩んできた。\nあと少しで、理想へたどり着くための大きな頂を超えることができる。\n掲げるのだ、故郷へ続く灯を"
 EEA_P_7_A: "成就"
 EEA_P_7_A_desc: "これは一つの結末か、それとも新たな序章か。\nこのような危機に際しても決して交わることはないと思われていた2つの同盟がついに手を取り合った。\n今日という記念の灯火は決して消えることはないだろう。"
 EEA_P_8_A: "ひとつのドイツ"
 EEA_P_8_A_desc: "一度灯った火が掻き消される事は無い。\nそれは過去に、そして未来へと続いている。"
 
 EEA_P_2_B: "ソ連への再接近"
 EEA_P_2_B_desc: "東欧州社会主義同盟は、その名の通り社会主義諸国により結成された同盟だ。ソ連とは彼らの極東撤退以後、距離を取っていたが再び接近する事は社会主義を守る選択となるだろう。"
 EEA_P_2_BB: "工業支援"
 EEA_P_2_BB_desc: "我が国の優れた工業機械をソ連に輸出して此方の影響力を増やす。"

 EEA_P_3_B: "対等なる関係"
 EEA_P_3_B_desc: "かつての東欧諸国は、盟主であるソ連に実質的な隷属を強いられてきた。しかしソ連が苦境に追い込まれている今ならば対等な同盟者として関係を築き上げる事も可能だ。"
 EEA_P_4_B: "軍事的支援"
 EEA_P_4_B_desc: "戦術機輸出は、ソ連の貴重な外貨獲得手段であり我々が多数の機体を購入する事は、ワルシャワ条約機構全体にとって損はない。"
 EEA_P_5_B: "戦術指南"
 EEA_P_5_B_desc: "将来的な反攻作戦でソ連と共に戦う事は十分ありえる自体である。その為に軍事顧問を招集することはソ連も否定はしないだろう。"
 EEA_P_6_B: "生産支援"
 EEA_P_6_B_desc: "同盟の生産能力の殆どを東ドイツに依存している現状を打破する為に各地に同盟の共有財産としての工場を建築する。"
 EEA_P_7_B: "戦術機再設計"
 EEA_P_7_B_desc: "我々の主力戦術機はソ連製の物だがその設計が我々の実情に即しているとは言いづらい。そこで機体の各部を再設計し欧州戦線での戦訓を反映する。"
 EEA_P_8_B: "社会主義の旗の下で"
 EEA_P_8_B_desc: "新たなワルシャワ条約機構を中心とした改革の成果が遂に実る時が来た。一つの主義で団結した我々が止まるのは、BETAが殲滅される時のみだ。"
 EEA_P_9: "街の灯り"
 EEA_P_9_desc: "長きに渡る戦いの末に遂にベルリンの地を踏むことに成功した。完全な廃墟と化したこの地の復興には、多大なる困難と苦労が待ち構えているが不可能ではない。今度が我々が街に灯火を作り出すのだ。"
