####events
 mvlv_eea.1.t: "ドイツ統一"
 mvlv_eea.1.d: "人民議会と連合評議会の決議を経て我々は、遂に東西の統一条約へと調印した。東西ドイツの代表による統一宣言は、多くの衆目が見守る中で行われ東西の人々が手を取り合い祝杯を上げている。統一ドイツの成立は、東欧諸国にも大きな動きと受け止められ我々と同じく東西政府に分断したポーランドの再統合の動き等も検討されているようだ。"
 mvlv_eea.1.a: "私達は歴史的瞬間に立ち会っている"
 mvlv_eea.2.t: "ドイツ統一"
 mvlv_eea.2.d: "以前から盛んに行われていた東西ドイツ統一の議論が遂に結実し国際社会への統一の宣言が本日行われた。これにより東欧州社会主義同盟全体でも、欧州連合とのより親密な連携を模索する動きが広がっており今後の東西関係の進展が期待される。"
 mvlv_eea.2.a: "喜ばしい事だ"
 mvlv_eea.3.t: "欧州連合が統合を求める"
 mvlv_eea.3.d: "西側への接近という基本方針を堅持しながら、東西ドイツの再統一は徐々に完成へと進んでいった。 両ドイツの再統一後、東欧州社会主義同盟はあらゆる面で欧州連合との結びつきを強め、欧州統合の声が次第に高まってきた。 欧州連合が東欧州社会主義同盟に欧州連合への加盟を正式に要請した今、東欧州社会主義同盟はその場で欧州連合に加盟すべきなのか、それとも当分の間保留すべきなのか。"
 mvlv_eea.3.a: "よし、欧州連合に正式に加盟する手続きを始めよう。"
 mvlv_eea.3.b: "BETA大戦が終わるまで保留だ。"

