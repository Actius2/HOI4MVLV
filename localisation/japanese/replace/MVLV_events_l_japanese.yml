 mvlv_generic.0.t: "略史"
 mvlv_generic.0.d: "1944年:日本が条件付き降伏。太平洋戦争が終結\n1945年:ドイツが核攻撃を受け無条件降伏。ドイツが東西に分割され第二次世界大戦が終戦する\n1958年:探査機ヴァイキング1号が火星で生命体と初遭遇\n1966年:オルタネイティヴ計画が始動\n1967年:火星生命体が月面基地を攻撃し第一次月面戦争が勃発。火星生命体が「BETA」と命名されオルタネイティヴ2が始動\n1973年:BETAが中国喀什に着陸、月面からの完全撤退。オルタネイティヴ3計画が始動\n1974年:人類初の戦術機F-4ファントムが戦線へ投入\n1978年:パレオロゴス作戦、ミンスクハイヴ地下茎構造への突入に成功するも数時間後に全滅。\n1979年:バンクーバー協定発効、国際連合統一軍設立\n1983年:海王星（ネプトゥーン）作戦、欧州連合軍の奮闘も虚しくベルリンが陥落。\n1985年:ソ連、国家基幹機能をアラスカへ移転。西独、仏が相次いで陥落し英国本土攻防戦始まる。\n1990年:喀什のBETAが本格的な東進を開始\n1992年:スワラージ作戦、軌道爆撃や軌道降下部隊などが投入される\n1995年:オルタネイティヴ4計画が始動\n1996年:オルタネイティヴ5予備計画招集\n1998年:BETAが日本上陸、一ヶ月に及ぶ熾烈な防衛戦の末、京都陥落し首都が東京に移される。\n1999年:明星作戦、国連、日本、アメリカ、大東亜連合軍によって横浜ハイヴの攻略に成功。作戦の過程で横浜ハイヴにG弾が投下される。"
 mvlv_generic.0.a: "これが世界における常識だ"

 mvlv_generic.100.t: "人事異動が完了"
 mvlv_generic.100.d: "ラグランジュ点に向かう最後の再突入型駆逐艦が姿を消すと、警備担当者はみな安堵のため息をつき、鉄条網の外で騒いでいた人々も次第に静かになっていった。「見捨てられ、裏切られたと感じながらも、私は自分の運命を受け入れるしかない。 それまでは、消費財の割り当てを適切に増やしましょう、これが彼らをなだめるためにできる唯一のことです」---- 地球上に残る国際連盟の幹部は会議でこう語った。\n国の要人やその家族には乗船枠があったが、その枠を放棄し、民衆とともに生き、民衆とともに死ぬことを選んだ者もいた。"
 mvlv_generic.100.a: "彼らに幸あれ、我々にも幸あれ。"
 mvlv_generic.100.b: "彼らに幸あれ、我々にも幸あれ。ドーンプロジェクトの準備を始めよう。"

 mvlv_LA.1.t: "中南米連合"
 mvlv_LA.1.d: "戦況は悪化の一途をたどり、BETAはアメリカ大陸に近づきつつある。 米国のいわゆる安全保障は、我々をだまし、搾取する口実にすぎない。 大戦前から米国の干渉に苦しめられてきたラテンアメリカ諸国は、終わりが近づいている現実を知るべきだ。 ラテンアメリカ諸国は団結し、資源を配分し、早急に動員し、軍隊を訓練し、要塞を築き、自らの力によってBETAに抵抗すべきである。たとえこれが我々の終わりであるとしても、我々は最後の瞬間まで戦わねばならない。"
 mvlv_LA.1.a: "共に外敵から身を守ろう"
 mvlv_LA.2.t: "中南米連合"
 mvlv_LA.2.d: "戦況は悪化の一途をたどり、BETAはアメリカ大陸に近づきつつある。 米国のいわゆる安全保障は、我々をだまし、搾取する口実にすぎない。 大戦前から米国の干渉に苦しめられてきたラテンアメリカ諸国は、終わりが近づいている現実を知るべきだ。 ラテンアメリカ諸国は団結し、資源を配分し、早急に動員し、軍隊を訓練し、要塞を築き、自らの力によってBETAに抵抗すべきである。たとえこれが我々の終わりであるとしても、我々は最後の瞬間まで戦わねばならない。"
 mvlv_LA.2.a: "共に外敵から身を守ろう"
 
 fall_event.1.t: "マレー防衛線の崩壊の足音"
 fall_event.1.d: "強固な要塞に守られた防衛ラインに崩壊の足音が近づいている。今ここで何らかの対処をしなければドミノ倒し状に戦線が崩壊するだろう。"
 fall_event.1.a: "誰か何とかしろ！"
 fall_event.1.b: "人の山で遅滞せよ！"
 fall_event.2.t: "マレー防衛線の危機"
 fall_event.2.d: "今日、マレー半島の防衛線内部にBETAが侵入したとの報告があった。人類防衛線崩壊の足音は着実に近づいている。"
 fall_event.2.a: "我々にはどうしようもない"
 fall_event.2.b: "今、恩を売るべきだ"
 fall_event.2.c: "その恩は返ってくるのか？"