 mvlv_generic.1.t: "Muvluv Modへようこそ"
 mvlv_generic.1.d: "4つのオプションのうち1つを選んでください。"
 mvlv_generic.1.a: "簡単"
 mvlv_generic.1.b: "普通"
 mvlv_generic.1.c: "困難"
 mvlv_generic.1.e: "地獄"
 mvlv_generic.1.f: "東北地方の要塞化"
 mvlv_generic.1.g: "台湾を要塞化する"
 mvlv_generic.1.h: "シチリアとイギリス沿岸を要塞化する"
 mvlv_generic.1.i: "カイロと東部砂漠を要塞化する"
 mvlv_generic.1.j: "マレー北部を要塞化する"
 mvlv_generic.1.k: "北サハリンを要塞化する"
 mvlv_generic.1.l: "ユーコン基地を要塞化する"
 mvlv_generic.5.t: "天元山噴火"
 mvlv_generic.5.d: "日本の天元山という火山が噴火したという情報が入ってきた。日本政府は国連軍にも支援を求めてきている。"
 mvlv_generic.5.a: "手を貸す必要はない"
 mvlv_generic.5.b: "訓練部隊を送ろう"
 mvlv_generic.6.t: "戦略研究会"
 mvlv_generic.6.d: "近頃、戦略研究会なる超党派組織が軍内で結成されたとの事だ。その目的は未だ明らかでは無いが、裏でアメリカや国連が動いているという情報もあり、注意が必要そうだ。"
 mvlv_generic.6.a: "動向を監視しておけ"
 mvlv_generic.7.t: "決起"
 mvlv_generic.7.d: "本日未明、狭霧大尉率いる第一戦術機甲連隊が帝都において決起した！声明によれば、殿下を蔑ろにしている現政権を打倒し、殿下に本来の権限をお返しする事が目的であると言っている。"
 mvlv_generic.7.a: "帝都の防衛を最優先せよ！"
 mvlv_generic.8.t: "日本でのクーデター"
 mvlv_generic.8.d: "かねてからCIAが準備してきた日本でのクーデターだが、実行の目途が立ったとのことだ。今こそ介入を行うべきだろう。"
 mvlv_generic.8.a: "大規模な介入を行う"
 mvlv_generic.8.b: "我々が手を出すまででもない"
 mvlv_generic.9.t: "死闘"
 mvlv_generic.9.d: "殿下が帝都を脱出していた事が明らかになった。決起軍は伊豆半島へ向かい殿下の後を追っている。そこには米軍と国連軍が展開しており、大規模な戦闘が繰り広げられているようだ。"
 mvlv_generic.9.a: "戦況の把握を急げ！"
 mvlv_generic.10.t: "激闘"
 mvlv_generic.10.d: "殿下が帝都を脱出していた事が明らかになった。決起軍は伊豆半島へ向かい殿下の後を追っている。そこには国連軍が展開しており、大規模な戦闘が繰り広げられているようだ。"
 mvlv_generic.10.a: "戦況の把握を急げ！"
 mvlv_generic.12.t: "決起の行く末"
 mvlv_generic.12.d: "激戦の末、決起軍の主力は壊滅した。殿下は国連軍横浜基地への脱出に成功し、既に声明を発表した。決起軍残党も既に投降し、原隊に復帰している。"
 mvlv_generic.12.a: "殿下に謁見を"
 mvlv_generic.13.t: "決起成功"
 mvlv_generic.13.d: "激戦の末、決起軍は殿下の身柄を確保した。決起軍の首謀者である狭霧大尉は声明を発表し、全ての権限が殿下に返上される事を明らかにした。"
 mvlv_generic.13.a: "殿下に本来の権限を！"
 mvlv_generic.14.t: "悠陽の死"
 mvlv_generic.14.d: "流れ弾か狙ったものか…殿下を乗せ脱出を急ぐ戦術機が被弾した。衛士は強化装備によって軽症で済んだが殿下は重傷を負ってしまった。回復は絶望的とのことだ…"
 mvlv_generic.14.a: "今は喪に服そう…"
 mvlv_generic.15.t: "Muvluv Modへようこそ"
 mvlv_generic.15.d: "4つのオプションのうち1つを選んでください。"
 mvlv_generic.15.a: "シングル（桜花作戦無し)"
 mvlv_generic.15.b: "シングル (桜花作戦有り)"
 mvlv_generic.15.c: "6人以下　マルチプレイ"
 mvlv_generic.15.e: "7人以上　マルチプレイ"
 mvlv_generic.16.t: "将軍の削除モードを選択"
 mvlv_generic.16.d: "当Modではイベントによる将軍の削除が行われます。\nお気に入りのキャラを削除されたくない場合は無効を選択してください。\n\n※注 この処理はすべての将軍の削除処理に影響があります。\n　　 特にこだわりがない場合は有効を推奨しています。"
 mvlv_generic.16.a: "削除を有効にする（デフォルト）"
 mvlv_generic.16.b: "削除を無効にする"
 
 mvlv_generic.17.t: "マブラヴmodへようこそ"
 mvlv_generic.17.d: "あなたは当国家の指導者としてBETAの侵攻に対抗していただきます！\n敵は強大ですが我々の知恵を生かして反攻の時を窺いましょう。"
 mvlv_generic.17.a: "戦術のヒントを見る"
 mvlv_generic.17.b: "目標のヒントを見る"
 mvlv_generic.17.c: "難易度のヒントを見る"
 mvlv_generic.17.e: "閉じる（難易度選択へ）"
 mvlv_generic.18.t: "戦術のヒント"
 mvlv_generic.18.d: "BETAは非常に強力なため、こちらも強力な兵器で対抗する必要があります。\nそのための手段として戦術機が用意されています。\nなので兵器生産のほとんどをこの兵器に注力することをお勧めします。\nまた、当兵器を用いてもBETAに反抗するのは容易ではありません。\n可能な限り有利な地形や戦術で戦い、十分な戦力が用意できるまで機を窺うことを強くお勧めします。"
 mvlv_generic.18.a: "戻る"
 mvlv_generic.19.t: "目標のヒント"
 mvlv_generic.19.d: "当modは、2001年末に行われる桜花作戦の成否が終着点として制作されています。\nこの作戦を行うには日本にある国連基地の横浜を維持、もしくは奪還する必要があります。\nですので、これを最重要課題としてプレイすることをお勧めします。"
 mvlv_generic.19.a: "甲21号作戦のヒントを見る"
 mvlv_generic.19.b: "桜花作戦のヒントを見る"
 mvlv_generic.19.c: "戻る"
 mvlv_generic.20.t: "甲21号作戦のヒント"
 mvlv_generic.20.d: "終盤のストーリーにおいて佐渡島ハイヴこと甲21号を攻略するイベントがあります。\nこのイベントにおいて戦略兵器であるXG-70bが動員されます。\n当兵器と他部隊での連合部隊で上陸作戦を行ってください。砲弾と降下兵団を活用するのもよいです。\n参加できない部隊は次の作戦に備えて横浜基地周辺に待機しておくことをお勧めします。"
 mvlv_generic.20.a: "戻る"
 mvlv_generic.21.t: "桜花作戦のヒント"
 mvlv_generic.21.d: "この桜花作戦は簡素なディシジョンにおいて進行します。\n桜花作戦における士気の上昇は長くは続かないため、速やかに進行することを強くお勧めします。\nこの作戦における要点はオリジナルハイヴの門と呼ばれる地点を確保することです。\nこの地点に大規模な降下兵団を降下させてください。\n失敗は許されないので強行指示を必ず発令してください。\nその後XG-70dを含む本隊を降下させます。\nこの作戦の難易度は高いためXG-70bだけでの攻略はお勧めしません。\nこのXG-70dをオリジナルハイヴ中央へ向かわせてすべてを終わらせてください。"
 mvlv_generic.21.a: "追加のヒントを見る"
 mvlv_generic.21.b: "戻る"
 mvlv_generic.22.t: "桜花作戦に関する何者かの手記"
 mvlv_generic.22.d: "転生者よ悲惨な未来を見たか？私もだ。\n彼らの犠牲を無駄にしないために私はここにいる。---\n門の攻略には1つに200～240幅分の降下部隊を投下するのが良い。\n特重要なのは左側上下2地点の確保だ。\nここを確保できればXG-70dの生存確率は格段に上がるはずだ。\n本隊を守るために途中まで同行するのがいいだろう。\n本隊は現時点、今すぐに降下すべきだ。悠長にしている時間はない。\n私は残念ながら今回は参加できない。幸運を祈る。"
 mvlv_generic.22.a: "戻る"
 mvlv_generic.23.t: "難易度のヒント"
 mvlv_generic.23.d: "このmodでは4つの難易度が用意されています。\nあなたに合った難易度を選択するために＜§R地獄§!＞以外のヒントについて確認しておくといいでしょう。"
 mvlv_generic.23.a: "難易度<§G簡単§!>のヒントを見る。"
 mvlv_generic.23.b: "難易度<§C普通§!>のヒントを見る。"
 mvlv_generic.23.c: "難易度<§Y困難§!>のヒントを見る。"
 mvlv_generic.23.e: "戻る"
 mvlv_generic.23.f: "難易度<§R地獄§!>のヒントを見る。"

 mvlv_generic.24.t: "難易度<§G簡単§!>のヒント"
 mvlv_generic.24.d: "難易度<§G簡単§!>は比較的初心者向けに設定された難易度です。\nこの難易度ではプレイヤーに多くのバフが与えられます。\nこの世界の仕組みに慣れるのにちょうどよいでしょう。"
 mvlv_generic.24.a: "戻る"
 mvlv_generic.25.t: "難易度<§C普通§!>のヒント"
 mvlv_generic.25.d: "難易度<§C普通§!>は比較的経験者向けに設定された難易度です。\nこの難易度ではプレイヤーにある程度のバフが与えられます。\nちょっとした腕試しにちょうどよいでしょう。"
 mvlv_generic.25.a: "戻る"
 mvlv_generic.26.t: "難易度<§Y困難§!>のヒント"
 mvlv_generic.26.d: "難易度<§Y困難§!>は経験者向けに設定された難易度です。\nこの難易度ではBETAの生産速度が増加します。\nまた、プレイヤーへの効果的なバフは少なくなっています。\nこのことから、より過酷な世界に挑戦することができます。"
 mvlv_generic.26.a: "戻る"
 mvlv_generic.27.t: "難易度<§R地獄§!>のヒント"
 mvlv_generic.27.d: "挑戦者か、救世主か・・・。\nどちらにせよ、君ならきっと乗り越えられるはずだ。\n全てを守れると思うな、選択というのは何かを切り捨てるということだ。"
 mvlv_generic.27.a: "さらに深く"
 mvlv_generic.27.b: "戻る"
 mvlv_generic.28.t: "難易度<§R地獄§!>のヒント？"
 mvlv_generic.28.d: "h？め\\tょ`時空への干※……"
 mvlv_generic.28.a: "さらに深く"
 mvlv_generic.28.b: "すぐに戻る"
 mvlv_generic.29.t: "難？度<§R地※§!>のヒンンンンttt……"
 mvlv_generic.29.d: "不明\\tょ`時空への干※……"
 mvlv_generic.29.a: "さらに深く"
 mvlv_generic.29.b: "今すぐ戻る"
 mvlv_generic.30.t: "難？度<§R地※§!>？？？？"
 mvlv_generic.30.d: "検※、＃識、異常※在※※空干※……"
 mvlv_generic.30.a: "それを見る"
 mvlv_generic.30.b: "急いで戻る"
 mvlv_generic.31.t: "認知"
 mvlv_generic.31.d: "不明存在による干渉を検知、認識。情報を収集。情＃を共…します。\n災害へ対処してください。 災害へ対処してください。 災害へ対処してください。 災害へ対処してください。\n災害へ対処してください。 災害へ対処してください。 災害へ対処してください。 災害へ対処してください。\n災害へ対処してください。 災害へ対処してください。 災害へ対処してください。 災害へ対処してください。\n災害へ対処してください。 災害へ対処してください。 災害へ対処してください。 災害へ対処してください。\n災害へ対処してください。 災害へ対処してください。 災害へ対処してください。 災害へ対処してください。\n災害へ対処してください。 災害へ対処してください。 災害へ対処してください。 災害へ対処してください。\n災害へ対処してください。災害へ対……………"
 mvlv_generic.31.a: "戻る"

 mvlv_generic.32.t: "違和感"
 mvlv_generic.32.d: "前線監視局の報告によるとレーザー級の数が減っているかもしれないとの報告があった。\nしかし、統計を取っているわけではないので実際のところは分からない。\n最近の攻勢の激化と何か関係があるのだろうか？"
 mvlv_generic.32.a: "杞憂だといいが"


 
 mvlv_generic.34.t: "G弾の非難"
 mvlv_generic.34.d: "BETA占領地とはいえかのG弾こと新型爆弾が元我が領内に投下された。\n情報封鎖を行ったにもかかわらずその報は国民にすでに知れ渡っている。\n対応を間違えれば暴動が起こる可能性もある。\n国連や様々な国と連携してかの国を非難せねばならない。\n"
 mvlv_generic.34.a: "[FROM.GetName]を非難する"
 mvlv_generic.34.b: "いや、こうするしかなかった"
 mvlv_generic.35.t: "[FROM.GetName]からの非難"
 mvlv_generic.35.d: "BETAをまとめて一掃したというのに恩知らずのやつらが我が国を非難してきた。\nまた、周囲の国も同調しているようだ。\n今後は慎重に動くべきかもしれない。\n"
 mvlv_generic.35.a: "恩知らずめ"
 mvlv_generic.36.t: "G弾の成果"
 mvlv_generic.36.d: "我々はかの新型爆弾で投下地域のBETAを殲滅せしめた。\n未知の影響が出ているとの報告があるが、この一歩の前では些細なことだ。\n"
 mvlv_generic.36.a: "G弾をたたえよ"
 mvlv_generic.37.t: "G弾と悲劇"
 mvlv_generic.37.d: "もはやこうするしか手はない。\n追い込まれた我々はなりふり構っていられない。\n小説の彼らもきっとこのような思いだったのだろう。\n"
 mvlv_generic.37.a: "おわりは近い"
 mvlv_generic.38.t: "異常震域"
 mvlv_generic.38.d: "全世界で同時刻に地震が観測された。\nそれは普段地震が起こらない地域でも発生したらしい。\n"
 mvlv_generic.38.a: "いったいなにが・・・"
 mvlv_generic.39.t: "緊急事態！"
 mvlv_generic.39.d: "緊急事態！緊急事態！\n首都司令部に突如BETAが出現！\n至急援軍を！至急援ぐ・・・・"
 mvlv_generic.39.a: "・・・"
 mvlv_generic.40.t: "全体の難易度変更"
 mvlv_generic.40.d: "全世界の難易度を変更します。\n4つのオプションのうち1つを選んでください。"
 
 mvlv_generic.42.t: "弾薬が購入されました"
 mvlv_generic.42.d: "[FROM.GetName]に弾薬が購入されました。"
 mvlv_generic.42.a: "わかった"
 
 mvlv_generic.96.t: "通知をON"
 mvlv_generic.96.d: "自分以外の戦線の通知がONになりました。"
 mvlv_generic.96.a: "わかった"
 mvlv_generic.97.t: "通知をOFF"
 mvlv_generic.97.d: "自分以外の通知がOFFになりました。"
 mvlv_generic.97.a: "わかった"
 
 stability.22.t: "難民解放戦線"
 stability.22.desc.a: "BETA大戦下にあって難民たちは過酷な生活を強いられている。治安は極度に悪化し、難民キャンプはそれぞれ自警団を組織するようになった。しかし、それはテロの温床となり次第に自分たちを守らない受け入れ国に対して攻撃を行うようになる。当初こそ散発的な攻撃でさほど被害はなかったが、近頃報告されているキリスト教恭順派が組織した「難民解放戦線」なる組織が各難民キャンプの自警団をまとめ上げ、組織的に攻撃を行うようになった。その規模は警察組織程度では到底防ぐことができない規模であり、その影響は深刻化している。 "
 stability.22.desc.b: "難民解放戦線の攻撃は日に日に激しさを増している。小手先の対策は何の効果もなかったようだ。 難民解放戦線は難民の生活改善や選挙権の付与を求めており、テロへの参加を拒んでいた人々も周りの参加者に触発されて難民解放戦線に参加しているようだ。 これまでのところは備蓄によって最前線に対する補給への打撃を幾らか抑えることが出来ているが、 この攻撃が戦争遂行能力へ影響を及ぼすのは時間の問題である。 \n\n国防省は政府に対し、 テロへの妥協を許すことのないように要求しているが、 政府内における他の派閥においては難民の要求をある程度満せば、 事態を収束させられるかもしれないという意見が出ている。 "
 stability.22.desc.c: "テロリストたちの攻撃はもはや全国規模に広がり、 戦争に直結する産業のみならず、 サービス業にも影響している。 テロリストの中には元軍人も多く、どこから得たのかはわからないが機械化装甲歩兵や戦術機までもが攻撃に参加している事が確認される事態に陥っている。 秘密警察の報告によると大規模な蜂起のために、 兵器の生産が占領された工場で開始されているようだ。 \n\n軍最高司令部は、 忠誠を誓う部隊により断固たる対応を採れば鎮圧することができると信じているが、 政府の文官によれば、 そうすれば内戦に発展し、 確実に敗北すると主張している。 "
 stability.22.a: "テロ組織などに貴重な物資を割く余裕などない "
 stability.22.b: "難民への支援を重視すると発表しろ。それで時間を稼げるはずだ"
 stability.22.c: "難民キャンプに即座に支援物資を送り不満を減らそう"
 stability.22.d: "テロの参加者と恭順派共を見せしめとして処刑しろ"
 stability.22.e: "国連に治安維持軍の派遣を要請しよう"
 stability.22.f: "前線から部隊を抽出し治安維持にあたらせよう "
 stability.22.g: "難民に準市民権を与える法案を策定しよう"
 strikes_event.1.t: "政府による緊急会見"
 strikes_event.1.desc: "政府による難民への支援重視政策の発表は功を奏したようだ。未だある程度ある政府への信頼から、テロに参加していた者や参加を求められていた者は政府を信じてテロへの参加を止め、元のキャンプへと帰っていった。難民解放戦線はこれを受けて我が国から撤退したと思われ、しばらくの間は平穏が保たれるだろう。しかし、この政策はあくまでも臨時のものでしかないため、早急に長期的な改善案を策定しなければ再び難民解放戦線は我が国で攻撃を行うだろう。"
 strikes_event.1.a: "こう言うだけで引き下がるとは民衆は単純だな。 "
 strikes_event.2.t: "緊急会見の失敗"
 strikes_event.2.desc: "昨夜の政府の緊急会見において難民への支援が発表されたが、それを信じる者など一人として存在しなかった。今まで何の支援もしてこなかった政府の言葉は何の意味も持たなかったのである。難民解放戦線はここぞとばかりに攻勢を強め、難民たちを仲間に引き込んでいった。今後さらなる攻撃が予想されるため、国民の間でも不安が高まっている。 状況の改善にはまだまだ時間がかかる見通しが立てられている。BETAとの戦闘に支障が出ることも免れないだろう。"
 strikes_event.2.a: "思ったようにはいかないな。 "
 strikes_event.3.t: "支援物資"
 strikes_event.3.desc: "食料が充足し、家があり、着るものがあれば不満は減る。結局のところ現物が自分の手元にあれば人々は満足するのだ。難民キャンプに到着した支援物資輸送隊は難民たちから賛辞をもって迎えられ、数か月生活するのには十分な量の支援物資が難民キャンプへと届けられた。これにより、難民解放戦線の言葉に耳を貸す難民は減り、我が国で組織的な攻撃を行うことが困難になったようだ。難民の中から政府に協力する者も増え始め、社会の安定化に拍車がかけられる結果となった。"
 strikes_event.3.a: "すばらしい。 "
 strikes_event.4.t: "見せしめ"
 strikes_event.4.desc: "[Root.GetLeader]は本日、 テロに参加した難民とキリスト教恭順派の信者を人類反逆罪で処刑した。 テロリストはともかくキリスト教恭順派という宗教団体の信者を処刑したことは衝撃をもって伝えられ、[Root.GetLeader]への非難も多数寄せられたが、難民達の士気を削ぐには十分であった。多くの難民たちは難民解放戦線に加えキリスト教恭順派への入信も拒むようになり、テロリストによる攻撃の可能性は大きく下がったといえるだろう。しかし、恐怖による抑圧が長続きしないのは歴史が証明している。これ以降問題が何も起きないと予測するのは楽観的過ぎるだろう。難民解放戦線を始めとするテロリスト達の蠢動が収まったわけではない。"
 strikes_event.4.a: "仕方がないことだ。 "
 strikes_event.5.t: "激怒する信者たち"
 strikes_event.5.desc: "[Root.GetLeader]は本日、 テロに参加した難民とキリスト教恭順派の信者を人類反逆罪で処刑した。テロリストはともかくキリスト教恭順派という宗教団体の信者を処刑したことは衝撃をもって伝えられ、国内の信者たちは激怒し、次々に政府への批判を展開した。さらに、信者たちに難民解放戦線への参加を公然と呼びかけ始め、[Root.GetLeader]に神の怒りを思い知らせなければならないと息巻いている。多数の信者たちを取り込んだ難民解放戦線も、「最後の審判を生き残った難民を処刑するなど言語道断であり、許すことはできない。これより大規模な襲撃を開始する。」と声明を発表する事態にまで発展した。生産拠点へのさらなる打撃は避けられないだろう。 "
 strikes_event.5.a: "我々はどうしたらいいんだろうか。 "
 strikes_event.6.t: "国連治安維持軍"
 strikes_event.6.desc: " [Root.GetLeader]は、 国連軍の治安維持軍による支援を受けることを本日発表した。 これにより数日後には国連軍部隊が各地の難民キャンプに展開することになる。自国でテロを鎮圧できないことは各国の失笑を買ったが、自国のリソースを使わずに治安維持が行えるという点で有効な策だったと言えるだろう。しかし、土地勘のない国連軍部隊で完璧に任務を遂行できるかは甚だ疑問であり、完全にテロリストを排除できるかは未知数である。。 "
 strikes_event.6.a: "背に腹は代えられない。 "
 strikes_event.7.t: "クリストファー作戦"
 strikes_event.7.desc: "実戦部隊が一晩中難民キャンプ近郊に駐留し、 大規模な演習と軽い訓練を続け威嚇を行った。 太陽が地平線上に現れ、 バリケードを構築している難民たちが難民解放戦線の支援に望みを託している最中、 攻撃側の隊列が動いた。 疲労した難民たちは、 組織だった抵抗を行うのに出遅れた。 非武装の難民を守るための小部隊を残して、 軍は武装した難民を掃討し、 難民キャンプのリストにより全ての首謀者が逮捕される。 正午までに、 軍は各難民キャンプを完全に制圧し、 外出禁止令を布告した。 これ以上の抵抗はもはや期待できない。 大部分の難民は、 国家に協力するという条件ですぐに解放され、 テロの首謀者は拘束され、 裁判にかけられる。 死刑判決がなされる模様だ。 "
 strikes_event.7.a: "要求が変更された。 "
 strikes_event.8.t: "リルフォートの戦い"
 strikes_event.8.desc: "部隊は夜通しキャンプの外に駐留したが、 軽重織り交ぜた訓練が驚きを与えた。 部隊が動いたとき、 すでに難民たちは警戒しており、 準備ができていることが分かった。 しかし、機械化装甲歩兵を投入した軍の攻撃を止めることは出来ず、このままテロリスト制圧作戦は成功かと思われたが、そこに突如として戦術機部隊が現れた。 対戦術機用の装備を持ち合わせていない軍は壊滅的被害を受けた。 \n\n担当指揮官は増援を要請するために部隊を引き上げたが、 難民解放戦線はその隙に難民たちを連れ去り、 行方をくらませた。 明日、 大規模な捜索が予定されているが、 難民解放戦線の戦術機を操るテロリストの卓越した操縦技術を目の当たりにした軍司令官は、 勝機があるとはもはや信じていない。 "
 strikes_event.8.a: "打てる手がどんどんなくなりつつある。 "
 strikes_event.9.t: "難民権利保護法"
 strikes_event.9.desc: "首都中に緊張が高まりつつある中、 [Root.GetLeader]は、 ついに難民の権利を保護する新法を発表した。 この法律は、 十分な食料の保証、 既定年数国のために働いた者への市民権の付与、 および選挙権の付与等これまで類を見なかったものである。 \n\n政府関係者は多くがこれによりテロ参加者を完全に屈服させる以上のものだと考えている。 難民解放戦線は我が国から完全に撤退した。 "
 strikes_event.9.a: "うまくいけばこれで十分だ。 "
 improved_worker_conditions: "難民への支援政策"
 improved_worker_conditions_desc: "難民は我が国の国民ではないが、放置していてはテロの温床になりかねない。支援政策を立案し実行することでテロを未然に防ぐことができるだろう。 "

#news________________________________________________________________________________
 mvlv_news.1.t: "ハイヴの攻略に成功"
 mvlv_news.1.d: "この日、多大な犠牲を払いながらも人類は[Root.GetName]の攻略に成功した。\n失った将兵や物資は返ってこないが、人類は確実に反撃の一歩を踏み出している。"
 mvlv_news.1.a: "よくやった！"
 mvlv_news.2.t: "BETAによるハイヴの再占領"
 mvlv_news.2.d: "安くない物資や将兵を大量に消費して攻略した[Root.GetName]をBETAに再占領された。\n人類の勝利は遠ざかった。"
 mvlv_news.2.a: "なんということだ"
 mvlv_news.3.t: "ハイヴの攻略に成功"
 mvlv_news.3.d: "この日、多大な犠牲を払いながらも人類は[Root.GetName]の攻略に成功した。\n失った将兵や物資は返ってこないが、人類は確実に反撃の一歩を踏み出している。"
 mvlv_news.3.a: "彼らの犠牲を無駄にしてはいけない！"
 mvlv_news.3.b: "よくやった！"
 mvlv_news.4.t: "G弾の投下"
 mvlv_news.4.d: "アメリカのG弾投下により横浜ハイヴは壊滅的な被害を受けた。\nこれは歴史的な戦果だが、多くの部隊が巻き込まれたとの情報もある。\nまた、威力が想定以下だったことや解明困難な異常現象による汚染などから\n各国にてG弾脅威論が騒がれている。"
 mvlv_news.4.a: "なんてことだ"
 mvlv_news.5.t: "It's a brain！"
 mvlv_news.5.d: "諜報機関より極秘の情報が入った。\n横浜ハイブ内にて衛士が多数の人間の脳を発見したとのことだ。\n残念ながら生存者は確認されていない。\nこれは兵士の士気や国民感情に大きな影響を与える可能性があるため公開厳禁である。"
 mvlv_news.5.a: "なんということだ・・・"
 mvlv_news.6.t: "明星作戦"
 mvlv_news.6.d.b: "大日本帝国において大規模反攻作戦である明星作戦が開始された\nこの作戦の成否は人類の対BETA戦争において重要なものとなるだろう。"
 mvlv_news.6.b: "成功を祈る"
 mvlv_news.6.d.a: "我々は今日この日のために取れるあらゆる手を打ってきた。今こそ、反撃の時だ"
 mvlv_news.6.a: "反撃開始！"
 mvlv_news.7.t: "[FROM.GetName]が難易度を変更しました"
 mvlv_news.7.d: ""
 mvlv_news.7.a: "わかった"
 
 mvlv_news.8.t: "佐渡島撤退"
 mvlv_news.8.d: "XG-70の爆破\n\n佐渡島ハイヴの構造物を薙ぎ払った秘密兵器はその任務の中機能不全に陥り、\n国連はその自爆投棄を決めたようだ。\nXG-70の自爆は佐渡島を容易に消し去る威力とのことから各軍に早急な退避指示が出された。"
 mvlv_news.8.a: "総員退避！"
 mvlv_news.9.t: "佐渡島の消滅"
 mvlv_news.9.d: "XG-70の爆破により佐渡島ハイヴは文字通り消滅した。\n各国の被害も多く立て直しには時間がかかるだろう。\nただ、この地球上からハイヴがまた一つ減ったということは間違いなく・・・\nそう、間違いなく希望への一歩であるといえよう。"
 mvlv_news.9.a: "確かな一歩のはずだ"
 
 mvlv_news.10.t: "[FROM.GetName]が全体の難易度を変更しました"
 mvlv_news.10.d: ""
 mvlv_news.10.a: "わかった"

 mvlv_news.11.t: "視線"
 mvlv_news.11.d: "何かが、こちらを見ている気がする。"
 mvlv_news.11.a: "勘違いだといいが・・・"

 mvlv_news.12.t: "終末の灯台"
 mvlv_news.12.d: "空高く聳え立ち、その光は人類を終焉へ導く道標となる。\nそれはまさしく終末の灯台だ。\n"
 mvlv_news.12.a: "誰かあれをどうにかしろ！"

 mvlv_news.13.t: "逆光"
 mvlv_news.13.d: "衛星監視報告によれば新たな超重光線級がハイヴ付近で確認されたらしい。\nどうやらBETAはあれが我々にある程度有効であると理解したらしい。\n今後はあれが量産されるということを考慮しなければならない。"
 mvlv_news.13.a: "なんてことだ・・・"

 mvlv_news.14.t: "「その日」"
 mvlv_news.14.d: "国連最先端研究所より、重力波に謎の揺らぎが観測されたとの情報が入った。\nただしこれは一時的なもので、その後に特異な変化は観測されていないという。\n観測機器の故障も疑われたが、現在のところ問題は発見されていない。\n"
 mvlv_news.14.a: "経過を注視せよ"
 
 mvlv_news.15.t: "難易度が設定されました"
 mvlv_news.15.d: "全体の難易度は[FROM.GetName]が設定した難易度に統一されています。\n以降、最初のイベントでの難易度設定の選択肢は無効化されます。\n"
 mvlv_news.15.a: "わかった"

