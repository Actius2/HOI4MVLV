 UNI_low_influence: "安全保障理事会"
 UNI_low_influence_desc: "米英ソ仏中の五大国により形成されていた安全保障理事会は、BETA大戦の影響でアメリカ以外の国力が低下した影響で、日本とオーストラリアが常任理事国入りすることになった。しかし、中ソはこれを欧米に二票目を与えるものとして非難した。現在も安全保障理事会は意見の対立が続き、効率的に対BETA戦の作戦立案が行えているとは言えない状況にある。"
 UNI_high_influence: "国連主導の安全保障理事会"
 UNI_high_influence_desc: "米英ソ仏中の五大国により形成されていた安全保障理事会は、BETA大戦の影響でアメリカ以外の国力が低下した影響で、日本とオーストラリアが常任理事国入りすることになった。西側と東側の対立は国際連合の権威の回復によってまとまりつつあり人類は団結してBETAに立ち向かうことができるようになった。"
 UNI_refugees_army: "退避国義勇軍"
 UNI_refugees_army_desc: "国連統合軍の殆どの部隊はBETAによって領土を奪われた国の軍隊によって構成されている。祖国奪還に燃える彼らはとても士気が高いが、それ故に過酷な最前線に送られることが多い。その為、国連軍への参加を拒絶する政府も少なくない。"
 UNI_refugees_problem_0: "国連の難民支援"
 UNI_refugees_problem_0_desc: "国連はBETA大戦の影響で発生している大量の難民に対する援助を世界規模で行っており、難民志願兵を募ることができる。しかし、多すぎる難民の管理には多くのリソースが必要であり、受け入れ地の治安も悪化している。"
