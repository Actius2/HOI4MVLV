 mvlv_uni.1.t: "最後の卒業生"
 mvlv_uni.1.d: "本日、横浜基地の衛士訓練学校で訓練課程を修了した訓練兵に対して衛士徽章が授与された。今回訓練校を卒業した新任少尉等は全員がA-01連隊に配属される運びとなった。"
 mvlv_uni.1.a: "おめでとうございます。少尉殿。" 
 mvlv_uni.9.t: "00ユニット"
 mvlv_uni.9.d: "オルタネイティヴ4計画司令部総責任者である香月夕呼博士は不可能と思われていた00ユニットが完成したと報告した。00ユニットはBETAをリーディングし、情報を手に入れるための切り札であり、さらにこれの完成によってXGの実戦運用も可能になる。"
 mvlv_uni.9.a: "人類の勝利の日は近いな"
 mvlv_uni.5.t: "人類最後の抵抗"
 mvlv_uni.5.d: "前線の全てのハイヴに陽動を行い、軌道降下部隊がオリジナルハイヴ攻略を行う桜花作戦。何もかもが不完全な状況の中、それが故に必死の努力を重ねる人々の手により、ついに発動の時を迎えた。2002年初頭、オリジナルハイヴ攻略部隊 A-01部隊は、無数の名も無き将兵達の挺身の下、全人類の命運を懸け、今飛び立つ・・・"
 mvlv_uni.5.a: "粉骨砕身の思いで戦え" 
 operation_ouka_tt: "§R 作戦主導国はディシジョンで作戦進行を指揮せよ！ §!" 
 mvlv_uni.7.t: "桜花作戦 成功"
 mvlv_uni.7.d: "突入部隊は多大な損害を被ったがあ号標的を破壊し、オリジナルハイヴの機能を停止させることに成功した。これでBETAの対処能力は著しく低下するだろう。"
 mvlv_uni.7.a: "彼らこそが英雄だ！" 
 mvlv_uni.6.t: "桜花作戦 失敗"
 mvlv_uni.6.d: "人類がその命運を懸けて実行した桜花作戦は失敗した。あ号標的によって人類側の戦術、兵器の情報は既に各ハイヴに伝播し、人類の兵器は無力化されてしまうだろう。"
 mvlv_uni.6.a: "全ハイヴへのG弾投射を急げ…" 
 mvlv_uni.8.t: "新種"
 mvlv_uni.8.d: "エヴェンスクハイヴにこれまでに確認されたことのないBETAが出現した。\n要塞級と重光線級を合体し、とにかく巨大化させたかのような新種は人知を超えた戦闘力をもっている。\n恐らくこれが戦闘のためだけに生み出された最初のBETAなのだろう。"
 mvlv_uni.8.d2: "衛星監視センターより緊急！\nエヴェンスクハイヴで確認されたとされる超巨大BETAが、各ハイヴから出現が確認された。\n要塞級と重光線級を合体し、とにかく巨大化させたかのような新種は人知を超えた戦闘力をもっている。\nあの存在を野放しにすれば間違いなく人類は壊滅的被害を受けるだろう。"
 mvlv_uni.8.a: "あの聳え立つクソッタレをぶち殺せ！！"
 mvlv_uni.10.t: "救世主は来ない"
 mvlv_uni.10.d: "この世界に救世主は来ない。あなた自身が道を切り開くのだ"
 mvlv_uni.10.a: "ブリーフィングを始めよう"
 mvlv_uni.11.t: "XM3"
 mvlv_uni.11.d: "香月博士の提案により開発された戦術機用OSであるXM3は実証試験を終え、実戦機に装備される事となった。これまでにない画期的なOSであるXM3は全世界の衛士に多大な恩恵をもたらすだろう"
 mvlv_uni.11.a: "これの提供に加盟国はいくら払うのかな？"
 mvlv_uni.12.t: "XM3提供"
 mvlv_uni.12.d: "国連の香月博士は、極秘に開発されたという戦術機用新OSであるXM3を我が国に提供したいと申し出てきた。しかし、それには試験の名目での戦術機接収や、相応の資金提供が含まれており、代償に見合うものか見極める必要があるだろう…"
 mvlv_uni.12.a: "女狐め…ッ、戦術機と引き換えだ" 
 mvlv_uni.12.b: "女狐め…ッ、工場の貸与権をくれてやる"
 mvlv_uni.12.c: "ちょっと待ってくれ！"
 MVLV_event_xmos_tt: "§R 戦術機の備蓄を250以上貯めることで工場で支払わずにXM3を購入できる。 §!"
 mvlv_uni.12.f: "高すぎる！"
 mvlv_uni.13.t: "儲け"
 mvlv_uni.13.d: "香月博士のOSは加盟国には魅力的なだったようだ。これで各方面に回せる資金が確保できるだろう。"
 mvlv_uni.13.a: "狙い通りね"
 mvlv_uni.14.t: "相互評価演習"
 mvlv_uni.14.d: "ユーコン基地でブルーフラッグ演習が開催された。各国の試験部隊が競い合うことでより戦術機開発への知見が深まるだろう。"
 mvlv_uni.14.a: "事故の無いように願う"
 mvlv_uni.15.t: "ファースト・ストライク"
 mvlv_uni.15.d: "ブルーフラッグ演習で賑わうユーコンは突如災厄に見舞われた。謎の組織が基地内の戦術機を奪い基地を占拠したのだ。さらに、BETA研究施設が襲撃され、捕獲していた研究用BETAが脱走したとの報告も上がっている…"
 mvlv_uni.15.a: "何が起こっているんだ！？"
 mvlv_uni.16.t: "声明"
 mvlv_uni.16.d: "我々はユーコン基地を占拠しました。その理由は世界中で非道な扱いを受けている難民の解放を訴えるためです。国連は本来難民に使うべき資材や資源を相互比較演習等という戯れに用いています。これは断じて許されるものではありません。よって、我々はユーコンの市民10万人を人質に取り、難民への選挙権付与、難民解放戦線構成員の即時解放、難民への支援の増加を要求します。"
 mvlv_uni.16.a: "この忌々しい映像を今すぐ止めろ！"
 mvlv_uni.17.t: "発：国連統合軍 軍事参謀委員会"
 mvlv_uni.17.d: "宛：方面軍司令部\n各方面軍は戦術機1個連隊を国連統合軍直轄司令部の指揮下に提供せよ"
 mvlv_uni.17.a: "致し方あるまい…"
 mvlv_uni.18.t: "派遣軍"
 mvlv_uni.18.d: "影響力の低下が叫ばれる国連も安保理特権があれば装備を集めることなど容易だ。"
 mvlv_uni.18.a: "当然だな"
 mvlv_uni.19.t: "軌道降下"
 mvlv_uni.19.d: "現在先行して突入した軌道降下部隊がSW115周辺を制圧中だ。しかし楽観はできない。§R部隊の損耗は予想をはるかに上回っている。§!本隊の突入タイミングに関して§Y予定通りでの突入§!か§Y現周回をもって突入させる§!か早急に決断しなければならない。"
 mvlv_uni.19.a: "現周回をもって突入を行う"
 mvlv_uni_19a_tt: "§Rおそらく間に合うだろう・・・§!"
 mvlv_uni.19.b: "予定通り次の周回で突入する"
 mvlv_uni_19b_tt: "§R間に合わない可能性が高い！§!"
 mvlv_uni.20.t: "オペレーションサドガシマ"
 mvlv_uni.20.d: "00ユニットの実戦運用試験を行う。この作戦の第一目標はハイヴにリーディングを行うXG-70bの援護である。ハイヴ攻略は主目的ではない。00ユニットの喪失だけは絶対に回避せよ。各員の健闘を祈る。"
 mvlv_uni.20.a: "試験の成功を祈る"
 mvlv_uni.21.t: "横浜基地襲撃"
 mvlv_uni.21.d: "佐渡島ハイヴ陥落の歓喜に湧く帝都に突如として砲声が響いた。帝都の近傍、町田にBETAが出現したのである。奴らは佐渡島ハイヴ所属の残党と予想され、目標は横浜ハイヴの再奪還であると考えられる。何としてもBETAを排除しなければならない。"
 mvlv_uni.21.a: "至急増援を！"
 mvlv_uni.22.t: "横浜基地大規模襲撃"
 mvlv_uni.22.d: "佐渡島ハイヴ攻略失敗の報で悲しみに暮れる帝都に突如として砲声が響いた。帝都の近傍、町田にBETAが出現したのである。さらに大深部を侵攻してきたBETAによってXG-72bも破壊されてしまった。奴らは佐渡島ハイヴ所属のBETA群と予想され、目標は横浜ハイヴの再奪還であると考えられる。何としてもBETAを排除しなければならない。"
 mvlv_uni.22.a: "至急増援を！"
 mvlv_uni.23.t: "未来への咆哮"
 mvlv_uni.23.d: "BETAの戦術は我々を上回っていた。突入した先行部隊はかなりの損害を受けている。同時に突入したA-01部隊の僚機も多くが落とされた。しかし、あきらめるわけにはいかない。我々は勝たねばならないのだ。いま、人類の命運は彼らに託された。"
 mvlv_uni.23.a: "もはや祈るしかあるまい…"
 mvlv_uni.24.t: "新生A-01"
 mvlv_uni.24.d: "香月博士の度重なる要請によって元ソ連軍人や国連軍の出奔者等非常に優秀な人物たちが横浜基地へ集った。今後の第四計画の推進に大いに役に立つことだろう。"
 mvlv_uni.24.a: "ちょっと予想外ね"
 mvlv_uni.25.t: "新型OS実証試験"
 mvlv_uni.25.d: "香月博士の提案した新型OS実証試験は惨事となった。BETA研究施設から逃げ出したBETAが演習中の部隊を襲撃し、壊滅的な被害をもたらしたのだ。BETAの数に対してあまりに大きな被害を受けて、司令部は基地戦力の増強を要請した。"
 mvlv_uni.25.a: "こんなにも平和ボケしていたとは！"
 mvlv_uni.26.t: "オリジナルハイヴ攻略計画準備要請"
 mvlv_uni.26.d: "オルタネイティヴ第四計画司令部総責任者である香月夕呼博士は不可能と思われていた00ユニットが完成したと報告した。00ユニットはBETAをリーディングし、情報を手に入れるための切り札であり、さらにこれの完成によってXGの実戦運用も可能になる。これによってBETAに対する大反攻が現実的なものとなった。そのことから国連は各国に作戦準備を行うように要請した。"
 mvlv_uni.26.a: "準備を始めよう"
 mvlv_uni.27.t: "国連安保理決議第3666号"
 mvlv_uni.27.d: "横浜襲撃によって多数の犠牲者が出た事件。その傷を広げるかのように衝撃の事実がもたらされた。BETAは我々人類の情報を解析しており、数週間以内に完全な対策を講じる可能性がとても高いということだ。これにより、かねてより計画されていたあ号標的攻略作戦の日程を繰り上げて発動する決議が経った今可決された。我々は桜花作戦の発動に従い前線の全てのハイヴに陽動を行わなければならない。これは人類の存亡を欠けた最終決戦である。"
 mvlv_uni.27.a: "もはや一刻の猶予もない"
 MVLV_ouka_setting_tt: "§R 桜花作戦時に中核州ボーナスを得ます。 §!"
 mvlv_uni.27.b: "決死の作戦に我々も参戦する"
 MVLV_ouka_setting2_tt: "§R 桜花作戦時に少量の中核州ボーナスと空挺攻撃ボーナスを得ます。　フェーズ2で空挺降下を行ってください！ §!"
 mvlv_uni.28.t: "桜花作戦フェーズ1"
 mvlv_uni.28.d: "桜花作戦フェーズ1発令に伴い、我々は前線の全てのハイヴに陽動を行わなければならない。"
 mvlv_uni.28.a: "作戦を発動せよ"
 mvlv_uni.29.t: "桜花作戦フェーズ2"
 mvlv_uni.29.d: "桜花作戦フェーズ1発令に伴い、作戦に割り当てられた国家は直ちに　§Y「門」およびその周辺地域§!　に降下し、来たる第3フェーズ突入部隊のための侵入口を確保し、§R陽動を行え！§!"
 mvlv_uni.29.a: "健闘を祈る"
 mvlv_uni.30.t: "桜花作戦最終段階"
 mvlv_uni.30.d: "前線の全てのハイヴに陽動を行い、軌道降下部隊がオリジナルハイヴ攻略を行う桜花作戦。何もかもが不完全な状況の中、それが故に必死の努力を重ねる人々の手により、ついに発動の時を迎えた。2002年初頭、オリジナルハイヴ攻略部隊 A-01部隊は、無数の名も無き将兵達の挺身の下、全人類の命運を懸けた決戦の地に舞い降りた。"
 mvlv_uni.30.a: "全ては彼らに託された"
 mvlv_uni.31.t: "未来への咆哮"
 mvlv_uni.31.d: "楽観的だったのかもしれない。BETAの戦術は我々を上回っていた。突入した先行部隊の殆どがA-04の降下を待たずに全滅してしまったのだ。もはやオリジナルハイヴにはA-01部隊しかいないといっても過言ではない状況である。しかも、多数の光線級の迎撃により甚大な被害を被ったようだ・・・。しかし、そうであっても我々は彼らを信じるほかはない。"
 mvlv_uni.31.a: "もはや祈るしかあるまい…"
 mvlv_uni.32.t: "[FROM.GetName]の個体数増加"
 mvlv_uni.32.d: "監視衛星カメラ情報センターによって観測された情報から[FROM.GetName]の個体数が著しく上昇しているように見えるとの報告があった。もし、それが真実であるならこれまでの統計から大規模な進行がある可能性が高い。必要に応じて間引きを行う必要もあるかもしれない。"
 mvlv_uni.32.a: "了解した。"
 mvlv_uni.33.t: "横浜の接収"
 mvlv_uni.33.d: "国連決議の結果、横浜を接収し基地を建設することが通達された。"
 mvlv_uni.33.a: "一歩前進だ"
 mvlv_uni.33.b: "致し方あるまい"
 mvlv_uni.34.t: "[FROM.GetName]個体数の飽和！"
 mvlv_uni.34.d: "監視衛星カメラ情報センターによって観測された情報から[FROM.GetName]の個体数飽和し大規模な侵攻状態になったことが分かった。早急に防備を整える必要がある。"
 mvlv_uni.34.a: "総員、防衛体制！"

 mvlv_uni.35.t: "[FROM.GetName]個体数の飽和！"
 mvlv_uni.35.d: "監視衛星カメラ情報センターによって観測された情報から[FROM.GetName]の個体数飽和し大規模な侵攻状態になったことが分かった。"
 mvlv_uni.35.a: "総員、防衛体制！"
 
 mvlv_uni.36.t: "[FROM.GetName]の地下侵攻の予兆"
 mvlv_uni.36.d: "前線のセンサーがBETAの地下侵攻と思われる振動を感知した。早急に防備を整える必要がある。"
 mvlv_uni.36.a: "総員、防衛体制！"
 
 mvlv_uni.37.t: "[FROM.GetName]の地下侵攻！"
 mvlv_uni.37.d: "BETAが地下から侵攻してきた！至急、戦線を確認し防衛に当たれ！"
 mvlv_uni.37.a: "総員、防衛体制！"
 
 mvlv_uni.39.t: "[FROM.GetName]の勢いの減衰"
 mvlv_uni.39.d: "監視衛星カメラ情報センターによって観測された情報から[FROM.GetName]の侵攻規模が減衰していることが分かった。おそらく大規模な侵攻が収束したものと思われる。"
 mvlv_uni.39.a: "油断は禁物だ"
 
 mvlv_uni.40.t: "占領した[FROM.GetName]からBETAの噴出"
 mvlv_uni.40.d: "[FROM.GetName]の最深部にたどり着いた部隊…攻略部隊全域から緊急の通信が入った。\nどこからともなく大量のBETAが出現した。\n速やかに対処しなければならない。"
 mvlv_uni.40.a: "緊急事態に対処せよ！"

 mvlv_uni.41.t: "少年"
 mvlv_uni.41.d: "諜報筋によると、横浜基地でちょっとした騒ぎがあったらしい。\nとある少年が基地に訪れ、衛兵と言い争いをしたとか・・・。\n何の因果か彼は香月博士に拾われ、今は士官候補生として訓練に勤しんでいるらしい。\n・・・ただ、この少年はこの日まで1年以上生死不明の行方不明状態であったとか。\n"
 mvlv_uni.41.a: "何かが始まろうとしている"
 
 mvlv_uni.42.t: "横浜動乱"
 mvlv_uni.42.d: "横浜基地で行われていた新型OS実証試験で事件が起きた。\n研究施設から逃げ出したBETAが演習中の部隊を襲撃し、壊滅的な被害をもたらしたのだ。\nこれにより当基地の士官や衛士に少なくない被害が起きた。\nこれを受けて司令部は基地戦力の増強を要請したらしい。\n我々は後方だからと実に平和ボケしていたのかもしれない。"
 mvlv_uni.42.a: "我々も他人事では済まない"

 mvlv_uni.43.t: "横浜基地襲撃"
 mvlv_uni.43.d: "横浜基地より緊急事態の宣言が行われた。\nなんと横浜基地、およびその周辺に大規模なBETA群が出現し横浜基地を襲撃したのだ。\nまた、BETAが今までと異なり明確な目標と戦術を持った動きをしていたとの報告もある。\n今回の事件により横浜基地の人員に多くの死傷者が発生している。"
 mvlv_uni.43.a: "何ということだ！"

 
