 UNI_207: "始動"
 UNI_207_desc: "横浜基地訓練校で任官式が開催される"
 UNI_operation_ouka: "人類最後の抵抗"
 UNI_operation_ouka_desc: "00ユニットを通じた情報解析によって、オルタネイティヴ第四計画司令部はBETAに関する新事実、そして人類の置かれた絶体絶命の状況を認識した。人類の歴史を存続させるために残された時間は、数年でも数か月でもなく、僅か数日でしかない…。安全保障理事会は全ての作戦計画を繰り上げ、現時点で人類が投入可能な全ての戦力を使用してのオリジナルハイヴ攻略を決断する。"
 UNI_00_unit: "切り札"
 UNI_00_unit_desc: "横浜基地に突如現れた奇妙な新兵…死人であるはずのこの男は頻繁に香月副指令の部屋を訪ねているようだが…"
 UNI_sadogashima: "甲21号作戦"
 UNI_sadogashima_desc: "第四計画司令部は00ユニット実戦運用試験としての佐渡島ハイヴ攻略作戦を立案した。安全保障理事会はこれを即時承認し、即座に実施されることとなった。この作戦は日本帝国にとっても悲願であり、XM3の優先供給を約束することで、全面的な協力を取り付けることに成功した。"
 UNI_xmos: "奇跡のOS"
 UNI_xmos_desc: "香月博士が突然提案してきたこの戦術機用新OSは当初不可解な目で見られたが、実戦や実証試験を経てこれが非常に画期的なOSであることが分かってきた。このOSが全戦術機に行き渡れば衛士の戦死者を激減させられるだろう。"
 UNI_theTrueUnitedNation: "真の人類連合"
 UNI_theTrueUnitedNation_desc: "国連は、国土を失った多くの国々をつなぐ役割を担い、人類を真に団結させ、世界の力を結集させなければならない。"
 UNI_NegotiateWithUSA: "米国民感情の安定化"
 UNI_NegotiateWithUSA_desc: "かつての世界の超大国の中で、いまだ完璧な戦闘力を保持している唯一の国として、米国の発言力は国連全体で自明であり、われわれが計画を推進するには、彼らの支持を得るために彼らの感情を安定させなければならない。"
 UNI_strengthen_the_English_Channel_line: "欧州連合の防衛強化"
 UNI_strengthen_the_English_Channel_line_desc: "英仏海峡防衛は英国を維持するための最後の砦であり、これが破られれば、英国を基地として欧州全域を反撃する計画は論外となり、英仏海峡の安全を確保するためのEUへの支援を直ちに開始しなければならない。"
 UNI_allayWithJapan: "対日関係の緩和"
 UNI_allayWithJapan_desc: "日本の反対にもかかわらず明星作戦においてG弾投下を決断したことで日本に犠牲者を出したのは我々の責任だ。これは日本との関係を和らげるために負わなければならない責任である。"
 UNI_East_Asian_Emergency_transportation_policy: "大東亜緊急援助法"
 UNI_East_Asian_Emergency_transportation_policy_desc: "大東亜同盟の最前線は、長年にわたる激しい戦闘ですでに崩壊寸前である。即刻、緊急に直接支援を行い、国連軍を増派するとともに、装備の追加支援を行わなければならない。"
 UNI_StrengthenAfricaFront: "アフリカ連合の強化"
 UNI_StrengthenAfricaFront_desc: "アフリカ連合は発足以来大きく成長したが、その基盤はまだ弱すぎる。"
 UNI_Central_SouthAmericaMobilization: "アメリカ大陸初期動員法"
 UNI_Central_SouthAmericaMobilization_desc: "中南米諸国もまた、戦線のニーズに応えるために動員され、戦線に赴く準備が整っていなければならない。"
 UNI_LessonsFromOperationLucifer: "人類の反攻の始まり"
 UNI_LessonsFromOperationLucifer_desc: "明星作戦は、極東戦線で初めてBETAに対する大規模な反攻に成功し、人類が初めてBETAの巣の占拠に成功し、人類がBETAに勝てることを証明した。 人類を覆っていた暗雲がようやく少し晴れた。"
 UNI_JointResearch: "国際共同研究"
 UNI_JointResearch_desc: "今日の死活的な状況において、異なるメーカー間の癒着を続けても意味はなく、国連が主導して各国の科学研究努力を統合し、国際共同研究を行う必要がある。"
 UNI_JointTSFPilotTraining: "国連衛士訓練プログラム"
 UNI_JointTSFPilotTraining_desc: "衛士は人類にとってかけがえのない希少なエリートであり、戦術機を飛ばすために必要な存在である。しかし、これほど激しい戦争のさなかにあって、現役の衛士の数は急速に減少しており、最前線の衛士を補充するためには、国際的な規模で合同訓練を主導する必要がある。"
 UNI_JointIndustrialProduction: "国際産業協力"
 UNI_JointIndustrialProduction_desc: "最大限の生産性を追求するためには、世界中のすべての工業生産組織を統合する必要があり、国際連合が世界規模での工業協力を直接主導する必要がある。"
 UNI_StandardizedProductionSequence: "国際的に標準化された製造工程"
 UNI_StandardizedProductionSequence_desc: "戦況が激化する中、生産能力をさらに向上させるためには、あらゆる種類の機器について世界的に調和のとれた標準的な生産プロセスを確立することが不可避の要件となっている。 新たに設立されたNLM工業規格検討委員会は、世界規模での新標準の実施を確実にする。"
 UNI_StandardizedDataLink: "軍事データの統一"
 UNI_StandardizedDataLink_desc: "近い将来、大規模な多国間共同軍事作戦が数多く実施されることになるだろうが、その際には、最も効率的な連携を実現するために、すべての国の現用データリンクを統一し、アップグレードする必要がある。"
 UNI_JointCommandPost: "多国籍統合司令部"
 UNI_JointCommandPost_desc: "国境を越えた部隊編成には、各国の指揮官が各国軍の指揮を調整する統合司令部を形成する必要がある。"
 UNI_AmericaIndustryConsolidation: "アメリカ大陸産業統合計画"
 UNI_AmericaIndustryConsolidation_desc: "中南米の既存産業の統合と効率化、生産量増加を目指す。"
 UNI_IncreaseAtlanticRegionFoodProduction: "大西洋沿岸における食糧生産の拡大"
 UNI_IncreaseAtlanticRegionFoodProduction_desc: "食料供給を安定させるためには、藻類やその他の主要原料を使用する合成食品工場を大西洋岸に拡大する必要がある。"
 UNI_SEADevelopment: "東南アジア開発計画"
 UNI_SEADevelopment_desc: "地域の中核であった東アジアを失った後、供給能力を向上させながら大東亜同盟の戦闘力を維持するためには、東南アジアをより深く発展させる必要がある。"
 UNI_CooperateWithBolsheviks: "連邦共産党との協力"
 UNI_CooperateWithBolsheviks_desc: "さまざまな理由から、ソビエト連邦は国際連合と密接に結びついていないが、この状況は改善されるべきであり、イデオロギーに関係なく、BETAへの抵抗勢力は団結すべきである。"
 UNI_EstablishContactInAlaska: "アラスカでの接触"
 UNI_EstablishContactInAlaska_desc: "ソ連はBETAとの戦いで非常に豊かで貴重な経験を持っており、今後の北アジアの復興はソ連の力なくしてはありえない。 最初の会合の場所は、アラスカのソ連レンドリースに決まった。"
 UNI_allayWithUSSR: "ソ連とのデタント"
 UNI_allayWithUSSR_desc: "過去にソ連とさまざまな相違や矛盾があったのは事実だが、今は関係を緩和し、現状を見直すことが不可欠だ。"
 UNI_LookIntoTheFuture: "未来に向けて"
 UNI_LookIntoTheFuture_desc: "会談はかなり順調に進み、双方が将来に向けて共通の目標を定める時が来た。"
 UNI_allayWithUFC: "中国との関係緩和"
 UNI_allayWithUFC_desc: "ソ連と同じように、両者の間にはかなり激しい対立があったし、BETA戦争後も軍の指揮権などをめぐって多くの対立があったが、そうした問題を手放す時が来たのだ。"
 UNI_TaiwanConstructionProtocol: "台湾建設技術"
 UNI_TaiwanConstructionProtocol_desc: "台湾は統一戦線の大陸反攻の最重要拠点であり、最後のベースキャンプでもある。 台湾をさらに建設することは、統一戦線を強力に支援し、われわれの誠意を示すことになる。"
 UNI_JointExerciseWithBaoFengTestFlight: "ストーム隊との合同作戦"
 UNI_JointExerciseWithBaoFengTestFlight_desc: "ストーム隊が使用するJ-10Xは接近戦に優れており、我々は彼らと合同演習を行い、より多くのデータを得るべきだ。"
 UNI_ConsolidateAlternativePlans: "オルタネイティヴ計画の統合"
 UNI_ConsolidateAlternativePlans_desc: "オルタネイティヴ計画の成果は、かつては互いにリソースを奪い合っていたが、その効果を最大化するために統合されなければならない。"
 UNI_ReuseAL3: "オルタネイティヴIIIの再適用"
 UNI_ReuseAL3_desc: "当初の目的は、BETAと精神的なコミュニケーションができる改心者を育成することだったが、おそらくこのプロジェクトは他の目的にも使えるだろう。"
 UNI_YashiroKasumi: "社霞"
 UNI_YashiroKasumi_desc: "この謎めいた少女は、ソビエト連邦から私たちに譲渡されたオルタネイティヴIIIの数少ない成功者の一人で、彼女の名前は社霞。"
 UNI_FruitofTheNewAL3: "人員計画の調整"
 UNI_FruitofTheNewAL3_desc: "オルタネイティヴIIIの再適用はかなり実を結んでおり、しばらくの間は人材の心配をする必要はない。"
 UNI_AdditionalFundForAL4: "オルタネイティヴIVへの支援"
 UNI_AdditionalFundForAL4_desc: "日本が主導するオルタネイティヴ4は順調に進んでいるようだが、残された時間はあまりない。"
 UNI_EnhanceA01ValkyrieSquadron: "ヴァルキリーズ飛行隊装備強化"
 UNI_EnhanceA01ValkyrieSquadron_desc: "主要な戦闘に参加したヴァルキリーズ特殊部隊は、優れた戦術機に置き換える必要があり、直ちに実施すべきである。"
 UNI_PromoteIrinaPyatkh: "イリーナ・ピアティフを指揮系統に昇格させる。"
 UNI_PromoteIrinaPyatkh_desc: "オルタネイティヴ4のプロジェクト・リーダーである香月夕呼博士の要請により、元ポーランド代表のイリーナ・ピアティフが横浜基地の指揮系統に即座に異動することになった。"
 UNI_AdjustAL5FocalPoint: "オルタネイティヴVの方向性変更"
 UNI_AdjustAL5FocalPoint_desc: "戦況の変化に対応するため、オルタネイティヴVの実施優先順位を見直す必要がある。"
 UNI_EnhanceOrbitalCorps: "強化された軌道戦力"
 UNI_EnhanceOrbitalCorps_desc: "将来的にハイヴ攻略作戦の数は増加するだろう、その任務のために軌道降下部隊ももっと必要になるだろう。"
 UNI_UNSCJointCommand: "宇宙軍統一司令部"
 UNI_UNSCJointCommand_desc: "世界中の人々が国際連合宇宙軍を構成しており、それを調整するために専門の宇宙軍統合司令部が必要なのだ。"
 UNI_AftermathOfOperationOuka: "桜花作戦の補填"
 UNI_AftermathOfOperationOuka_desc: "桜花作戦は成功したが、その代償は非常に大きかった。"
 UNI_DawnWillCome: "人類の勝利の夜明け"
 UNI_DawnWillCome_desc: "BETA大戦において多くの人が亡くなったが、彼らの犠牲を無駄にすることはない。目の前の長い夜を明るく照らす光は、すぐそこまで来ている。"
 UNI_UNIndustrialProductionReorganiseProtocol: "国連産業改善計画"
 UNI_UNIndustrialProductionReorganiseProtocol_desc: "激化する戦況に対処するためには、土地の喪失によって失われた生産能力を補うために、工業生産能力を再編成する必要がある。"
 UNI_FocusOnTSFProduction: "戦術機生産への注力"
 UNI_FocusOnTSFProduction_desc: "戦術機は、BETAに対する人間の戦略にとって最も重要なユニットであり、我々は生産性を彼らに集中させなければならない。"
 UNI_BalanacedProduction: "平均生産量の増加"
 UNI_BalanacedProduction_desc: "戦術機と通常戦力、どちらも不可欠であり、同等に扱うべきだ。"
 UNI_FocusOnCartridgeProduction: "砲弾製造の重視"
 UNI_FocusOnCartridgeProduction_desc: "戦術機の使用は重要だが、大量のBETAを倒すのはやはり後方の重砲であり、我々はそれをもっと必要としている。"
 UNI_ImproveTSFQuality: "品質向上"
 UNI_ImproveTSFQuality_desc: "古い機材が時代遅れになるのは常に時間の問題であり、既存の戦術機をアップグレードして、前線の需要に見合った品質を維持する必要がある。"
 UNI_QuantityOverQuality: "生産拡大"
 UNI_QuantityOverQuality_desc: "BETAはその果てしない数で知られており、戦術機がBETAより圧倒的に優れているとはいえ、我々はまだ多くの装備を必要としている。"
 UNI_AbsorbExternalCartridgeProductionTech: "他国の先進技術を導入"
 UNI_AbsorbExternalCartridgeProductionTech_desc: "前線での戦闘経験が豊富な国々は、より効率的に装備を生産する方法について多くの先進技術を持っているかもしれない。"
 UNI_NextGenTSFDevelopment: "国際連合のための新世代戦術機の開発"
 UNI_NextGenTSFDevelopment_desc: "前線からの要求に応えるためには、新世代の戦術機の開発に着手する必要がある。"
 UNI_ClassifiedJointTSFDevWithUSA: "米国との秘密戦術機開発協力"
 UNI_ClassifiedJointTSFDevWithUSA_desc: "次世代戦術機の開発プロセスを加速させるためにも、他国のメーカーの感情も考慮する必要があるが、密かに米国と協力すべきだ。"
 UNI_ClassifiedJointTSFDevWithJAP: "日本との秘密戦術機開発協力"
 UNI_ClassifiedJointTSFDevWithJAP_desc: "次世代戦術機の開発プロセスを加速させるためには、他国のメーカーの感情も考慮する必要があるが、密かに日本と協力すべきだ。"
 UNI_InternalNextGenTSFDevelopment: "新世代戦術機の自主開発"
 UNI_InternalNextGenTSFDevelopment_desc: "次世代戦術機の開発を早期に完了させることは重要だが、いつまでも他メーカーの技術に頼っているわけにはいかない。"
 UNI_4thGenTSFDev: "次世代戦術機の開発"
 UNI_4thGenTSFDev_desc: "新型の第3世代戦術機が完全に稼働し始めた今、BETAを圧倒的に上回る次世代戦術機を目指し、新時代の扉を開くことを考えるべき時だ。"
 UNI_ProvideAidForJapanDefence: "日本の防衛支援"
 UNI_ProvideAidForJapanDefence_desc: "明星作戦は終わったばかりだ。我々は、日本の防衛を支援し、オルタナティヴ4プログラムの開発を監視するために、捕獲した横浜の隠れ家の上に連合軍の基地を設置すべきだ。 日本の首相は、見返りとして不知火の技術を喜んで提供してくれるようだ。"
 UNI_RestateVancouverTreaty: "バンクーバー協定の再確認"
 UNI_RestateVancouverTreaty_desc: "占領された横浜の巣の所有権については、参加国からさまざまな意見が出されており、バンクーバー協定に従って私たちが管理することになる。"
 UNI_ConcludeOperationLucifer: "明星作戦の総括"
 UNI_ConcludeOperationLucifer_desc: "明星作戦は人類が捕獲に成功した最初のBETAの巣であったが、それは極めて高価な勝利であり、我々は失敗から学ばなければならない。"
 UNI_RevealGBombCapability: "G弾の発表"
 UNI_RevealGBombCapability_desc: "明星作戦で初めて使用された水爆の威力はあまりに恐ろしいもので、私たちはこの真新しい戦略兵器の威力を外部に公表しなければならなかった。"
 UNI_PrepareForProjectProminence: "ジョエル・プロジェクトの着実な進展"
 UNI_PrepareForProjectProminence_desc: "大規模な多国間共同戦術機開発プロジェクトとして、私たちはすでに多くの最前線の国々から戦闘経験を得ており、それは戦術機の開発に大いに役立つものである。"
 UNI_RefugeeResttlement: "難民の適切な定住"
 UNI_RefugeeResttlement_desc: "難民の再定住を遅らせることはできないし、きちんと再定住させなければならない。 国の没落は彼らのせいではないし、彼らは今、私たちの過ちの代償を払っている。"
 UNI_EnhanceSecurityForces: "治安部隊の強化"
 UNI_EnhanceSecurityForces_desc: "人類にとって生死の境をさまようこの時期に、難民の生活を気遣うほどの余力も時間もない。"
 UNI_RefugeeEnlistment: "難民の徴兵"
 UNI_RefugeeEnlistment_desc: "難民の中には、故郷を離れて逃げることに抵抗のある若者も多い。 そうすれば、難民キャンプへのプレッシャーも軽減されるだろう"
 UNI_RefugeeVolunteerArmy: "難民志願部隊"
 UNI_RefugeeVolunteerArmy_desc: "ここまで戦争が進むと、もはや地獄から逃れてきた難民でさえ、自らを戦争に巻き込まないようにできる者はいない。 避難民を主力とする軍隊の編成は、訓練不足の人たちがその穴埋めをすることを期待しない一方で、防衛を補強することになる。"
 UNI_EnhanceUNReputation: "国際連合の権威回復"
 UNI_EnhanceUNReputation_desc: "明星作戦以前の一連の作戦失敗によって、安保理理事国から懐疑的な目を向けられている。明星作戦や難民問題への対応などの実績を通じて、人類諸国をリードする能力を証明しなければならない。"
 UNI_FocusOnAL4: "オルタネイティヴIVに注力"
 UNI_FocusOnAL4_desc: "米国が提案するオルタネイティヴVが潜在的に危険なものであることを考えれば、日本で進行中のオルタネイティヴIVに集中した方がよいだろう。"
 UNI_EmergencySecurityCouncilSummit: "緊急安全保障理事会の開催"
 UNI_EmergencySecurityCouncilSummit_desc: "訓練基地はBETAによる予期せぬ襲撃を受け、香月博士は、同様の襲撃を防ぐため、すべての国の基地に警戒を呼びかける緊急安全保障理事会の必要性を提案する。"
 UNI_WorldJointDevelopment: "共に働く研究者たち"
 UNI_WorldJointDevelopment_desc: "桜花作戦は、人類に真の希望を見出す時間を与えてくれた。 奮起した研究者たちが力を合わせれば、人類の勝利は必ず達成される。"
 UNI_blue_flag: "相互評価演習"
 UNI_blue_flag_desc: "ユーコン基地で各国の試験部隊による大規模な模擬戦を計画する。この演習により試験部隊同士の技術交流の促進や、競い合うことで生まれる新たなアイデアなどを開発に取り入れることができるだろう。"
 UNI_yukon_base: "ユーコン基地復興"
 UNI_yukon_base_desc: "多大な犠牲が払われたユーコン基地テロ事件であるが、テロリスト共は制圧され、基地の機能は取り戻された。一刻も早く復興しなければならない。"
 UNI_a01: "再建"
 UNI_a01_desc: "オルタネイティヴ4の中で重要な役目を果たし、桜花作戦を成功に導いたA-01連隊は度重なる激戦の中で消耗し、ついに解散されることになった。香月博士はこれに合わせて新たな戦力(手駒)を探し始めた。"
 UNI_vd: "ヴァルキリーズデータ"
 UNI_vd_desc: "ヴァルキリーズが残したデータは今後の対BETA戦において必ず価値のあるものになるだろう。国連が戦後も主導権を握るためにこのデータの活用法を模索しなければならない。"
 UNI_YashiroKasumi_tt: "社霞が将軍として利用可能になる"
 UNI_YashiroKasumi_tt_desc: ""

 UNI_category: "安全保障理事会特別権限"
 UNI_category_desc: "安保理は国連統合軍を統率する頭脳である。その為、各種の特権を保持している。"
 UNI_UNI_give: "[From.GetName]へ装備提供を命令"
 UNI_UNI_give_desc: "国連統合軍は独自の軍を維持できるほどの工業力は持っていない。特に戦術機は各国からの派遣軍で賄っている状況であるが、安保理権限で各国より装備の提供を命令できる。"
 UNI_xmosd_category: "XM3"
 UNI_xmosd_category_desc: "XM3はとてつもない可能性を秘めたOSである。これを有効活用しない手はない。香月博士は各方面に働きかけ、このOSの売り込みを行っている。"
 UNI_xmosd_give: "[From.GetName]へのXM3提供"
 UNI_xmosd_give_desc: "XM3提供の見返りを要求することで、各方面に回す資金が増やせるだろう"
 UNI_xmosdg: "[From.GetName]への支払額増額要求"
 UNI_xmosdg_desc: "XM3の恩恵を受けている各国に対して追加で支払いを求めれば快く応じてくれるだろう"
 UNI_xmos_mission: "工場支払い"
