l_japanese:
 mvlv_difficulty: "難易度"
 mvlv_difficulty_easy: "難易度選択 : 簡単"
 mvlv_difficulty_easy_desc: "BETAは強い。一人で戦うあなたに加護を。"
 mvlv_difficulty_normal: "難易度選択 : 普通"
 mvlv_difficulty_normal_desc: "援助は少ない。人類の命運は君の戦略次第だ。"
 mvlv_difficulty_hard: "難易度選択 : 困難"
 mvlv_difficulty_hard_desc: "この世界の人類は弱い。しかし、熟練の指揮官達であれば生き残れるだろう。"
 mvlv_difficulty_unlimited: "難易度選択 : 地獄"
 mvlv_difficulty_unlimited_desc: "軋轢を乗り越えBETAを殲滅せよ"
 mvlv_difficulty_ai: "難易度選択 : AI"
 mvlv_difficulty_ai_desc: "彼らはAIだ。つまり、あなたより遥かに弱い。この世界は彼らに慈悲を与えることにした。"
 mvlv_difficulty_beta: "難易度選択 : BETA"
 mvlv_difficulty_beta_desc: "奴らが来た。奴らの勢いはとどまることを知らず、その醜悪な見た目と凶悪な力でこちらを喰らい尽くす。"
 
 SRD_idea: "確率時空管理システム"
 SRD_idea_desc: "この国は、本確率時空でのイベントやリソース管理を円滑に行うために存在している。"

 beta_resource: "BETA資源"
 beta_resource_desc: "BETAの生産力は無尽蔵と言えるが、その材料は謎に包まれている。"
 beta_speed_up_production: "BETAの危機感"
 beta_speed_up_production_desc: "BETAを刺激しすぎたため、早期な戦力補充が行われる。"

