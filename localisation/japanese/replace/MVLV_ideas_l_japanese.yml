 hive_recently_phaseUp: "ハイヴの著しい成長"
 hive_recently_phaseUp_desc: "このハイヴは最近規模が大きくなったため、当面の間は強化されないだろう。\n\n……少なくとも数カ月は。"
 hive_thinning_state: "間引きされたハイヴ"
 hive_thinning_state_desc: "間引き作戦が実施されたため、このハイヴからは少量のBETAしか生産されなくなる。\n\nこれは、あなたの兵士によってもたらされた最良の結果である。"

 mvlv_aggressive_beta: "大規模侵攻"
 mvlv_aggressive_beta_desc: "個体数が飽和したハイブのBETAは新たな支配地を求めて進軍する。その勢いを止めることは出来ない"
 mvlv_aggressive_beta2: "小規模侵攻"
 mvlv_aggressive_beta2_desc: "定期的にBETAは新たな支配地を求めて進軍する。その勢いを止めることは出来ない"
 mvlv_defence_human: "縦深防御"
 mvlv_defence_human_desc: "BETAの大規模侵攻を受けて縦深防御戦術を実行する"
 mvlv_standby_sado: "停滞"
 mvlv_standby_sado_desc: "彼らはなにかを待っている"
 mvlv_nuclear_winter: "核の冬"
 mvlv_nuclear_winter_desc: "BETA大戦初期からBETAの侵攻を防ぐため人類は核兵器を多用してきた。その結果地球は慢性的な核の冬状態にあり、作物の生育や人々の暮らし、軍事行動に至るあらゆる場所に影響が出ている。"

 mvlv_prominence_problem: "プロミネンス計画"
 mvlv_prominence_problem_desc: "プロミネンス計画は国連主導の戦術機開発計画であり、多数の国を参加させ、同じ基地で研究、開発を行わせることで戦術機の開発を促進するという目的の計画であり、国連軍ユーコン基地で進められている。"
 mvlv_saast: "米州安全保障地域条約"
 mvlv_saast_desc: "SAAST条約とも呼ばれるこの条約は、安全地帯である中南米に対BETA戦用の部隊は不要というアメリカの意見によって結ばれた。この条約で中南米諸国の軍備は大きく制限されるが、代わりにアメリカから経済支援を受けられる。"

 MVLV_ouka_setting_idea: "桜花作戦準備指令"
 MVLV_ouka_setting_idea_desc: "あ号目標攻略の目算が建ったことから国連より準備指令と援助が行われた。"
 MVLV_ouka_setting_idea2: "緊急：桜花作戦準備指令"
 MVLV_ouka_setting_idea2_desc: "もはや一刻の猶予もなく我々はこの作戦準備に全力を注がなければならない"
 MVLV_ouka_phase_1_idea: "桜花作戦第一フェーズ"
 MVLV_ouka_phase_1_idea_desc: "我が国家は前線押上と攻勢による陽動・引き出しが任務だ"
 MVLV_ouka_phase_1_idea2: "桜花作戦第一フェーズ"
 MVLV_ouka_phase_1_idea2_desc: "我が国家は、前線の陽動を行いながら第二フェーズの準備を行う必要がある"
 MVLV_ouka_phase_2_idea: "桜花作戦第二フェーズ"
 MVLV_ouka_phase_2_idea_desc: "オリジナルハイヴの門、およびその周辺に軌道降下を行い本隊のために陽動を行う"
 MVLV_denial_of_delusion: "妄想の否定"
 MVLV_denial_of_delusion_desc: "あ号標的攻略は悲願ではあるが現状では非現実的と言わざるを得ない。"
 MVLV_H00_idea: "あ号標的"
 MVLV_H00_idea_desc: "そこにいるらしい"

 mvlv_leased_land: "租借地経済"
 mvlv_leased_land_desc: "アフリカには多くの欧州諸国の租借地がある。これは地域の経済に大きく貢献しているが、同時にそれを快く思わないアフリカ人も多い。"

 mvlv_start_up: "スタートアップボーナス"
 mvlv_start_up_desc: ""
 mvlv_united_nations: "国際連合"
 mvlv_parmanent: "常任理事国"
 mvlv_parmanent_desc: "5大国及び日本、オーストラリアで構成される常任理事国は国連において強大な発言力を持っており、国連軍の作戦立案や物資輸送の面で自国に有利な方針を実行させることができる。"
 mvlv_un_member: "国際連合の一員"
 mvlv_un_member_desc: "常任理事国ではないものの一定の発言力のある加盟国である。"
 mvlv_license: "国際連合工業支援機構"
 mvlv_license_desc: "国連加盟国の中で対BETA用兵器を自国で開発できる力がない国は多い。そのような国が他国の装備をライセンス生産する際に少しでも負担を軽く出来るよう国連が支援している。"
 mvlv_altanative_0: "オルタネイティヴ計画"
 mvlv_altanative_0_desc: "オルタネイティヴ計画はBETAとのコミュニケーション方法の確立やBETAの生態の解明を効率的に行うべく始まった計画であるが、時が経つにつれて人類の生存を目指す計画へと変わりつつある。オルタネイティヴ計画の主導国に選ばれた国は国連と協力しつつ各計画毎の目標の達成を目指す。"
 mvlv_altanative_3: "オルタネイティヴIII"
 mvlv_altanative_3_desc: "この国はオルタネイティヴIIIの主導国となった国である。その為、計画による成果や研究中の項目についてある程度恩恵を受けることができる。オルタネイティヴIIIは人工ESP発現体によってBETAとのコミュニケーションを取ろうとした計画であり、ソビエト連邦は計画の副産物である人工ESP発現体を軍事転用する研究を行っている。"
 mvlv_altanative_4: "オルタネイティヴIV"
 mvlv_altanative_4_desc: "この国はオルタネイティヴIVの主導国となった国である。その為、計画による成果や研究中の項目についてある程度恩恵を受けることができる。オルタネイティヴIVは00ユニットによってBETAをリーディングし、BETAの情報を得ることが目的の計画であり、日本帝国は計画により予想されるハイヴ攻略戦において国連軍から優先的に支援を受けている。"
 mvlv_altanative_5: "オルタネイティヴV"
 mvlv_altanative_5_desc: "この国はオルタネイティヴVの主導国となった国である。その為、計画による成果や研究中の項目についてある程度恩恵を受けることができる。オルタネイティヴVは系外惑星への人類の移住を目的にした計画であり、ラグランジュ点において巨大な移民船団の建造を行っている。なお、実行の際には地球に存在するすべてのハイヴに対してのG弾投下及び残存戦力をすべて投入したハイヴ攻略作戦が実施される。"
 mvlv_brokenhive: "占領されたハイヴ"
 mvlv_brokenhive_desc: "このハイヴは人類によって攻略済みであり、完全な制御下にある。\n今後、このハイヴからBETAは出現しないだろう。奴らに奪われない限り……"
 operation_ouka: "桜花作戦"
 operation_ouka_desc: "この作戦の失敗は人類の滅亡を意味する。人類最後の抵抗は何もかも足りない中で始まった。"

 BET_operation: "オリジナルハイヴ"
 BET_operation_desc: "大規模災害が切迫していることを察知すると、直ちに高度活動命令が発令される。"
 BET_broken_original_hive: "機能を止めたオリジナルハイヴ"
 BET_end_game: "戦術的行動"
 BET_end_game_desc: "そろそろ戦いを終わらせ、災厄を一掃し、戦術的な作戦を実行に移す時だ。"
 BET_00_unit: "重大災害の防止策"
 BET_00_unit_desc: "損失を減らすのに役立つ、大規模災害に関するさまざまな情報が寄せられた。"
