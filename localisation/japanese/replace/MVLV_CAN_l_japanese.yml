 CAN_atomic: "核汚染"
 CAN_atomic_desc: "BETAの降下を核によって退けたカナダ北東部の広大な地は人が住める状態ではない。30年経った現在も影響は強く残っており、食料の確保や産業の育成の障害となっており多くのリソースを現状の維持に費やさざる得ない。"
