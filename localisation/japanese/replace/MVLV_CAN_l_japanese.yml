 CAN_us: "カナダ支援政策"
 CAN_us_desc: "アメリカは核によって汚染されたカナダに対して多大な支援を行っている。この支援のお陰で今のカナダは辛うじて国家としての態勢を保っているが、それは旧宗主国たるイギリスの影響の排除や、カナダ経済の支配を目論むアメリカに逆らうことが出来ないという側面も持っている。"
 CAN_noatomic: "清浄な地で"
 CAN_noatomic_desc: "西部への産業、住民の移転が完了し、やっと我々は新たな一歩を踏み出せる。"
 
 CAN_EUR: "欧州貿易協定"
 CAN_EUR_desc: "貿易協定を建前としながら復興支援と政的介入が行われている。"
 CAN_idea_Pride_in_the_Sky: "大空への誇り"
 CAN_idea_Pride_in_the_Sky_desc: "軍規模に対して遥かに強大な降下兵団を我々は輩出している。"

 ###event
 
 mvlv_can.1.t: "オタワ宣言"
 mvlv_can.1.d: "現在のカナダはアメリカに経済を支配され、故意に復興を阻まれている。この状況から脱するにはアメリカからの支援を断り、自立の道を進まなければならない。本日大統領府はこのような声明を発表した。アメリカとの関係悪化は避けられないだろう。"
 mvlv_can.1.a: "カナダのために！"
 mvlv_can.2.t: "オタワ宣言"
 mvlv_can.2.d: "カナダが我が国の支援を断ってきた。合衆国大統領は激怒しカナダへの支援停止は勿論一切の交渉を打ち切ることを宣言した。"
 mvlv_can.2.a: "大人しく傀儡のままでいれば良かったものを…"
 mvlv_can.3.t: "アメリカからの圧力"
 mvlv_can.3.d: "カナダがアメリカから自立するという知らせが入った。これを受けて事務総長は支援策を発表するつもりであったが、それはアメリカによって妨げられた。アメリカからの要求はカナダへの国連による支援を一切停止せよ。との事だ"
 mvlv_can.3.a: "致し方ない…"
 mvlv_can.4.t: "国連からの通知"
 mvlv_can.4.d: "今朝大統領府に一通の知らせが届いた。それは国連がカナダへの支援を一切停止するというものであった。自立の道を歩み始めたカナダの孤独な戦いが始まった。"
 mvlv_can.4.a: "我々の決断は揺るがない！"