l_japanese:
 OSE_focus_tree: "オーストラリア 国家方針ツリー"
 ose_first: "本土防衛"
 ose_first_desc: "長年我々は後方国家として安全で快適な暮らしを送ってきたが、近年のBETAの進撃速度を考えると我々の大陸に押し寄せてくるのも時間の問題である。そうなってから平和に慣れ切った国民を戦争に駆り立てても戦力にはならない。反発は多いだろうが、あらゆる手段を用いて国民と国を強くしなければならない。"
 ose_eco: "人類の工場"
 ose_eco_desc: "我が国が常任理事国になって久しいが、肝心の工業力は他の常任理事国とは比べることすらできない。我が国の工場の大半は食料の加工であったり、輸出のために使われている。これを軍事にも転用できるよう生産ラインの整理、簡略化を行う。民間企業をいくつか統廃合することになるだろうが、必要なことだ。"
 ose_eco2_1: "再雇用"
 ose_eco2_1_desc: "食糧工場運営企業の統廃合によって余剰の工場を生み、軍需工場を設立する体制を作ったが、元々食糧工場で働いていた難民たちに多くの失業者が出てしまった。明日の生活にも困る彼らを工場の再稼働まで放置はできない。軍で雇用していざという時の為に訓練を施そう。"
 ose_eco2_2: "戦術研究所"
 ose_eco2_2_desc: "我が国は長年極少数の派遣軍を各地に派遣してきたが、それらの部隊が集めた戦訓は軍全体に反映されているとは言えない。戦術機の研究も大事だが、戦術が無ければ無用の長物となってしまうだろう。"
 ose_eco2_3: "AAX計画"
 ose_eco2_3_desc: "近年、アメリカを始め各国で第三世代の高性能戦術機が開発され、実戦配備され始めているが、我が国にそのような高価な戦術機を買いそろえる余裕はない。まして、戦後アメリカに脅威とみなされるような機体を持っていいはずがない。しかしながら、差し迫ったBETAの脅威に対抗するには第三世代の戦術機は必須だろう。そんな中、ボーニング社に安価な第三世代機の開発を依頼するべきという案が浮上してきた。"
 ose_eco2_4: "工場大転換"
 ose_eco2_4_desc: "我が国は食料自給率が100％を超える世界的に珍しい国であり、他国では一般的になりつつある合成食糧は全く流通していない。しかし、これらで国内の需要を満たせば、食糧工場をさらに自由に使うことができるだろう。"
 ose_eco2_5: "大軍需工場"
 ose_eco2_5_desc: "我々は国内の既存の工場を転換するのと、同時に新たな工場の建設も積極的に行ってきた。郊外に大工業団地を作り、我が大陸の工業に革新を起こす時だ。"
 ose_eco2_6: "大民需工場"
 ose_eco2_6_desc: "我々は国内の既存の工場を転換するのと、同時に新たな工場の建設も積極的に行ってきた。郊外に大工業団地を作り、我が大陸の工業に革新を起こす時だ。"
 ose_eco2_7: "大弾薬工場"
 ose_eco2_7_desc: "来るべき決戦にそなえ、弾薬を大量に製造できる基盤を整えるべきだ。あらゆる労働力を動員して弾薬工場地帯を建設する。"
 ose_eco2_8: "国連派遣軍"
 ose_eco2_8_desc: "国連には多数の戦術機部隊が在籍しているが、そのうちの数師団を我が国に提供するように常任理事国権限で要求することが可能だ。"
 ose_eco2_9: "国連を頼る"
 ose_eco2_9_desc: "我が国は他の常任理事国に比べ研究力で劣っている。国連を頼って研究機関を支援してもらうことが可能かもしれない。"
 ose_eco2_10: "緊縮生活"
 ose_eco2_10_desc: "戦争は差し迫った脅威である。我が国の国民も暢気に暮らせるはずがない。生活を制限する法律を制定し、国民の消費を抑制しよう。"
 ose_eco2_11: "難民の帰化"
 ose_eco2_11_desc: "これまで難民はただの労働力として良いように使われてきたが、彼らのお陰で我が国は大きく飛躍できた。今こそ我が国で共に働く彼らを国民として認めるべきだろう。そして、ともにBETAから祖国を護るのだ。"
 ose_eco2_12: "元難民徴兵制度"
 ose_eco2_12_desc: "難民の多数を帰化させたことで彼らに徴兵制を適用できるようになった。これまでも志願兵は募っていたが彼らに徴兵制を敷くことで大きく軍を拡充できるだろう。"
 ose_eco2_13: "給付金"
 ose_eco2_13_desc: "これまで矢継ぎ早に行ってきた改革は国民生活に多大な影響を及ぼしている。政府から支援金を拠出し、マスメディアも駆使して宣伝工作を行って混乱を鎮めることに注力しよう。"
 ose_eco2_14: "新たな祖国"
 ose_eco2_14_desc: "多少の混乱はあったが無事に難民達はオーストラリア国民となることを受け入れてくれた。そして、難民出身の兵士たちも部隊へ多数配属された。新たな祖国を護る彼らの決意は軍全体にいい影響を与えてくれている。"
 militarism_mob: "新たな祖国"
 militarism_mob_desc: "多少の混乱はあったが無事に難民達はオーストラリア国民となることを受け入れてくれた。そして、難民出身の兵士たちも部隊へ多数配属された。新たな祖国を護る彼らの決意は軍全体にいい影響を与えてくれている。"
 ose_war: "革新の胎動"
 ose_war_desc: "議会は我が国を護るためにあらゆる手段を取ることを求めているが、結局は既存の食料工場を転換するだの難民を少しずつ受け入れるだの甘い考えが蔓延しているようだ。そのような軟弱者たちに任せていては一夜にして我が国はBETAに蹂躙されてしまうだろう。もっと急進的な改革が必要だ。"
 ose_war3_1: "半強制労働法"
 ose_war3_1_desc: "我が国に蔓延る難民どもを強制的に国のために働かせる。非難をかわすため表向きは強制労働には見えないようにあらゆる細工を施し、難民たちにそうするしかない状況を作り出すのだ。"
 ose_war3_2: "適材適所"
 ose_war3_2_desc: "我が国には毎日のように難民がやってくる。しかし、それらすべてを強制労働させていては人材の無駄遣いも良い所だ。元軍人は徴兵、元大学教授、教師などは研究所に強制的に送るなど、人材の配置を改善するべきだろう。"
 
 ose_war3_3: "亡命衛士の強制徴用"
 ose_war3_3_desc: "大量に来る難民の中でも貴重な存在はいる。特に祖国を捨てて、もしくは国連軍から逃亡してきた衛士などは、特に重要な存在だ。彼らに新しい居場所を提供してやる代わりに、彼らの能力と戦術機を使わせてもらおうではないか。"
 
 ose_war3_4: "戦術機への注力"
 ose_war3_4_desc: "これまで米国に媚を売って強力な戦術機は保持してこなかったが、最早そのような場合ではない。我が国もあらゆる手段を用いて強力な戦術機を手に入れなければならない。"
 
 ose_war3_5: "戦車への注力"
 ose_war3_5_desc: "飛べないとはいえ高速で展開でき、戦術機よりも安価な戦車は対BETA戦における必須装備である。これらの拡充も急がせるべきだろう。"
 ose_war3_6: "AL弾生産工場"
 ose_war3_6_desc: "我が国でAL弾を大量生産し、各国に供給すれば、我が国のプレゼンスを高めることになり、同時に我が国を護る砲弾の盾も増やせる。専用の工場を建設して生産に注力しよう。"
 
 ose_war3_7: "試作戦術機の横流し"
 ose_war3_7_desc: "我が国には、BETAに対抗するための最新戦術機が必要だ…。そんな時、とある筋から試作戦術機の技術供与が提案された…。乗るゔべきだろうか？"
 
 ose_war3_8: "研究機関の新設"
 ose_war3_8_desc: "難民の強制徴用等により、余裕の出来たリソースを研究機関に割り振ることが出来る。"
 
 ose_war3_9: "難民戦車工場"
 ose_war3_9_desc: "戦車工場に難民を集中的に送り込んで戦車の生産を加速させよう。"
 ose_war3_10: "難民戦術機工場"
 ose_war3_10_desc: "戦術機工場に難民を集中的に送り込んで戦術機の生産を加速させよう。"
 ose_war3_11: "世界のために"
 ose_war3_11_desc: "全ての人達の力をあわせて、この地に大工業地帯を建設する。"
 
 ose_war3_11A: "悲願の成就"
 ose_war3_11A_desc: "『すべての人間は平等につくられていることは、当たり前の真実だ』 長らく続いた悲劇を我々自身の手で終わらせ、世界に平和をもたらそう。"
 
 ose_ghard1: "その時が迫る"
 ose_ghard1_desc: "大東亜連合より悲報が舞い込んできた。長らく耐えてきた防衛線がついに瓦解したというのである。いよいよ来るべき時が来た。"
 ose_ghard2: "緊急召集"
 ose_ghard2_desc: "我が国に危機が迫っている。政府は緊急事態宣言を発し、国民の徴兵を始めた。"
 ose_ghard3: "工場緊急接収"
 ose_ghard3_desc: "我が国に迫るBETAに対抗するため、国内の工場を多数接収し、軍需品の増産を急がせる。"
 ose_ghard4: "上陸阻止"
 ose_ghard4_desc: "我が国にBETAを上陸させてはならない。要塞の修繕、拡張、新設を急がせる。"
 ose_ghard5: "国連の緊急支援"
 ose_ghard5_desc: "我が国の危機に対して、国連に支援を要請する。焼け石に水かもしれないが、やらないよりははるかにマシだ。"
 
 OSE_PurchaseRetiredTSF: "退役戦術機の購入"
 OSE_PurchaseRetiredTSF_desc: "国連から旧式の戦術機を大量に購入する。費用は嵩むが、なりふり構っている余裕はない。"
 
 OSE_DemandTSFProductionLicense: "戦術機製造ライセンス要求"
 OSE_DemandTSFProductionLicense_desc: "より優れた戦術機が必要な我が国には、手段を選んでいる余地はない。"
 
 OSE_AllInProduction: "三交代制"
 OSE_AllInProduction_desc: "工場は稼働を止めず、明かりは消えず、真新しい兵器が津波の様に前線を支える。"
 
 
 OSE_food: "人類の食糧工場"
 OSE_food_desc: "BETA大戦の影響をほとんど受けてこなかったオーストラリアは世界一の天然食料輸出国であり、同時に国民向けの食料も天然物があふれている。"
 OSE_refugees: "難民の積極的受け入れ"
 OSE_refugees_desc: "オーストラリアは国連に協力して多くの難民を受け入れている。それは労働力として使えるという利点があるが、多くの地域で治安の悪化が懸念されている。"
 OSE_payment_of_grants: "給付金の支払い"
 OSE_payment_of_grants_desc: ""
 
 OSE_goods: "緊縮生活"
 OSE_refugees2: "難民の帰化"
 OSE_refugees3: "新たな祖国"
 OSE_refugees4: "半強制労働制"
 OSE_space: "対レーザー戦闘"
 OSE_tsf: "国営戦術機工場"
 OSE_human: "適材適所"
 OSE_tank: "国営戦車工場"
 OSE_geu: "大東亜連合緊急支援"
 
 OSE_idea_ANZAC: "ANZAC"
 OSE_idea_ANZAC_desc: "『Australia and New Zealand Army Corps』通称ANZACは、オーストラリアおよびニュージーランド合同の軍事組織を意味する。1914年に編成された彼らは英連邦の尖兵として危険な戦線に派遣されてきた。英連邦の結束が弱まった今でも、ANZACの精神はオセアニア軍に引き継がれている。"
 
 OSE_idea_Expanding_refugee: "難民戦線の拡大"
 OSE_idea_Expanding_refugee_desc: "強硬な対難民政策は、難民の反発を招くと同時に、統治機能の致命的な不全を招いている。もしかすると国内情勢を一変させる事態が訪れるかもしれない。"
 
 OSE_idea_Refugee_Nation: "最後の楽園"
 OSE_idea_Refugee_Nation_desc: "我々は長らくBETAに、そして抑圧的な指導者達に虐げられてきた。ここを我々にとっての楽園として、この地を護る為に、そして我々の自由を護るために、武器を取ろう。もう我々は無力な難民ではない。そして世界中の同志達をこの地に集めよう。我々の成した事が、無意味で終わらないように。そして、明日を無事に過ごせるように。"
 
 OSE_esc_tsf_tt: "大東亜、アメリカ、国連機で構成された５個師団規模の戦術機を作成する。"
 
 mvlv_ose.1.t: "緊急支援"
 mvlv_ose.1.d: "我らの危機に際し、オーストラリアが緊急の支援を行ってきた！"
 mvlv_ose.1.a: "これで何とかしのげればいいが…"

