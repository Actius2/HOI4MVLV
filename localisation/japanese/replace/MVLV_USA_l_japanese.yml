 USA_focus_tree: "アメリカ合衆国 国家方針ツリー"
 USA_support_japanese: "日本におけるスパイ活動"
 USA_support_japanese_desc: "オルタネイティヴIVを主導する日本は、わが国が主導するオルタネイティヴVの障害となっている。 クーデターを起こすために工作員を送り込むことで、わが国に有利な国際情勢を作り出すことができる。"
 USA_WarOrPeace: "最も幸福な大陸対BETA戦争"
 USA_WarOrPeace_desc: "唯一、国力を保持する超大国として、私たちは世界で最も安全な国を築いている。しかし、全力を尽くしてBETAと戦うことが私たちの義務であり、私たちは選択を迫られている。"
 USA_ArsenalofDemocracy: "民主主義の兵器廠"
 USA_ArsenalofDemocracy_desc: "第二次世界大戦では、自由世界全体を守るという重荷が私たちの肩にのしかかっていた。そして今、この巨人は、同盟国と兵士を支援するための軍備の高波とともに、再び目覚めようとしている。"
 USA_ExpandLockheed: "ロッキード"
 USA_ExpandLockheed_desc: "ロッキードはいくつかの主要メーカーの1社として、戦術機におけるわが国の技術的優位性を世界規模で確立するために多大な貢献をしてきた。"
 USA_GeneralPurposeTSFDev: "汎用戦術機の開発"
 USA_GeneralPurposeTSFDev_desc: "ハイ・ロー理論のために2つの異なる戦術機を設計するのは、両方に対応できる汎用モデルにはかなわないし、少なくとも異なるラインを調整するコストを節約することはできない。"
 USA_21stCenturyArmsRace: "21世紀米国の軍備計画"
 USA_21stCenturyArmsRace_desc: "ATSF計画の当初の意図通り、我々は戦後の権力分立と争いに備えなければならない。"
 USA_Advanced_Anti_BETA_MBT: "先進的な対BETA戦車"
 USA_Advanced_Anti_BETA_MBT_desc: "戦術機を更新することも重要だが、前線で主力兵力を実際に担っているのはやはり陸軍の装甲であり、そのために次世代の主力戦車を開発すべき時なのだ。"
 USA_EagleModiProject: "F15改造プログラム"
 USA_EagleModiProject_desc: "既存のF-15Eストライク・イーグルは、その長寿にもかかわらず、将来の戦争任務の要求を常に引き受けることができるわけではなく、ボーイングは新たなアップグレードの計画を持っている。"
 USA_AidUNForces: "国連軍を支援"
 USA_AidUNForces_desc: "国連軍は我々から戦術機を大量に入手したいと考えている。これは恩を売るチャンスだ。"
 USA_FormAmericaCoalitionForce: "米州連合軍の結成"
 USA_FormAmericaCoalitionForce_desc: "中南米は長い間われわれの庇護下にあったのだから、今こそ彼らも戦争に貢献する時だ。 中南米の戦術機パイロットを訓練し、米軍の指揮下に組み込む。"
 USA_DataLinkArmyBuild: "情報軍の創設"
 USA_DataLinkArmyBuild_desc: "私たちのデータリンク・システムはすでに世界的に最先端を走っているが、だからといって、より徹底したコンピューター化された軍隊を作り続けることを妨げるものではない。"
 USA_UnmannedAidUnit: "無人アシスタンスモジュール"
 USA_UnmannedAidUnit_desc: "情報技術を完成させた今こそ、無人アシストシステムに目を向けるべき時である。"
 USA_PeaceAboveElse: "最も幸せな国"
 USA_PeaceAboveElse_desc: "米国民の私たちに対する信頼は、米本土が戦争によって影響を受けることはないという信念に基づいており、私たちはその信念を国民に持ち続けるべきである。"
 USA_Superpower: "超大国"
 USA_Superpower_desc: "現在も将来も、世界にはただひとつの超大国しか存在しない。"
 USA_StrikeFirst: "先手必勝"
 USA_StrikeFirst_desc: "先制攻撃は肉を食べるが、後制攻撃はスープすら得られない。 現状を最大限に活用すべきだ。"
 USA_IndustrialMobilization: "産業動員"
 USA_IndustrialMobilization_desc: "プログラムの効果的な実施を確実にするためには、国全体の産業システムを整え、それに対応するためのインフラを拡充する必要がある。"
 USA_ProjectDawn: "ドーンプロジェクト"
 USA_ProjectDawn_desc: "地球は私たちの唯一の故郷であり、米国には故郷である地球を全力で守る義務がある。"
 USA_EvacuateFromEarth: "ラグランジュ計画"
 USA_EvacuateFromEarth_desc: "現在の戦争態勢では、人類に勝ち目はないが、ダイダロス計画が戻る道を用意したことは朗報であり、ラグランジュ点で移民船団を建造するときが来たのだ。"
 USA_UntouchableHomefront: "安全な大陸"
 USA_UntouchableHomefront_desc: "私たちの領土は世界最強の軍隊によって守られており、国民はそのことに自信を持っている。"
 USA_ExpandUSSF: "宇宙軍の拡大"
 USA_ExpandUSSF_desc: "宇宙軍は、冷戦が始まってから結成されたばかりの新しい組織だが、BETAとの戦いにおけるその重要性は過大評価できない。"
 USA_RefugeeIssue: "難民問題"
 USA_RefugeeIssue_desc: "戦争が始まって以来、わが国には人材面でも安全保障面でも難民が絶え間なく流入しており、難民政策を再考すべきである。"
 USA_DetainZone: "特別市街地"
 USA_DetainZone_desc: "難民を特別な都市部に配属することは、私たちにとって最大の慈悲である。"
 USA_AcceptRefugees: "公民権の範囲拡大"
 USA_AcceptRefugees_desc: "世界を防衛することは我々の義務であり、米国はすべての人を平等に扱う。"
 USA_RefugeeEnlistment: "難民奉仕協定"
 USA_RefugeeEnlistment_desc: "難民は膨大な労働力の潜在的供給源であり、今日、国境内に非常に多くの難民がいるのだから、市民権を得るために難民に兵役を義務づけることによって、彼らを活用すべきだ。"
 USA_RefugeeAssistedProduction: "特殊戦争産業"
 USA_RefugeeAssistedProduction_desc: "難民の多くが前線に直接派遣されることを望まないことは予測できるが、彼らに生産支援を求めるのは無理なことではないだろう。"
 USA_NewHomeland: "新しい祖国"
 USA_NewHomeland_desc: "“私は、内外のすべての敵に対して、アメリカ合衆国憲法と法律を支持し、守ります。 私は合衆国憲法に忠誠を誓います。”\n—米国帰化のための忠誠の誓いより抜粋"
 USA_ConstructionMobilization: "建設のための動員"
 USA_ConstructionMobilization_desc: "アメリカ合衆国は、あなた方の新しい祖国の建設に貢献するよう呼びかけている。そこでは、あなた方の名前は知られていないかもしれないが、あなた方が成し遂げた行いは永遠に記憶されるだろう。"
 USA_ContinentResourcesDev: "アメリカ大陸エネルギー鉱物資源開発計画"
 USA_ContinentResourcesDev_desc: "戦争というエンジンは、資源の安定供給なしにはフル稼働させることはできず、勝利の望みをつなぐには、より多くの銃、装備、資源が必要なのだ。 ラテンアメリカでのさらなる資源探査と資源採掘。"
 USA_ShaleOilProduction: "シェールオイル開発"
 USA_ShaleOilProduction_desc: "人類は重要な産油地のほとんどを失っており、燃料供給を安定させるためには、燃料を得るための新たな方法の開発に着手しなければならない。"
 USA_AmazonResourcesProduction: "アマゾン計画を拡大"
 USA_AmazonResourcesProduction_desc: "環境保護論者は我々の決定に反対するかもしれないが、今必要なのは資源の供給であり、環境問題ではない。"
 USA_NATOSummit: "21世紀NATO会議"
 USA_NATOSummit_desc: "西ヨーロッパは陥落したが、NATOはまだ存在している。ヨーロッパのNATO同盟国はこのことをよく理解しているはずであり、米国はまだ彼らと肩を並べている。"
 USA_TacticalCoordination: "戦術的調整"
 USA_TacticalCoordination_desc: "戦術的な作戦行動という点で、われわれに最も近い欧州連合軍として、われわれは将来の共同作戦に備え、彼らと戦術的に統合し、調整する必要がある。"
 USA_JointStrikeLyonHive: "H12作戦の共同鎮圧"
 USA_JointStrikeLyonHive_desc: "英仏海峡を安定させるためには、リヨンの巣に対する共同攻撃を開始する必要がある。"
 USA_US_Euro_AfricaAlliance: "欧米とアフリカの協調"
 USA_US_Euro_AfricaAlliance_desc: "欧州連合（EU）はNATOの一員として大西洋の北側の防衛を担っているが、アフリカ連合（AU）と関係を築き、アフリカを防衛システムに組み込むことで、アフリカが大西洋の南側の防衛を保証することができれば、私たちはさらに安全になる。"
 USA_AtlanticSupplyLine: "オーシャンルート"
 USA_AtlanticSupplyLine_desc: "アフリカ連合への親善の証として、我々はニューヨークとカメルーンを結ぶ航路を確立し、我々の工業製品はアフリカの同盟国への絶え間ない支援となるだろう。"
 USA_SouthAfricaDevelopment: "南アフリカ"
 USA_SouthAfricaDevelopment_desc: "南アフリカはアフリカ全体で最高の産業基盤を持っており、もっと注目され、支援されるべきだ。"
 USA_WestAfricaDevelopment: "黄金海岸"
 USA_WestAfricaDevelopment_desc: "西アフリカの黄金海岸は、ニューヨーク-カメルーン航路の最大の受益者となる。"
 USA_NATO_Africa_JointForces: "NATOアフリカ連合軍"
 USA_NATO_Africa_JointForces_desc: "NATOはアフリカの兄弟たちよ、諸君を歓迎する。 我々の同盟軍は、邪魔する者すべてを粉砕する。"
 USA_AmericaFreeTradeTreaty: "米州自由貿易条約"
 USA_AmericaFreeTradeTreaty_desc: "米州諸国との間の貿易障壁や関税は、私たちが米州諸国に影響を及ぼすことを制限してきた。"
 USA_CentralAmericaDevelopment: "中米プラン"
 USA_CentralAmericaDevelopment_desc: "中米は国境に近く、彼らの好感度を上げるためにもっと支援すべきだ。"
 USA_InvestCentralAmerica: "中米に投資"
 USA_InvestCentralAmerica_desc: "中米の皆さん、これはアメリカ合衆国からの支援であり、そのお返しをお待ちしています。"
 USA_SouthAmericaDevelopment: "南米プラン"
 USA_SouthAmericaDevelopment_desc: "南米は常にアメリカの裏庭であり、自分の裏庭を大切にすることについて何を言うことがあろうか？"
 USA_InvestSouthAmerica: "南米への投資"
 USA_InvestSouthAmerica_desc: "南米の皆さん、これはアメリカ合衆国からの支援であり、そのお返しをお待ちしています。"
