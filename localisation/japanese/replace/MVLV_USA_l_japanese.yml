#######ideas
 USA_country: "超大国"
 USA_country_desc: "アメリカ合衆国は誰もが認める唯一の超大国となった。大衆向けの製品も他国とは比べ物にならない程充実している。しかし、その生活に慣れた国民はBETA大戦下であるにも関わらず国家や軍に協力的ではない。"
 USA_refugees: "難民志願兵"
 USA_refugees_desc: "アメリカ合衆国はBETA大戦によって発生した難民を多く受け入れているが、難民達に市民権を与えてはいない。その為、難民の殆どは過酷な生活を強いられており、極度に治安が悪化している地域もある。そんな中でアメリカの市民権を得られるほぼ唯一の方法が軍人になることであり、アメリカ軍には多くの難民が志願兵として参加している。"
 USA_refugees2: "特別市街地"
 USA_refugees2_desc: "仕事のない難民を収容し隔離するために、一部の地域に特別市街地を設置することで、国民の安全と国内経済の正常化を維持する。 また、米軍に奉仕する難民軍の組織化を促進する。"
 USA_refugees3: "難民奉仕協定"
 USA_refugees3_desc: "難民奉仕協定を確立し、難民の募集を体系化する。 そうすることで、難民が祖国を取り戻すことを望むにせよ、より良い生活を求めるにせよ、それに応じて報われるようになる。"
 USA_refugees4: "特殊戦争産業"
 USA_refugees4_desc: "ローエンドの軍需産業の一部をこれらの地域に配備することで、資格はあるが軍隊に入りたくないという遊休人口が、家族を養うのに十分で、全面的にコミットできる仕事に就けるようにする。"
 USA_refugees5: "公民権の範囲拡大"
 USA_refugees5_desc: "米国は昔も今も自由の象徴であり、規制された多重審査の仕組みを通じて、難民の中の有能な人々に市民権を与えている。 そして、アメリカの一員としてアメリカンドリームのために戦うのだ。"
 USA_refugees6: "人々の新しい祖国"
 USA_refugees6_desc: "人と仕事の流入により、近隣地域や公共サービスはかつてないほど疲弊しており、政府は開発の成果をすべての市民に行き渡らせるために早急に行動を起こす必要がある。"
 USA_refugees7: "建設のための動員"
 USA_refugees7_desc: "再び、光の速さでアメリカ合衆国が建設され、彼らの勤勉さ、勇気、創造性、決断力によって、人々は繁栄へと向かっている。"
