 USA_superpower: "超大国"
 USA_superpower_desc: "現在の世界では、米国が世界の唯一の中心となっており、米国の一挙手一投足が世界の隅々にまで大きな影響を及ぼしている。"
 USA_dawn_plan_start1: "ドーンプロジェクト - 設立"
 USA_dawn_plan_start1_desc: "議会の議論では、米国は今という歴史的な機会を捉えなければならず、他国のためとは言わないまでも、海外での米国の利益を守る必要があると判断された。 そしてそのためには、関連事業に多大な資源を割く必要がある"
 USA_dawn_plan_start2: "ドーンプロジェクト - 立案"
 USA_dawn_plan_start2_desc: "このような大規模な産業計画には、全米の産業企業の調整が必要であり、そのためには多額の資金投入が不可欠であった。"
 USA_dawn_plan_start3: "ドーンプロジェクト - 始動"
 USA_dawn_plan_start3_desc: "企業や資源の大規模な動員とともに、自由世界を防衛するこの計画は正式に発足した。"
 USA_dawn_plan_advance1_change: "ドーンプロジェクト - 分岐"
 USA_dawn_plan_advance1_change_desc: "軍産複合体と議会内での議論は続いている。 生産性を高めるために古い生産ラインの更新を優先すべきかどうか。 それとも単に工業生産を拡大するのか。"
