 emperor_showa_2: "政威軍監"

 JAP_puppet_shogun: "傀儡将軍"
 JAP_puppet_shogun_desc: "今の政威大将軍は政治的権限をほとんど持っていないに等しい。しかし、政府の傀儡でしかない現状を快く思わない者は多い。"
 JAP_konoe: "日本帝国斯衛軍"
 JAP_konoe_desc: "斯衛軍は城内省直属の軍事組織であり、派手な戦術機を用いることで知られている。それは戦場で兵士の士気を向上させ、日本の防衛に貢献している。しかし、帝国軍と別に装備を調達することは、工場に負担をかけている。"
 JAP_puppet_shogun_2: "傀儡将軍"
 JAP_puppet_shogun_2_desc: "今の政威大将軍は政治的権限をほとんど持っていないに等しい。しかし、政府の傀儡でしかない現状を快く思わない者は多い。"
 JAP_shogun: "政威大将軍"
 JAP_shogun_desc: "内閣から権限の返上を受け、将軍は本来の権威を取り戻した。今の将軍は全帝国民の象徴として誰もが認める存在だ"
 JAP_killed_shougun: "煌武院 悠陽の死"
 JAP_killed_shougun_desc: "前将軍殿下の死は帝国民にとって最大の悲劇だ。国内は乱れ、統率を取り戻すには多大な時間が必要となるだろう。"
