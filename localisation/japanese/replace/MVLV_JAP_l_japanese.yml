 mvlv_jap_nf_construction_tt: "制作中"
 mvlv_jap_nf_coastal_bunker_tt: "本島側の海峡に要塞を建築する。"
 JAP_xfj_project: "XFJ計画"
 JAP_xfj_project_desc: "我が国の戦術機開発は行き詰っている。不知火は第三世代戦術機として十分な性能を有してはいるが、拡張性に欠け、今後の発展が望める機体ではない。このままでは急速に陳腐化するのは目に見えている。これに対し、ボーニング社が共同開発計画を持ち掛けてきた。"
 mvlv_jap_nf1: "明星作戦"
 mvlv_jap_nf1_desc: "今こそ、各国連合での大反攻作戦を開始する！"
 mvlv_jap_nf2: "復興計画"
 mvlv_jap_nf2_desc: "初期復興費用の多くを政府が負担し、素早い復興を成し遂げる。"
 mvlv_jap_nf3: "熟練土木工"
 mvlv_jap_nf3_desc: "我々は平時から多くの災害を経験してきた。その中で培われてきた土木建設力には目を見張るものがある。"
 mvlv_jap_nf4: "秀でた鉄道技術"
 mvlv_jap_nf4_desc: "安心、安全、厳格なダイヤ。鉄道において我が国を超えるものはない。高い技術と教育、人海戦術のなせる業だ。"
 mvlv_jap_nf5: "専用機の最適化"
 mvlv_jap_nf5_desc: "試作試験されていた斯衛軍機のデータが揃ってきた。今こそさらに洗練された芸術品を仕上げるときだ。"
 mvlv_jap_nf6: "XFJ計画"
 mvlv_jap_nf6_desc: "不知火は第三世代戦術機として十分な性能を有してはいるが、拡張性に欠け、今後の発展が望める機体ではない。ボーニング社の共同開発計画案に基づき、ユーコン基地にて改良機体の開発を行う。"
 mvlv_jap_nf7: "内政復興"
 mvlv_jap_nf7_desc: "東京から危機は去った。今こそ政府機関を戻すときだ。また、京都が復興するまでのいましばらくの間、東京御所を将軍の拠点としていただく。"
 mvlv_jap_nf8: "日本戦略研究会"
 mvlv_jap_nf8_desc: "現状、政府や軍上層部は将軍を蔑ろにし、統帥権干犯を繰り返している。故に、我々は同志と共に勉強会を結成し、各機関に睨みを利かせる必要がある！"
 mvlv_jap_nf9: "政治の再編"
 mvlv_jap_nf9_desc: "現状を切り崩し、各所への利害の調整や再配置を行う。前途多難ではあるが、我々ならばやり遂げることができるはずだ。"
 mvlv_jap_nf10: "斯衛の帝国"
 mvlv_jap_nf10_desc: "将軍を蔑ろにしてきた政府ではこの国を良くすることはできない。よってこれより斯衛が将軍の名のもと、民を導いてゆく！"
 mvlv_jap_nf11: "将軍の復権"
 mvlv_jap_nf11_desc: "紆余曲折あり政府は再編され、将軍の存在は民衆に歓迎されている。いまこの時、真に将軍の復権を宣言する時だ。"
 mvlv_jap_nf12: "電磁砲試験"
 mvlv_jap_nf12_desc: "帝国技研より提案されたそれは、ローレンツ力によって砲弾を高速かつ高連射する代物で、それを戦術機向けにリサイズされたものだという。机上ではこれ一つで戦場を変えるほどの威力があるらしい・・・"
 mvlv_jap_nf13: "日ソ相互協定"
 mvlv_jap_nf13_desc: "互いにハイヴを目の前にする者同士、互いの技術交換で得られるものがあるはずだ。"
 mvlv_jap_nf14: "欧州交流派遣"
 mvlv_jap_nf14_desc: "BETA大戦において本土防衛戦を経験した彼の国は我が国と似ているものがあり、学びを得ることができるかもしれない。"
 mvlv_jap_nf15: "西方の要塞化"
 mvlv_jap_nf15_desc: "九州方面での防衛をより強固なものとすべく、大規模な要塞を建築する。"
 mvlv_jap_nf16: "北方の要塞化"
 mvlv_jap_nf16_desc: "北海道方面での防衛をより強固なものとすべく、大規模な要塞を建築する。"
 mvlv_jap_nf17: "東亜援助"
 mvlv_jap_nf17_desc: ""
 mvlv_jap_nf17_a: "大東亜ベルト防衛線"
 mvlv_jap_nf17_a_desc: ""
 mvlv_jap_nf17_b: "大東亜ベルトの稼働"
 mvlv_jap_nf17_b_desc: ""
 GEU_belt_deffence_tt: "§Yルソン§!の北、および§Yパラワン§!の南に要塞を建築する。\n§R※建築予約が入っていると建設されない場合があります。§!"
 mvlv_jap_nf18: "日欧技術協定"
 mvlv_jap_nf18_desc: "日欧の戦術機方針は似ており、より効率的な技術交流ができるであろう。"
 mvlv_jap_nf19: "新生日本帝国"
 mvlv_jap_nf19_desc: "いまこの国は、過酷な時代において苦難を乗り越え団結し、国土を強固に保持するに至った。より強力に、そして新たなる日を迎えるために、我々は大規模な建設投資を行う。"
 
 mvlv_jap_nf8_tt: "§R次のNFはゲーム後半のイベントの結果で自動的に達成されます。§!"
 mvlv_jap_nf_basey_construct_tt: "§Y僻地開発§! のディシジョンのコストを軽減する"
 mvlv_jap_nf_available_tt: "政府が安定するか特定のイベントが起きた"
 mvlv_jap_assistance_tt: "イベントが承認された場合、以下の効果を得る。"
 mvlv_jap_space_tt: "-------------"
 JAP_EUR_cultural_relations_tt: "イベントが承認された場合、以下の指揮官を半年間欧州連合に派遣する。"
 mvlv_jap_eur_pact_tt: "イベントが承認された場合、双方同世代の最新戦術機の技術を得る。"
 
 
 mvlv_jap.6.t: "甲21号作戦"
 mvlv_jap.6.d: "我々は国連軍とともに佐渡島ハイヴを攻略する。我々があの島を失って二年。ついに待ち望んだ日が来た！帝国軍と斯衛軍全将兵が一丸となって攻略に臨む！"
 mvlv_jap.6.a: "砲撃開始っ！"
 mvlv_jap.1.t: "不知火弐型"
 mvlv_jap.1.d: "本日、ユーコン基地で開発が進んでいた不知火弐型の試作機が完成の日を迎えた。政治的、経済的な様々な要素を含む複雑な機体だが、優秀な開発衛士の働きにより、より一層の強化が期待できるだろう。"
 mvlv_jap.1.a: "早く完成機が見たいものだな"
 mvlv_jap.2.t: "XFJ計画"
 mvlv_jap.2.d: "XFJ計画を進めるにあたって、帝国からも人員を派遣しなければならない。ユーコン基地で陣頭指揮を行う大役に抜擢されたのは、昨年任官したばかりの新任斯衛軍人であった。(一時的に篁唯依はユーコン基地に出向しますが、一連のイベントの後に帰還します。)"
 mvlv_jap.2.a: "頼んだぞ"
 mvlv_jap.3.t: "任務完了"
 mvlv_jap.3.d: "ユーコン基地において様々な事件もあったもののXFJ計画自体は順調に進み、ついに完了したとの報告があった。これに伴い、派遣されていた人員は日本に帰還し、不知火弐型の量産化に向けて尽力するだろう。"
 mvlv_jap.3.a: "よくやった！"
 mvlv_jap.4.t: "佐渡島のBETA群が上陸"
 mvlv_jap.4.d: "佐渡島ハイヴのBETA群が新潟に上陸してきた。早急に排除しなければならない。"
 mvlv_jap.4.a: "防衛部隊の健闘を祈る"
 mvlv_jap.5.t: "地下侵攻"
 mvlv_jap.5.d: "佐渡島ハイヴのBETA群が地下を侵攻し上陸してきた！帝都絶対防衛権の突破を許してはならない！"
 mvlv_jap.5.a: "増援を急がせろ！"

 mvlv_jap.7.t: "明星作戦"
 mvlv_jap.7.d: "我々は今日この日のために取れるあらゆる手を打ってきた。今こそ、反撃の時だ"
 mvlv_jap.7.a: "反撃開始！"
 
 mvlv_jap.8.t: "東京復興"
 mvlv_jap.8.d: "政府機関および幕府機構の東京移転が決定された。\n幸い東京御所の周辺は無事であったが、将軍の「民なくして国なし」の一言から東京の大規模な復興が急ピッチで行われた。\nこれほどの復興が短期間で成されたのはまさに将軍の威光あってこそである。"
 mvlv_jap.8.a: "将軍はいつも民と共にある"
 
 
 mvlv_jap.9.t: "極秘技術協定"
 mvlv_jap.9.d: "日本との相互援助協定の裏で技術交換に関する交渉が行われた。\n相互に最新の戦術機を交換するというものだ。\n政府内には極秘技術の流失を懸念する者もいるが、逆にチャンスでもある。\n反対派は黙っていないだろうが、さてどうしたものか・・・"
 mvlv_jap.9.a: "協定を受諾しよう"
 mvlv_jap.9.b: "拒否する"
 
 mvlv_jap.10.t: "交渉失敗"
 mvlv_jap.10.d: "ソ連政府内での派閥争い故か、残念ながら交渉は失敗に終わった。"
 mvlv_jap.10.a: "残念だ"
 
 mvlv_jap.11.t: "交渉成功"
 mvlv_jap.11.d: "極秘の交渉は成功に終わった。\nただ、どこからか情報が漏れたようで国内で不満の声が上がっているようだ。\nだが、BETA殲滅という目的の前では些細なことだ。"
 mvlv_jap.11.a: "日ソ友好の第一歩だ"
 
 mvlv_jap.12.t: "横浜へのG弾投下"
 mvlv_jap.12.d: "日本で明星作戦と称された反攻作戦が開始されたようだが、進行は芳しくないらしい。\n横浜ハイブの地下茎構造が想定を大きく上回る規模であることが判明したそうだ。\nこれ以上の損耗は無意味だ。\n議会はG弾の使用を承認。日本へ通告を行った。\nしかし、日本から中止要請が届いた。\n我々はどうするべきか・・・"
 mvlv_jap.12.a: "速やかにG弾の投下を行うべきだ！"
 mvlv_jap.12.b: "いや、踏みとどまるべきだ"
 
 mvlv_jap.13.t: "G弾投下作戦の中止"
 mvlv_jap.13.d: "米国において進められていたG弾の投下作戦が中止された。\nこれはわが軍を多数巻き込むことも辞さない作戦であり、\n外交官の必死の努力により中止に至ったようだ。"
 mvlv_jap.13.a: "なんとかなったようだ"
 
 mvlv_jap.14.t: "日本からの支援"
 mvlv_jap.14.d: "日本国内において大東亜へ避難移設された工場の生産の一部を割り振る計画が承認されたらしい"
 mvlv_jap.14.a: "喜んで受け入れよう"
 mvlv_jap.14.b: "いや、自国で何とかする"
 
 mvlv_jap.15.t: "大東亜へ支援の返事"
 mvlv_jap.15.d: "大東亜に打診した支援計画が承認された！\nこれで両国の友情はさらに深まった！"
 mvlv_jap.15.d2: "残念ながら今回の支援計画は拒否された。\nきっと彼らにも事情があるのだろう。。。"
 mvlv_jap.15.a: "良い結果だ"
 mvlv_jap.15.b: "残念だ"
 
 mvlv_jap.16.t: "日本からの交流派遣団"
 mvlv_jap.16.d: "武官交流として日本から外交官団が送られるらしい。\nまた、視察研修として斯衛軍衛士養成学校の士官候補生も含まれているらしい\n約半年の交流を予定している。"
 mvlv_jap.16.a: "喜んで受け入れよう"
 mvlv_jap.16.b: "そんな余裕はない"
 
 mvlv_jap.17.t: "欧州交流の返事"
 mvlv_jap.17.d: "交流派遣計画が承認された！\nこれで両国の友情はさらに深まった！"
 mvlv_jap.17.d2: "残念ながら今回の計画は拒否された。\nきっと彼らにも事情があるのだろう。。。"
 mvlv_jap.17.a: "良い結果だ"
 mvlv_jap.17.b: "残念だ"
 
 mvlv_jap.18.t: "帰郷"
 mvlv_jap.18.d: "武官交流および視察研修の全日程が終了した。\n今回のイベントは双方にとって非常に良い経験となっただろう。"
 mvlv_jap.18.a: "盟友よ、また会おう"
 
 mvlv_jap.19.t: "帰郷"
 mvlv_jap.19.d: "欧州に派遣された交流団が本日帰郷した。\n今回のイベントは我々にとって非常に有意義なものとなっただろう。"
 mvlv_jap.19.a: "良く生きて戻った"
 
 mvlv_jap.20.t: "日欧技術協定"
 mvlv_jap.20.d: "日本の外交団に続き、今度は技術士官の交流の申し出があった。\n日本と欧州の戦術機の違いを改めて確認するチャンスだが\nさてどうしようか・・・"
 mvlv_jap.20.a: "技術交換に応じよう"
 mvlv_jap.20.b: "いや、機密情報は与えられない"
 
 mvlv_jap.21.t: "日欧協定の結果"
 mvlv_jap.21.d: "良い結果が得られたようだ。"
 mvlv_jap.21.d2: "残念ながら成果は出なかったようだ。"
 mvlv_jap.21.a: "すばらしい"
 mvlv_jap.21.b: "残念だ"
 
 mvlv_jap.22.t: "出雲奇襲"
 mvlv_jap.22.d: "出雲奪還作戦の時、後方のＨＱが奇襲を受け壊滅した。\nこの際、孤立無援となった帝国軍を逃がすため崇宰恭子が殿を務めたが、\n複数の要塞級が出現し奮戦空しくも彼女は戦死したとされる。"
 mvlv_jap.22.a: "英雄に黙祷"
 
 mvlv_jap.26.t: "一方的な通知"
 mvlv_jap.26.d: "アメリカ軍によるG弾発射が情報部によってもたらされた。\n着弾までの時間はもう1日もないそうだ。\n一刻も早く前線の軍および住民を避難させなければならない！"
 mvlv_jap.26.a: "ふざけるな！"
 
