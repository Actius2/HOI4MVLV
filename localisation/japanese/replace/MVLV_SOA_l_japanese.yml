 mvlv_soa.1.t: "SAAST破棄"
 mvlv_soa.1.d: "理事会がSAASTの破棄を公に宣言した。この衝撃の発表は世界中から注目を浴びた。何十年も米国の傘に隠れていた国家連合は今後どうなっていくのだろうか。"
 mvlv_soa.1.a: "我々自身の力で我々を守る！"
 mvlv_soa.2.t: "SAAST破棄"
 mvlv_soa.2.d: "理事会がSAASTの破棄を公に宣言した。この衝撃の発表は世界中から注目を浴びた。何十年も米国の傘に隠れていた国家連合は今後どうなっていくのだろうか。
 mvlv_soa.2.a: "彼らが後悔することにならなければ良いな"

