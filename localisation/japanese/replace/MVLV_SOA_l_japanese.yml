 CEA_food: "中米の天然食料"


 SOA_Unity: "風雨にさらされて同じ船に乗る"
 SOA_Unity_desc: "BETAはすでにアメリカ大陸に進出しており、アメリカの安全保障への取り組みは純粋に死文化している。自力で自国を守るためには、中米と新たな同盟を結ぶ必要がある。"
 SOA_RefugeeLabourers: "中南米の難民労働者"
 SOA_RefugeeLabourers_desc: "難民は保護を求め、我々は産業労働力を求める。"
 SOA_EmergencyMobilization: "緊急動員"
 SOA_EmergencyMobilization_desc: "BETAが迫る中、ぐずぐずしている暇はなく、緊急動員令が発令され、市民も難民も軍隊に参加できるようになった。"
 SOA_PurchaseRetiredTSF: "退役戦術機の購入"
 SOA_PurchaseRetiredTSF_desc: "たとえそれが退役した戦術機であっても、一般兵が殺されるよりはまだましだ。"
 SOA_AbsorbExiledPilots: "亡命した衛士の吸収"
 SOA_AbsorbExiledPilots_desc: "戦術機と同様に、それを操縦できる衛士も必要だ。ここに亡命したベテランの衛士たちは、間違いなく動員されるべきだ。"
 SOA_NewTSFPilotTrainingCentre: "新しい衛士訓練基地"
 SOA_NewTSFPilotTrainingCentre_desc: "亡命した衛士に戦術機を飛ばしてもらうのは長期的な道ではない。"
 SOA_DemandTSFProductionLicense: "戦術機製造ライセンス要請"
 SOA_DemandTSFProductionLicense_desc: "我々は成熟した戦術機技術を持っていないのだから、生産ラインを導入するために生産許可を求める方がいいだろう。"
 SOA_AcceptExternalResearchers: "科学研究機関から移籍金を受け取る"
 SOA_AcceptExternalResearchers_desc: "外部からの科学研究支援は喜んで受け入れる。 私たちは、土地を失った科学研究機関を歓迎し、場所と助成金を提供する。"
 SOA_ConstructDefenceLine: "防衛線を築く"
 SOA_ConstructDefenceLine_desc: "来るべき決戦に備え、守備は試練に耐えうるものでなければならない。"
 SOA_ReinforceStrategicStrongholds: "防衛線の強化"
 SOA_ReinforceStrategicStrongholds_desc: "戦略的重要地点の強化と防衛ラインの対策強化。"
 SOA_EmergencyCivilianFactoryConscription: "軍需産業への緊急転換"
 SOA_EmergencyCivilianFactoryConscription_desc: "世界滅亡の危機に瀕したとき、民間人向けの消費財の供給は制限され、生産能力はすべて軍需に回されることになる。"
 SOA_AllInProduction: "三交替制"
 SOA_AllInProduction_desc: "工場は稼働を止めず、明かりは消えず、真新しい兵器が津波のように前線を支える。"

