 EUR_eng: "イギリスのためのEU"
 EUR_eng_desc: "欧州連合で国土を保持している唯一の大国であるイギリスは欧州連合において絶大な権限を持っており、欧州連合のリソースを自国のために自由に使うことができるといっても過言ではない。当然それに反発する加盟国は多く、欧州連合は分裂寸前である。"
