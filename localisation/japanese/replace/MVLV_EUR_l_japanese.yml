####events
 mvlv_eur.1.t: "EF-2000 ロールアウト"
 mvlv_eur.1.d: "欧州の総力を結集した戦術機が今日この日完成を迎えた。\n途中フランスの離脱などで計画に遅れが出たが、その分多くの最新技術を取り込むことができた。\n実地試験ではすでに高い評価を得ており、今後の量産次第で戦況を変えられる可能性がある。\n何はともあれこの素晴らしき日を讃えよう。\nユーロファイターに栄光あれ。"
 mvlv_eur.1.a: "素晴らしい"