l_japanese:
 EUR_focus_tree: "欧州連合 国家方針ツリー"
 EUR_FortifyChannelDefence: "海峡防衛線の強化"
 EUR_FortifyChannelDefence_desc: "英国本土決戦以来、わが国の防衛は不安定な状態にあり、早急に強化しなければならない。"
 EUR_RebuildLondon: "ロンドン再建"
 EUR_RebuildLondon_desc: "ロンドンは以前の戦いで大きな被害を受けており、街を再建することは国民に自信を与えることにもなる。"
 EUR_ReinforceSicily: "シチリア島の強化"
 EUR_ReinforceSicily_desc: "シチリアは将来、アペニン山脈への反攻のための最前線基地であり、地中海最大の軍事要塞である。"
 EUR_JointEuroCommand: "欧州連合司令部"
 EUR_JointEuroCommand_desc: "今日の欧州合同軍は、すべての旧EU加盟国の軍隊で構成されているが、そのような軍隊を調整するためには、国境を越えた合同司令部が必要である。"
 EUR_aDealMadewithAfrica: "非関連会社との取引"
 EUR_aDealMadewithAfrica_desc: "西ヨーロッパが崩壊した後、イタリアやフランス経由でアフリカに渡航する人がかなりいた。"
 EUR_exchangeIntel: "情報交換"
 EUR_exchangeIntel_desc: "紅海戦線でのアフリカの歴戦は、BETAの活動に関する多くの貴重な情報を蓄積しているはずだ。"
 EUR_NorthAfricaArmyGroup: "北アフリカ派遣"
 EUR_NorthAfricaArmyGroup_desc: "アフリカ連合との協力関係をさらに強化し、われわれの善意の証として、欧州連合の陸上部隊がシチリア島から北アフリカに即時配備される。"
 EUR_CoopWithUN: "国際連合との協力"
 EUR_CoopWithUN_desc: "多くの土地と貴重な資源を失った後、われわれが独自に発展する能力は苦境に立たされており、国連統合軍との科学的協力が現時点での最善の解決策である。"
 EUR_IncreaseOurShare: "積極的な分担金の増加"
 EUR_IncreaseOurShare_desc: "国際連盟にさらなる研究資源と技術支援を求めるなら、私たちは誠意を示さなければならない。"
 EUR_ParticipateinAL4: "オルタネイティヴ4への秘匿参与"
 EUR_ParticipateinAL4_desc: "日本が主導するオルタネイティヴ4の研究結果は、長期的にはわれわれの利益になるかもしれない。"
 EUR_IntimateEEA: "東欧に近づく"
 EUR_IntimateEEA_desc: "時代やイデオロギーに関係なく、ヨーロッパには統一という叶わぬ夢がある。 東欧社会主義連盟とソ連との結びつきが弱まりつつある今、彼らに協力を申し出ることは、東欧を我々により近づけることにつながるだろう。"
 EUR_AlienateEEA: "東欧の疎外"
 EUR_AlienateEEA_desc: "我々は、時代に関係なく、赤の陣営の人々と共存することはできない。"
 EUR_OfferAid: "援助を提供する"
 EUR_OfferAid_desc: "援助はリップサービスの問題ではない。東欧社会主義同盟の人々が必要としているのは、政治家の空約束ではなく、目に見える具体的な資源である。"
 EUR_OfferEuroMadeTSF: "欧州戦術機の提供"
 EUR_OfferEuroMadeTSF_desc: "東欧の社会主義連合国は、これまで比較的旧式のミグ29やその他のソ連製第2世代、さらには第1世代の戦術機を使用してきたが、われわれの親善の証として、より先進的な第3世代モデルを提供すべきである。"
 EUR_IncreaseConsumableGoods: "消費財の割当増加"
 EUR_IncreaseConsumableGoods_desc: "東欧の社会主義連合国における武器不足の問題を解決した後、民間工場の不足を補うために、消費財という形で追加的な援助を提供する必要があるが、これは間違いなく国民の恨みを買うだろう。"
 EUR_ExchangeTactics: "戦術交流"
 EUR_ExchangeTactics_desc: "東欧社会主義連邦の戦術機部隊は、わが軍に欠けている接近戦の比類なき経験を持っており、同様に部隊間の連携戦闘の経験も不足している。"
 EUR_PoliticalAffection: "政治的影響"
 EUR_PoliticalAffection_desc: "ヨーロッパ諸国は一つの旗の下に集まるべきであり、たとえ私たちが異なる陣営から来たとしても、東欧諸国に何らかの政治的影響力を及ぼすために、今日の力学に頼ることはできる。"
 EUR_ReconcilingIdeologyDifference: "イデオロギーの違いを調整する"
 EUR_ReconcilingIdeologyDifference_desc: "東欧の国々がかつてのイデオロギーの違いを捨て、我々の仲間になるのは容易ではない。"
 EUR_TheTrueEuropeanUnion: "真の欧州連合"
 EUR_TheTrueEuropeanUnion_desc: "欧州連合は、東欧社会主義者同盟の諸君を歓迎し、われわれは共通の勝利のために協力する。"
 EUR_LimitedAid: "限定的な支援"
 EUR_LimitedAid_desc: "われわれは戦線を維持するためにできることはすべてやった。"
 EUR_IntimateUSA: "米国に近づく"
 EUR_IntimateUSA_desc: "東側陣営に接近するよりも、米国に接近する方が安全な選択肢であることは間違いない。"
 EUR_ExchangeCombatData: "戦闘データ取引"
 EUR_ExchangeCombatData_desc: "戦術的なドリルコードという点では我々とよく似ているため、米軍は砲兵戦の経験が豊富なはずだが、やはり近接戦闘の経験が必要だろう。"
 EUR_AidFromUS: "米国からの援助"
 EUR_AidFromUS_desc: "オルタネイティヴ5の受け入れをわずかに示しただけで、アメリカはタオルを投げ捨て、私たちは報われたのだ。"
 EUR_ExpandOrbitalDivers: "軌道力の拡大"
 EUR_ExpandOrbitalDivers_desc: "米国からの支援により、我々は軌道降下兵団を拡大する機会を得た。彼らは将来、西ヨーロッパを奪還した際のハイヴ攻撃の主力となるだろう。"
 EUR_AidCanada: "カナダへの支援"
 EUR_AidCanada_desc: "東欧と一線を引いた今、後方生産を固め、カナダへの援助を開始する時が来た。"
 EUR_CanadaIndustrialInvestment: "カナダの疎開地産業への投資"
 EUR_CanadaIndustrialInvestment_desc: "カナダでの疎開地の産業への投資は、より直接的に私たちの生産能力を向上させるだろう。"
 EUR_LessonsFromBattleofLondon: "ロンドン防衛の教訓"
 EUR_LessonsFromBattleofLondon_desc: "英国の首都として、ロンドンはこの戦いによって大きなダメージを受け、多くの欠点が露呈した。"
 EUR_ReflectOnBattleofEurope: "ヨーロッパの戦いを振り返る"
 EUR_ReflectOnBattleofEurope_desc: "我々は西ヨーロッパ大陸を守ることに自信を持っていたが、その傲慢さは事実の前では木っ端みじんになり、何が間違っていたのか、どうすれば改善できるのか、反省すべき問題である。"
 EUR_ImportA10ProductionLine: "A10生産ラインの導入"
 EUR_ImportA10ProductionLine_desc: "西ドイツ作戦中のアメリカのA-10戦術歩行攻撃機は、強力な対小型種戦闘能力を示し、それは西ドイツ軍の報告に反映された。"
 EUR_InvestInA12Development: "A12プロジェクトへの投資"
 EUR_InvestInA12Development_desc: "将来の作戦では、多くの水陸両用上陸作戦が避けられないことは確実であることを考えれば、この機会にA-12アベンジャーの開発計画にできるだけ早く参加し、この新しい水陸両用戦術機をできるだけ早く実戦配備できるようにすべきである。"
 EUR_PromoteJA44Tactic: "ケルベロスの戦術的宣伝"
 EUR_PromoteJA44Tactic_desc: "西ドイツのJA44ケルベロス旅団はBETAとの戦いに長けている。"
 EUR_TheNewGenKnights: "新衛士訓練"
 EUR_TheNewGenKnights_desc: "”毎朝、崇高な機会が訪れ、あらゆる機会が崇高な衛士を育む。 彼らは、あらゆる方法で、あらゆる機会に、国のために命とすべてを捧げる用意があり、これからもその覚悟を持ち続ける勇敢な男たち同様、私たちの感謝に値する。”—《We Will Fight on the Beach》より抜粋"
 EUR_ImproveMk57Cannon: "支援砲の改良"
 EUR_ImproveMk57Cannon_desc: "Mk57戦隊支援砲は大規模な戦闘テストを受けており、このデータに照らしてあらゆる面を改善すべきだ。"
 EUR_DeployModifiedHuman: "改造人間の配備"
 EUR_DeployModifiedHuman_desc: "改造技術には常に大きな賛否両論があるが、実戦の結果に勝るものはない。"
 EUR_AdvancedFieldMedicalTreatment: "高度な現場医療"
 EUR_AdvancedFieldMedicalTreatment_desc: "人体改造技術には極めて高度な医療技術が集約されており、これらの医療技術が普及すれば、現場での医療レベルが飛躍的に向上し、より多くの兵士に生存の可能性がもたらされる。"
 EUR_LimitedUsageOfHumanModification: "人体改造の使用制限"
 EUR_LimitedUsageOfHumanModification_desc: "人体改造技術にはコストがかかり、実戦での信頼性は証明されているにもかかわらず、大量使用という当初の計画を変更し、限定的な配備にすべきだ。"
 EUR_MilitaryCooperationWithJapan: "日本との軍事交流"
 EUR_MilitaryCooperationWithJapan_desc: "私たちから遠く離れた日本帝国は、現在、私たちと非常に似た状況にある。だからこそ、私たちは日本帝国と綿密な軍事交流を行い、互いの戦闘経験から学ぶことで、BETAとの戦争によりよく対処することができる。"

#####ideas
 EUR_power: "欧州連合理事会"
 EUR_power_desc: "欧州連合理事会は欧州連合各国の政府によって構成される欧州連合最高の意思決定機関であり、イギリスの権限が増しているとは言え欧州の人々全体の拠り所であり、BETA大戦下にあって世界中に散らばった欧州の人々を繋ぎとめている。"
