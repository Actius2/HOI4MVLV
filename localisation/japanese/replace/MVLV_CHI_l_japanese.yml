##events
 mvlv_chi.1.t: "難民の最初のグループが避難しました"
 mvlv_chi.1.d: "海南島北部から海南島南部の港まで、ものすごい長い行列が続いています。\n住民は皆、家族を引きずり、荷物の入った大小の袋を背負って船への乗船を待っています。\n 1か月以内に、瓊州海峡の防衛線に最も近い住民全員が台南行きのフェリーに一斉に乗った。"
 mvlv_chi.1.a: "さあ、西へ向かう時間です。"
 mvlv_chi.2.t: "難民の第2陣が避難しました"
 mvlv_chi.2.d: "海南西部から海南南部の港まで、ものすごい長い列が伸びています。住民は全員、家族を引きずり、荷物の入った大小の袋を背負って、船への乗船を待っています。 1か月以内に、海南西部の住民全員が台南行きのフェリーにまとめて乗った。"
 mvlv_chi.2.a: "次は南東です。"
 mvlv_chi.3.t: "難民の3番目のグループが避難しました"
 mvlv_chi.3.d: "海南南東部の避難住民の第3グループは全員、台南行きのフェリーに乗り込みました。残りの住民は、海南島で生きるか死ぬかを喜んでいます。政府は彼らの選択を尊重し、志願したすべての人々に支援を提供します滞在するためには武器が与えられ、民兵の訓練も受けた。"
 mvlv_chi.3.a: "避難はもう終わりました。海南は防衛を続けるべきでしょうか？"
 mvlv_chi.4.t: "緊急警報"
 mvlv_chi.4.d: "多数のBETAが海を渡って海南島の海岸に近づいているのが検出されました!"
 mvlv_chi.4.a: "すべての防御者はレベル1の戦闘準備に入ります"
 mvlv_chi.5.t: "海南防衛線は静止している"
 mvlv_chi.5.d: "避難任務を完了した後、中央軍事委員会は、BETAを重慶の巣窟に封じ込め、台湾海峡の防衛圧力を軽減するために、引き続き海南島を保持することを決定した。100ごと数日中に、中央軍事委員会は兵士たちを激励するために自ら防衛線を訪問し、兵士たちへの手紙とお悔やみも持ち帰りました。"
 mvlv_chi.5.a: "同志よ、あなた方は皆英雄です"
 mvlv_chi.6.t: "海南の陥落"
 mvlv_chi.6.d: "避難任務を完了する前に、BETAは防衛線を突破し、海南島に大混乱を引き起こし始めました。通過した場所は混乱しており、誰も生き残れませんでした。"
 mvlv_chi.6.a: "国民の恥"
 mvlv_chi.6.b: "人々を失望させましょう"
 mvlv_chi.6.c: "最善を尽くしますが、まだ十分ではありません"
 mvlv_chi.7.t: "海南の陥落"
 mvlv_chi.7.d: "避難任務を完了した後、中央政府は、海南島を防衛することで重慶の巣窟にあるBETAを封じ込め、台湾海峡の防衛圧力を軽減できると信じていた。しかし、海南島を防衛する必要はなく、 BETAの強い圧力により、海南島から全軍を撤退させることが決定され、海南島の陥落が発表された。"
 mvlv_chi.7.a: "人々が救えば土地を失い、人々と土地の両方が生き残るでしょう。"