l_japanese:
 CHI_focus_tree: "中国 国家方針ツリー"
 CHI_idea_00: "海峡の防衛強化"
 CHI_idea_00_desc: "台湾は最早、中華に残された最後の人類生存圏でありその陥落は国家の崩壊を意味する。故に要塞のさらなる修繕、拡充は当然だろう。"
 CHI_idea_01: "奪回を見据えて"
 CHI_idea_01_desc: "大陸からの退避に成功した生産設備を本格的に稼働させる。全ては中国の為に。"
 CHI_idea_01_Ex1: "研究機関の再配置"
 CHI_idea_01_Ex1_desc: "二つの党の管轄で分散した研究機関を再配置しより効率的に研究リソースを捻出する。"
 CHI_idea_02: "台北改造計画"
 CHI_idea_02_desc: "大陸を失った今、台湾は対BETA戦争の最前線でありいつ戦場になるとも分からない。そこで台湾を徹底的に対BETA戦争の為に再開発しこれからの戦いに備えるのだ。"
 CHI_idea_03: "華僑資本との連絡"
 CHI_idea_03_desc: "国外の同胞の中でも社会的地位の高い者へと働きかけ現地に我々の軍需工場を設営させる。"
 CHI_idea_04: "台南改造計画"
 CHI_idea_04_desc: "計画は段階的だが徹底的に行われる。台湾の中では比較的戦火の遠い台南もその例外ではない。"
 CHI_idea_05: "ユダヤ資本の支援"
 CHI_idea_05_desc: "イスラエルが陥落した現在に於いても未だに世界でのユダヤ資本の力は大きい。J-10開発の際に一度協力した彼らと再び接触を図り支援を得ることは無駄な試みにはならないだろう。"
 CHI_idea_01_Ex2: "パラオ諸島大開発"
 CHI_idea_01_Ex2_desc: "来たるべき奪回の為に台湾の徹底的な再開発が行われたが島一つでは、限度というものがある。故に太平洋諸島の島々を有効活用しようという試みは、ごく自然なものであると言えるだろう。"
 CHI_idea_01_Ex3: "資本の恩恵"
 CHI_idea_01_Ex3_desc: "国外からの資本導入により対BETA戦の為の改造を強行していた台湾経済は大きく改善された。"
 CHI_idea_06: "反撃の下準備"
 CHI_idea_06_desc: "来たるべき反攻の屋台骨は整った。次は、構築された生産体制を駆使して必要となる物を確保するべきだろう。"
 CHI_idea_01_Ex4: "フィリピンへの投資"
 CHI_idea_01_Ex4_desc: "台湾の防衛体制は強固なものだが万が一に備える事は無駄にはならないだろう。"
 CHI_idea_11: "これからの中華"
 CHI_idea_11_desc: "政治体制も何もかも異なる両党による内部対立は、深刻でこのままでは大陸反攻はおろか台湾防衛もままならない。"
 CHI_idea_12_R1: "アカを掌握せよ"
 CHI_idea_12_R1_desc: "国共内戦での敗北以後、我々の統治範囲は台湾と幾ばくの島嶼に限られていた。しかしアカが大陸から敗走し力を失いつつある現状は連中を制御下に置き国民党が主導権を握る好機だろう。"
 CHI_idea_12_R1_tt: "§Y統一中華戦線§!が国名を§Y中華民国§!に変更する。 \n"
 CHI_idea_12_R2: "混乱の収束"
 CHI_idea_12_R2_desc: "アカの中でも自ら立場に感づいている賢い奴は居るようで我々の動きへの抵抗を続けている。一刻も早い終息を図るには、強硬手段も辞すべきではない。"
 CHI_idea_12_R3: "西側と…"
 CHI_idea_12_R3_desc: "多少の反発に遭ったが我々が中華の主導権を握る試みは、概ね成功しつつある。これを機に西側諸国との関係を更に深化させるのは、悪い選択はない。"
 CHI_idea_12_R4: "アメリカとの研究協定"
 CHI_idea_12_R4_desc: "西側諸国の盟主であるアメリカ合衆国は、技術でも最先端であり彼らからの技術提供を引き出すことは、大きな利益となる。共産党の残した東側の技術ならば良き交渉材料ともなるだろう。"
 CHI_idea_12_R5: "外蒙古の正統性"
 CHI_idea_12_R5_desc: "ウランバートルハイヴの位置する外蒙古は、歴史的に中華の一部であることは明白だ。西側諸国の支持を取り付けられる今ならば、その所有権の主張も受け入れられるだろう。"
 CHI_idea_12_S1: "共存"
 CHI_idea_12_S1_desc: "総統府に共産党が入って以降の統一政府は表向き協力し合う姿勢を見せつつも内部では激しい政争が絶えなかった。元々共産党は台湾を征服するつもりであったのに現在は立場が逆転しているのだからその屈辱は想像に難くないだろう。国民党側もそのような状況になるまで合作を行わなかった点を見れば共産党への恨みの深さが理解できる。しかし、我々は内輪で争っている場合ではない。あらゆる犠牲を払ってでも真に統一された政府を打ち立てるべきだ。"
 CHI_idea_12_S2: "生贄"
 CHI_idea_12_S2_desc: "国民党と共産党双方に政府の統一を目指す派閥は存在している。これに対し軍からも協力者が現れた。これにより本格的に統一政府樹立を目指す計画が始動される。まずは政府内の愚か者共を始末し、一気に総統府を制圧する。その混乱に乗じて軍部の過激派も排除する。その為ならばどんな犠牲もいとわない。"
 CHI_idea_12_S3: "統一政府の準備"
 CHI_idea_12_S3_desc: "統一派は迅速に政権を奪取した。軍部もほとんどの部隊が同調し原隊に復帰している。我々はついに真の統一へと歩み始めたのだ。"
 CHI_idea_12_S4: "技術的統一"
 CHI_idea_12_S4_desc: "人民解放軍と中華民国軍では根本的な技術体系が異なる。人民解放軍はソ連式の装備に大陸での経験から得た対BETA戦闘ノウハウを持ち、中華民国軍はアメリカ式の装備に西側諸国の先端電子技術を持つ。そして双方は互いに自分たちに足りないものを持っている。統一に向かって歩みだした我々はそれを合わせることで効率的な軍を新設することができる。"
 CHI_idea_12_S5: "共和国"
 CHI_idea_12_S5_desc: "政府の統一と軍部の統一双方を成し遂げた我々はついに世界に対して中華民族による真の統一国家樹立を宣言することができる。我々は成し遂げたのだ。"
 CHI_idea_12_S5_tt: "§Y統一中華戦線§!が国名を§Y中華共和国§!に変更する。 \n"
 CHI_idea_12_L1: "静かなる粛清"
 CHI_idea_12_L1_desc: "結局の所、全中華人民は共産党の指導により統治されるのが対BETA戦争を見据えた上での最高の選択であり、その指導部に国民党の席は不要である。"
 CHI_idea_12_L1_tt: "§Y統一中華戦線§!が国名を§Y中華人民共和国§!に変更する。 \n"
 CHI_idea_12_L2: "委員会設置"
 CHI_idea_12_L2_desc: "大陸からの屈辱的な転進以後、党内にも国民党への恭順を図る者共が現れ始めている。粛清を推し進めるのと並行し党内の指導体制も刷新するべきだ。"
 CHI_idea_12_L3: "大陸での経験"
 CHI_idea_12_L3_desc: "我々には、大陸の戦いで得た多くの戦訓がある。台湾に押し込められた現状を打破する為にも我々は、それらで何を失い何を得たのか知らなくてはならない。"
 CHI_idea_12_L4: "管理計画経済"
 CHI_idea_12_L4_desc: "長期間、国民党の統治下に置かれていたこの土地の労働者は、その殆どが資本経済に毒されている。今後のBETAとの戦いの為にも共産党によるより最適な経済計画に従うように指導しなくてはならない。"
 CHI_idea_12_L5: "犠牲の下で"
 CHI_idea_12_L5_desc: "BETAにより我々は、数多くの犠牲を強いられ失う一方であった。だがこれ以上失うものは存在しない以上、後はBETAから奪われたものを取り返すだけで良い。中国を一つとした我々ならば可能だ。"
 CHI_idea_13: "華南の再建"
 CHI_idea_13_desc: "大陸への上陸は順調に進みつつあるが同時に補給問題も避けて通ることは出来ない。そこで華南を再建し今後の大陸奪回の橋頭堡とする。"
 CHI_idea_14: "沿岸部の再建"
 CHI_idea_14_desc: "台湾の対岸部に当たる福州周辺地域は、台湾の安全のために必要な地域でありその再建事業は、急務である。"
 CHI_idea_15_A: "始まりの都"
 CHI_idea_15_A_desc: "長きに渡る戦いに遂に勝利した。中華大陸の奪回に成功した我々が凱旋する地は、辛亥革命で生まれた共和制の始まりの地である南京こそが相応しいだろう。"
 CHI_idea_15_B: "中華の都"
 CHI_idea_15_B_desc: "我々は、遂に中華大陸の奪回に成功した。これから長きに渡るだろう再建には、明朝、清朝、中華人民共和国と永きに渡り中華の首都であった北京こそが都合が良いだろう。"
 CHI_ReviewDiploandWarStrat: "対外関係と対BETA戦略の再検討"
 CHI_ReviewDiploandWarStrat_desc: "BETAとの戦いは26年間続き、我々は多くの国の軍隊と共同作戦を行ってきた。 台湾島に追い詰められた今、私たちだけでは祖国を取り戻すことができないのではないかと危惧しており、積極的に外部からの援助を求めるべきだ。"
 CHI_InvestAUSRefugeeFactory: "オーストラリアの難民工場への投資"
 CHI_InvestAUSRefugeeFactory_desc: "多くの難民が収容されているオーストラリアの借地権付き土地にある工場に投資することで、最前線に供給すると同時に、難民の力を最大限に活用し、受け入れ国の負担を軽減することができる。"
 CHI_MilitaryCoopWithJapan: "日本との軍事協力"
 CHI_MilitaryCoopWithJapan_desc: "日本は本土決戦を支援するために軍隊を派遣しており、協力するための一定の基盤がある。 日本はBETAによる祖国への侵略によって深刻なダメージを受けており、彼らが我々の申し出を拒否することはないと信じている。"
 CHI_InvestSouthAmericaFactory: "南米の難民工場に投資"
 CHI_InvestSouthAmericaFactory_desc: "難民を再定住させるために、私たちは南米にもリースを持っている。 台湾からは離れているが、そこに投資して工場を建設するのも悪くない。"
 CHI_LearnFromEEA: "東欧の伝統的な製法"
 CHI_LearnFromEEA_desc: "激烈な戦闘は戦術機の信頼性を試すものであり、戦術機の準備を重視する東欧社会主義連盟はそこから学ぶべきである。"
 CHI_SendGEUAdvisors: "大東亜への軍事顧問団派遣"
 CHI_SendGEUAdvisors_desc: "大東亜戦線は長く、ジャングル戦が主流である。 軍事顧問団を大東亜に派遣し、その戦闘経験から学び、将来本土奪還のために使われるであろう軍事的結びつきを強化する。"
 CHI_UFC_USSR_TechCoop: "ソ連に技術協力を求める"
 CHI_UFC_USSR_TechCoop_desc: "我々はソ連のMIG21とSU27を導入して改良を加えてきた。ソ連は我々と似たような運用哲学を持っており、ソ連に技術協力を求めることは技術改良の助けになる。"
 CHI_ResultOfExternalTechAid: "海峡を渡る雷"
 CHI_ResultOfExternalTechAid_desc: "ソ連とアメリカの技術を結集し、長年の戦闘経験をもとに再設計された共産党と国民党が共同開発した戦術機は、必ずやBETAに雷撃を与えるだろう。"
 CHI_AbsorbUSTSFTech: "アメリカ戦術機メーカーの紹介"
 CHI_AbsorbUSTSFTech_desc: "競争に敗れ、アメリカの戦術機メーカーは海外に目を向けている。この機会に、アメリカの戦術機メーカーを招き、新しい戦術機の開発に協力してもらうこともできるかもしれない。"
 CHI_DemandAidFromUS: "米国への援助要請"
 CHI_DemandAidFromUS_desc: "米国の戦略はアジアよりもヨーロッパを優先することだが、十分な代償を払う意思があれば、米国はわれわれの援助要請を拒否しないかもしれない。"


