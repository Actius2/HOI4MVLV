 CHI_P4: "管理計画経済"
 CHI_overseas_chinese_network: "華僑ネットワーク"
 CHI_overseas_chinese_network_desc: "東南アジア、北アメリカ等の華人共同体にネットワークを張り彼らを通じて民生品生産を国外に委託させる事で台湾ほぼ全ての工場を対BETA戦へ動員する事に成功している。"
 CHI_one_country_two_systems: "第三次国共合作"
 CHI_one_country_two_systems_desc: "1986年、共産国民両政府の対BETA共闘条約調印により成立した第三次国共合作だが共産党政府の大陸失陥によりその力関係には大きな歪みが生じている。"
 CHI_learn_eea: "東欧の伝統的な製法"
