l_english:
 OSE_focus_tree: "Australia Focus Tree"
 ose_first: "Homeland Defense"
 ose_first_desc: "For many years, we have lived a safe and comfortable life as a backward nation, but considering the speed of the BETA's advance in recent years, it is only a matter of time before they invade our continent. If that happens, driving our people, who have become accustomed to peace, into war will not be a fighting force. There will likely be a lot of opposition, but we must use every means possible to strengthen our people and our country."
 ose_eco: "Factory of Humanity"
 ose_eco_desc: "Although our country has been a permanent member of the Security Council for a long time, our industrial power is not even comparable to that of other permanent members. Most of our factories are used for food processing or export. We will streamline and simplify our production lines so that they can be used for military purposes. This will mean merging and closing some private companies, but it is necessary."
 ose_eco2_1: "Rehire"
 ose_eco2_1_desc: "The merger of food factory operators created surplus factories and created a system for establishing munitions factories, but many of the refugees who originally worked at the food factories became unemployed. They are struggling to make ends meet, so we cannot leave them alone until the factories are up and running again. We will employ them in the military and provide them with training for emergencies."
 ose_eco2_2: "Tactical Research Institute"
 ose_eco2_2_desc: "Our country has sent small numbers of expeditionary forces to various places for many years, but the lessons learned by those units have not been reflected in the military as a whole. Research into Tactical Surface Fighter is important, but without tactics, it will be useless."
 ose_eco2_3: "AAX Project"
 ose_eco2_3_desc: "In recent years, high-performance third-generation Tactical Surface Fighter have been developed and deployed in various countries, including the United States, but our country cannot afford to purchase such expensive Tactical Surface Fighter. Moreover, there is no way we should have aircraft that would be considered a threat to the United States after the war. However, third-generation Tactical Surface Fighter will be essential to counter the imminent threat of BETA. In the midst of this, a proposal was raised to ask Boening to develop an inexpensive third-generation aircraft."
 ose_eco2_4: "Factory transformation"
 ose_eco2_4_desc: "Japan is one of the few countries in the world with a food self-sufficiency rate of over 100%, and does not distribute synthetic foods, which are becoming common in other countries. However, if we could meet domestic demand with synthetic foods, we would be able to use food factories more freely."
 ose_eco2_5: "Large Munitions Factory"
 ose_eco2_5_desc: "We have been actively converting existing factories across the country while also building new ones, creating great industrial parks in the suburbs and revolutionizing the industry of our continent."
 ose_eco2_6: "Large Civilian Factory"
 ose_eco2_6_desc: "We have been actively converting existing factories across the country while also building new ones, creating great industrial parks in the suburbs and revolutionizing the industry of our continent."
 ose_eco2_7: "Large Ammunition Factory"
 ose_eco2_7_desc: "In preparation for the coming battle, we must prepare the foundations for mass production of ammunition. We will mobilize all labor forces to build an ammunition factory area."
 ose_eco2_8: "UN Expeditionary Force"
 ose_eco2_8_desc: "The United Nations has a large number of Tactical Surface Fighter units in its arsenal, and as a permanent member of the Security Council it can request that several of these divisions be made available to our country."
 ose_eco2_9: "Relying on the UN"
 ose_eco2_9_desc: "Japan is inferior in research capabilities compared to other permanent members of the Security Council. It may be possible to rely on the United Nations to support research institutes."
 ose_eco2_10: "Austerity"
 ose_eco2_10_desc: "War is an imminent threat. Our people cannot afford to live carefree lives. Let's enact laws that restrict people's lives and limit their consumption."
 ose_eco2_11: "Naturalization of Refugees"
 ose_eco2_11_desc: "Up until now, refugees have been used simply as labor, but thanks to them, our country has made great strides. Now is the time to recognize them as citizens, working alongside us in our country. And together, we will protect our homeland from the BETA."
 ose_eco2_12: "Former refugee conscription system"
 ose_eco2_12_desc: "By naturalizing many of the refugees, it is now possible to conscript them into the military. Although they have been recruiting volunteers up until now, conscription will allow them to greatly expand their military."
 ose_eco2_13: "Benefits"
 ose_eco2_13_desc: "The rapid-fire reforms that have been implemented thus far have had a major impact on the lives of the people. The government should provide financial support and use the mass media to carry out publicity operations to calm the confusion."
 ose_eco2_14: "A New Homeland"
 ose_eco2_14_desc: "Although there was some confusion, the refugees were accepted as Australian citizens. Many refugee-born soldiers were also assigned to the unit. Their determination to protect their new homeland has had a positive impact on the entire military."
 militarism_mob: "A New Homeland"
 militarism_mob_desc: "Although there was some confusion, the refugees were accepted as Australian citizens. Many refugee-born soldiers were also assigned to the unit. Their determination to protect their new homeland has had a positive impact on the entire military."

 ose_war: "The beginnings of innovation"
 ose_war_desc: "The Congress wants to take every possible measure to protect our country, but in the end, it seems that naive ideas like converting existing food factories and accepting refugees little by little are widespread. If we leave it to such weaklings, our country will be overrun by BETA overnight. More radical reforms are needed."
 ose_war3_1: "Semi-forced Labor Law"
 ose_war3_1_desc: "They force the refugees who are rampant in our country to work for the country. In order to avoid criticism, they do all sorts of things to make it look like forced labor, creating a situation where the refugees have no choice but to do so."
 ose_war3_2: "The right person in the right place"
 ose_war3_2_desc: "Refugees come to our country almost every day. However, forcing them all to work is a waste of human resources. We should improve the allocation of human resources by conscripting former military personnel and forcibly sending former university professors and teachers to research institutes."
 
 ose_war3_3: "Forced conscription of defecting guards"
 ose_war3_3_desc: "Among the large number of refugees, there are some valuable individuals. Especially the guards who have abandoned their homeland or fled from the UN forces. In exchange for providing them with a new home, we can use their skills and Tactical Surface Fighter."
 
 ose_war3_4: "Focus on TSF"
 ose_war3_4_desc: "Up until now, Japan has not possessed powerful Tactical Surface Fighter by pandering to the United States, but this is no longer the case. Japan must use all available means to acquire powerful Tactical Surface Fighter."
 
 ose_war3_5: "Focus on Tanks"
 ose_war3_5_desc: "Although they cannot fly, tanks can be deployed at high speed and are cheaper than Tactical Surface Fighter, making them essential equipment in the fight against the BETA. We should hurry up with expanding these as well."
 ose_war3_6: "AL Bullet Production Factory"
 ose_war3_6_desc: "If we mass-produce AL bullets in our country and supply them to other countries, we can increase our country's presence and at the same time increase the number of shells protecting our country. Let's build a dedicated factory and focus on production."
 
 ose_war3_7: "Selling prototype TSF"
 ose_war3_7_desc: "Our country needs the latest Tactical Surface Fighter to fight the BETA... At that time, a certain source offered to provide the technology for a prototype Tactical Surface Fighter... Should we get on board?"
 
 ose_war3_8: "Establishment of a new research institute"
 ose_war3_8_desc: "By forcibly conscripting refugees, etc., surplus resources can be allocated to research institutions."
 
 ose_war3_9: "Refugee Tank Factory"
 ose_war3_9_desc: "Send refugees to tank factories in large numbers to speed up tank production."
 ose_war3_10: "Refugee TSF Factory"
 ose_war3_10_desc: "Let's concentrate refugees in the Tactical Surface Fighter factory to accelerate the production of Tactical Surface Fighter."
 ose_war3_11: "For the World"
 ose_war3_11_desc: "With everyone's combined efforts, we will build a large industrial zone on this land."
 
 ose_war3_11A: "Fulfillment of a long-cherished wish"
 ose_war3_11A_desc: "-It is a simple truth that all men are created equal.- Let us put an end to this long-standing tragedy with our own hands and bring peace to the world."
 
 ose_ghard1: "The Time is Near"
 ose_ghard1_desc: "Sad news has come from the Greater East Asian Union. The long-held defense line has finally collapsed. The time has come."
 ose_ghard2: "Emergency Summoning"
 ose_ghard2_desc: "A crisis is looming in our country. The government has declared a state of emergency and begun conscription."
 ose_ghard3: "Factory emergency requisition"
 ose_ghard3_desc: "In order to counter the BETA that is approaching our country, they seize many factories within the country and rush to increase production of military supplies."
 ose_ghard4: "Preventing landings"
 ose_ghard4_desc: "We must not allow the BETA to land in our country. We must hurry to repair, expand, and build new fortresses."
 ose_ghard5: "United Nations emergency assistance"
 ose_ghard5_desc: "I will ask the United Nations for assistance in our current crisis. It may be a drop in the bucket, but it's better than nothing."
 
 OSE_PurchaseRetiredTSF: "Purchase of retired TSF"
 OSE_PurchaseRetiredTSF_desc: "They will purchase a large number of old Tactical Surface Fighter from the United Nations. It will cost a lot of money, but they cannot afford to be picky."
 
 OSE_DemandTSFProductionLicense: "TSF manufacturing license request"
 OSE_DemandTSFProductionLicense_desc: "Our nation needs better Tactical Surface Fighter, and we have no room for compromise."
 
 OSE_AllInProduction: "Three-shift system"
 OSE_AllInProduction_desc: "The factories keep running, the lights stay on, and brand new weapons support the front lines like a tsunami."
 
 
 OSE_food: "Humanity's Food Factory"
 OSE_food_desc: "Australia, which was barely affected by the BETA War, is the world's largest exporter of natural foods, and at the same time, it has an abundance of natural foods to feed its citizens."
 OSE_refugees: "Actively accepting refugees"
 OSE_refugees_desc: "Australia cooperates with the United Nations in accepting many refugees, which has the advantage of providing a labor force, but there are concerns about the deterioration of security in many areas."
 OSE_payment_of_grants: "Payment of benefits"
 OSE_payment_of_grants_desc: ""
 
 OSE_goods: "Austerity"
 OSE_refugees2: "Naturalization of refugees"
 OSE_refugees3: "A New Homeland"
 OSE_refugees4: "Semi-forced labor system"
 OSE_space: "Anti-Laser Combat"
 OSE_tsf: "National TSF Factory"
 OSE_human: "The right person in the right place"
 OSE_tank: "National Tank Factory"
 OSE_geu: "Greater East Asia Union Emergency Assistance"
 
 OSE_idea_ANZAC: "ANZAC"
 OSE_idea_ANZAC_desc: "-Australia and New Zealand Army Corps- The common name ANZAC stands for Australian and New Zealand military organization. Formed in 1914, they were sent to dangerous fronts as the vanguard of the British Commonwealth. Even now, when the unity of the Commonwealth has weakened, the spirit of ANZAC is inherited by the Oceania Army."
 
 OSE_idea_Expanding_refugee: "Expanding the refugee front"
 OSE_idea_Expanding_refugee_desc: "The tough refugee policy is provoking resentment from refugees and is also causing a fatal breakdown in governance. It could lead to a situation that completely changes the domestic situation."
 
 OSE_idea_Refugee_Nation: "The Last Paradise"
 OSE_idea_Refugee_Nation_desc: "We have been oppressed by BETA and oppressive leaders for a long time. Let's take up arms to protect this land, which is our paradise, and to protect our freedom. We are no longer powerless refugees. Let's gather comrades from all over the world here. So that what we have done will not end in vain. And so that we can live safely tomorrow."
 
 OSE_esc_tsf_tt: "A five-division-sized force of Tactical Surface Fighter will be created, consisting of aircraft from Greater East Asia, America, and the United Nations."
 
 mvlv_ose.1.t: "Emergency Support"
 mvlv_ose.1.d: "Australia has come to our aid in our time of crisis!"
 mvlv_ose.1.a: "I hope this helps somehow..."