  beta_combat_tactics: "BETA Tactics"
  beta_combat_tactics_desc: "tactics developed as the result of human research"
  human_combat_tactics: "Tactics against BETA"
  human_combat_tactics_desc: "Tactics developed based on research and combat data against the BETA"
  MOBILE_WARFARE_DOCTRINE_LABEL: "Mobile Strike Doctrine"
  MOBILE_WARFARE_DOCTRINE_DESC: "The tactics used by the NATO countries, based on the combined encirclement and annihilation of Tactical Surface Fighter and other services, are aimed at increasing the survival rate of soldiers. "
  SUPERIOR_FIREPOWER_DOCTRINE_LABEL: "Close Combat Doctrine"
  SUPERIOR_FIREPOWER_DOCTRINE_DESC: "The Warsaw Pact countries and those with Hives in their territories, such as Japan, utilizing high concentrations of Tactical Surface Fighter to crush the enemy in close combat as their primary tactic. "
  GRAND_BATTLEPLAN_DOCTRINE_LABEL: Total War Doctrine"
  GRAND_BATTLEPLAN_DOCTRINE_DESC: "Under the General Mobilization System, the entire population is mobilized to build a defence system. The aim is to defend the country by all means."
  MOBILE_INFANTRY_LABEL: "G-bomb Utilization"
  MOBILE_INFANTRY_LABEL_TT: "Increased command and control rate and attack capability of Tactical Surface Fighter to clear the way for G-bombs."
  BLITZKRIEG_LABEL: "All Terrain aircraft"
  BLITZKRIEG_LABEL_TT: "Improve the synergy of Tactical Surface Fighter and build a system in which all combat operations, including medium-range support, are performed by Tactical Surface Fighter only."
  DISPERSED_SUPPORT_LABEL: "mobile assault"
  DISPERSED_SUPPORT_LABEL_TT: "Infiltration strikes by increasing the overall speed of the army in order to penetrate deep behind the BETA echelon. "
  INTEGRATED_SUPPORT_LABEL: "intensive melee combat"
  INTEGRATED_SUPPORT_LABEL_TT: "Improve the combat effectiveness and breakout capability of Tactical Surface Fighter units. "
  ASSAULT_LABEL: "Fight to the End"
  ASSAULT_LABEL_TT: "Even if expensive weapons such as Tactical Surface Fighter cannot be manufactured, the ability to use conventional weapons must be improved for the defense of the country"
  INFILTRATION_LABEL: "Invade and Assault"
  INFILTRATION_LABEL_TT: "Increase the overall speed of the Army to enable large-scale, long-distance penetration raids."

  cat_mobile_warfare: "Mobile Strike Doctrine"
  cat_superior_firepower: "Close Combat Doctrine"
  cat_grand_battle_plan: "Total War Doctrine"

  mobile_warfare: "Mobile Warfare"
  mobile_warfare_desc: "Maneuver warfare focuses on disrupting the enemy's system through speed and maneuver. \n\n"
  delay: "Delay"
  delay_desc: "Ambushes and delays can also be effective in slowing down the attacking side's advance when victory is not possible. "
  elastic_defence: "Active Defense"
  elastic_defence_desc: "Rather than preventing an advance, a -deep- defensive line slows the attacking advance, buying time for the defending forces to hold off and then counterattack. \n"
  mobile_infantry: "Mobile Support"
  mobile_infantry_desc: Efficient mobile deployment of fire support not only minimizes losses to frontline troops, but is also extremely effective in boosting the morale of frontline soldiers. Show the BETA that we can deliver the firepower they need where it's needed! \n\n"
  mass_motorization: "Large-scale Unmanned Weapons"
  mass_motorization_desc: "Unmanned weapons are not very effective, but it depends on how you use them. \n By using them in a planned manner, you can make up for insufficient firepower, and sometimes you can use them to buy time. \n It's a small price to pay when you consider the morale and lives of soldiers.\n"
  mechanised_offensive: "Large-scale Support to Pave the Way"
  mechanised_offensive_desc: "After destroying the enemy's main force with large-scale supporting artillery fire, the remaining enemy will be cleared out by combined arms such as Tactical Surface Fighter. \nIf sacrifices can be bought with ammunition, there is no more effective purchase.\n"
  mechanised_offensive1: "Mass Deployment of UAVs"
  mechanised_offensive1_desc: "Although UAVs can be shot down by ray-class aircraft, it is better than using manned weapons for reconnaissance.\nAt the very least, the presence and location of ray-class aircraft can be determined, broadening the range of tactics that can be taken.\nGround drones will also be used to conduct large-scale reconnaissance.\n"
  mechanised_offensive2: "Overwhelming Support and G-Bomb"
  mechanised_offensive2_desc: "There are no more obstacles before us.\nBecause we have the ultimate weapons and overwhelming support brought by the BETA.\nThere is no need to show off anymore.\nThis is our common sense.\n"
 
  armored_spearhead: "pioneering Tactical Surface Fighter"
  armored_spearhead_desc: "In order to maximize the potential of Tactical Surface Fighter, they cannot be used only for defense. An independent rapid force should be developed with the Tactical Surface Fighter at its core as the vanguard. \n\n"
  schwerpunk: "Concentration of forces"
  schwerpunk_desc: "In order to win, forces must be concentrated on key battlefields. "
  blitzkrieg: "Penetration Breakthrough"
  blitzkrieg_desc: "It improves the coordination accuracy of Tactical Surface Fighter units entering enemy groups and increases the speed of the entire unit. "
  blitzkrieg1: "Tactical Surface Fighter maneuver tactics"
  blitzkrieg1_desc: "Utilizing the maneuverability of Tactical Surface Fighter, they will disrupt and surround the enemy, ensuring their annihilation. "
  blitzkrieg2: "The Essence of ALL-TSF"
  blitzkrieg2_desc: "With ALL-TSF tactics, there are no constraints such as the mobility of other units. This increases the flexibility of Tactical Surface Fighter operations and allows more units to be concentrated in one place."
 
  superior_firepower: "superior firepower"
  superior_firepower_desc: "It is not human lives that are used to fight the enemy, but bullets. Our human resources are expensive, but ammunition is cheap. \n\n"
  sup_delay: "Delay"
  sup_delay_desc: "Even though it may not be possible to win, it is important to utilize all resources at hand and buy more time for the rear with tactical savvy and a strong will to fight.  "
  mobile_defence: "Mobile support"
  mobile_defence_desc: "Tactical Surface Fighter units can support the defense no matter where the enemy attacks from."
  intergrated_support: "Integrated Support"
  intergrated_support_desc: "Enhancement of divisional attacks by integrating support and actual combat forces. \n\n"
  regimental_combat_teams: "Mobile Combat"
  regimental_combat_teams_desc: "By constantly moving, you reduce your chances of being attacked by the BETA and minimize your troops' losses. The only thing you'll lose is fuel.\n"
  regimental_combat_teams1: "Diversion by TSF"
  regimental_combat_teams1_desc: "BETA are attracted to high performance manned aircraft.\n Taking advantage of this characteristic, Tactical Surface Fighter units will carry out diversionary attacks in the center of enemy lines, gathering the enemy together,\n making saturation attacks by artillery units more effective. \n"
  regimental_combat_teams2: "Close-Quarters melee combat"
  regimental_combat_teams2_desc: "Although it may seem that a closely packed unit's movements are restricted, this becomes a tactic that eliminates blind spots through high levels of training and cooperation.\n"
  regimental_combat_teams3: "The Superhuman Guardians"
  regimental_combat_teams3_desc: "The guards, whose minds have been strengthened through post-hypnotic suggestion and drugs, display incredible fighting abilities.\n" 
 
  dispersed_support: "Distributed Support"
  dispersed_support_desc: "Distributing support forces allows firepower to be distributed over a larger front, thereby improving the division's defensive capabilities. \n\n"
  overwhelming_firepower: "Mobile Encirclement"
  overwhelming_firepower_desc: "While the Tactical Surface Fighter unit launches a diversionary charge and a ray-class attack in front of the enemy, the tank unit will flank and annihilate them.\n"
  overwhelming_firepower1: "Tactical Rush"
  overwhelming_firepower1_desc: "Any difficult terrain is no problem with the maneuverability of a Tactical Surface Fighter.\n"
  overwhelming_firepower2: "General Mobile Assault"
  overwhelming_firepower2_desc: "We will continue to annihilate the BETA with our overwhelming speed and advanced tactics that take advantage of the speed difference. No one can catch up with us anymore. Speed is justice... embody it! \n"
  overwhelming_firepower3: "Diversionary Rush"
  overwhelming_firepower3_desc: "They use a diversion to lure out the BETA and quickly eliminate them.\nThere is no terrain that they cannot break through with their superior tactics and mobility. \n"

  sup_mechanized_offensive: "mechanized offensive"
  sup_mechanized_offensive_desc: "Mechanized forces are an excellent fighting force. The centerpiece of the offensive is the mech infantry, which moves using weapons and armor-protected vehicles while transporting heavy weapons. "
  concentrated_fire_plans: "Concentration of Fire Plan"
  concentrated_fire_plans_desc: "By concentrating the firepower of various forces, a great blow can be dealt to the enemy. \n\n"
  combined_arms: "multi-service combination (MSP)"
  combined_arms_desc: "Armor, infantry, and support units are more effective when organized in the same unit than when used separately."
  tactical_control: "Tactical command"
  tactical_control_desc: "The non-commissioned officers, accustomed to the union of the services at the front, now had direct control over the operations of all the services.  "

  grand_battle_plan: "Focused defense"
  grand_battle_plan_desc: "Flexibility in defense is required against BETA, but in the final defense it is sometimes necessary to hold firm. For this reason, we should not be slow to prepare. \n\n"
  trench_warfare: "Trench warfare against BETA"
  trench_warfare_desc: "Trenches are the foundation of defense. In the war against BETA, that was the instant fortress, and the key was to be able to construct it as quickly as possible. "
  grand_assault: "overall leadership"
  grand_assault_desc: "A well-coordinated army can be prepared in advance to withstand a long campaign. "
  grand_mechanized_offensive: "absolute defense"
  grand_mechanized_offensive_desc: "For countries with no territorial depth, retreat means national decline and demise. Therefore, the line of defence must be fortified as early as possible, as never before, and must be defended to the death. \n\n"
  assault_concentration: "total defense"
  assault_concentration_desc: "Regardless of the type of weapon used, infantry is fundamental. Therefore, infantry must be given maximum importance. "
  branch_interoperation: "Interoperability of military types"
  branch_interoperation_desc: "Enhanced interaction between the different spheres of the military will enable the military to function better in the joint war effort of the services.。 "
  assault_breakthrough: "strike on one's own initiative"
  assault_breakthrough_desc: "In order to survive, we must resist until the last moment. Even if we cannot defend our homeland alone, we must sustain small offensives and actively cut our numbers to stop the enemy from launching attacks. "
  infantry_offensive: "Flexible defense"
  infantry_offensive_desc: "BETA is powerful but slow. Fight favorably by retreating quickly to favorable terrain to establish a new line of defense as soon as possible. \n\n"
  armored_operations: "Theory of Tactical Surface Fighter Utilization"
  armored_operations_desc: "Although Tactical Surface Fighter are expensive, they are very powerful weapons. Improvement of the defense system through more efficient use. "
  infiltration_assault: "Efficient replenishment"
  infiltration_assault_desc: "Air-dropped resupply containers can only be fought in large-scale operations. Even for countries that do not have a cosmic army, it is necessary to construct other means to effectively resupply supplies."
  night_assault_tactics: "Tank strong attack tactics"
  night_assault_tactics_desc: "In order to launch offensives without losing expensive Tactical Surface Fighter, conduct training that enables battle tanks and mechanized infantry to be used in offensives as well.  "
  attritional_containment: "Battlefield Goddess"
  attritional_containment_desc: "Against BETA, the role of artillery is multifaceted beyond offense and defense, including relying on cover from anti-laser warheads. This role is especially large inland. We must utilize this effectively. "

  antitank1: "Improvements to the Electromagnetic Projection Cannon"
  antitank1_desc: "electromagnetic projection gun"
  antitank2: "electromagnetic projection gun II"
  antitank2_desc: "electromagnetic projection gun"
  antitank3: "Improvements to the modified electromagnetic projection gun I"
  antitank3_desc: "electromagnetic projection gun"
  antitank4: "Improvements to the modified electromagnetic projection gun II"
  antitank4_desc: "electromagnetic projection gun"
  antitank5: "electromagnetic projection gun V"
  antitank5_desc: "electromagnetic projection gun"
  artillery1: "Self-propelled howitzer I"
  artillery1_desc: "With the help of more modern materials and mechanisms, howitzers and field guns, born from the last great war, underwent the renovation of the apothecary and the modernization of modern warfare. "
  artillery2: "Improved self-propelled howitzer I"
  artillery2_desc: "The improved field gun is ready for us to use. The design of the new howitzer required a new oil-pressure screw mechanism and a longer gun body."
  artillery3: "Improved self-propelled howitzer modified II"
  artillery3_desc: "Guns can be designed with additional muzzle brakes to facilitate the mounting of heavier guns on lighter carriers.。"
  artillery4: "Self-propelled howitzer IV"
  artillery4_desc: "The development of lightweight artillery that can be dismantled and transported can extend artillery support to previously inaccessible places.。"
  artillery5: "Development self-propelled howitzer modified"
  artillery5_desc: "The development of lightweight artillery that can be dismantled and transported can extend artillery support to previously inaccessible places.。 "
  mountain_gun: "mountain artillery"
  mountain_gun_desc: "The treacherous terrain of northern India facilitated the development of artillery that could be disassembled and placed on the back of a mule and, if necessary, transported anywhere."
  rocket_artillery2: "Improved self-propelled rocket launcher I"
  rocket_artillery2_desc: "The self-propelled howitzer allows for rapid mass destruction using multiple rocket launchers, while allowing for conservative maneuvering to avoid counterattacks. "
  rocket_artillery3: "Improved self-propelled rocket launcher II"
  rocket_artillery3_desc: "By using them on a force-by-force basis, artillery batteries can reload in an organized manner and change positions quickly."
  rocket_artillery4: "Self-propelled rocket launcher III"
  rocket_artillery4_desc: "Cyclostabilized rockets increase the range of light artillery units. "
  tech_special_forces: "Orbital Lowering Force"
  tech_special_forces_desc: "The Battle of the Lair requires specialized training. It is necessary to prepare our troops for difficult conditions. "
  advanced_special_forces: "Advanced Surge Training"
  advanced_special_forces_desc: "Through large-scale training, our break-in forces can perform at the level of the average Guardsman and above. "
  improved_special_forces: "Orbital Lowering Force expansion plan"
  improved_special_forces_desc: "The Nest Assault Force can perform tasks that the average soldier cannot. In order to get more capable soldiers, it is necessary to improve training methods. "
  extreme_environment_training: "Environmental training within the nest"
  extreme_environment_training_desc: "Defenders of the Assault Force are required to fight in very tough environments. With proper training and equipment, our troops can fight in very harsh lair environments. "
  survival_training: "Survival training"
  survival_training_desc: "Orbital descent forces often fought behind the enemy's back and were thus often caught in a situation of insufficient supplies. It is necessary to train them to be able to endure harsh weather and fight with limited supplies. "
  elite_forces: "Specialized teams"
  elite_forces_desc: "Only the superlative can become an elite unit. The guards created through this training will fight stronger, faster, and better than anyone else. "
  MVLV_sov_tec: "П3 Program"
  MVLV_sov_tec_desc: ""
  atomic_research: "G Elemental Research"
  atomic_research_desc: "G Elemental critical reactions produce surprising gravitational deviations in this direction that will likely offer new hope for mankind."
  nukes: "G Bomb"
  nukes_desc: "Theoretically, the G-bomb is simultaneously incredibly destructive as well as controllable, and once put into actual combat will potentially turn the tide against humanity."
  infantry_at: "Infantry anti-tank weapons I"
  infantry_at_desc: "Equipping our infantry units with anti-tank rifles will allow them to counter the chariot class while ensuring they don't lose their maneuverability."
  infantry_at2: "Infantry anti-tank weapons II"
  infantry_at2_desc: "In order for infantry to be effective against larger betas, smaller and lighter hollow charge weapons must be made."
  support_weapons: "Support Weapons I"
  support_weapons_desc: "Automatic weapons have become lighter and assault rifles have proved effective against smaller species: hand-held support weapons should continue to be developed."
  support_weapons2: "Support Weapons II"
  support_weapons2_desc: "The development of automatic weapons combining the characteristics of both light and heavy machine guns has enabled our soldiers to use them in a variety of ways."
  support_weapons3: "Support Weapons III"
  support_weapons3_desc: "While maintaining and improving the reliability of the machine gun, attempts can also be made to increase its rate of fire to ensure an uninterrupted barrage of bullets to kill beta."
  support_weapons4: "Support Weapons IV"
  support_weapons4_desc: "With the popularization of large-calibre machine guns, the development of reliable automatic weapons that can be used in any environment and by any type of soldier has become a top priority for modern armies."

