l_english:
 EQ_MOD_SLOT_MVLV_TSF_armor_slot_TITLE: "Armor"
 EQ_MOD_SLOT_MVLV_TSF_armor_slot_TITLE_desc: "Armor Slot (explanation)"
 EQ_MOD_CAT_MVLV_TSF_armor_type_TITLE: "Armor"
 EQ_MOD_CAT_MVLV_TSF_armor_type_TITLE_desc: "Armor Type (explanation)"
 MVLV_TSF_armor_composite: "§GComposite Armor§!"
 MVLV_TSF_armor_composite_desc: "Composite armor made of multiple materials and anti-ray coatings. Although the cost increases, it provides high survivability without compromising mobility."
 MVLV_TSF_no_armor: "Armor §RWithout§!"
 MVLV_TSF_no_armor_desc: "No armor. Exposed frame reduces durability and severely reduces survivability, but armor cost becomes negligible."
 MVLV_TSF_armor_heavy: "§YHeavy Armor§!"
 MVLV_TSF_armor_heavy_desc: "Strengthening the rigidity and armor of the entire aircraft. This will inevitably reduce reliability, but will prevent it from being destroyed in one or two hits."
 MVLV_TSF_armor_light: "§CLight Armor§!"
 MVLV_TSF_armor_light_desc: "Reducing armor and improving maneuverability. This can lead to accidents and makes the unit more susceptible to being destroyed by larger opponents, but it also reduces costs."
 MVLV_TSF_armor_nomal: "Normal Armor"
 MVLV_TSF_armor_nomal_desc: "Orthodox armor. Provides sufficient protection and maneuverability to operate as a Tactical Surface Fighter."
 
 EQ_MOD_SLOT_MVLV_TSF_OS_slot_TITLE: "Operating System"
 EQ_MOD_SLOT_MVLV_TSF_OS_slot_TITLE_desc: "Operating System Slot (explanation)"
 EQ_MOD_CAT_MVLV_TSF_OS_normal_type_TITLE: "Normal OS"
 EQ_MOD_CAT_MVLV_TSF_OS_normal_type_TITLE_desc: "Normal OS Type (explanation)"
 MVLV_TSF_basic_OS: "§OEarly§! General OS"
 MVLV_TSF_basic_OS_desc: "The initial OS is extremely similar to the OS installed on the Hardiman used in the Lunar War, and is capable of rudimentary three-dimensional maneuvering and the operation of various weapons."
 MVLV_TSF_OS_1_normal: "§YBasic§! General OS"
 MVLV_TSF_OS_1_normal_desc: "A basic OS that can be used for a wide range of general-purpose purposes. It is compatible with all engagement distances, but it can also be said to be a jack of all trades and master of none."
 MVLV_TSF_OS_2_normal: "§CImproved§! General OS"
 MVLV_TSF_OS_2_normal_desc: "An improved general-purpose operating system that enhances survivability and operational capabilities through integration with various sensors and improved processor performance."
 MVLV_TSF_OS_3_normal: "§GAdvanced§! General OS"
 MVLV_TSF_OS_3_normal_desc: "A more advanced general-purpose operating system, with improved algorithms, sensors and processors for greater situational awareness."
 MVLV_TSF_OS_4_normal: "§BFuture§! General OS"
 MVLV_TSF_OS_4_normal_desc: "A general-purpose OS with performance equal to or greater than the XM3. Humanity has now surpassed the geniuses of the past."
 MVLV_TSF_OS_XM3: "XM3"
 MVLV_TSF_OS_XM3_desc: "The XM3 utilizes some of the Alternative 4 technology, combining improved processing power with flexibility in response to attitude control inputs to greatly improve maneuverability."

 EQ_MOD_CAT_MVLV_TSF_OS_close_type_TITLE: "Close Combat OS"
 EQ_MOD_CAT_MVLV_TSF_OS_close_type_TITLE_desc: "Close Combat OS Type (explanation)"
 MVLV_TSF_OS_1_close: "§YBasic§! Close Combat OS"
 MVLV_TSF_OS_1_close_desc: "As its name suggests, the Close-Proximity Specialized OS is a processing system specialized for close-range maneuvering and attack, providing the option of disrupting larger species through mobility."
 MVLV_TSF_OS_2_close: "§CImproved§! Close Combat OS"
 MVLV_TSF_OS_2_close_desc: "An improved close-combat OS, with situational awareness interfaces for approaching enemies, making it more survivable and aggressive in close-combat situations."
 MVLV_TSF_OS_3_close: "§GAdvanced§! Close Combat OS"
 MVLV_TSF_OS_3_close_desc: "A more advanced close-combat OS. It has some automated functions, such as maximizing the kinetic energy of the long sword, further improving its offensive power."
 MVLV_TSF_OS_XM3_close: "Close Combat XM3"
 MVLV_TSF_OS_XM3_close_desc: "The XM3 is a close-combat specialized type. The system design of the XM3 is optimized for each pilot by integrating and incorporating the pilot's behavioral characteristics, and it works well with the close-combat specialized OS."

 EQ_MOD_CAT_MVLV_TSF_OS_support_type_TITLE: "Support OS"
 EQ_MOD_CAT_MVLV_TSF_OS_support_type_TITLE_desc: "Support OS Type (explanation)"
 MVLV_TSF_OS_1_support: "§YBasic§! Support OS"
 MVLV_TSF_OS_1_support_desc: "The support-specialized OS is an OS that focuses on specializing in areas such as the operation of support assault guns at medium to long ranges, and concentrates the processing system on fire control."
 MVLV_TSF_OS_2_support: "§CImproved§! Support OS"
 MVLV_TSF_OS_2_support_desc: "An improved support-specialized OS. Its effectiveness against large species has been greatly improved by introducing features such as calculation of the target's future position, display of weak spots, and an aim stabilization device."
 MVLV_TSF_OS_3_support: "§GAdvanced§! Support OS"
 MVLV_TSF_OS_3_support_desc: "A further developed support-specialized OS. By linking with sensors, it aims to maximize attack efficiency through search-while-tracking and simultaneous multi-target tracking systems."
 MVLV_TSF_OS_XM3_support: "Support XM3"
 MVLV_TSF_OS_XM3_support_desc: "The XM3 is a specialized support system. By incorporating the pilot's cognitive characteristics from accumulated data into the target selection algorithm, it is an attack support system specialized for each pilot."

 EQ_MOD_SLOT_MVLV_TSF_engine_slot_TITLE: "Propulsion System"
 EQ_MOD_SLOT_MVLV_TSF_engine_slot_TITLE_desc: "Propulsion System Slot (explanation)"
 EQ_MOD_CAT_MVLV_TSF_engine_normal_type_TITLE: "General Propulsion System"
 EQ_MOD_CAT_MVLV_TSF_engine_normal_type_TITLE_desc: "General Propulsion System Type (explanation)"
 MVLV_TSF_no_engine: "Propulsion System §RWithout§!"
 MVLV_TSF_no_engine_desc: "It is not equipped with a propulsion system, which significantly reduces maneuverability and makes organized action difficult."
 MVLV_TSF_basic_engine: "§OEarly§! General Propulsion System"
 MVLV_TSF_basic_engine_desc: "Rudimentary propulsion system, not optimized for Tactical Surface Fighter."
 MVLV_TSF_engine_1: "§YBasic§! General Propulsion System"
 MVLV_TSF_engine_1_desc: "A basic propulsion system that conforms to Tactical Surface Fighter standards, such as an independent power system driven by propellant."
 MVLV_TSF_engine_2: "§CImproved§! General Propulsion System"
 MVLV_TSF_engine_2_desc: "Improved propulsion system, which not only increases thrust but also improves maneuverability with a variety of other improvements."
 MVLV_TSF_engine_3: "§GAdvanced§! General Propulsion System"
 MVLV_TSF_engine_3_desc: "Further developed propulsion system. Overall thruster performance has been improved and various propulsion systems have been optimized."
 MVLV_TSF_engine_4: "§BFuture§! General Propulsion System"
 MVLV_TSF_engine_4_desc: "A propulsion system that even makes space travel possible. Its extremely high output leaves other propulsion systems in the dust."
 
 EQ_MOD_CAT_MVLV_TSF_engine_maneuver_type_TITLE: "Maneuverable Propulsion System"
 EQ_MOD_CAT_MVLV_TSF_engine_maneuver_type_TITLE_desc: "Maneuverable Propulsion System Type (explanation)"
 MVLV_TSF_engine_maneuver_1: "§YBasic§! Maneuverable Propulsion System"
 MVLV_TSF_engine_maneuver_1_desc: "A propulsion system that emphasizes instantaneous power and acceleration. It allows for high-speed maneuvering and rapid deployment in close combat, but at the expense of fuel efficiency."
 MVLV_TSF_engine_maneuver_2: "§CImproved§! Maneuverable Propulsion System"
 MVLV_TSF_engine_maneuver_2_desc: "An improved highly maneuverable propulsion system. The application of thrust vectoring technology and the expansion of the moving parts of the thrusters themselves have allowed for even greater maneuverability."
 MVLV_TSF_engine_maneuver_3: "§GAdvanced§! Maneuverable Propulsion System"
 MVLV_TSF_engine_maneuver_3_desc: "A more advanced, highly maneuverable propulsion system that allows for sudden changes in velocity vector through explosive thrust."
 
 EQ_MOD_CAT_MVLV_TSF_engine_cruise_type_TITLE: " Cruise Propulsion System"
 EQ_MOD_CAT_MVLV_TSF_engine_cruise_type_TITLE_desc: "Cruise Propulsion System Type (explanation)"
 MVLV_TSF_engine_cruise_1: "§YBasic§! Cruise Propulsion System"
 MVLV_TSF_engine_cruise_1_desc: "A propulsion system that prioritizes fuel efficiency and productivity. Although it has disadvantages in terms of suspension, it has high productivity and fuel efficiency."
 MVLV_TSF_engine_cruise_2: "§CImproved§! Cruise Propulsion System"
 MVLV_TSF_engine_cruise_2_desc: "An improved cruise propulsion system, which not only improves long-distance performance but also provides some maneuverability during close-quarters combat."
 MVLV_TSF_engine_cruise_3: "§GAdvanced§! Cruise Propulsion System"
 MVLV_TSF_engine_cruise_3_desc: "A more advanced cruise propulsion system, giving it the maneuverability to deal with Beam-class targets."
 
 EQ_MOD_SLOT_MVLV_TSF_headUnit_slot_TITLE: "Head Unit"
 EQ_MOD_SLOT_MVLV_TSF_headUnit_slot_TITLE_desc: "Head Unit Slot (explanation)"
 EQ_MOD_CAT_MVLV_TSF_headUnit_nomal_type_TITLE: "Normal Head Unit"
 EQ_MOD_CAT_MVLV_TSF_headUnit_nomal_type_TITLE_desc: "Normal Head Unit Type (explanation)"
 MVLV_TSF_basic_head: "§OEarly§! Head Unit"
 MVLV_TSF_basic_head_desc: "A very early head unit, providing minimal sensors and visibility."
 MVLV_TSF_head_normal_1: "§YBasic§! Head Unit"
 MVLV_TSF_head_normal_1_desc: "A basic head unit that provides a human-like viewing angle and is equipped with environmental sensors."
 MVLV_TSF_head_normal_2: "§CImproved§! Head Unit"
 MVLV_TSF_head_normal_2_desc: "An improved head unit equipped with an optical zoom system that allows it to observe targets at long distances."
 MVLV_TSF_head_normal_3: "§GAdvanced§! Head Unit"
 MVLV_TSF_head_normal_3_desc: "A more advanced head unit. The introduction of infrared sensors such as a thermal sight allows for more efficient target detection."
 
 EQ_MOD_CAT_MVLV_TSF_headUnit_heavy_type_TITLE: "Armored Head Unit"
 EQ_MOD_CAT_MVLV_TSF_headUnit_heavy_type_TITLE_desc: "Armored Head Unit Type (explanation)"
 MVLV_TSF_head_heavy_1: "§YBasic§! Armored Head Unit"
 MVLV_TSF_head_heavy_1_desc: "A head unit that has strengthened armor at the expense of situational awareness, which increases survivability from BETA attacks, but at the expense of elements such as field of view."
 MVLV_TSF_head_heavy_2: "§CImproved§! Armored Head Unit"
 MVLV_TSF_head_heavy_2_desc: "An improved armored head unit. It has the same performance as the basic head unit, and its observation capabilities have also been improved."
 MVLV_TSF_head_heavy_3: "§GAdvanced§! Armored Head Unit"
 MVLV_TSF_head_heavy_3_desc: "A more advanced armored head unit that is now capable of operating optical zoom and environmental sensors, further improving situational awareness."
 
 EQ_MOD_CAT_MVLV_TSF_headUnit_aerial_type_TITLE: "Aerial Head Unit"
 EQ_MOD_CAT_MVLV_TSF_headUnit_aerial_type_TITLE_desc: "Aerial Head Unit Type (explanation)"
 MVLV_TSF_head_aerial_1: "§YBasic§! Aerial Head Unit"
 MVLV_TSF_head_aerial_1_desc: "A head unit that sacrifices armor for aerodynamic characteristics. It has great advantages in sensors and field of view, but sacrifices elements such as survivability."
 MVLV_TSF_head_aerial_2: "§CImproved§! Aerial Head Unit"
 MVLV_TSF_head_aerial_2_desc: "An improved aerodynamic head unit, with enhanced situational awareness through integration of environmental sensors and optimized system connectivity."
 MVLV_TSF_head_aerial_3: "§GAdvanced§! Aerial Head Unit"
 MVLV_TSF_head_aerial_3_desc: "A more advanced aerodynamic head unit. Improved optical sensors allow for more efficient target search and attack."
 
 EQ_MOD_SLOT_MVLV_TSF_right_hand_slot_TITLE: " Right Hand Weapon"
 EQ_MOD_SLOT_MVLV_TSF_right_hand_slot_TITLE_desc: " Right Hand Weapon Slot (explanation)"
 EQ_MOD_CAT_MVLV_TSF_right_hand_type_TITLE: " Right Hand Weapon"
 EQ_MOD_CAT_MVLV_TSF_right_hand_type_TITLE_desc: " Right Hand Weapon Type (explanation)"
 MVLV_TSF_basic_assault_cannon: "§OEarly§! Assault Cannon"
 MVLV_TSF_basic_assault_cannon_desc: "An early assault rifle. It lacks both ammunition and gunpowder capacity, leaving it lacking in many areas when taking on larger targets, but it is highly productive."
 MVLV_TSF_assault_cannon_1: "§YBasic§! Assault Cannon"
 MVLV_TSF_assault_cannon_1_desc: "A basic assault rifle. It has a conventional design that combines a 120mm cannon and a 36mm chain gun, and has some performance potential."
 MVLV_TSF_assault_cannon_2: "§CImproved§! Assault Cannon"
 MVLV_TSF_assault_cannon_2_desc: "An improved assault rifle. Improved reliability and ammunition have made it more effective against the BETA."
 MVLV_TSF_assault_cannon_3: "§GAdvanced§! Assault Cannon"
 MVLV_TSF_assault_cannon_3_desc: "A more advanced assault rifle, with improvements such as the incorporation of a laser range finder that transmits information to the FCS of Tactical Surface Fighter."
 MVLV_TSF_railgun_1: "§YBasic§! Railgun"
 MVLV_TSF_railgun_1_desc: "A cannon using the Lorentz force was developed with the practical application of G-elements. Development was delayed due to problems with the barrel and electricity, but G-elements solved these issues."
 MVLV_TSF_railgun_2: "§CImproved§! Railgun"
 MVLV_TSF_railgun_2_desc: "A railgun that has been adjusted to be easier to use and mass-produce, with a view to deploying it on the front lines. Its performance has declined slightly."
 MVLV_TSF_railgun_3: "§GAdvanced§! Railgun"
 MVLV_TSF_railgun_3_desc: "The railgun's performance has been further improved, and it now exerts overwhelming destructive power. §YWhen combined with the sensors of the tactical unit§!it exerts high firepower."
 MVLV_TSF_support_gun: "Support Gun"
 MVLV_TSF_support_gun_desc: "A general-purpose gun capable of both direct strikes and indirect support, designed to be carried and operated by a single Tactical Surface Fighter. Highly effective against large-scale and tank-class vehicles."
 
 EQ_MOD_SLOT_MVLV_TSF_left_hand_slot_TITLE: "Left Hand Weapon"
 EQ_MOD_SLOT_MVLV_TSF_left_hand_slot_TITLE_desc: "Left Hand Weapon Slot (explanation)"
 EQ_MOD_CAT_MVLV_TSF_add_wepon_type_TITLE: "Additional Assault Cannon"
 EQ_MOD_CAT_MVLV_TSF_add_wepon_type_TITLE_desc: "Additional Assault Cannon Type (explanation)"
 MVLV_TSF_add_basic_assault_cannon: "§OEarly§! Assault Cannon"
 MVLV_TSF_add_basic_assault_cannon_desc: "An early assault rifle. It lacks both ammunition and gunpowder capacity, leaving it lacking in many areas when taking on larger targets, but it is highly productive."
 MVLV_TSF_add_assault_cannon_1: "§YBasic§! Assault Cannon"
 MVLV_TSF_add_assault_cannon_1_desc: "A basic assault rifle. It has a conventional design that combines a 120mm cannon and a 36mm chain gun, and has some performance potential."
 MVLV_TSF_add_assault_cannon_2: "§CImproved§! Assault Cannon"
 MVLV_TSF_add_assault_cannon_2_desc: "An improved assault rifle. Improved reliability and ammunition have made it more effective against the BETA."
 MVLV_TSF_add_assault_cannon_3: "§GAdvanced§! Assault Cannon"
 MVLV_TSF_add_assault_cannon_3_desc: "A more advanced assault rifle, with improvements such as the incorporation of a laser range finder that transmits information to the FCS of Tactical Surface Fighter."
 
 EQ_MOD_CAT_MVLV_TSF_shield_type_TITLE: "Shield"
 EQ_MOD_CAT_MVLV_TSF_shield_type_TITLE_desc: "Shield Type (explanation)"
 MVLV_TSF_shield: "Shield"
 MVLV_TSF_shield_desc: "A shield coated with a light-resistant coating, which can improve survivability at the cost of reduced mobility."
 MVLV_TSF_reactive_shield: "Reactive Shield"
 MVLV_TSF_reactive_shield_desc: "A shield equipped with explosive reactive armor. It is highly destructive against small species that cling to you."
 
 EQ_MOD_CAT_MVLV_TSF_sword_type_TITLE: "Close Combat Long Sword"
 EQ_MOD_CAT_MVLV_TSF_sword_type_TITLE_desc: "Close Combat Long Sword Type (explanation)"
 MVLV_TSF_long_sword: "Close Combat Long Sword"
 MVLV_TSF_long_sword_desc: "A long sword that treats the entire aircraft as a single sword. Not only does it improve aerodynamic characteristics, it also boasts ease of handling."
 MVLV_TSF_heavy_sword: "Heavy Long Sword"
 MVLV_TSF_heavy_sword_desc: "A long sword that emphasizes striking power through the kinetic energy of its pure weight. It has excellent destructive power, but is difficult to handle."
 
 EQ_MOD_SLOT_MVLV_TSF_head_slot_TITLE: " Head Slot"
 EQ_MOD_SLOT_MVLV_TSF_head_slot_TITLE_desc: "Head Slot (explanation)"
 EQ_MOD_CAT_MVLV_TSF_add_sensor_type_TITLE: "Additional Sensors"
 EQ_MOD_CAT_MVLV_TSF_add_sensor_type_TITLE_desc: "Additional Sensors Type (explanation)"
 MVLV_TSF_basic_sensor_system: "§OEarly§! Additional Sensors"
 MVLV_TSF_basic_sensor_system_desc: "Adds an early-type sensor. Its detection capabilities are not very high, but it is useful as a secondary tool."
 MVLV_TSF_add_sensor_1: "§YBasic§! Additional Sensors"
 MVLV_TSF_add_sensor_1_desc: "Add a basic sensor. Ground radar will be installed to detect the presence of BETA groups."
 MVLV_TSF_add_sensor_2: "§CImproved§! Additional Sensors"
 MVLV_TSF_add_sensor_2_desc: "Adding improved sensors, integrating with a laser ranging system to determine the distance to the BETA forces."
 MVLV_TSF_add_sensor_3: "§GAdvanced§! Additional Sensors"
 MVLV_TSF_add_sensor_3_desc: "Add advanced sensors. By introducing optical sensors, it will be possible to ascertain the composition of the BETA group."
 MVLV_TSF_add_armored_sensor: "Armored Sensors"
 MVLV_TSF_add_armored_sensor_desc: "Additional armored sensors based on improved sensors provide both situational awareness and protection."

 EQ_MOD_CAT_MVLV_TSF_add_armor_type_TITLE: "Additional Armor Module"
 EQ_MOD_CAT_MVLV_TSF_add_armor_type_TITLE_desc: "Additional Armor Module Type (explanation)"
 MVLV_TSF_add_armor: "Additional Armor"
 MVLV_TSF_add_armor_desc: "Simply adding armor. This increases the rigidity of the entire aircraft, but increases production costs."
 MVLV_TSF_add_blade_armor: "Blade Edge Armor"
 MVLV_TSF_add_blade_armor_desc: "Adds blade edge armor, which becomes an offensive tool in close combat and increases attack power."
 MVLV_TSF_add_aerial_blade_armor: "Aerial Blade Edge Armor"
 MVLV_TSF_add_aerial_blade_armor_desc: "Adds aerial blade armor, which emphasizes aerodynamic properties and improves both maneuverability and attack power."
 MVLV_TSF_add_special_blade_armor: "Special Blade Edge Armor"
 MVLV_TSF_add_special_blade_armor_desc: "Adds super carbon blade edge armor. Production costs will increase, but performance will improve dramatically."
 
 EQ_MOD_SLOT_MVLV_TSF_shoulder_slot_TITLE: "Shoulder Slot"
 EQ_MOD_SLOT_MVLV_TSF_shoulder_slot_TITLE_desc: "Shoulder Slot (explanation)"
 EQ_MOD_CAT_MVLV_TSF_add_thruster_type_TITLE: "Additional Thrusters"
 EQ_MOD_CAT_MVLV_TSF_add_thruster_type_TITLE_desc: "Additional Thrusters Type (explanation)"
 MVLV_TSF_add_thruster_1: "§YBasic§! Additional Thruster"
 MVLV_TSF_add_thruster_1_desc: "Adding a basic thruster will improve the maneuverability of the entire aircraft."
 MVLV_TSF_add_thruster_2: "§CImproved§! Additional Thruster"
 MVLV_TSF_add_thruster_2_desc: "Improved thrusters are added. This model has improved explosive power, allowing for even greater maneuverability."
 MVLV_TSF_add_thruster_3: "§GAdvanced§! Additional Thruster"
 MVLV_TSF_add_thruster_3_desc: "Add advanced thrusters to this model, which allows for rapid vector changes and maximizes maneuverability."
 
 EQ_MOD_CAT_MVLV_TSF_add_missile_type_TITLE: "Additional Missiles"
 EQ_MOD_CAT_MVLV_TSF_add_missile_type_TITLE_desc: "Additional Missiles Type (explanation)"
 MVLV_TSF_large_missile_1: "§YBasic§! Large missile"
 MVLV_TSF_large_missile_1_desc: "Adds a frame for cruise missiles. It is highly effective against BETA groups, but it places a heavy burden on mobility and various equipment."
 MVLV_TSF_large_missile_2: "AIM-54 Phoenix"
 MVLV_TSF_large_missile_2_desc: "A reinforced frame for launching cruise missiles. The performance of the missiles themselves has been improved, making them highly effective against small species."
 MVLV_TSF_small_missile: "General Small Missile"
 MVLV_TSF_small_missile_desc: "A missile launch frame that can be easily equipped to various Tactical Surface Fighter with simple modifications. It exerts high firepower when suppressing an area, but its maneuverability is reduced."
 
 EQ_MOD_CAT_MVLV_TSF_add_supplies_type_TITLE: "Additional Supplies"
 EQ_MOD_CAT_MVLV_TSF_add_supplies_type_TITLE_desc: "Additional Supplies Type (explanation)"
 MVLV_TSF_supplie_armor: "Additional Supply Armor"
 MVLV_TSF_supplie_armor_desc: "An armored block housing ammunition and propellant, facilitating long-term operations while increasing survivability."
 
 EQ_MOD_SLOT_MVLV_TSF_leftBackArm_slot_TITLE: "Left Rear Stretcher System"
 EQ_MOD_SLOT_MVLV_TSF_leftBackArm_slot_TITLE_desc: "Left Rear Stretcher System Slot (explanation)"
 EQ_MOD_SLOT_MVLV_TSF_rigtBackArm_slot_TITLE: "Right Rear Stretcher System"
 EQ_MOD_SLOT_MVLV_TSF_rigtBackArm_slot_TITLE_desc: "Right Rear Stretcher System Slot (explanation)"
 EQ_MOD_CAT_MVLV_TSF_add_back_thruster_type_TITLE: "Additional Rear Thruster"
 EQ_MOD_CAT_MVLV_TSF_add_back_thruster_type_TITLE_desc: "Additional Rear Thruster Type (explanation)"
 MVLV_TSF_add_back_thruster: "§YBasic§! Additional Rear Thruster"
 MVLV_TSF_add_back_thruster_desc: "The weapon mounting section is replaced with thrusters. This is expected to improve maneuverability, but it will sacrifice both rear slots."
 
 EQ_MOD_CAT_MVLV_TSF_add_back_supplies_type_TITLE: "Back Carry Supplies"
 EQ_MOD_CAT_MVLV_TSF_add_back_supplies_type_TITLE_desc: "Back Carry Supplies Type (explanation)"
 MVLV_TSF_drop_tank: "Back Carry Supplies"
 MVLV_TSF_drop_tank_desc: "Part of the weapon mounting section will be converted to accommodate supplies, allowing it to store anything from missiles, ammunition, and propellant, making it useful in long-term battles."
 
 EQ_MOD_SLOT_MVLV_TSF_arm_slot_TITLE: "Arm Slot"
 EQ_MOD_SLOT_MVLV_TSF_arm_slot_TITLE_desc: "Arm Slot (explanation)"
 EQ_MOD_CAT_MVLV_TSF_sub_weapon_type_TITLE: "Additional Arm Armament"
 EQ_MOD_CAT_MVLV_TSF_sub_weapon_type_TITLE_desc: "Additional Arm Armament Type (explanation)"
 MVLV_TSF_chain_sword: "Electric blade"
 MVLV_TSF_chain_sword_desc: "Adds an electric blade, which is highly destructive in close combat but reduces maneuverability and reliability."
 MVLV_TSF_sub_sword: "Sub Storaged Sword"
 MVLV_TSF_sub_sword_desc: "Adds a retractable melee blade, which proves its worth in close-quarters combat as a fixed weapon."
 
 EQ_MOD_SLOT_MVLV_TSF_leg_slot_TITLE: "Leg Slot"
 EQ_MOD_SLOT_MVLV_TSF_leg_slot_TITLE_desc: "Leg Slot (explanation)"
 
 EQ_MOD_SLOT_MVLV_TSF_waist_slot_TITLE: "Waist Slot"
 EQ_MOD_SLOT_MVLV_TSF_waist_slot_TITLE_desc: "Waist Slot (explanation)"
 EQ_MOD_SLOT_MVLV_TSF_sp_slot_1_TITLE: "Other Modules Slot"
 EQ_MOD_SLOT_MVLV_TSF_sp_slot_1_TITLE_desc: " Other Modules Slot (explanation)"
 EQ_MOD_SLOT_MVLV_TSF_sp_slot_2_TITLE: " Other Modules Slot"
 EQ_MOD_SLOT_MVLV_TSF_sp_slot_2_TITLE_desc: " Other Modules Slot (explanation)"
 EQ_MOD_SLOT_MVLV_TSF_sp_slot_3_TITLE: " Other Modules Slot"
 EQ_MOD_SLOT_MVLV_TSF_sp_slot_3_TITLE_desc: " Other Modules Slot (explanation)"
 EQ_MOD_SLOT_MVLV_TSF_sp_slot_4_TITLE: " Other Modules Slot"
 EQ_MOD_SLOT_MVLV_TSF_sp_slot_4_TITLE_desc: " Other Modules Slot (explanation)"
 EQ_MOD_SLOT_MVLV_TSF_sp_slot_5_TITLE: " Other Modules Slot"
 EQ_MOD_SLOT_MVLV_TSF_sp_slot_5_TITLE_desc: " Other Modules Slot (explanation)"
 EQ_MOD_SLOT_MVLV_TSF_sp_slot_6_TITLE: " Other Modules Slot"
 EQ_MOD_SLOT_MVLV_TSF_sp_slot_6_TITLE_desc: " Other Modules Slot (explanation)"
 EQ_MOD_CAT_MVLV_TSF_sp_fcs_type_TITLE: "Fire Control System"
 EQ_MOD_CAT_MVLV_TSF_sp_fcs_type_TITLE_desc: "Fire Control System Type (explanation)"
 MVLV_TSF_fcs_1: "§YBasic§! FCS"
 MVLV_TSF_fcs_1_desc: "A basic fire control system that works in conjunction with sensors and the OS to select targets and perform efficient attacks."
 MVLV_TSF_fcs_2: "§CImproved§! FCS"
 MVLV_TSF_fcs_2_desc: "An improved fire control system, capable of simultaneous mechanical multi-target tracking, improving the efficiency of target selection."
 MVLV_TSF_fcs_3: "§GAdvanced§! FCS"
 MVLV_TSF_fcs_3_desc: "A more advanced fire control system. In addition to the sight stabilization system, it also features a digital zoom function, allowing for more efficient use of firepower."
 
 EQ_MOD_CAT_MVLV_TSF_sp_dataLink_type_TITLE: "Data Link System"
 EQ_MOD_CAT_MVLV_TSF_sp_dataLink_type_TITLE_desc: "Data Link System Type (explanation)"
 MVLV_TSF_deta_link_1: "§YBasic§! Data Link System"
 MVLV_TSF_deta_link_1_desc: "Basic data link system. Near-field data links receive information from nearby forces to aid in the decision-making process."
 MVLV_TSF_deta_link_2: "§CImproved§! Data Link System"
 MVLV_TSF_deta_link_2_desc: "Improved data link systems, integrating with theater data networks to further enhance situational awareness."
 MVLV_TSF_deta_link_3: "§GAdvanced§! Data Link System"
 MVLV_TSF_deta_link_3_desc: "A more advanced data link system. By integrating commands from a higher command system with information from the surrounding area, it even enables mutual cooperation."
 
 EQ_MOD_CAT_MVLV_TSF_sp_structure_type_TITLE: "TSF Structure"
 EQ_MOD_CAT_MVLV_TSF_sp_structure_type_TITLE_Desc: "TSF Structure Type (explanation)"
 MVLV_TSF_reinforced_structure_1: "§YBasic§! Reinforced Structural"
 MVLV_TSF_reinforced_structure_1_desc: "Introduce structural materials that improve the overall rigidity of the aircraft, improving various strength-related factors such as crashworthiness, but at the expense of production costs and reliability."
 MVLV_TSF_reinforced_structure_2: "§CImproved§! Reinforced Structural"
 MVLV_TSF_reinforced_structure_2_desc: "Improved reinforced structural material, which solves reliability issues and allows for greater rigidity, but at the cost of increased production costs."
 MVLV_TSF_reinforced_structure_3: "§GAdvanced§! Reinforced Structural"
 MVLV_TSF_reinforced_structure_3_desc: "An advanced version of reinforced structural materials. Although production costs have increased, survivability and durability have also increased."
 
 MVLV_TSF_special_structure_1: "§YBasic§! Special Structural"
 MVLV_TSF_special_structure_1_desc: "Introduce composite structural materials to reduce production costs. Simplify the overall structure, but sacrifice frame strength and reliability."
 MVLV_TSF_special_structure_2: "§CImproved§! Special Structural"
 MVLV_TSF_special_structure_2_desc: "An improved composite structure. Although the frame strength issue remains, it can improve reliability to some extent and further reduce costs."
 MVLV_TSF_special_structure_3: "§GAdvanced§! Special Structural"
 MVLV_TSF_special_structure_3_desc: "An advanced type of composite structural material. By integrating the entire structure and simplifying the production process, further cost reductions are possible."
 MVLV_TSF_special_structure_4: "§BFuture§! Special Structural"
 MVLV_TSF_special_structure_4_desc: "This revolutionizes the concept of conventional composite structural materials. By introducing G elements into the structural materials, the manufacturing costs of the aircraft frame are significantly reduced."
 
 EQ_MOD_CAT_MVLV_TSF_sp_shell_type_TITLE: "Special Ammunition Shells"
 EQ_MOD_CAT_MVLV_TSF_sp_shell_type_TITLE_desc: "Special Ammunition Shells Type (explanation)"
 MVLV_TSF_explosive_shell: "Explosive Shell"
 MVLV_TSF_explosive_shell_desc: "By increasing the explosive charge of the ammunition used, the attack power against soft targets is increased at the expense of penetration power. Reliability and cost are sacrificed for stable operation."
 MVLV_TSF_piercing_shell: "Piercing Shell"
 MVLV_TSF_piercing_shell_desc: "The ammunition used is a highly armor-piercing round, which sacrifices effectiveness against soft targets in exchange for increased attack power against larger targets, at the expense of reliability and cost due to barrel wear."
 
 EQ_MOD_CAT_MVLV_TSF_sp_sight_type_TITLE: "Dedicated Targeting Device"
 EQ_MOD_CAT_MVLV_TSF_sp_sight_type_TITLE_desc: "Dedicated Targeting Device Type (explanation)"
 MVLV_TSF_sniper_sight: "High Magnification Sight"
 MVLV_TSF_sniper_sight_desc: "The introduction of high magnification sights makes it easier to target weak spots on the target, at the expense of some situational awareness."
 MVLV_TSF_combat_sight: "Close Combat Sight"
 MVLV_TSF_combat_sight_desc: "The introduction of a Close combat sight increases situational awareness, at the expense of some targeting ability."
 
 EQ_MOD_CAT_MVLV_TSF_sp_vibration_sensor_type_TITLE: "Vibration Sensor"
 EQ_MOD_CAT_MVLV_TSF_sp_vibration_sensor_type_TITLE_desc: "Vibration Sensor Type (explanation)"
 MVLV_TSF_vibration_sensor_1: "§OEarly§! Vibration Sensor"
 MVLV_TSF_vibration_sensor_1_desc: "An early type vibration sensor capable of detecting BETA groups moving across the surface of the earth."
 MVLV_TSF_vibration_sensor_2: "§YBasic§! Vibration Sensor"
 MVLV_TSF_vibration_sensor_2_desc: "A basic vibration sensor that can detect large-scale BETA advances from the sounds of vibrations."
 MVLV_TSF_vibration_sensor_3: "§CImproved§! Vibration Sensor"
 MVLV_TSF_vibration_sensor_3_desc: "An improved vibration sensor that can determine the presence and size of BETA groups from vibration sounds."
 MVLV_TSF_vibration_sensor_4: "§GAdvanced§! Vibration Sensor"
 MVLV_TSF_vibration_sensor_4_desc: "An advanced vibration sensor that can determine the size of the BETA group and their estimated current location from the vibrations."
 
 EQ_MOD_SLOT_MVLV_TSF_convert_module_slot_TITLE: "Role Conversion Module Slot"
 EQ_MOD_SLOT_MVLV_TSF_convert_module_slot_TITLE_desc: "Role Conversion Module Slot (explanation)"
 EQ_MOD_CAT_MVLV_TSF_convert_module_type_TITLE: "Role Conversion Module"
 EQ_MOD_CAT_MVLV_TSF_convert_module_type_TITLE_desc: "Role Conversion Module Type (explanation)"
 MVLV_TSF_convert_module: "Support Tactical Surface Fighter Module"
 MVLV_TSF_convert_module_desc: "A module for operating this design as a support tactical surface fighter."
 
 EQ_MOD_CAT_MVLV_TSF_sp_maintenance_team_type_TITLE: "Maintenance and Capture Module"
 EQ_MOD_CAT_MVLV_TSF_sp_maintenance_team_type_TITLE_desc: "Maintenance and Capture Module Type (explanation)"
 MVLV_TSF_maintenance_team_1: "§YBasic§! Maintenance Team"
 MVLV_TSF_maintenance_team_1_desc: "Prepare a dedicated maintenance team for Tactical Surface Fighter. Although the cost will increase, maintenance will improve reliability."
 MVLV_TSF_maintenance_team_2: "§GExpert§! Maintenance Team"
 MVLV_TSF_maintenance_team_2_desc: "Providing specialized training for maintenance crews for Tactical Surface Fighter will increase costs further, but will also provide greater reliability."
 MVLV_TSF_maintenance_team_3: "§CFront§! Maintenance Team"
 MVLV_TSF_maintenance_team_3_desc: "Deploying front-line-trained, experienced maintenance teams to Tactical Surface Fighter improves reliability, but makes it difficult to maintain the rigidity of the entire aircraft."
 MVLV_TSF_capture_team: "§RBETA§! Captured Team"
 MVLV_TSF_capture_team_desc: "Various equipment for capturing BETA. Although the overall performance of the aircraft is sacrificed, Tactical Surface Fighter make it possible to obtain specimen samples of BETA."
 
 EQ_MOD_CAT_MVLV_TSF_sp_custom_module_type_TITLE: "Specialized Custom Modules"
 EQ_MOD_CAT_MVLV_TSF_sp_custom_module_type_TITLE_desc: "Specialized Custom Modules Type (explanation)"
 MVLV_TSF_cruise_custom: "Cruise Specialized custom"
 MVLV_TSF_cruise_custom_desc: "Cruise Specialized custom (explanation)"
 MVLV_TSF_super_cruise_custom: "Ultra Cruise Specialized Custom"
 MVLV_TSF_super_cruise_custom_desc: "Ultra Cruise Specialized Custom (explanation)"
 MVLV_TSF_limit_custom: "Limiter Custom"
 MVLV_TSF_limit_custom_desc: "Limiter Custom (explanation)"
 MVLV_TSF_hight_limit_custom: "High Limit Custom"
 MVLV_TSF_hight_limit_custom_desc: "High Limit Custom (explanation)"
 MVLV_TSF_combat_custom: "Close Combat Custom"
 MVLV_TSF_combat_custom_desc: "Close Combat Custom (explanation)"