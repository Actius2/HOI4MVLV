l_english:
 DOCTRINE_TRACK_INFANTRY_ARTY: "Infantry and Support Weapons"
 DOCTRINE_TRACK_INFANTRY_ARTY_DESC: "The people and support branches are the foundation that sustains everything."
 DOCTRINE_TRACK_ARMOR: "Armored Forces"
 DOCTRINE_TRACK_ARMOR_DESC: "The main force against BETA, the wall, and the firepower."
 DOCTRINE_TRACK_TSF: "Tactical Machines"
 DOCTRINE_TRACK_TSF_DESC: "Humanity's trump card, breaking through the front lines and leading to victory."
 
 GRAND_DOCTRINE_HIGH_LEVEL_WARFARE: "High-Level Warfare"
 GRAND_DOCTRINE_HIGH_LEVEL_WARFARE_DESC: "Conduct efficient operations through multifaceted firepower projection backed by abundant resources and military quality."
 GRAND_DOCTRINE_ALL_TSF: "ALL-TSF"
 GRAND_DOCTRINE_ALL_TSF_DESC: "Tactical Mobile Weapons form the core of our operations. Therefore, we conduct operations centered around them."
 GRAND_DOCTRINE_TRENCH_WARFARE: "Total War"
 GRAND_DOCTRINE_TRENCH_WARFARE_DESC: "People are resources. We will defend our homeland and expel the BETA with total force, sparing nothing."

 SUBDOCTRINE_BREAKWATER_OF_HUMANITY: "Humanity's Breakwater"
 SUBDOCTRINE_BREAKWATER_OF_HUMANITY_DESC: "People are shields, walls, firing points, and the foundation of all."
 SUBDOCTRINE_ARTILLERY_GODDESS: "Goddess of the Battlefield"
 SUBDOCTRINE_ARTILLERY_GODDESS_DESC: "Worship the cannon, praise the cannon, glorify the cannon. Overwhelming firepower is justice."
 SUBDOCTRINE_GENERAL_SUPPORT: "General Support"
 SUBDOCTRINE_GENERAL_SUPPORT_DESC: "Maximize the capabilities of main forces through extensive and abundant support."
 SUBDOCTRINE_THOROUGH_MAINTENANCE: "Thorough Maintenance"
 SUBDOCTRINE_THOROUGH_MAINTENANCE_DESC: "Prioritize maintenance units to ensure peak performance even in harsh environments."

 SUBDOCTRINE_MOBILE_DEFENCE: "Mobile Defense"
 SUBDOCTRINE_MOBILE_DEFENCE_DESC: "Leverage the mobility of armored forces to more efficiently support extensive defensive lines."
 SUBDOCTRINE_ATTRITION_STRATEGY: "Attrition Strategy"
 SUBDOCTRINE_ATTRITION_STRATEGY_DESC: "Regularly reduce enemy strength through localized offensives to secure defensive flexibility and depth."
 SUBDOCTRINE_HIGH_ROTATION: "High Rotation Operations"
 SUBDOCTRINE_HIGH_ROTATION_DESC: "Enhance the maintenance and resupply speed of armored forces to enable rapid return to the front lines."
 SUBDOCTRINE_ARMS_COOPERATION: "Arms Cooperation"
 SUBDOCTRINE_ARMS_COOPERATION_DESC: "Achieve more efficient armored operations through cooperation between different branches of the military."

 SUBDOCTRINE_SUPPORT_TSF_OPERATION: "Support Operations"
 SUBDOCTRINE_SUPPORT_TSF_OPERATION_DESC: "Valuable mobile suits should demonstrate their true value in support roles."
 SUBDOCTRINE_MOBILE_ASSAULT: "Mobile Assault"
 SUBDOCTRINE_MOBILE_ASSAULT_DESC: "Efficiently annihilate BETA through decoys, bluffs, and mobile operations."
 SUBDOCTRINE_CLOSE_QUARTERS_COMBAT: "Close Quarters Combat"
 SUBDOCTRINE_CLOSE_QUARTERS_COMBAT_DESC: "Close combat is most suited for Hive warfare, achieving maximum results with minimal ammunition."
 SUBDOCTRINE_LASER_JAGD_TACTICS: "Anti-Laser Warfare"
 SUBDOCTRINE_LASER_JAGD_TACTICS_DESC: "Establish training guidelines to mitigate damage from humanity's greatest enemy, Laser-class threats, and enhance mopping-up capabilities."

 SUBDOCTRINE_ABSOLUTE_DEFENSE_LINE: "Hold the Line"
 SUBDOCTRINE_ABSOLUTE_DEFENSE_LINE_DESC: "We are not permitted to retreat; we must defend at the cost of our lives."
 SUBDOCTRINE_FLEXIBLE_OPERATION: "Flexible Operations"
 SUBDOCTRINE_FLEXIBLE_OPERATION_DESC: "Conduct flexible operations with ample margin to minimize casualties and maximize combat effectiveness."
 SUBDOCTRINE_THOROUGH_GUIDANCE: "Thorough Guidance"
 SUBDOCTRINE_THOROUGH_GUIDANCE_DESC: "Through thorough operational guidance, we forge a resilient force."
 SUBDOCTRINE_COMPREHENSIVE_SUPPORT: "Comprehensive Support"
 SUBDOCTRINE_COMPREHENSIVE_SUPPORT_DESC: "The true battlefield extends beyond the front lines. We fulfill our role."