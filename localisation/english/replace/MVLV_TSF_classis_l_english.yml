 tank_designer_artillery: "Support Tactical Surface Fighter"
 MVLV_TSF_chassis: "Tactical Surface Fighter"
 MVLV_TSF_chassis_desc: "Anti-BETA Strategic Arms"
 MVLV_TSF_support_chassis: "Support Tactical Surface Fighter"
 MVLV_TSF_support_chassis_desc: "Anti-BETA Strategic Arms"
 tank_designer_MVLV_TSF_chassis: "Tactical Surface Fighter"
 tank_designer_MVLV_TSF_support_chassis: "Support Tactical Surface Fighter"
 
 MVLV_TSF_chassis_0: "Early Prototype Tactical Surface Fighter"
 MVLV_TSF_chassis_0_desc: "It was created by the NCAF-X Project, a development plan for a new concept weapon capable of operating on Earth based on the large Extravehicular Mobility Unit (MMU) used in the Lunar War, or a platform to demonstrate the domestic production capability of a similar Tactical Surface Fighter. Although it has the minimum capabilities as a Tactical Surface Fighter, it is almost impossible to actually use it in combat with the BETA. It is an experimental entity, and it will be necessary to wait for the completion of the first generation Tactical Surface Fighter before it can be used in actual combat."
 MVLV_TSF_chassis_1_light: "1st Gen Light Tactical Surface Fighter"
 MVLV_TSF_chassis_1_light_desc: "The first generation light Tactical Surface Fighter in this classification refers to the F-5 Freedom Fighter developed by the US company Northrock and its various derivatives. Designed as a highly manufacturable Tactical Surface Fighter, this frame and its various derivatives made a significant contribution to the deployment of Tactical Surface Fighter by humanity in the early stages of the BETA War. Its lightness was particularly highly praised on the European front, where it was used for long periods with on-site modifications, and this frame system has been used to realize many low-cost Tactical Surface Fighter."
 MVLV_TSF_chassis_1_light_mod: "1st Gen Improved Light Tactical Surface Fighter"
 MVLV_TSF_chassis_1_light_mod_desc: "An improved and expanded version of the first generation light Tactical Surface Fighter that was used primarily by the European Union."
 MVLV_TSF_chassis_1_heavy: "1st Gen Heavy Tactical Surface Fighter"
 MVLV_TSF_chassis_1_heavy_desc: "In this classification, the first generation heavy Tactical Surface Fighter refers to the F-4, the first Tactical Surface Fighter in human history, developed jointly by the U.S. Army, Navy, Air Force, and Space Forces, and its various derivatives. The frame and aircraft structure of the F-4, developed as the first Tactical Surface Fighter in human history, were designed to be easily expandable and renovable, as their immaturity was anticipated. As shown by the operation of derivatives in Africa and the operational track record in Japan, this frame system is an older generation type, but it has high expandability and low cost."
 MVLV_TSF_chassis_2_light: "2nd Gen Light Tactical Surface Fighter"
 MVLV_TSF_chassis_2_light_desc: "The second generation light Tactical Surface Fighter in this classification refers to second generation aircraft that are designed to improve the maneuverability that was an issue with first generation Tactical Surface Fighter, especially the successors of the F-5 and its derivatives, and those that place emphasis on productivity. This frame system, which was the basis for lightweight and excellent aircraft designs, has excellent cost performance, including the best-selling aircraft in frontline countries such as the F-16 and MiG-29, which were designed in the hope of compensating for the low mass production that was pointed out in Tactical Surface Fighter such as the F-15 and F-14."
 MVLV_TSF_chassis_2_heavy: "2nd Gen Heavy Tactical Surface Fighter"
 MVLV_TSF_chassis_2_heavy_desc: "In this classification, second-generation heavy Tactical Surface Fighter refers to second-generation aircraft that focus on improving maneuverability, which was a problem in first-generation aircraft, especially successors to the F-4 and its derivatives, and those that place emphasis on improving aircraft performance and expanding payload. Small and light Tactical Surface Fighter such as the F-16 and MiG-29 have limitations on future performance improvements, but this frame system is excellent in terms of long-term expandability and overall rigidity of the aircraft, as seen in the existence of the F-15, designed as a successor to the F-4, and the F-15ACTV, which was strengthened to quasi-third generation equivalent as a modified version of the F-15."
 MVLV_TSF_chassis_2_maneuver: "2nd Gen Maneuverable Tactical Surface Fighter"
 MVLV_TSF_chassis_2_maneuver_desc: "In this classification, the second generation high mobility Tactical Surface Fighter refers to Tactical Surface Fighter such as Japan's Type 94 and the Soviet Union's Su-37, which were designed and manufactured in the later stages of second generation aircraft development, and which place particular emphasis on dogfighting performance and are different from the traditional American Tactical Surface Fighter system. These high mobility Tactical Surface Fighter, designed even at the expense of scalability, incorporate various modifications and basic performance improvements in anticipation of close-quarters dogfighting and close-quarters combat, and some are strengthened to the point that they are comparable to third generation aircraft. In addition to maneuverability, this frame system boasts outstanding ability to deal with large species."
 MVLV_TSF_chassis_3_light: "3rd Gen Light Tactical Surface Fighter"
 MVLV_TSF_chassis_3_light_desc: "In this classification, third-generation light Tactical Surface Fighter refers to Tactical Surface Fighter that inherit the low-cost and light-weight characteristics of the second generation and aim to further improve performance. As exemplified by the development of the F-35 in the United States and the MiG-35 in the Soviet Union, the cost has been reduced while maintaining high basic specifications and multi-mission capabilities. Although there has not been much growth in terms of expandability, this frame system still has high performance as a new-generation Tactical Surface Fighter based on sufficient cost performance."
 MVLV_TSF_chassis_3_heavy: "3rd Gen Heavy Tactical Surface Fighter"
 MVLV_TSF_chassis_3_heavy_desc: "In this classification, third-generation heavy Tactical Surface Fighter refers to Tactical Surface Fighter that inherit the high expandability and high durability characteristics of the second generation while aiming for further performance improvement. Led by the F-22 designed in conjunction with the ATSF program in the United States, expandability has been further improved to allow the addition of further parts to achieve higher performance than the previous generation type. Although the improvement in basic specifications itself is not so noticeable compared to the cost, this frame system can meet the demands of new-generation Tactical Surface Fighter that are moving towards higher performance."
 MVLV_TSF_chassis_3_maneuver: "3rd Gen Maneuverable Tactical Surface Fighter"
 MVLV_TSF_chassis_3_maneuver_desc: "In this classification, the third generation high mobility Tactical Surface Fighter refers to Tactical Surface Fighter that are particularly focused on close combat performance among the third generation aircraft. Following the lineage of high performance that is often seen in those designed and manufactured just before the standard for third generation aircraft was established, it is characterized by high mobility and enhanced anti-large species annihilation capabilities, as typified by the Su-47, which is designed by incorporating carbon blades into the details of the aircraft. This frame system boasts even higher mobility and countermeasure capabilities against large species than the previous generation aircraft."
 MVLV_TSF_chassis_4: "4th Gen Tactical Surface Fighter"
 MVLV_TSF_chassis_4_desc: "The fourth generation Tactical Surface Fighter has an expanded operational range from 1G to 0G environments, and is equipped with specially developed long swords and assault guns, as well as an additional booster unit equipped with a portable charged particle cannon for operations in 0G space. It has performance worthy of a new era of Tactical Surface Fighter that completely rewrites the basics of previous Tactical Surface Fighter."
 
