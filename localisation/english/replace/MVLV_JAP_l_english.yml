 JAP_puppet_shogun_desc: "The current Generalissimo has almost no political power, but there are many who are not happy with his status as a puppet of the government."
 JAP_konoe: "Imperial Japanese Guard"
 JAP_konoe_desc: "The Imperial Guard is a military organization under the direct control of the Imperial Ministry, and is known for using flashy Tactical Surface Fighter. It boosts the morale of soldiers on the battlefield and contributes to the defense of Japan. However, procuring equipment separately from the Imperial Army places a strain on factories."
 JAP_puppet_shogun_2: "Puppet General"
 JAP_puppet_shogun_2_desc: "The current Generalissimo has almost no political power, but there are many who are not happy with his status as a puppet of the government."
 JAP_shogun: "Shogun"
 JAP_shogun_desc: "With the Cabinet relinquishing his authority, the Shogun has regained his rightful authority. The Shogun is now universally recognized as the symbol of all the people of the Empire."
 JAP_killed_shougun: "Death of Koubuin Yuuhi"
 JAP_killed_shougun_desc: "The death of His Highness the former general is the greatest tragedy for the people of the Empire. The country is in turmoil and it will take a long time to regain control."
