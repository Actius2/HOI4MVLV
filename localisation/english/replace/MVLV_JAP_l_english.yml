 JAP_xfj_project: "XFJ Project"
 JAP_xfj_project_desc: "Japan's Tactical Surface Fighter development has reached a dead end. Although the Shiranui has sufficient performance as a third-generation Tactical Surface Fighter, it lacks scalability and is not an aircraft that can be expected to develop in the future. It is obvious that it will rapidly become obsolete if it continues like this. In response to this, Boeing proposed a joint development plan."
