 mvlv_jap.6.t: "Operation Ko 21"
 mvlv_jap.6.d: "We will attack the Sado Island Hive together with the UN forces. It has been two years since we lost the island. The long-awaited day has finally come! All the soldiers of the Imperial Army and the S-Guard will unite and attack!"
 mvlv_jap.6.a: "The bombardment begins!"
 mvlv_jap.1.t: "Shiranui Phase 2"
 mvlv_jap.1.d: "Today, the prototype of the Shiranui Phase 2, which was under development at the Yukon Base, was completed. It is a complex machine that includes various political and economic factors, but with the work of excellent development engineers, we can expect it to be further strengthened."
 mvlv_jap.1.a: "I want to see the finished product soon."
 mvlv_jap.2.t: "XFJ Project"
 mvlv_jap.2.d: "In order to move forward with the XFJ project, it is necessary for the Empire to send in personnel, and the person selected for the important role of leading the effort at the Yukon base is a newly appointed Sergeant who was commissioned only last year.(Yui Takamura is temporarily transferred to the Yukon Base, but returns after a series of events.)"
 mvlv_jap.2.a: "Good Luck"
 mvlv_jap.3.t: "Mission complete"
 mvlv_jap.3.d: "Although there were various incidents at the Yukon base, the XFJ project itself has progressed smoothly, and it has been reported that it has finally been completed. With this, the personnel dispatched to the base will return to Japan and work hard towards mass production of the Shiranui Phase 2."
 mvlv_jap.3.a: "well done!"
 mvlv_jap.4.t: "BETA groups land on Sado Island"
 mvlv_jap.4.d: "BETA groups from the Sado Island Hive have landed in Niigata. They must be eliminated immediately."
 mvlv_jap.4.a: "I wish the defense forces the best of luck."
 mvlv_jap.5.t: "Underground Invasion of the Sado Island Hive"
 mvlv_jap.5.d: "The BETA swarm from the Sado Island Hive has invaded underground and landed! We must not allow them to breach the absolute defense of the Imperial Capital!"
 mvlv_jap.5.a: "Hurry up and send in reinforcements!"

 mvlv_jap.7.t: "Operation Myojo"
 mvlv_jap.7.d: "We have done everything we can to prepare for this day, now is the time to fight back!"
 mvlv_jap.7.a: "The counterattack begins!"
 
 mvlv_jap.8.t: "Kyoto Restoration"
 mvlv_jap.8.d: "We have succeeded in rebuilding the capital after recapturing it!\nThe morale of the people will also rise."
 mvlv_jap.8.a: "Congratulations"
 
 
 mvlv_jap.9.t: "Top secret technology agreement"
 mvlv_jap.9.d: "Behind the scenes of the mutual aid agreement with Japan, negotiations were held regarding a technology exchange. The plan was to exchange the latest Tactical Surface Fighter with each other. Some in the government are concerned about the leakage of top-secret technology, but conversely, it is also an opportunity. Opponents will not remain silent, but what should be done..."
 mvlv_jap.9.a: "Let's accept the agreement"
 mvlv_jap.9.b: "Reject"
 
 mvlv_jap.10.t: "Negotiations fail"
 mvlv_jap.10.d: "Unfortunately, perhaps due to factional strife within the Soviet government, the negotiations ended in failure."
 mvlv_jap.10.a: "It's a shame"
 
 mvlv_jap.11.t: "Negotiations successful"
 mvlv_jap.11.d: "The secret negotiations were a success. However, it seems that information was leaked from somewhere, and voices of dissatisfaction are rising within the country. However, this is a trivial matter compared to the goal of eliminating the BETA."
 mvlv_jap.11.a: "The first step towards friendship between Japan and the Soviet Union"
 
 mvlv_jap.12.t: "G-bomb dropped on Yokohama"
 mvlv_jap.12.d: "It seems that a counterattack operation called Operation Myojo has begun in Japan, but it is not going well. It has been revealed that the underground stem structure of the Yokohama Hive is much larger than expected. Any further damage is pointless. The parliament has approved the use of G-shells. Japan has been notified. However, a request to cancel has been received from Japan. What should we do...?"
 mvlv_jap.12.a: "We need to drop G-bomb immediately!"
 mvlv_jap.12.b: "No, you should hold on."
 
 mvlv_jap.13.t: "G-bomb drop operation canceled"
 mvlv_jap.13.d: "The operation to drop G-bombs in the United States has been called off. This operation would have involved many of our troops, and it appears that the desperate efforts of our diplomats led to its cancellation."
 mvlv_jap.13.a: "It seems like it worked out"
 
 mvlv_jap.14.t: "Support from Japan"
 mvlv_jap.14.d: "It seems that a plan has been approved to allocate part of the production from factories evacuated and relocated to Greater East Asia in Japan."
 mvlv_jap.14.a: "I'll gladly accept it"
 mvlv_jap.14.b: "No, I'll figure it out in my own country."
 
 mvlv_jap.15.t: "Replying to the Greater East Asia"
 mvlv_jap.15.d: "The aid plan proposed to Greater East Asia has been approved! \nThis has further strengthened the friendship between our two countries!"
 mvlv_jap.15.d2: "Unfortunately, this support plan was rejected. I'm sure they have their own reasons..."
 mvlv_jap.15.a: "Good results"
 mvlv_jap.15.b: "It's a shame"
 
 mvlv_jap.16.t: "Dispatch of exchange delegations from Japan"
 mvlv_jap.16.d: "It seems that a diplomatic delegation will be sent from Japan as a military exchange.\nIn addition, it seems that officer cadets from the Guards Training School will also be included as part of an inspection training program.\nThe exchange is scheduled to last about six months."
 mvlv_jap.16.a: "I'll gladly accept it"
 mvlv_jap.16.b: "I don't have that luxury."
 
 mvlv_jap.17.t: "European Exchange Response"
 mvlv_jap.17.d: "The exchange plan has been approved! This will further deepen the friendship between our two countries!"
 mvlv_jap.17.d2: "Unfortunately, this plan was rejected. I'm sure they had their reasons for doing so..."
 mvlv_jap.17.a: "Good results"
 mvlv_jap.17.b: "It's a shame"
 
 mvlv_jap.18.t: "Homecoming"
 mvlv_jap.18.d: "The entire schedule of military exchanges and training visits has been completed. This event must have been a very good experience for both sides."
 mvlv_jap.18.a: "My friend, we'll meet again"
 
 mvlv_jap.19.t: "Homecoming"
 mvlv_jap.19.d: "The exchange group that was sent to Europe returned home today. \nThis event must have been very meaningful for us."
 mvlv_jap.19.a: "I came back alive and well"
 
 mvlv_jap.20.t: "Japan-EU Technology Agreement"
 mvlv_jap.20.d: "Following the Japanese diplomatic mission, I was offered an exchange of technical officers. It would be a good chance to confirm the difference between Japanese and European Tactical Surface Fighter, but I don't know what to do..."
 mvlv_jap.20.a: "Accepting technology exchange"
 mvlv_jap.20.b: "No, I can't give you classified information."
 
 mvlv_jap.21.t: "Consequences of the EU-Japan Agreement"
 mvlv_jap.21.d: "It seems to have produced good results."
 mvlv_jap.21.d2: "Unfortunately, it seems that it didn't work."
 mvlv_jap.21.a: "wonderful"
 mvlv_jap.21.a: "It's a shame"
 
 mvlv_jap.22.t: "Surprise attack in Izumo"
 mvlv_jap.22.d: "During the operation to recapture Izumo, the HQ in the rear was abruptly attacked and destroyed. On this occasion, Kyoko Takatsukasa acted as rear guard to allow the isolated and helpless Imperial forces to escape, but several fortress-class forces appeared and despite her valiant efforts, she was killed in battle."
 mvlv_jap.22.a: "A moment of silence for heroes"
 
 
