 JAP_haishui: "Do-or-Die"
 JAP_haishui_desc: "This is it. The enemy is at the gates. Should we fall here, Japan falls with us. No matter what, we shall not fail!"
 JAP_MS_plan: "Operation Myojo"
 JAP_MS_plan_desc: "Everything rides on this. The battle to take back our homeland begins now!"
 JAP_MS_plan_ai: "Operation Myojo"
 JAP_MS_plan_ai_desc: "Everything rides on this. The battle to take back our homeland begins now!"
 JAP_idea_architecture_1: "Skilled Civil Engineer"
 JAP_idea_architecture_1_desc: "The BETA invasion has left much of the mainland in ruins. We must direct all available skilled labor to repair our civil and military supply networks."
 JAP_idea_architecture_2: "Skilled Civil Engineer"
 JAP_idea_architecture_2_desc: "We are redirecting engineers to more efficiently construct factories for war material."
 JAP_idea_makeshift_capital: "Relocated Government"
 JAP_idea_makeshift_capital_desc: "After the destruction of Kyoto, the capital was relocated to Tokyo. This has caused a disturbance in government, and as the BETA advance, the populace begins to panic. The construction of the Yokohama Hive only serves to exacerbate this."
