l_english:
 mvlv_difficulty: "Difficulty"
 mvlv_difficulty_easy: "Difficulty : Easy"
 mvlv_difficulty_easy_desc: "BETA are strong. May you be protected as you fight alone."
 mvlv_difficulty_normal: "Difficulty : Normal"
 mvlv_difficulty_normal_desc: "Aid is scarce. The fate of humanity depends on your strategy."
 mvlv_difficulty_hard: "Difficulty : Hard"
 mvlv_difficulty_hard_desc: "The humans of this world are weak, but with skilled commanders they can survive."
 mvlv_difficulty_unlimited: "Difficulty : Hell"
 mvlv_difficulty_unlimited_desc: "Overcome friction and eliminate the BETA"
 mvlv_difficulty_ai: "Difficulty : AI"
 mvlv_difficulty_ai_desc: "They are AI, which means they are much weaker than you. The world has decided to show them mercy."
 mvlv_difficulty_beta: "Difficulty : BETA"
 mvlv_difficulty_beta_desc: "They have come. Their force knows no bounds, consuming us with their hideous appearance and brutal strength."

 beta_resource: "BETA Resources"
 beta_resource_desc: "The BETA's production capacity is seemingly limitless, but the materials they use are shrouded in mystery."
 beta_speed_up_production: "BETA's Sense of Danger"
 beta_speed_up_production_desc: "Having provoked the BETA too much, early replenishment of forces was carried out."

