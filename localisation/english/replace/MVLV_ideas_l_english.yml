 hive_phase_9: "Phase 9"
 hive_phase_9_desc: "Hive Size"
 hive_recently_phaseUp: "Hive's remarkable growth"
 hive_recently_phaseUp_desc: "This Hive has grown in size recently, and will not be reinforced anytime soon... for several months, at least."
 hive_thinning_state: "Thinning Hive"
 hive_thinning_state_desc: "Due to the thinning operations carried out, this hive is now producing only small numbers of BETA.\n\nThis is the best result your soldiers have ever achieved."

 mvlv_aggressive_beta: "Large-scale invasion"
 mvlv_aggressive_beta_desc: "The BETA hive, whose population has reached saturation, is marching forward in search of new territories to rule. It is impossible to stop their momentum."
 mvlv_aggressive_beta2: "Small-scale invasion"
 mvlv_aggressive_beta2_desc: "Periodically, the BETA marches out to new territories. Their momentum cannot be stopped."
 mvlv_defence_human: "Defense in Depth"
 mvlv_defence_human_desc: "Implement defense in depth tactics in response to a large-scale BETA invasion"
 mvlv_standby_sado: "Stagnation"
 mvlv_standby_sado_desc: "They are waiting for something"
 mvlv_nuclear_winter: "Nuclear Winter"
 mvlv_nuclear_winter_desc: "Since the early days of the BETA War, humanity has used nuclear weapons extensively to ward off BETA invasions. As a result, the Earth is in a chronic nuclear winter, affecting everything from crop growth to people's lives and military operations."

 mvlv_prominence_problem: "Project Prominence"
 mvlv_prominence_problem_desc: "Project Prominence is a United Nations-led tactical aircraft development program aimed at accelerating the development of tactical aircraft by involving multiple nations in research and development at the same base. It is being carried out at the United Nations Yukon Air Base."
 mvlv_saast: "Americas Security & Cooperation Treaty"
 mvlv_saast_desc: "This treaty, also known as the SAAST Treaty, was concluded because the United States felt that there was no need for troops to fight the BETA in Latin America, which was a safe zone. This treaty greatly restricted the military armaments of Latin American countries, but in return they received economic aid from the United States."
 MVLV_S11: "Deploying S-11 SD-System"
 MVLV_S11_desc: "Take a few of the bastards with you..."

 MVLV_ouka_setting_idea: "Operation Ohka preparation order"
 MVLV_ouka_setting_idea_desc: "As the plan for attacking the A-type target became clear, the United Nations provided preparatory orders and assistance."
 MVLV_ouka_setting_idea2: "Emergency: Operation Ohka Preparation Order"
 MVLV_ouka_setting_idea2_desc: "There is no time to waste and we must devote all our efforts to preparing for this operation."
 MVLV_ouka_phase_1_idea: "Operation Ohka Phase 1"
 MVLV_ouka_phase_1_idea_desc: "Our nation's mission is to push forward the front line and to use offensive diversions and draw out the enemy."
 MVLV_ouka_phase_1_idea2: "Operation Ohka Phase 1"
 MVLV_ouka_phase_1_idea2_desc: "Our nation needs to prepare for the second phase while conducting diversionary measures on the front lines"

 MVLV_ouka_phase_2_idea: "Operation Ohka Phase 2"
 MVLV_ouka_phase_2_idea_desc: "Conduct an orbital descent into the gates of the original Hive and its surrounding areas to perform a diversion for the main force."
 MVLV_denial_of_delusion: "Denial of Delusions"
 MVLV_denial_of_delusion_desc: "Although capturing the Type A target is a long-cherished dream, it must be said that it is unrealistic under the current circumstances."
 MVLV_H00_idea: "A Target"
 MVLV_H00_idea_desc: "It seems he's there"

 mvlv_leased_land: "Leased Territory Economy"
 mvlv_leased_land_desc: "Many European countries have leased territories in Africa, which contribute greatly to the region's economy but are also unpopular with many Africans."
 mvlv_start_up: "Start-up Bonus"
 mvlv_start_up_desc: ""
 mvlv_united_nations: "United Nations"
 mvlv_parmanent: "Permanent Members"
 mvlv_parmanent_desc: "The permanent members, composed of the five major powers, Japan, and Australia, have a strong voice in the United Nations and can execute policies that are advantageous to their own countries in terms of UN military operations and material transportation."
 mvlv_un_member: "Member of the United Nations"
 mvlv_un_member_desc: "Although not a permanent member, it is a member country with a certain amount of influence."
 mvlv_license: "United Nations Industrial Support Organization"
 mvlv_license_desc: "Many UN member countries do not have the ability to develop anti-BETA weapons in their own countries. The United Nations supports such countries to lighten the burden when they license produce equipment from other countries."
 mvlv_altanative_0: "Alternative Plan"
 mvlv_altanative_0_desc: "The Alternative Plan began as a plan to efficiently establish communication methods with BETA and elucidate BETA's ecology, but over time it is becoming a plan aimed at human survival. Countries chosen as the leading countries of the Alternative Plan aim to achieve the goals of each plan while cooperating with the United Nations."
 mvlv_altanative_3: "Alternative III"
 mvlv_altanative_3_desc: "This country is a country that became the leading country of Alternative III. Therefore, it can receive some benefits from the results of the plan and the items under research. Alternative III was a plan to communicate with BETA using artificial ESP manifesters, and the Soviet Union is conducting research to militarily use artificial ESP manifesters, a by-product of the plan."
 mvlv_altanative_4: "Alternative IV"
 mvlv_altanative_4_desc: "This country is a country that became the leading country of Alternative IV. Therefore, it can receive some benefits from the results of the plan and the items under research. Alternative IV is a plan aimed at obtaining BETA information by leading BETA with 00 units, and the Japanese Empire is receiving preferential support from the UN forces in the expected hive capture battle due to the plan."
 mvlv_altanative_5: "Alternative V"
 mvlv_altanative_5_desc: "This country is a country that became the leading country of Alternative V. Therefore, it can receive some benefits from the results of the plan and the items under research. Alternative V is a plan aimed at human migration to extraterrestrial planets, and a large immigrant fleet is being built at the Lagrange point. Note that when executed, a hive capture operation that throws all remaining forces and drops G bombs on all hives existing on Earth will be carried out."
 mvlv_brokenhive: "Occupied Hive"
 mvlv_brokenhive_desc: "This hive has been captured by humans and is completely under control. From now on, BETA will not appear from this hive. Unless they take it back..."
 operation_ouka: "Operation Ouka"
 operation_ouka_desc: "The failure of this operation means the extinction of humanity. The last resistance of humanity began with nothing enough."

 BET_operation: "Original Hive"
 BET_operation_desc: "When a major disaster is imminent, a high-level activity order is issued immediately."
 BET_broken_original_hive: "Original Hive with Stopped Function"
 BET_end_game: "Tactical Action"
 BET_end_game_desc: "It's about time to end the fight, wipe out the disaster, and move on to tactical operations."
 BET_00_unit: "Preventive Measures for Major Disasters"
 BET_00_unit_desc: "Various information about large-scale disasters that can help reduce losses has been gathered."
 BET_human_kill: "Human Kill"
 BET_human_kill_desc: "Formulation of an initial stage of anti-personnel strategy based on the information received."

 MVLV_00_unit: "00 Unit"
 MVLV_00_unit_desc: "A mysterious girl equipped with a quantum superconducting brain."
 MVLV_ouka_after: "Aftermath of Operation Ouka"
 MVLV_ouka_after_desc: "Operation Ouka, the largest operation in human history, was a campaign that barely reached its launch due to the sudden deployment of all surplus supplies and stockpiled materials. Therefore, there is currently a severe shortage of supplies worldwide, and it is expected to take some time to recover."
 MVLV_bocchi: "A Lone Battle"
 MVLV_bocchi_desc: "The savior does not come... But the threat does not occur either..."
 MVLV_xmosg: "Payment Obligation"
 MVLV_xmosg_desc: "It is a reasonable price to pay for the expensive advanced OS, XM3."

