 mvlv_soa.1.t: "SAAST Destruction"
 mvlv_soa.1.d: "The board of directors publicly declared the termination of SAAST. This shocking announcement attracted attention from around the world. What will become of this alliance of nations that has been under the umbrella of the United States for decades?"
 mvlv_soa.1.a: "Protect us with our own power!"
 mvlv_soa.2.t: "SAAST Destruction"
 mvlv_soa.2.d: "The board of directors publicly declared the termination of SAAST. This shocking announcement attracted attention from around the world. What will become of this alliance of nations that has been under the umbrella of the United States for decades?"
 mvlv_soa.2.a: "I hope they don't end up regretting it."