 SOA_Unity: "Aboard Ship in Storm"
 SOA_Unity_desc: "The BETA have already expanded into the American continent, and the US commitment to national security has become a mere formality. In order to defend themselves, they need to forge a new alliance with Central America."
 SOA_RefugeeLabourers: "Refugee workers in Latin America"
 SOA_RefugeeLabourers_desc: "Refugees want protection, we want industrial labour."
 SOA_EmergencyMobilization: "Emergency Mobilization"
 SOA_EmergencyMobilization_desc: "With the BETA closing in, there was no time to hesitate and an emergency mobilization order was issued, allowing citizens and refugees alike to join the military."
 SOA_PurchaseRetiredTSF: "Purchase of Retired TSF"
 SOA_PurchaseRetiredTSF_desc: "Even if it's a retired Tactical Surface Fighter, it's still better than having ordinary soldiers killed."
 SOA_AbsorbExiledPilots: "Absorption of the Exiled Guard"
 SOA_AbsorbExiledPilots_desc: "Just as we need Tactical Surface Fighter, we also need guards who can pilot them. The veteran guards who defected here should definitely be mobilized."
 SOA_NewTSFPilotTrainingCentre: "New Guard Training Base"
 SOA_NewTSFPilotTrainingCentre_desc: "Having defected guards fly Tactical Surface Fighter is not a long-term solution."
 SOA_DemandTSFProductionLicense: "Request for TSF manufacturing license"
 SOA_DemandTSFProductionLicense_desc: "Since we do not have mature Tactical Surface Fighter technology, it would be better to seek a production license to bring in a production line."
 SOA_AcceptExternalResearchers: "Receive transfer fees from scientific research institutions"
 SOA_AcceptExternalResearchers_desc: "We welcome external support for scientific research. We welcome landless scientific research institutions and provide them with space and grants."
 SOA_ConstructDefenceLine: "Build a line of defense"
 SOA_ConstructDefenceLine_desc: "With the coming battle in sight, the defense must stand the test of time."
 SOA_ReinforceStrategicStrongholds: "Strengthening the line of defense"
 SOA_ReinforceStrategicStrongholds_desc: "Strengthening strategically important locations and strengthening defense line measures."
 SOA_EmergencyCivilianFactoryConscription: "Urgent shift to military industry"
 SOA_EmergencyCivilianFactoryConscription_desc: "In the event of the world being on the brink of destruction, the supply of consumer goods for civilians would be restricted and all production capacity would be diverted to military demand."
 SOA_AllInProduction: "Three-shift system"
 SOA_AllInProduction_desc: "The factories keep running, the lights stay on, and brand new weapons swarm the front lines like a tsunami."

