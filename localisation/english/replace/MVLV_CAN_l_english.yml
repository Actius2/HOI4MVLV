 CAN_atomic: "Nuclear Contamination"
 CAN_atomic_desc: "The vast area in northeastern Canada, which was repelled by nuclear weapons from BETA's descent, is not habitable. Even 30 years later, the impact remains strong, hindering food security and industrial development, and many resources must be spent to maintain the status quo."
 CAN_us: "Canada Support Policy"
 CAN_us_desc: "The United States is providing a great deal of support to Canada, which has been contaminated by nuclear weapons. Thanks to this support, Canada is barely maintaining its posture as a nation, but it also means that it cannot oppose America, which is aiming to dominate the Canadian economy and exclude the influence of Britain, the former colonial power."
 CAN_noatomic: "In a Pure Land"
 CAN_noatomic_desc: "With the completion of the transfer of industry and residents to the west, we are finally able to take a new step."

###event

 mvlv_can.1.t: "Ottawa Declaration"
 mvlv_can.1.d: "Canada is currently being economically dominated by the United States and deliberately hindered from reconstruction. To escape this situation, we must refuse support from the United States and proceed on the path of independence. The Presidential Office announced such a statement today. A deterioration in relations with the United States is unavoidable."
 mvlv_can.1.a: "For Canada!"
 mvlv_can.2.t: "Ottawa Declaration"
 mvlv_can.2.d: "Canada has refused our support. The President of the United States was furious and declared that he would not only stop supporting Canada, but also cut off all negotiations."
 mvlv_can.2.a: "They should have stayed quiet as puppets..."
 mvlv_can.3.t: "Pressure from the United States"
 mvlv_can.3.d: "We received news that Canada is becoming independent from the United States. In response to this, the Secretary-General was planning to announce a support measure, but it was obstructed by the United States. The demand from the United States is to stop all support to Canada by the United Nations."
 mvlv_can.3.a: "It can't be helped..."
 mvlv_can.4.t: "Notification from the United Nations"
 mvlv_can.4.d: "This morning, a notice arrived at the Presidential Office. It was that the United Nations had completely stopped support to Canada. The lonely battle of Canada, which has begun to walk the path of independence, has begun."
 mvlv_can.4.a: "Our determination is unwavering!"