 USA_superpower: "Superpower"
 USA_superpower_desc: "In today's world, the United States is the sole center of the world, and every move it makes has a major impact on every corner of the globe."
 USA_dawn_plan_start1: "Dawn Project - Founded"
 USA_dawn_plan_start1_desc: "Congressional debate determined that the United States must seize the historic opportunity now and protect its interests abroad, if not those of other nations. And to do that, it will be necessary to allocate significant resources to related businesses."
 USA_dawn_plan_start2: "Project Dawn - Planner"
 USA_dawn_plan_start2_desc: "Such a large-scale industrial project required coordination among industrial companies across the United States, which in turn required huge investments of capital."
 USA_dawn_plan_start3: "Project Dawn - Start-up"
 USA_dawn_plan_start3_desc: "With a massive mobilization of corporations and resources, the plan for the defense of the free world was officially launched."
 USA_dawn_plan_advance1_change: "Project Dawn - Branch"
 USA_dawn_plan_advance1_change_desc: "The debate continues within the military-industrial complex and within Congress: Should we prioritize upgrading old production lines to increase productivity, or simply expand industrial production?"
