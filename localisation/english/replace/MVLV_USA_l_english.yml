 USA_focus_tree: "USA National Focus Tree"
 USA_support_japanese: "Espionage in Japan"
 USA_support_japanese_desc: "Japan, which leads Alternative IV, is an obstacle to Alternative V, which is led by our country. By sending agents to stage a coup, we can create an international situation that is favorable to our country."
 USA_WarOrPeace: "The Worlds Last Superpower"
 USA_WarOrPeace_desc: "As the only powerful superpower, we have built the safest country in the world, but it is our duty to fight the BETA with all our might, and we must make a choice."
 USA_ArsenalofDemocracy: "Arsenal of Democracy"
 USA_ArsenalofDemocracy_desc: "In World War II, the burden of defending the entire free world rested on our shoulders, and now that giant is awakening again with a tidal wave of armaments to support our allies and our soldiers."
 USA_ExpandLockheed: "Lockheed"
 USA_ExpandLockheed_desc: "Lockheed is one of several leading manufacturers that have made significant contributions to establishing America's technological superiority in tactical aircraft worldwide."
 USA_GeneralPurposeTSFDev: "Development of general-purpose Tactical Surface Fighter"
 USA_GeneralPurposeTSFDev_desc: "Designing two different Tactical Surface Fighter for the high-low doctrine is no match for a general-purpose model that can serve both, or at least it does not save the cost of coordinating different lines."
 USA_21stCenturyArmsRace: "21st Century US Arms Planning"
 USA_21stCenturyArmsRace_desc: "As originally intended in the ATSF plan, we must prepare for postwar separation of powers and conflict."
 USA_Advanced_Anti_BETA_MBT: "Advanced anti-BETA tank"
 USA_Advanced_Anti_BETA_MBT_desc: "While updating Tactical Surface Fighter is important, it is the Army's armor that actually carries the main force on the front lines, and for that reason, it is time to develop a next-generation main battle tank."
 USA_EagleModiProject: "F15 Modification Program"
 USA_EagleModiProject_desc: "Despite its longevity, the existing F-15E Strike Eagle isn't always up to the demands of future warfare missions, and Boeing has plans for a new upgrade."
 USA_AidUNForces: "Supporting the UN forces"
 USA_AidUNForces_desc: "The UN military wants to acquire a large number of Tactical Surface Fighter from us. This is our chance to do them a favor."
 USA_FormAmericaCoalitionForce: "Formation of the United American Forces"
 USA_FormAmericaCoalitionForce_desc: "Latin America has been under our protection for so long, and now it is time for them to contribute to the war effort. We will train Latin American tactical pilots and integrate them under U.S. military command."
 USA_DataLinkArmyBuild: "Creation of the Intelligence Command"
 USA_DataLinkArmyBuild_desc: "Our data link systems are already the most advanced in the world, but that does not prevent us from continuing to build a more thoroughly computerized military."
 USA_UnmannedAidUnit: "Unmanned Assistance Module"
 USA_UnmannedAidUnit_desc: "Now that we have perfected information technology, it is time to turn our attention to unmanned assistance systems."
 USA_PeaceAboveElse: "The happiest country"
 USA_PeaceAboveElse_desc: "The American people's trust in us is based on the belief that the American homeland will not be affected by war, and we must continue to hold that belief in our people."
 USA_Superpower: "Superpower"
 USA_Superpower_desc: "There will always be only one superpower in the world."
 USA_StrikeFirst: "First move wins"
 USA_StrikeFirst_desc: "The first strike gets you meat, the last strike gets you no soup. Make the most of the situation."
 USA_IndustrialMobilization: "Industrial Mobilization"
 USA_IndustrialMobilization_desc: "To ensure effective implementation of the program, a national industrial system and corresponding infrastructure needs to be in place."
 USA_ProjectDawn: "Project Dawn"
 USA_ProjectDawn_desc: "The Earth is our only home, and America has an obligation to do everything in our power to protect it."
 USA_EvacuateFromEarth: "Lagrangian planning"
 USA_EvacuateFromEarth_desc: "With the current war footing, humanity has no chance of winning, but the good news is that Project Daedalus has prepared a way back, and the time has come to build a migrant fleet at the Lagrange point."
 USA_UntouchableHomefront: "A safe continent"
 USA_UntouchableHomefront_desc: "Our nation is confident that our territory is protected by the most powerful military in the world."
 USA_ExpandUSSF: "Expanding Space Force"
 USA_ExpandUSSF_desc: "The Space Force is a new organization, having only been formed since the start of the Cold War, but its importance in the fight against the BETA cannot be overestimated."
 USA_RefugeeIssue: "Refugee Issue"
 USA_RefugeeIssue_desc: "Since the start of the war, our country has been experiencing a constant influx of refugees, both in terms of human resources and security, and we should rethink our refugee policy."
 USA_DetainZone: "Special urban area"
 USA_DetainZone_desc: "The placement of refugees in special urban areas is our greatest mercy."
 USA_AcceptRefugees: "Expanding the scope of civil rights"
 USA_AcceptRefugees_desc: "It is our duty to defend the world, and America treats everyone equally."
 USA_RefugeeEnlistment: "Refugee Service Agreement"
 USA_RefugeeEnlistment_desc: "Refugees are a huge potential source of labor, and since we have so many of them within our borders today, we should utilize them by requiring them to serve in the military in order to gain citizenship."
 USA_RefugeeAssistedProduction: "Special Warfare Industry"
 USA_RefugeeAssistedProduction_desc: "It is expected that many of the refugees will not want to be deployed directly to the front lines, but it would not be unreasonable to ask them to help with production."
 USA_NewHomeland: "A new homeland"
 USA_NewHomeland_desc: "(I will support and defend the Constitution and laws of the United States against all enemies, foreign and domestic. I pledge allegiance to the Constitution of the United States.) --Excerpt from the Pledge of Allegiance for U.S. Naturalization"
 USA_ConstructionMobilization: "Mobilizing for construction"
 USA_ConstructionMobilization_desc: "The United States of America is calling on you to help build a new homeland, a place where your names may not be known, but your deeds will be remembered forever."
 USA_ContinentResourcesDev: "Departments of natural resorces"
 USA_ContinentResourcesDev_desc: "Our Warmachine Must not be stopped by resource shortages we will have Local governments increase natural resource extraction to ensure our factories have what they need to run uninterupted."
 USA_ShaleOilProduction: "Shale Oil Development"
 USA_ShaleOilProduction_desc: "Humanity has lost most of its significant oil-producing territories and must begin developing new ways to obtain fuel in order to stabilize its fuel supply."
 USA_AmazonResourcesProduction: "Expanding Amazon plans"
 USA_AmazonResourcesProduction_desc: "Environmentalists may disagree with our decision, but the need of the hour is resource provision, not environmental issues."
 USA_NATOSummit: "21st Century NATO Conference"
 USA_NATOSummit_desc: "Western Europe has fallen, but NATO still exists. Our European NATO allies should understand this well, and the United States still stands shoulder to shoulder with them."
 USA_TacticalCoordination: "Tactical Adjustments"
 USA_TacticalCoordination_desc: "As our closest European Allied forces in terms of tactical operations, we need to integrate and coordinate tactically with them in preparation for future joint operations."
 USA_JointStrikeLyonHive: "Joint suppression of Operation H12"
 USA_JointStrikeLyonHive_desc: "In order to stabilize the English Channel, it is necessary to launch a concerted attack on the Lyon hive."
 USA_US_Euro_AfricaAlliance: "Europe, America and Africa cooperation"
 USA_US_Euro_AfricaAlliance_desc: "The European Union (EU) is responsible for the defense of the northern side of the Atlantic as part of NATO, but we would be much safer if we could build relationships with the African Union (AU) and incorporate Africa into our defense system so that Africa could guarantee the defense of the southern side of the Atlantic."
 USA_AtlanticSupplyLine: "Ocean Route"
 USA_AtlanticSupplyLine_desc: "As a sign of goodwill to the African Union, we will establish a shipping route between New York and Cameroon, and our industrial products will be a constant source of support to our African allies."
 USA_SouthAfricaDevelopment: "South Africa"
 USA_SouthAfricaDevelopment_desc: "South Africa has the best industrial base in all of Africa and deserves more attention and support."
 USA_WestAfricaDevelopment: "Gold Coast"
 USA_WestAfricaDevelopment_desc: "The gold coast of West Africa will be the biggest beneficiary of the New York-Cameroon route."
 USA_NATO_Africa_JointForces: "NATO African Union Forces"
 USA_NATO_Africa_JointForces_desc: "NATO welcomes you, my African brothers, and our allies will crush all who stand in our way."
 USA_AmericaFreeTradeTreaty: "Inter-American Free Trade Treaty"
 USA_AmericaFreeTradeTreaty_desc: "Trade barriers and tariffs between us and the American countries have limited our influence in those countries."
 USA_CentralAmericaDevelopment: "Central America Plan"
 USA_CentralAmericaDevelopment_desc: "Central America is close to the border and should be given more support to improve their favorability."
 USA_InvestCentralAmerica: "Investing in Central America"
 USA_InvestCentralAmerica_desc: "My fellow Central Americans, this is help from the United States of America, and we look forward to giving back in return."
 USA_SouthAmericaDevelopment: "South America Plan"
 USA_SouthAmericaDevelopment_desc: "South America has always been America's backyard, and what's there to say about caring for your own backyard?"
 USA_InvestSouthAmerica: "Investing in South America"
 USA_InvestSouthAmerica_desc: "My fellow South Americans, this is aid from the United States of America that we look forward to giving in return."
