 mvlv_usa.2.t: "G-Bomb Plan Called into Question"
 mvlv_usa.2.d: "The UN investigation team conducted a series of experiments in Yokohama after the G-bomb explosion and announced the results in public. The success of Operation MS verified the effectiveness of G-bombs, and the US military gained confidence in the feasibility of the G-bomb strategy, but what was unexpected was the so-called (threat of G-bombs) thrown out by the representatives of the frontline countries who heard the report. \n(Operation Star was successful because they dropped G-bombs, and the effect of G-bombs is obvious to everyone. Even if friendly forces were involved, it was because the situation was urgent and there was no time to discuss. In any case, if there were no G-bombs, would you still be here criticizing our methods?) - US representative protests at the UN conference\nDespite the strong protests of the US representative, the conference finally decided to make the G-bomb strategy the final preliminary plan. What was really bad was that there were also anti-G-bomb forces in the country, which hindered the promotion of the G-bomb strategy."
 mvlv_usa.2.a: "How ungrateful!"
 mvlv_usa.3.t: "The Beginning of the Lagrange Project"
 mvlv_usa.3.d: "The first technology verification immigrant ship at the Lagrange Point was completed after some twists and turns, but the good news is that all technical difficulties have been overcome. At the Lagrange Point, the work of transporting further components for the construction of the space dock and the dispatch of engineers has begun. All personnel involved in the project will be trained in space work."
 mvlv_usa.3.a: "Respect to the engineers"
 mvlv_usa.4.t: "Lagrangian design - second stage"
 mvlv_usa.4.d: "Dock materials and personnel are ready to begin mass assembly of space docks. Ten space docks are scheduled to be completed, allowing for the simultaneous construction of ten large immigrant ships. Materials resupply and personnel rotation will continue. Factories producing immigrant ship components will begin expanding in preparation for the next wave."
 mvlv_usa.4.a: "Ring a gong"
 mvlv_usa.5.t: "Lagrangian design - third stage"
 mvlv_usa.5.d: "The shipyard is now fully completed and construction of the immigrant ships has officially begun. A stream of fully loaded orbital destroyers are transporting parts manufactured on Earth to the Lagrangian point, where they are received and assembled at the shipyard. \n(It's really cool to operate the construction machinery at Lagrangian. When I concentrated on my work, I felt like I was finally free from the oppressive feeling of the BETA invasion.)\nAn engineer who returned to Earth said this in an interview with CNN."
 mvlv_usa.5.a: "How many engineers will get a ticket?"
 mvlv_usa.6.t: "Preparing materials for the immigrant fleet"
 mvlv_usa.6.d: "Construction of the immigrant ships is nearly complete, followed by a large number of orbital destroyers loaded with all the supplies necessary to provide the immigrant fleet with the voyage. All relevant factories are operating at full capacity, including food, medicine, engineering equipment, life support systems, and weapons."
 mvlv_usa.6.a: "It would be nice to have unlimited Coca-Cola while working in space."

 USA_dawn_plan_categories: "Project Dawn"
 USA_Lagrange_Plan_categories: "Lagrangian Planning"
 mvlv_usa.1.t: "Parliament debates refugee issue"
 mvlv_usa.1.d: "Since the BETA invasion, our country has accepted a large number of refugees with different languages, cultures, beliefs, and lifestyles. Conflicts have arisen frequently not only between refugees and locals, but also among refugees themselves, causing a rapid deterioration of our country's legal system. Surveys have revealed that the public is extremely dissatisfied with the legal system and employment problems caused by the refugees, and refugees are becoming increasingly resistant to existing refugee policies. It is time to bring the refugee issue to the forefront and resolve it."
 mvlv_usa.1.a: "Quarantine refugees. Move them to designated camp areas and deploy security forces to maintain order."
 mvlv_usa.1.b: "Naturalization of refugees. Special funds should be allocated to accommodate these poor people and to help them integrate into the local community."
 mvlv_usa.100.t: "Immigrant fleet completed"
 mvlv_usa.100.d: "The vast immigrant fleet built at the Lagrangian point is undoubtedly the largest creation in human history, and it is a complicated stroke of luck that humanity is (forced to) embark on interstellar exploration only half a century after it began space exploration. \n -The Alternative 5 Plan has been the subject of much controversy, but we are convinced that it is the right path. For the survival of human civilization, it is a great pioneer for the elite of humanity to leave Earth and head to the habitable planet Alpha Centauri Bb- ---- says one of the engineers involved in Alternative 5. \nThe immigrant fleet is complete, but candidates for the fleet must be carefully considered. Those who do not have a chance to board the fleet can remain on Earth and face the final battle with the BETA. The permission to use the G-bomb will be lifted after the immigrant ship departs, so no one knows what will happen after that. However, it is expected that the departure base will be surrounded by people wanting to depart before the immigrant ship officially departs, and a terrorist attack to destroy the departure base will occur."
 mvlv_usa.100.a: "Now we're ready for Alternative 5."
 mvlv_usa.101.t: "Project Dawn Action Plan"
 mvlv_usa.101.d: "The first phase of Alternative V is complete. The next phase is to manufacture G-shells from all available G-elements and prepare for an all-out attack on the BETA on an unprecedented scale. With the help of the orbital projector, we will launch G-shells directly into all Hive surface structures, destroying surface structures and shallow trunk structures underground, exposing the main shaft, and then send an orbital drop force into the main shaft to attack the reactor and disable it. Given the BETA's response capabilities, we must complete the operation in a short time. \n -This time, humanity will bet everything. Even if the continent becomes a wasteland, as long as the BETA is completely annihilated, humanity will rise again. Even if we fail, it will only be an early catastrophe.- --Commander-in-Chief of the Space Force"
 mvlv_usa.101.a: "This is the final counterattack and a gamble for the future of humanity!"

 USA_dawn_plan_categories: "Project Dawn"
 USA_lagrange_plan_1: "Prepare materials for the immigrant ship dock (minimum 10 re-entry destroyers must be in stock)"
 USA_lagrange_plan_2: "Build an immigrant dock (requires a minimum of 20 re-entry destroyers in stock)"
