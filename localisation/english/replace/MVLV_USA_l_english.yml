#######ideas
 USA_country: "Superpower"
 USA_country_desc: "The United States has become the only superpower that everyone recognizes. Its mass market products are far more abundant than those of other countries. However, the people who are accustomed to this lifestyle are not cooperative with the state or the military, even in the midst of the BETA War."
 USA_refugees: "Refugee Volunteer"
 USA_refugees_desc: "The United States has accepted many refugees from the BETA War, but has not granted them citizenship. As a result, most of the refugees are forced to live harsh lives, and some areas have become extremely unsafe. In such circumstances, the only way to obtain American citizenship is to become a soldier, and many refugees volunteer to serve in the US military."
 USA_refugees2: "Special urban area"
 USA_refugees2_desc: "To maintain the safety of the people and the normalization of the domestic economy, special urban areas will be established in certain areas to accommodate and isolate unemployed refugees, and the organization of a refugee army to serve the U.S. military will be promoted."
 USA_refugees3: "Refugee Service Agreement"
 USA_refugees3_desc: "Establish a refugee service agreement and systematize refugee recruitment so that refugees are rewarded accordingly, whether they want to reclaim their homeland or seek a better life."
 USA_refugees4: "Special Warfare Industry"
 USA_refugees4_desc: "By placing some of our low-end defense industries in these areas, we can ensure that qualified, idle people who don't want to join the military have jobs that are sufficient to support a family and that they can fully commit to."
 USA_refugees5: "Expanding the scope of civil rights"
 USA_refugees5_desc: "America was and still is a symbol of freedom, offering citizenship to qualified refugees through a regulated multi-level screening process, and fighting for the American dream as part of the American people."
 USA_refugees6: "A new homeland for the people"
 USA_refugees6_desc: "The influx of people and jobs is straining neighbourhoods and public services like never before, and governments need to act urgently to ensure the benefits of development reach all citizens."
 USA_refugees7: "Mobilizing for construction"
 USA_refugees7_desc: "Once again, at the speed of light, the United States of America was built, and through their hard work, courage, creativity, and determination, their people are on their way to prosperity."
