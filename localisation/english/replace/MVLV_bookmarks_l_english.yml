l_english:
 1973_START_NAME: "BETA Invasion"
 1973_START_DESC: "A wild BETA has appeared! \nNot yet playable (may be implemented as a completely different scenario in the future)"
 1999_START_NAME: "Operation Myojo"
 1999_START_DESC: "The year is 1999, and humanity is on the brink of extinction. After nearly 30 years of fighting the BETA, humanity has been pushed to the point of losing most of the Eurasian continent. The BETA's eastward advance, which began nine years ago, has now reached the Japanese archipelago. If the BETA cannot be stopped now, the extinction of humanity will be inevitable."
 JAP_1999_START_DESC: "In the great BETA invasion that began in 1998, Japan lost much of its territory and its people. The Imperial Capital Absolute Defense Line managed to buy a few months of time for evacuation, but now the BETA is on the verge of invading the Kanto region. To make matters worse, the BETA have reached Sado Island and begun construction of a hive. They are somehow holding out with the help of the US military and UN forces in Japan, but the day when the new Imperial Capital, Tokyo, falls may be approaching. "
 BET_1999_START_DESC: "BETA is an abbreviation for an extraterrestrial species hostile to humans, and has been invading Earth since 1973. As of 1999, they have already taken over 90% of the Eurasian continent, and if things continue as they are, they are expected to complete their domination of Earth in just a few more years. "
 USA_1999_START_DESC: "The United States is the only superpower that has not been invaded by the BETA, and in 1999 it is the strongest country in the world in both name and reality. However, due to the export of weapons and the lending of factories to other countries around the world, and the low interest of the people in war, it is difficult to say that it has enough munitions factories to maintain its own military. However, its total industrial power is overwhelming, so if it could unleash its true power, it may be able to open the way to victory for humanity. "
 EUR_1999_START_DESC: "The European Union was established in 1972 as a community centered on the Western countries of Europe. As of 1999, the European continent has been completely taken over by the BETA, and only a few islands remain, such as the island nation of Great Britain and the Italian island of Sicily. Currently, Great Britain, the only country that still has a mainland, is leading the European Union, rebuilding its military with the aim of retaking Europe, but there is still a lot of friction between member states, and unless they can build a cooperative relationship, it will be difficult to even defend the British Isles, let alone retaking their homeland. "
 SOV_1999_START_DESC: "The Soviet Union was once a superpower rivaling the United States, but as of 1999 it has lost most of its territory to the BETA. However, because it was one of the first to transfer its military and industrial power to the rear, even after losing its territory it still retains a military and industrial power worthy of a great power. The Communist Party leadership, based in Alaska leased from the United States, is eagerly waiting for the right opportunity to retake their homeland and overthrow America. "
 UNI_1999_START_DESC: "When the BETA War first broke out, the East and West countries carried out reckless operations without any coordination, resulting in many casualties. To avoid this, the Vancouver Agreement was concluded, which led to the establishment of the United Nations Unified Command. As of 1999, the United Nations had absorbed the military forces of Eurasian countries that had lost their land and formed direct military forces, which were fighting in each country, and also possessed a huge fleet made up of ships donated by each country. Despite facing a common enemy, humanity has yet to build a cooperative relationship, but if the UN could show its strength, the attitudes of each country may change. "
 AFR_1999_START_DESC: "Africa, the birthplace of humanity, has undergone a major turning point since Europe became a battlefield in the BETA War. Many European countries that lost their land have begun to invest heavily in their former colonies in Africa. They have built many factories in Africa and invested heavily in infrastructure, and as a result, African countries have become great powers with some of the largest cities in the world. In terms of military affairs, African countries have formed an alliance and are concentrating their forces on the Suez Absolute Defense Line for defense. Now is the time for Africans to defeat the BETA and put an end to all the past. "
 CHI_1999_START_DESC: "When the BETA first began their invasion of Earth, the People's Republic of China tried to repel them on its own and monopolize the unknown technology. However, the emergence of the ray class dealt a major blow, and the Communist government was driven out of the mainland without being able to fully rebuild its military. The Communist government then shocked the world by forming the third Kuomintang-Communist cooperation agreement with the Taiwanese government of the Republic of China, another China. However, the two countries have completely different political systems, so it is impossible for things to go well, and various problems are occurring frequently. If things continue like this, Taiwan's defense will not be able to be maintained. "
 GEU_1999_START_DESC: "The Greater East Asia Union is a national alliance formed by the Far Eastern countries, excluding China and Japan, such as India, Korea, and Indonesia. Initially, each of these nations was incorporated into the UN forces and continued to fight the BETA, but having lost their land, their morale was high, and they had no powerful backing, so they were sent to the front lines, where they were at a disadvantage. To rectify this, the idea of ​​forming a national alliance to join the UN forces emerged, and as a result, the Greater East Asia Union was formed. As of 1999, they are fighting a defensive battle on the Malay Peninsula, but as most of the Japanese and UN forces have been transferred to the Japanese mainland, the Greater East Asia Union is forced to fight the defensive battle alone."
 SOA_1999_START_DESC: "The South American Union is a federation of nations formed by South American countries in order to wage the war against the BETA, but due to the fact that the American continent is the furthest-reaching nation of humanity, its military armaments are greatly restricted by a treaty concluded with the United States."
 CEA_1999_START_DESC: "The Central American Union is a federation of nations formed by South American countries in order to wage a war against the BETA, but due to the fact that the Central American Union is the furthest-reaching nation of humanity on the American continent, its military armaments are greatly restricted by a treaty concluded with the United States."
 OSE_1999_START_DESC: "Australia is one of the countries that has barely suffered the devastating effects of the BETA War. The Australian continent is now blessed with precious, healthy nature, and has become a large natural food production factory with a food self-sufficiency rate of over 300%. This is due to the labor force gained by actively accepting refugees, but an increase in refugees could have a negative impact on the country. And even more of a problem than refugees is the BETA approaching Southeast Asia. If the Greater East Asian Union falls, Australia will be on the front line, so military expansion must also be accelerated."
 CAN_1999_START_DESC: "Canada was hit hard by a series of nuclear attacks on BETA grounded units at the beginning of the BETA War. The northeastern part of Canada was rendered uninhabitable by radiation. Even though Canada has received a lot of aid from the United States, it is still far from recovery even now, 30 years after the nuclear attack, and it seems that the country will take a long time to rebuild."
 EEA_1999_START_DESC: "The East European Socialist Union is a national alliance of the former Eastern European countries, centered around East Germany. However, because they were invaded by the BETA before the Western European countries, their current national power is extremely limited, and their status is merely to provide military power as an observer state in the European Union. In the past, they operated everything from equipment to tactics in the Soviet style, but with the Soviet Union's withdrawal to the Far East and the loss of influence in Europe, and with military exchanges between East and West Germany as a catalyst, they are gradually closing the gap with the Western European countries."
 OTHER_1999_DESC: "Look at the world. Humanity is on the brink of extinction. Even in this state, humanity still cannot unite. Humanity has already greatly shrunk in sphere of influence, and if things continue as they are, they will just wait to be eradicated. The fate of the world is entrusted to your choice. It is up to you to prolong the life of humanity, which will be extinct within a few years, and to create time for a savior to appear."
 COUNTRY_SELECTION_CHARACTER_DESC: "$NAME|Y$ $DESC|$\n$TRAITS_DESC|$"