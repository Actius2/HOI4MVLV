 SOV_ru2: "Central Military Council"
 SOV_ru2_desc: "The Central Military Committee is located above the General Staff and efficiently commands the entire army."
 SOV_ru4: "Efficient Conscription"
 SOV_ru4_desc: "In our country where all people are conscripted, draft evasion is not allowed."
 SOV_ru5: "Efficient Guidance"
 SOV_ru5_desc: "Review the education curriculum at military schools"
 SOV_ru6: "Increase in Strike Power"
 SOV_ru6_desc: "The proper placement of personnel has led to an increase in the strike power of the entire army."
