 SOV_rs14: "Purchase of Factories"
 SOV_rs14_desc: "Sell most of the party's assets and purchase many factories overseas. Luxurious furnishings are not necessary for the Soviet Union."
 SOV_rs15: "Unified Leadership"
 SOV_rs15_desc: "There are no longer any non-Russians in the All-Union Communist Party leadership, and dangerous elements who may rebel are eliminated, which will lead to further efficiency in industry and operations."
 SOV_rs16: "Gathering Wisdom"
 SOV_rs16_desc: "The units divided by ethnicity belong to their respective military factions and fight each other. This will lose valuable anti-BETA experience. Establish a command that spans ethnic groups and share experience."
 SOV_rs17: "Multiethnic Leadership"
 SOV_rs17_desc: "The Communist Party leadership is composed of party members selected from all ethnic groups in order to uniformly control all people, and is reformed to carry out efficient guidance."
 SOV_rs18: "Completed Tactics"
 SOV_rs18_desc: "Revolutionary tactics have been completed by absorbing anti-BETA experience from all ethnic groups. The combat power of the Soviet Union's military is incomparable to before!"
 SOV_rs19: "Remnants of the Third Plan"
 SOV_rs19_desc: "The recovery of the motherland cannot be achieved with ordinary forces alone. Even if it is inhumane, it should be used mercilessly if it serves the motherland. Fortunately, we have the technology used in the third plan. As a first step, we need to start operating a test unit at Yukon Base."
 SOV_rs20: "Final Stage of the Plan"
 SOV_rs20_desc: "The preparations for the counteroffensive operation are nearing completion. Our country will definitely achieve it."
 SOV_rs21: "П3 Plan"
 SOV_rs21_desc: "Through research on the Feinberg phenomenon, which was discovered by chance in the third plan, we have obtained the occurrence of the Nastroika effect and its control technology. The aircraft that can control the Pravka, which was created from the white crystal using a special embryo, and can be used in combat, will exert a power that cannot be compared with ordinary manned Tactical Surface Fighters."
 SOV_rs22: "Operation Red Storm"
 SOV_rs22_desc: "With all the efforts, the preparations for the operation have finally been completed. All the people are waiting for the order from Comrade Secretary General!"
 SOV_rs23: "Focus on North America"
 SOV_rs23_desc: ""
