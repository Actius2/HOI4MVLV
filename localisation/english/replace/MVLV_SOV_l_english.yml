 SOV_main: "Towards the Recovery of the Motherland"
 SOV_main_desc: "Currently, our motherland has lost 90% of its territory. With the current system, our country will soon perish. We must not extinguish the fire of socialism! We must carry out reforms and urgently formulate a method to eliminate BETA and return to Moscow. There are many methods, but we must choose the best."
 SOV_rs: "Communist Party Declaration"
 SOV_rs_desc: "The party's leadership must be purged to reach the end."
 SOV_rs2: "Soviet-style Electrical Industry"
 SOV_rs2_desc: "The development of computers is essential for the recovery of the motherland."
 SOV_rs3: "Sacrifice and Experience"
 SOV_rs3_desc: "Our country has the most experience in anti-BETA warfare in the world. This must be thoroughly educated in the military."
 SOV_rs4: "Red Wave"
 SOV_rs4_desc: "The preparation for the large counteroffensive operation aiming at the recovery of the motherland is about to begin. Our country will never succumb to inferior creatures!"
 SOV_rs5: "Focus on Industry"
 SOV_rs5_desc: "Nothing can start without industrial power. Strengthen industrial power."
 SOV_rs6: "Focus on the Military"
 SOV_rs6_desc: "In preparation for the recovery operation, strengthen the entire army that fights on the front."
