 SOV_AnotherFiveYearPlan: "Five-Year Plan"
 SOV_AnotherFiveYearPlan_desc: "As the fourteenth five-year plan approaches its end, the time has come to summarize its results."
 SOV_RelocateProductionToAlaska: "Factory Relocation to Alaska"
 SOV_RelocateProductionToAlaska_desc: "Our so-called -western friends- have given us land in Alaska as a -necessary preparation-."
 SOV_AbsorbRefugeeAsLabourers: "Absorption of Refugee Labor"
 SOV_AbsorbRefugeeAsLabourers_desc: "Organizing refugees from the Far East control area into factories can be an effective way to alleviate pressure for stability, albeit at a 'necessary cost'."
 SOV_WartimeEconomyMobilization: "Wartime Economic Mobilization"
 SOV_WartimeEconomyMobilization_desc: "If the situation stabilizes, we can prepare a new five-year plan to continue the war machine."
 SOV_CollectivismPropaganda: "Collectivist Propaganda"
 SOV_CollectivismPropaganda_desc: "The fight against BETA is a fight for all humanity, a fight for the collective. Of course, the same goes for failure."
 SOV_AtAllCosts: "At All Costs"
 SOV_AtAllCosts_desc: "We need more, much more."
 SOV_AllEthnicGroupEquality: "Protect the Equality of All Ethnic Groups"
 SOV_AllEthnicGroupEquality_desc: "The 126 nationalities are an indivisible part of the federation, and the claim of equality for all nationalities is unshakeable."
 SOV_SteadyAdvance: "Steady Progress"
 SOV_SteadyAdvance_desc: "-Stability, progress in stability-, with stability as the main keynote, pursuing progress on the premise of maintaining overall stability."
 SOV_ExpandBasicIndustry: "Expansion of Basic Industry"
 SOV_ExpandBasicIndustry_desc: "Construction sites increase, factories increase, workers increase."
 SOV_ImportAdvancedEquipmentandTechnology: "Introduction of Advanced Equipment and Technology"
 SOV_ImportAdvancedEquipmentandTechnology_desc: "The fifteenth five-year plan is based on resolving the contradiction between the high cost of Tactical Surface Fighters and the great need for this weapon."
 SOV_InvestInResearch: "Investment in Research"
 SOV_InvestInResearch_desc: "Integrate the financial investment system for scientific research, focus on strategic and important fields, and rectify the state of fragmentation, small scale, and fragmentation of fields. Optimize the system and operation mechanism of the federation's science and technology program, and promote the integrated allocation of projects, bases, talents, and funds in key areas."
 SOV_ConcludeExperienceFromEquipmentProduction: "Aggregate Experience from Equipment Manufacturing"
 SOV_ConcludeExperienceFromEquipmentProduction_desc: ""The implementation of the Industrial Base Reconstruction Project has remedied the bottlenecks in basic parts, basic materials, basic techniques, and industrial technology foundations, and the unit production capacity has been effectively improved."--Excerpt from the Federation's 15th Five-Year Development Plan."
 SOV_GElementResearchFacility: "G Element Research Facility"
 SOV_GElementResearchFacility_desc: "The destructive weapon dropped by America in Operation Bright Star has upset the balance of strategic deterrence."
 SOV_EnhanceControl: "Tighten Up"
 SOV_EnhanceControl_desc: "Corruption must be eradicated and the party's leadership must reach the grassroots."
 SOV_EthnicGroupsIssue: "Ethnic Issues"
 SOV_EthnicGroupsIssue_desc: "As a union formed not on major ethnic groups, but on political thought, it may be in the best interest of both the party and the people to adjust ethnic policies when the facade is about to collapse."
 SOV_Russianism: "Great Russianism"
 SOV_Russianism_desc: "It is undeniable that maximizing the mobilization of the Russian ethnicity, which still makes up the overwhelming majority of the remaining population, is in the best interest. It may be permissible to revive Great Russianism in a limited way."
 SOV_PoliticalCorrectness: "Political Equality"
 SOV_PoliticalCorrectness_desc: "By increasing the number of people from minority regions within the federal government, it is possible to put into practice policies of ethnic equality."
 SOV_SteadyReformation: "Steady Reform"
 SOV_SteadyReformation_desc: "It is not possible to rush the reform of ethnic policies, and too radical a direction may lead to unnecessary losses."
 SOV_LeadershipMadeUpByRussianOnly: "Leadership of Only Russians"
 SOV_LeadershipMadeUpByRussianOnly_desc: "When Russian leaders make up the majority, they can invest a lot of resources in projects led by Russian ethnic groups and favor Russian ethnic talents, even while provoking the backlash of other ethnic groups."
 SOV_UnitedLeadershipClass: "Unified Leadership"
 SOV_UnitedLeadershipClass_desc: "Since the 30th Congress of the Soviet Union Communist Party, the authority of the Central Committee of the Party and the centralized and unified leadership have been strongly guaranteed, and the party as a whole is more ideologically unified, politically unified, and consistent in action."
 SOV_ReturnToOurHome: "Towards the Return to the Motherland"
 SOV_ReturnToOurHome_desc: ""Snow and wind, if the stars fly, my heart is far away on the ground, no matter how many misfortunes repeat, the friendship of two people will never change"--《Heart-stirring Youth Song》"
 SOV_ForMotherRussia: "For the Recovery"
 SOV_ForMotherRussia_desc: "Now, the motherland has lost 90% of its territory. Under the current system, the motherland will soon perish. We must not extinguish the fire of socialism! We must carry out reforms, eliminate BETA, and urgently formulate a program for the return to Moscow. There are many methods, but we must choose the best."
 SOV_RestatePartyAndArmyRelationship: "Reaffirmation of the Relationship between the Party and the Army"
 SOV_RestatePartyAndArmyRelationship_desc: "Since the offices of the party and government moved to Alaska, the relationship between the front-line units and the Central Committee of the Party has gradually weakened, and some front-line comrades have begun to treat the army as private soldiers, tending to militarize. A meeting should be held to reaffirm the basic policy of the party that commands the gun, and those who do not obey should be handed over to the Ministry of Internal Affairs."
 SOV_EnsureRevolutionariesPositionInArmy: "Securing the Position of Reformists in the Army"
 SOV_EnsureRevolutionariesPositionInArmy_desc: "The reformists have shown tactical superiority over the conservatives in a series of battles, but the pre-war army conservatives that have continued to this day are still dominant, and further reform of the army will not be achieved. Reformist officers should be promoted to have a voice and become the main character of the army's progress."
 SOV_TotalWar: "Total War"
 SOV_TotalWar_desc: "The war against BETA is far more tragic than any war in history, and the total power of the nation must be mobilized to fight."
 SOV_EliteForces: "Elite Forces"
 SOV_EliteForces_desc: "It is simply too costly and almost impossible to destroy BETA with a large ground force. Orbital drop operations are far more feasible and far less costly."
 SOV_FloodOfSteel: "Flood of Steel"
 SOV_FloodOfSteel_desc: "By fully utilizing the established mechanized army system and enhancing the synergy between units, it is possible to quickly organize and quickly reinforce."
 SOV_GuardianOfTheMotherland: "Guardian of the Motherland"
 SOV_GuardianOfTheMotherland_desc: "Tactical Surface Fighters are important weapons against BETA and are being further improved to meet the needs of current operations."
 SOV_TacticalPerfection: "Tactical Perfection"
 SOV_TacticalPerfection_desc: "All the experience of fighting BETA has been absorbed, and revolutionary tactics have been accomplished. The combat power of the Soviet army was far removed from the past!"
 SOV_FormOrbitalDivers: "Red Army Orbital Paratrooper Corps"
 SOV_FormOrbitalDivers_desc: "Dropping from orbit is proven to be more feasible in combat with the hive than advancing from the ground, and if there is enough scale of units in orbit alone to counter the hive, the motherland is within reach."
 SOV_ProjectP3Completion: "П3 Plan"
 SOV_ProjectP3Completion_desc: "Through research on the Feinberg phenomenon, which was discovered by chance in the third plan, we have obtained the occurrence of the Nastroika effect and its control technology. The aircraft that can control the Pravka, which was created from the white crystal using a special embryo, and can be used in combat, will exert a power that cannot be compared with ordinary manned Tactical Surface Fighters."
 SOV_OperationRedStorm: "Operation Red Storm"
 SOV_OperationRedStorm_desc: "The time has finally come to prepare for the combat plan for the great counteroffensive to regain the motherland. Our country will never succumb to inferior creatures! All the people are waiting for the order from Comrade Secretary General!"
 SOV_MilitaryLeadershipSummit: "Central Military Council"
 SOV_MilitaryLeadershipSummit_desc: "The Central Military Committee, which is located above the General Staff, effectively governs the entire army."
 SOV_EnhanceArtilleryUnits: "Strengthening Artillery"
 SOV_EnhanceArtilleryUnits_desc: "The large-scale destruction of BETA still relies on artillery, and the training of artillery in mobile warfare needs to be further improved."
 SOV_DoctrineImprovement: "Improvement of Campaign Law"
 SOV_DoctrineImprovement_desc: "The wide-ranging killing of BETA still relies on artillery, and the training for artillery to participate in mobile warfare must be further advanced."
 SOV_FrontlineGuidance: "Frontline Guidance"
 SOV_FrontlineGuidance_desc: "Veterans are assigned as frontline commanders to all frontline units."
 SOV_BarrageDataLink: "Artillery Data Link"
 SOV_BarrageDataLink_desc: "By fully utilizing the data link for artillery guidance, the accuracy of artillery can be greatly improved, and better support can be provided to the front line."
 SOV_RefugeeConscription: "Recruitment of Refugees"
 SOV_RefugeeConscription_desc: "Soviet refugees in exile are called upon to return to the military, and refugees from other countries accepted in the Alaska leasehold should also be mobilized."
 SOV_SeekExternalSupportForWar: "Overseas Aid for BETA War"
 SOV_SeekExternalSupportForWar_desc: "The Red Army is exhausted for a long war, and it may be effective to seek the assistance of -western friends-."
 SOV_NegotiateWithJapan: "Negotiations with Japan"
 SOV_NegotiateWithJapan_desc: "Japan has recently asked us for cooperation on electromagnetic weapons."
 SOV_ApproveArmSalesToJapan: "Arms Sales to Japan"
 SOV_ApproveArmSalesToJapan_desc: "Of course, under the name of sample exchange, we can sell a little stock of old equipment."
 SOV_NegotiateWithUSA: "Negotiations with America"
 SOV_NegotiateWithUSA_desc: "In 1980, there was an agreement on lend-lease that if you want the land back after the war, you have to pay an additional amount."
 SOV_NegotiateWithUN: "Negotiations with the United Nations"
 SOV_NegotiateWithUN_desc: "Despite encountering many inconvenient issues for the federation to temporarily resolve, we still hold two additional votes in the General Assembly."
 SOV_OfferAdditionalInfoAboutAL3ToUN: "Providing Information on Alternative III"
 SOV_OfferAdditionalInfoAboutAL3ToUN_desc: "Dr. Kozuki seems to have a strong interest in the results of Project П3, and she may not hesitate to pay a price for more -monsters-."

#events
 mvlv_sov.1.t: "Operation Red Storm"
 mvlv_sov.1.d: "Finally, the grand operation to reclaim our motherland has begun! The time has come to reclaim the motherland of the Soviet Union!"
 mvlv_sov.1.a: "Ураааааааа!!"
 mvlv_sov.2.t: "Compensation"
 mvlv_sov.2.d: "The Red Storm operation was a campaign carried out with overwhelming materials and resources, and we must pay the cost of activation."
 mvlv_sov.2.a: "Comrades, now is the time to endure"
 mvlv_sov.3.t: "Preparation Complete"
 mvlv_sov.3.d: "The time has come to reclaim our great motherland, our mother earth, our sacred land! All preparations are complete, and all the people are waiting for the order from Comrade Secretary General!"
 mvlv_sov.3.a: "The time has come to return home!"

