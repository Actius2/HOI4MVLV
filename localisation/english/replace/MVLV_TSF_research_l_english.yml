 MVLV_research_head_normal_1: "Basic Head Unit"
 MVLV_research_head_normal_1_desc: "A basic head unit that provides a human-like viewing angle and is equipped with environmental sensors."
 MVLV_research_head_normal_2: "Improved Head Unit"
 MVLV_research_head_normal_2_desc: "An improved head unit equipped with an optical zoom system that allows it to observe targets at long distances."
 MVLV_research_head_normal_3: "Advanced Head Unit"
 MVLV_research_head_normal_3_desc: "A more advanced head unit. The introduction of infrared sensors such as a thermal sight allows for more efficient target detection."
 MVLV_research_head_heavy_1: "Basic Armored Head Unit"
 MVLV_research_head_heavy_1_desc: "A head unit that has strengthened armor at the expense of situational awareness. It can increase survivability from BETA attacks, but at the expense of elements such as field of view."
 MVLV_research_head_heavy_2: "Improved Armored Head Unit"
 MVLV_research_head_heavy_2_desc: "An improved armored head unit. It has the same performance as the basic head unit, and its observation capabilities have also been improved."
 MVLV_research_head_heavy_3: "Advanced Armored Head Unit"
 MVLV_research_head_heavy_3_desc: "A more advanced armored head unit that is now capable of operating optical zoom and environmental sensors, further improving situational awareness."
 MVLV_research_head_aerial_1: "Basic Aerial Head Unit"
 MVLV_research_head_aerial_1_desc: "A head unit that sacrifices armor for aerodynamic characteristics. It has great advantages in sensors and field of view, but sacrifices elements such as survivability."
 MVLV_research_head_aerial_2: "Improved Aerial Head Unit"
 MVLV_research_head_aerial_2_desc: "An improved aerodynamic head unit, with enhanced situational awareness through integration of environmental sensors and optimized system connectivity."
 MVLV_research_head_aerial_3: "Advanced Aerial Head Unit"
 MVLV_research_head_aerial_3_desc: "A more advanced aerodynamic head unit. Improved optical sensors allow for more efficient target search and attack."

 MVLV_research_armor_heavy: "Heavy Armor"
 MVLV_research_armor_heavy_desc: "Strengthening the rigidity and armor of the entire aircraft. This will inevitably reduce reliability, but will prevent it from being destroyed in one or two hits."
 MVLV_research_armor_light: "Light Armor"
 MVLV_research_armor_light_desc: "Reducing armor and improving maneuverability. This can lead to accidents and makes the unit more susceptible to being destroyed by larger opponents, but it also reduces costs."
 MVLV_research_armor_composite: "Composite Armor"
 MVLV_research_armor_composite_desc: "Composite armor made of multiple materials and anti-ray coatings. Although the cost increases, it provides high survivability without compromising mobility."

 MVLV_research_reinforced_structure_1: "Basic Reinforcement Structure"
 MVLV_research_reinforced_structure_1_desc: "Introduce structural materials that improve the overall rigidity of the aircraft, improving various strength-related factors such as crashworthiness, but at the expense of production costs and reliability."
 MVLV_research_reinforced_structure_2: "Improved Reinforcement Structure"
 MVLV_research_reinforced_structure_2_desc: "Improved reinforced structural material, which solves reliability issues and allows for greater rigidity, but at the cost of increased production costs."
 MVLV_research_reinforced_structure_3: "Advanced Reinforcement Structure"
 MVLV_research_reinforced_structure_3_desc: "An advanced version of reinforced structural materials. Although production costs have increased, survivability and durability have also increased."
 MVLV_research_special_structure_1: "Basic Special Structure"
 MVLV_research_special_structure_1_desc: "Introduce special structural materials to reduce production costs. Simplify the overall structure, but sacrifice frame strength and reliability."
 MVLV_research_special_structure_2: "Improved Special Structure"
 MVLV_research_special_structure_2_desc: "An improved version of the special structural material. Although the frame strength problem remains, it can improve reliability to some extent and further reduce costs."
 MVLV_research_special_structure_3: "Advanced Special Structure"
 MVLV_research_special_structure_3_desc: "An advanced version of special structural materials. By integrating the entire structure and simplifying the production process, further cost reductions are possible."
 MVLV_research_special_structure_4: "Future Special Structure"
 MVLV_research_special_structure_4_desc: "This revolutionizes the concept of conventional special structural materials. By introducing G elements into the structural materials, the manufacturing costs of the aircraft frame are significantly reduced."
 
 MVLV_research_add_blade_armor: "Blade Edge Armor"
 MVLV_research_add_blade_armor_desc: "Adds blade edge armor, which becomes an offensive tool in close combat and increases attack power."
 MVLV_research_add_aerial_blade_armor: "Aerial Blade Edge Armor"
 MVLV_research_add_aerial_blade_armor_desc: "Adds aerial blade armor, which emphasizes aerodynamic properties and improves both maneuverability and attack power."
 MVLV_research_special_blade_armor: "Special Blade Edge Armor"
 MVLV_research_special_blade_armor_desc: "Adds super carbon blade edge armor. Production costs will increase, but performance will improve dramatically."
 
 MVLV_research_assault_cannon_1: "Basic Assault Cannon"
 MVLV_research_assault_cannon_1_desc: "The basic Assault Cannon. It is an orthodox design that combines a 120mm cannon and a 36mm chain gun, and has some performance."
 MVLV_research_assault_cannon_2: "Improved Assault Cannon"
 MVLV_research_assault_cannon_2_desc: "An improved Assault Cannon, with improved reliability and ammunition, making it more effective against the BETA."
 MVLV_research_assault_cannon_3: "Advanced Assault Cannon"
 MVLV_research_assault_cannon_3_desc: "A further development of the Assault Cannon, which includes improvements such as the incorporation of a laser range finder to transmit information to the FCS of Tactical Surface Fighter."
 MVLV_research_railgun_1: "Basic Railgun"
 MVLV_research_railgun_1_desc: "A cannon using the Lorentz force was developed with the practical application of G-elements. Development was delayed due to problems with the barrel and electricity, but G-elements solved these issues."
 MVLV_research_railgun_2: "Improved Railgun"
 MVLV_research_railgun_2_desc: "A railgun that has been adjusted to be easier to use and mass-produce, with a view to deploying it on the front lines. Its performance has declined slightly."
 MVLV_research_railgun_3: "Advanced Railgun"
 MVLV_research_railgun_3_desc: "The railgun's performance has been further improved, and it now exerts overwhelming destructive power. When combined with the sensors of Tactical Surface Fighter, it exerts high firepower."
 MVLV_research_support_gun: "Support Cannon"
 MVLV_research_support_gun_desc: "A general-purpose gun capable of both direct strikes and indirect support, designed to be carried and operated by a single Tactical Surface Fighter. Highly effective against large-scale and tank-class vehicles."
 
 MVLV_research_combat_sword: "Close Combat Weapons"
 MVLV_research_combat_sword_desc: "Close Combat Weapons Research (explanation)"

 MVLV_research_shield: "Normal Shield"
 MVLV_research_shield_desc: "A shield coated with a light-resistant coating, which can improve survivability at the cost of reduced mobility."
 MVLV_research_reactive_shield: "Reactive Shield"
 MVLV_research_reactive_shield_desc: "A shield equipped with explosive reactive armor. It is highly destructive against small species that cling to you."

 MVLV_research_large_missile_1: "Basic Large Missile"
 MVLV_research_large_missile_1_desc: "Adds a frame for cruise missiles. It is highly effective against BETA groups, but it places a heavy burden on mobility and various equipment."
 MVLV_research_large_missile_2: "Enhanced Large Missile"
 MVLV_research_large_missile_2_desc: "A reinforced frame for launching cruise missiles. The performance of the missiles themselves has been improved, making them highly effective against small species."
 MVLV_research_small_missile: "General Small Missile"
 MVLV_research_small_missile_desc: "A missile launch frame that can be easily equipped to various Tactical Surface Fighter with simple modifications. It exerts high firepower when suppressing an area, but its maneuverability is reduced."
 
 MVLV_research_add_sensor_1: "Basic Additional Sensors"
 MVLV_research_add_sensor_1_desc: "Add a basic sensor. By using ground radar, it is possible to detect the presence of BETA groups."
 MVLV_research_add_sensor_2: "Improved Additional Sensors"
 MVLV_research_add_sensor_2_desc: "Add a improved sensors, integrating with a laser ranging system to determine the distance to the BETA forces."
 MVLV_research_add_sensor_3: "Advanced Additional Sensors"
 MVLV_research_add_sensor_3_desc: "Add a advanced sensors. By introducing optical sensors, it will be possible to identify the components of the BETA group."

 MVLV_research_deta_link_1: "Basic Data Link"
 MVLV_research_deta_link_1_desc: "Basic data link system. Near-field data links receive information from nearby forces to aid in the decision-making process."
 MVLV_research_deta_link_2: "Improved Data Link"
 MVLV_research_deta_link_2_desc: "Improved data link systems, integrating with theater data networks to further enhance situational awareness."
 MVLV_research_deta_link_3: "Advanced Data Link"
 MVLV_research_deta_link_3_desc: "A more advanced data link system. By integrating commands from a higher command system with information from the surrounding area, it even enables mutual cooperation."
 
 MVLV_research_supplies: "Additional Supplies"
 MVLV_research_supplies_desc: "Part of the weapon mounting section will be converted to accommodate supplies, allowing it to store anything from missiles, ammunition, and propellant, making it useful in long-term battles."

 MVLV_research_custom_sights: "Dedicated targeting device"
 MVLV_research_custom_sights_desc: "Dedicated targeting device (explanation)"
 MVLV_research_custom_shells: "Custom Shells"
 MVLV_research_custom_shells_desc: "Custom Shells (explanation)"

 MVLV_research_maintenance_team_1: "Basic Maintenance Team"
 MVLV_research_maintenance_team_1_desc: "Prepare a dedicated maintenance team for Tactical Surface Fighter. Although the cost will increase, maintenance will improve reliability."
 MVLV_research_maintenance_team_2: "Skilled Maintenance Team"
 MVLV_research_maintenance_team_2_desc: "Providing specialized training for maintenance crews for Tactical Surface Fighter will increase costs further, but will also provide greater reliability."
 MVLV_research_maintenance_team_3: "Frontline Maintenance Team"
 MVLV_research_maintenance_team_3_desc: "Frontline-trained maintenance teams can perform more efficient maintenance with limited resources, but maintaining the rigidity of the entire aircraft becomes more difficult."
 MVLV_research_capture_team: "BETA Captured Team"
 MVLV_research_capture_team_desc: "Various equipment for capturing BETA. Although the overall performance of the aircraft is sacrificed, Tactical Surface Fighter make it possible to obtain specimen samples of BETA."
 

