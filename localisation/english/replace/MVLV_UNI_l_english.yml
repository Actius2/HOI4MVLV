 UNI_low_influence:0 "Security Council"
 UNI_low_influence_desc:0 "The Security Council, which was made up of the five major powers of the United States, the United Kingdom, the Soviet Union, France and China, was forced to accept Japan and Australia as permanent members due to the decline in national power other than the United States caused by the BETA War. However, China and the Soviet Union criticized this as giving a second vote to the West. Even now, differences of opinion continue within the Security Council, and it cannot be said that they are able to plan operations against the BETA efficiently."
 UNI_high_influence:0 "UN-led Security Council"
 UNI_high_influence_desc:0 "The Security Council, which was made up of the five major powers of the United States, the United Kingdom, the Soviet Union, France and China, was forced to accept Japan and Australia as permanent members due to the decline in national power other than the United States caused by the BETA War. The conflict between the East and West was gradually resolved with the restoration of the authority of the United Nations, and humanity was now able to unite and confront the BETA."
 UNI_refugees_army:0 "Evacuation Volunteer Army"
 UNI_refugees_army_desc:0 "Most of the UN Joint Forces are made up of military forces from countries whose territories have been seized by the BETA. They are highly motivated, eager to retake their homeland, but because of this they are often sent to the front lines in harsh conditions. For this reason, there are many governments that refuse to join the UN Forces."
 UNI_refugees_problem_0:0 "UN Refugee Aid"
 UNI_refugees_problem_0_desc:0 "The United Nations is providing assistance to the large number of refugees caused by the BETA War on a global scale, and can recruit refugee volunteers. However, managing the excessive number of refugees requires a lot of resources, and security in the hosting areas is deteriorating."
