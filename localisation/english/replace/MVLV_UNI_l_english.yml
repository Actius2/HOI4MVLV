 UNI_xmosi:0 "XM3"
 UNI_xmosi_desc:0 "The development of the XM3OS is a revolutionary OS that can be considered a remarkable achievement in the history of Tactical Surface Fighter development. This OS will reduce the number of Elite soldiers killed in battle by half."
