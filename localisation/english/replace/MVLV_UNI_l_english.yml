 UNI_focus_tree:0 "UN Forces National Focus Tree"

 mvlv_uni_nf101:0 "The Requisition of Yokohama"
 mvlv_uni_nf101_desc:0 "UN High Command wants to help shore up defenses in Japan with a base on the mainland. The professor in charge of Alternative IV has taken an interest in the Yokohama Hive. We can kill two birds with one stone here, and, as the host country for Alternative IV, the Japanese government would be unable to refuse..."
 mvlv_uni_nf102:0 "Construction of the Yokohama base"
 mvlv_uni_nf102_desc:0 "Construction atop and around the Hive remnants progresses smoothly. The base is being extended into the stab, so that research may be concluded more efficiently on the captured BETA specimens."
 mvlv_uni_nf103:0 "The Advanced Tactical Surface Fighter/Technology And Research Project"
 mvlv_uni_nf103_desc:0 "Popularly known as Project Prominence, the project consists of an international corps of TSF pilots assembled at the United Nations' Yukon Base in Alaska. Their purpose is two-fold: to test several TSFs that are being outfitted with various upgrades, and to serve as an example of international cooperation."
 mvlv_uni_nf104:0 "Increase in Diplomatic Staff"
 mvlv_uni_nf104_desc:0 "We are sending out more envoys in order to more effectively communicate with nations and to prevent misunderstandings."
 mvlv_uni_nf105:0 "Effective Use of Refugees"
 mvlv_uni_nf105_desc:0 "Recruitment campaigns targeting UN refugee camps has resulted in a large increase in manpower, mainly directed toward construction battalions and engineering corps."
 mvlv_uni_nf106:0 "Refugee Training"
 mvlv_uni_nf106_desc:0 "Recent refugee recruits are being trained in modern combat operations, in order to reinforce understrength battalions in Asia."
 mvlv_uni_nf107:0 "Refugee Volunteer Corps"
 mvlv_uni_nf107_desc:0 "In expanding the recruitment campaigns directed at refugees, we've amassed a large group of motivated men and women, ready to stand and fight to take back their lost homes."
 mvlv_uni_nf108:0 "Nationwide Weapons Survey"
 mvlv_uni_nf108_desc:0 "Tactical Fighters are not the only thing being tested at the Yukon base."
 mvlv_uni_nf109:0 "Nationwide Tactical Surface Fighter Survey"
 mvlv_uni_nf109_desc:0 "Developments from Yukon have led to new ideas in TSF design."
 mvlv_uni_nf110:0 "The Ultimate Tactical Surface Fighter"
 mvlv_uni_nf110_desc:0 "The data from the last Valkyrie units, as well as the ideas and technology perfected at the Yukon base, are being used together in order to create the next generation of TSF."
 mvlv_uni_nf111:0 "Discussions With Refugee Volunteer Groups"
 mvlv_uni_nf111_desc:0 "Meetings with the leaders of refugee camps and enclaves have led to a decrease in incidents, as well as an increase in general morale. While tensions have cooled, they have not completely dissipated, and any major disturbances can still threaten to boil over."
 mvlv_uni_nf112:0 "Refugee Independence"
 mvlv_uni_nf112_desc:0 "Continued discussions with camp leaders have led to the creation of "refugee towns". These camps-turned-settlements are governed in part by elected refugees and in part by appointed UN civil administators. While not perfect, this should allow for more freedom than was had in the old camps."

 UNI_207:0 "The Last Graduate"
 UNI_207_desc:0 "This will be the last commissioning ceremony held at Yokohama Air Base."
 UNI_xmos:0 "Miracle OS"
 UNI_xmos_desc:0 "This new OS for Tactical Surface Fighter, which Professor Kouzuki suddenly proposed, was initially met with some puzzling looks, but after actual combat and demonstration tests, it became clear that it was a revolutionary OS. If this OS were to be distributed to all Tactical Surface Fighter, it would drastically reduce the number of soldiers killed in battle."
 UNI_00_unit:0 "Secret Card"
 UNI_00_unit_desc:0 "One of the newly-commissioned officers has been visiting the Professor quite frequently as of late. He's been getting various special missions as of late, and apparently even had a hand in developing the new OS. Clearly the Professor needs him for something..."
 UNI_sadogashima:0 "Operation Ko 21"
 UNI_sadogashima_desc:0 "The Fourth Planning HQ came up with a plan to attack the Sadogashima Island Hive as a test of the 00 Unit's practical use. The Security Council immediately approved the plan, and it has been put into action. This operation is a long-cherished wish of the Japanese Empire, and the UN succeeded in obtaining full cooperation by promising priority supply of XM3s."
 UNI_operation_ouka:0 "Humanity's Last Stand"
 UNI_operation_ouka_desc:0 "Through intelligence analysis by the 00 Unit, the Alternative Fourth Plan Command Center has discovered new facts about the BETA and has recognized the dire situation humanity is in. The time left to preserve the history of humanity is not years or months, but only a few days... The Security Council will advance all operational plans and has decided to use all the forces currently available to humanity to attack the Original Hive."
 UNI_a01:0 "Reconstruction"
 UNI_a01_desc:0 "The A-01 regiment, which played an important role in Alternative 4 and led Operation Ohka to success, was exhausted in repeated fierce battles and was finally disbanded. Professor Kouzuki has begun looking for new pieces to place on the board."
 UNI_vd:0 "The Valkyrie Data"
 UNI_vd_desc:0 "The data left behind by the Valkyries will surely be valuable in the upcoming battle against the BETA. The UN must find a way to utilize this data in order to maintain leadership after the war."

 UNI_blue_flag:0 "Mutual Assessment Test"
 UNI_blue_flag_desc:0 "A large-scale mock battle between test units from each country is planned at the Yukon base. This exercise will promote technical exchanges between test units and will enable new ideas that emerge from competition to be incorporated into development."
 UNI_yukon_base:0 "Yukon Base Reconstruction"
 UNI_yukon_base_desc:0 "Although the Yukon Base terrorist incident claimed many lives, the terrorists were defeated and the base's functions have been restored."


 UNI_theTrueUnitedNation:0 "To Unite Humanity"
 UNI_theTrueUnitedNation_desc:0 "The United Nations must play the role of connecting the many countries that have lost their homelands, truly uniting humanity and bringing together the power of the world."
 UNI_NegotiateWithUSA:0 "Stabilizing American Sentiment"
 UNI_NegotiateWithUSA_desc:0 "As the only former world superpower that still retains a complete fighting force, America's voice throughout the United Nations is self-evident, and we need to advance our plans. We'll have to stabilize their emotions to gain their support."
 UNI_strengthen_the_English_Channel_line:0 "Strengthening the EU's Defense Line"
 UNI_strengthen_the_English_Channel_line_desc:0 "The English Channel defense is the last bulwark to preserve Britain, and if this is breached, plans to use Britain as a base to strike back across Europe will be out of the question, and the English Channel defense will be the last bulwark to maintain the English Channel. We must support the EU must immediately."
 UNI_allayWithJapan:0 "Relaxation of Relations with Japan"
 UNI_allayWithJapan_desc:0 "We are responsible for the casualties caused to Japan by deciding to drop G bombs in Operation Myojo despite Japan's opposition. We must take responsibility for it in order to soften relations with Japan."
 UNI_East_Asian_Emergency_transportation_policy:0 "Greater East Asia Emergency Relief Act"
 UNI_East_Asian_Emergency_transportation_policy_desc:0 "The front lines of the Greater East Asia Alliance are already on the verge of collapse after years of fierce fighting. We must provide immediate and urgent direct assistance, increase the number of United Nations forces, and provide additional equipment support. "
 UNI_StrengthenAfricaFront:0 "Strengthening the African Union"
 UNI_StrengthenAfricaFront_desc:0 "Although the African Union has grown significantly since its inception, its foundations are still too weak."
 UNI_Central_SouthAmericaMobilization:0 "Initial Mobilization of the Americas Act"
 UNI_Central_SouthAmericaMobilization_desc:0 "The countries of Latin America must be mobilized and ready to go to the front in order to shore up our forces."
 UNI_LessonsFromOperationLucifer:0 "The Beginning of Humanity's Counteroffensive"
 UNI_LessonsFromOperationLucifer_desc:0 "Operation Myojo was the first successful large-scale counteroffensive against BETA on the Far East Front, and the first time humans successfully occupied a Hive, proving that humans could defeat the BETA. The dark clouds that had been covering humanity have finally started to clear."
 UNI_JointResearch:0 "International Joint Research"
 UNI_JointResearch_desc:0 "In today's life-or-death situation, there is no point in continuing collusion between different manufacturers, and we need the United Nations to take the lead in integrating the scientific research efforts of each country and conducting international joint research."
 UNI_JointTSFPilotTraining:0 "United Nations Soldier Training Program"
 UNI_JointTSFPilotTraining_desc:0 "Soldiers are a rare elite that is irreplaceable to humanity, and are necessary for flying tactical aircraft. However, in the midst of such an intense war, the number of active-duty personnel is rapidly decreasing, and it is necessary to lead joint training on an international scale to replenish the number of soldiers on the front lines."
 UNI_JointIndustrialProduction:0 "International Industrial Cooperation"
 UNI_JointIndustrialProduction_desc:0 "The pursuit of maximum productivity requires the unification of all industrial production organizations in the world, and the United Nations must directly lead industrial cooperation on a global scale."
 UNI_StandardizedProductionSequence:0 "Internationally Standardized Production Process"
 UNI_StandardizedProductionSequence_desc:0 "As the war situation intensifies, the establishment of globally harmonized standard production processes for all types of equipment has become an unavoidable requirement in order to further improve production capacity. The newly established NLM Industrial Standards Review Committee will ensure the implementation of the new standard on a global scale."
 UNI_StandardizedDataLink:0 "Unified Military Data"
 UNI_StandardizedDataLink_desc:0 "In the near future, there will be a number of large-scale multilateral joint military operations, in which working data links of all countries will be required to achieve the most efficient coordination. need to be unified and upgraded. "
 UNI_JointCommandPost:0 "Multinational Joint Command"
 UNI_JointCommandPost_desc:0 "Cross-border formation of forces requires the commanders of each country to form a joint command that coordinates the command of their respective armies."
 UNI_AmericaIndustryConsolidation:0 "Americas Industry Consolidation Plan"
 UNI_AmericaIndustryConsolidation_desc:0 "This initiative aims to integrate existing industries in Latin America, improve efficiency, and increase production."
 UNI_IncreaseAtlanticRegionFoodProduction:0 "Increase Food Production in the Atlantic Coast"
 UNI_IncreaseAtlanticRegionFoodProduction_desc:0 "To stabilize our food supply, we need to expand synthetic food factories using algae and other key ingredients to the Atlantic coast."
 UNI_SEADevelopment:0 "Southeast Asia Development Plan"
 UNI_SEADevelopment_desc:0 "After losing East Asia, which was the core of the region, it is necessary to develop Southeast Asia more deeply in order to maintain the combat power of the Greater East Asia Alliance while improving its supply capacity. "
 UNI_CooperateWithBolsheviks:0 "Cooperate with the Federal Communist Party"
 UNI_CooperateWithBolsheviks_desc:0 "For various reasons, the Soviet Union is not closely tied to the United Nations. Should this situation improve, the resistance against the BETA will strengthen."
 UNI_EstablishContactInAlaska:0 "Contact in Alaska"
 UNI_EstablishContactInAlaska_desc:0 "The Soviet Union has very rich and valuable experience in the fight against the BETA, and the future reconstruction of North Asia will not be possible without the Soviet Union's efforts. The location for the first meeting was decided at the Soviet Lend-Lease Territory in Alaska."
 UNI_allayWithUSSR:0 "Detente with the USSR"
 UNI_allayWithUSSR_desc:0 "It is true that there were various differences with the Soviet Union in the past, but now it is essential to ease relations and review the current situation."
 UNI_LookIntoTheFuture:0 "Towards the Future"
 UNI_LookIntoTheFuture_desc:0 "The talks have progressed quite well and the time has come for both sides to set common goals for the future."
 UNI_allayWithUFC:0 "Easing Relations with China"
 UNI_allayWithUFC_desc:0 "Like the Soviet Union, there were quite a lot of conflicts between the West amd the East, and even after the BETA war there were many conflicts over issues such as military command, but now is the time to let go of those issues."
 UNI_TaiwanConstructionProtocol:0 "Taiwan Construction Technology"
 UNI_TaiwanConstructionProtocol_desc:0 "Taiwan is the most important base camp for the United Front's continental counteroffensive. Further building up Taiwan will strongly support the United Front and demonstrate our sincerity."
 UNI_JointExerciseWithBaoFengTestFlight:0 "Joint Operation with Storm Squadron"
 UNI_JointExerciseWithBaoFengTestFlight_desc:0 "The J-10X used by the Storm Corps is excellent in close combat, and we should conduct joint exercises with them to obtain more data."
 UNI_ConsolidateAlternativePlans:0 "Consolidate the Alternative Programs"
 UNI_ConsolidateAlternativePlans_desc:0 "The results of the Alternative Programs, which once competed with each other for resources, must be consolidated to maximize their effectiveness."
 UNI_ReuseAL3:0 "Reapply Alternative III"
 UNI_ReuseAL3_desc:0 "The original goal was to train converts who could communicate telepathically with the BETA, but perhaps this project could be used for other purposes as well."
 UNI_YashiroKasumi:0 "Shakasumi"
 UNI_YashiroKasumi_desc:0 "This mysterious girl is one of the few successful members of Alternative III, which was transferred to us from the Soviet Union. Her name is Shaka."
 UNI_FruitofTheNewAL3:0 "Adjust Workforce Planning"
 UNI_FruitofTheNewAL3_desc:0 "The re-application of Alternative III has been quite fruitful and we have been able to re-organize planning structures for efficiency."
 UNI_AdditionalFundForAL4:0 "Support for Alternative IV"
 UNI_AdditionalFundForAL4_desc:0 "Alternative 4, led by Japan, seems to be progressing smoothly, but there is not much time left."
 UNI_EnhanceA01ValkyrieSquadron:0 "Valkyrie Squadron Equipment Enhancement"
 UNI_EnhanceA01ValkyrieSquadron_desc:0 "The Valkyrie special forces that have participated in major battles need to be replaced with superior tactical aircraft. This must be done immediately."
 UNI_PromoteIrinaPyatkh:0 "Promote Irina Pyatkh Up the Chain of Command"
 UNI_PromoteIrinaPyatkh_desc:0 "At the request of Professor Kouzuki, project leader of Alternative 4, former Polish representative Irina Pyatkh has been transferred to the Yokohama base's chain of command."
 UNI_AdjustAL5FocalPoint:0 "Alternative V Direction Change"
 UNI_AdjustAL5FocalPoint_desc:0 "In order to respond to changes in the war situation, it has become necessary to review the implementation priorities of Alternative V."
 UNI_EnhanceOrbitalCorps:0 "Enhanced Orbital Forces"
 UNI_EnhanceOrbitalCorps_desc:0 "In the future, the number of Hive capture operations will increase. More orbital drop troops will be needed for these missions."
 UNI_UNSCJointCommand:0 "Space Force Unified Command"
 UNI_UNSCJointCommand_desc:0 "People around the world make up the United Nations Space Force, and a dedicated Space Force Joint Command is needed to coordinate it. "
 UNI_AftermathOfOperationOuka:0 "Compensation for Operation Ohka"
 UNI_AftermathOfOperationOuka_desc:0 "Operation Ouka was a success, but the cost has been very high."
 UNI_DawnWillCome:0 "Dawn of Humanity's Victory"
 UNI_DawnWillCome_desc:0 "Many people died in the BETA War, but their sacrifices will not be in vain. The light that brightens the long night before us is just around the corner."
 UNI_UNIndustrialProductionReorganiseProtocol:0 "United Nations Industrial Improvement Program"
 UNI_UNIndustrialProductionReorganiseProtocol_desc:0 "In order to cope with the escalating war situation, it is necessary to reorganize industrial production capacity to compensate for the production capacity lost due to territorial exchange."
 UNI_FocusOnTSFProduction:0 "Focus on Tactical Aircraft Production"
 UNI_FocusOnTSFProduction_desc:0 "Tactical aircraft are the most important units for human strategy against the BETA, and we must focus our productivity on them."
 UNI_BalanacedProduction:0 "Increase in Average Production"
 UNI_BalanacedProduction_desc:0 "Tactical aircraft and conventional forces are both essential and should be treated equally."
 UNI_FocusOnCartridgeProduction:0 "Focus on Shell Production"
 UNI_FocusOnCartridgeProduction_desc:0 "The use of tactical aircraft is important, but it is the heavy artillery in the rear that take out large numbers of BETA. We need to produce shells more efficiently in order to keep the guns firing."
 UNI_ImproveTSFQuality:0 "Improve TSF Quality"
 UNI_ImproveTSFQuality_desc:0 "It is always a matter of time before old equipment becomes obsolete, and existing tactical aircraft need to be upgraded to maintain quality that meets the demands of the front line."
 UNI_QuantityOverQuality:0 "Production Expansion"
 UNI_QuantityOverQuality_desc:0 "The BETA are known for their endless numbers, and although our tactical aircraft are vastly superior to BETA, we still need more equipment to continue fighting."
 UNI_AbsorbExternalCartridgeProductionTech:0 "Introduce Advanced Technology From Other Countries"
 UNI_AbsorbExternalCartridgeProductionTech_desc:0 "Countries with more front-line combat experience may have many advanced technologies used to take down large numbers of BETA more effectively."
 UNI_NextGenTSFDevelopment:0 "Development of the Next Generation"
 UNI_NextGenTSFDevelopment_desc:0 "In order to meet the demands from the front lines, we must begin the development of a new generation of tactical aircraft."
 UNI_ClassifiedJointTSFDevWithUSA:0 "US-UN Cooperative Development"
 UNI_ClassifiedJointTSFDevWithUSA_desc:0 "In order to accelerate the development process of next-generation tactical aircraft, we should consider the feelings of manufacturers in other countries, but we should secretly cooperate with the United States."
 UNI_ClassifiedJointTSFDevWithJAP:0 "Japan-UN Cooperative Development"
 UNI_ClassifiedJointTSFDevWithJAP_desc:0 "In order to accelerate the development process of next-generation tactical aircraft, it is necessary to consider the feelings of manufacturers in other countries, but we should secretly cooperate with Japan."
 UNI_InternalNextGenTSFDevelopment:0 "Independent Development"
 UNI_InternalNextGenTSFDevelopment_desc:0 "It is important to complete the development of the next-generation tactical aircraft as soon as possible, but we cannot rely forever on the technology of other manufacturers."
 UNI_4thGenTSFDev:0 "Development of the 4th-Generation"
 UNI_4thGenTSFDev_desc:0 "Now that the new 3rd generation tactical aircraft is fully operational, it's time to think about opening the door to a new era, aiming for a next-generation tactical aircraft that will overwhelmingly surpass the BETA."
 




 UNI_ProvideAidForJapanDefence:0 "Japanese Defense Assistance"
 UNI_ProvideAidForJapanDefence_desc:0 "Operation Myojo has just ended. We should establish an Allied base atop the captured Yokohama hideout to support the defense of Japan and monitor the development of the Alternative 4 program. Japan's prime minister seems willing to provide Shiranui's technology in return."
 UNI_RestateVancouverTreaty:0 "Reaffirming the Vancouver Agreement"
 UNI_RestateVancouverTreaty_desc:0 "Various opinions have been expressed by participating countries regarding the ownership of the occupied Yokohama nest, which will be managed by us in accordance with the Vancouver Agreement."
 UNI_ConcludeOperationLucifer:0 "Summary of Operation Myojo"
 UNI_ConcludeOperationLucifer_desc:0 "Operation Myojo was the first BETA nest successfully captured by humanity, but it was a very costly victory and we must learn from our mistakes. "
 UNI_RevealGBombCapability:0 "G bullet announcement"
 UNI_RevealGBombCapability_desc:0 "'The power of the hydrogen bomb used for the first time in Operation Myojo was so frightening that we had to publicly reveal the power of this brand new strategic weapon."
 UNI_PrepareForProjectProminence:0 "Steady progress of Joel Project"
 UNI_PrepareForProjectProminence_desc:0 "As a large-scale multilateral joint tactical aircraft development project, we have already gained combat experience from many front-line countries, which will greatly benefit the development of tactical aircraft. "
 UNI_RefugeeResttlement:0 "Adequate settlement of refugees"
 UNI_RefugeeResttlement_desc:0 "Refugee resettlement cannot be delayed and must be resettled properly. The downfall of the country was not their fault, and they are now paying the price for our mistakes. "
 UNI_EnhanceSecurityForces:0 "Strengthen security forces"
 UNI_EnhanceSecurityForces_desc:0 "At a time when humanity is teetering between life and death, we don't have the energy or time to care about the lives of refugees."
 UNI_RefugeeEnlistment:0 "Refugee Recruitment"
 UNI_RefugeeEnlistment_desc:0 "Many young refugees are reluctant to leave their homelands and flee. This will reduce the pressure on refugee camps."
 UNI_RefugeeVolunteerArmy:0 "Refugee Volunteer Army"
 UNI_RefugeeVolunteerArmy_desc:0 "If the war has progressed to this point, no one, not even the refugees who have escaped from hell, can prevent themselves from being drawn into the war. Building an army made up mainly of displaced people would strengthen the defense, without expecting poorly trained people to fill in the gaps."
 UNI_EnhanceUNReputation:0 "Restore the authority of the United Nations"
 UNI_EnhanceUNReputation_desc:0 "Due to a series of failed operations prior to Operation Myojo, it has been viewed with skepticism by members of the Security Council. They must prove their ability to lead human nations through achievements such as Operation Myojo and response to refugee issues."
 UNI_FocusOnAL4:0 "Focus on Alternative IV"
 UNI_FocusOnAL4_desc:0 "Given the potentially dangerous Alternative V proposed by the US, it would be better to focus on Alternative IV, which is underway in Japan."
 UNI_EmergencySecurityCouncilSummit:0 "Emergency Security Council meeting"
 UNI_EmergencySecurityCouncilSummit_desc:0 "The training base is unexpectedly attacked by BETA, and Dr. Katsuki proposes the need for an emergency security council to alert bases in all countries to prevent similar attacks."
 UNI_WorldJointDevelopment:0 "Researchers working together"
 UNI_WorldJointDevelopment_desc:0 "Operation Ohka gave humanity time to find true hope. If inspired researchers work together, victory for humanity will definitely be achieved."
 UNI_YashiroKasumi_tt:0 "Yashiro Kasumi will be available as a general"
 UNI_YashiroKasumi_tt_desc:0 ""

 UNI_category:0 "Special Powers of the Security Council"
 UNI_category_desc:0 "The Security Council is the brains that control the UN joint forces. As such, it holds various privileges."
 UNI_UNI_give:1 "Order to provide equipment to [From.GetName]"
 UNI_UNI_give_desc:0 "The UN Joint Forces does not have the industrial capacity to maintain its own military. In particular, Tactical Surface Fighter are provided by contingent forces from each country, but the Security Council has the authority to order the provision of equipment from each country."
 UNI_xmosd_category:0 "XM3"
 UNI_xmosd_category_desc:0 "XM3 is an OS with enormous potential. There is no way to not make effective use of it. Dr. Kouzuki is working in various fields to promote this OS."
 UNI_xmosd_give:1 "Providing XM3 to [From.GetName]"
 UNI_xmosd_give_desc:0 "By demanding something in return for providing XM3, it will be possible to increase funds available to each party."
 UNI_xmosdg:1 "Request for an increase in payment to [From.GetName]"
 UNI_xmosdg_desc:0 "If we ask countries that benefit from XM3 to make additional payments, they will likely be happy to oblige."
 UNI_xmos_mission:0 "Factory Payment"
 UNI_operation_ouka_category:0 "Operation Ouka"
 UNI_ouka_phase_1_decision:0 "Phase 1 -Frontline diversion-"
 UNI_ouka_phase_2_decision:0 "Phase 2 -Securing the gate first-"
 UNI_ouka_phase_3_decision:0 "Phase 3 -Main Force Charges In-"

 MVLV_command_ouka_decision:0 "Seize authority for Operation Ohka"
 MVLV_command_ouka_tt:0 "Seize authority for Operation Ohka"

 mvlv_uni.1.t:1 "The last graduate"
 mvlv_uni.1.d:1 "Today, the Guard Badge was awarded to the trainees who completed the training course at the Guard Training School at Yokohama Air Base. All the newly-commissioned second lieutenants who graduated from the training school will be assigned to the A-01 Regiment."
 mvlv_uni.1.a:1 "Congratulations, Lieutenant." 
 mvlv_uni.9.t:1 "00 Unit"
 mvlv_uni.9.d:1 "Dr. Yuuko Kazuki, head of the Alternative 4 Project Command, reports that the 00 Unit, which was thought to be impossible, has been completed. The 00 Unit is a trump card for reading the BETA and obtaining information, and its completion will also make it possible to use the XG in actual combat."
 mvlv_uni.9.a:1 "The day of victory for humanity is near"
 mvlv_uni.5.t:1 "Humanity's Last Stand"
 mvlv_uni.5.d:1 "Operation Ouka is a diversionary operation against all the hives on the front lines, and an orbital drop force will attack the original hive. In an imperfect situation, the time has finally come for the operation to be launched, thanks to the desperate efforts of the people. In early 2002, the original hive attack force, A-01, takes off, risking the fate of all mankind, under the sacrifice of countless nameless soldiers..."
 mvlv_uni.5.a:1 "Fight with all your might" 
 operation_ouka_tt:1 "§R The leading nation must direct the operation with their decisions! §!" 
 mvlv_uni.7.t:1 "Operation Ohka successful"
 mvlv_uni.7.d:1 "The assault team suffered heavy losses but succeeded in destroying the G-1 target and disabling the Original Hive. This will significantly reduce the BETA's ability to respond."
 mvlv_uni.7.a:1 "They are the heroes!" 
 mvlv_uni.6.t:1 "Operation Ohka failed"
 mvlv_uni.6.d:1 "Operation Ohka, on which humanity risked its fate, has failed. Information about humanity's tactics and weapons has already been spread to each Hive by the A-target, and humanity's weapons will likely be rendered useless."
 mvlv_uni.6.a:1 "Hurry and launch G-bombs on all Hives..." 
 mvlv_uni.8.t:1 "New species"
 mvlv_uni.8.d:1 "A never before seen BETA has appeared in the Evensk Hive.\nThis new species appears to be a combination of a fortress class and a heavy ray class, enlarged to a gigantic size, and has combat powers beyond human comprehension.\nThis is likely the first BETA created solely for combat."
 mvlv_uni.8.d2:1 "Emergency from the Satellite Monitoring Center!\nA super-giant BETA, said to have been spotted at the Evensk Hive, has been confirmed to have appeared in each hive.\nThis new species, which appears to be a combination of a fortress-class and a heavy ray-class, has been enlarged to a gigantic size and possesses combat power beyond human comprehension.\nIf that entity is left unchecked, there is no doubt that humanity will suffer devastating damage."
 mvlv_uni.8.a:1 "Kill that towering bastard!!"
 mvlv_uni.10.t:1 "The savior won't come"
 mvlv_uni.10.d:1 "There will be no savior in this world. You have to pave your own way."
 mvlv_uni.10.a:1 "Let's begin the briefing"
 mvlv_uni.11.t:1 "XM3"
 mvlv_uni.11.d:1 "XM3, an OS for Tactical Surface Fighter developed at the suggestion of Dr. Kazuki, has completed its verification tests and will be installed on combat aircraft. XM3 is an unprecedented, revolutionary OS that will bring great benefits to military personnel around the world."
 mvlv_uni.11.a:1 "How much will member states pay to provide this?"
 mvlv_uni.12.t:1 "Courtesy of XM3"
 mvlv_uni.12.d:1 "Dr. Kazuki of the United Nations has offered to provide our country with XM3, a new OS for Tactical Surface Fighter that was developed in secret. However, this would involve the confiscation of the aircraft for testing purposes and the provision of a fair amount of funding, so we will need to determine whether these costs are worth it..."
 mvlv_uni.12.a:1 "Damn fox... I'll trade you for my tactical plane." 
 mvlv_uni.12.b:1 "You fox girl... I'll give you the lease on the factory."
 mvlv_uni.12.c:1 "wait a moment!"
 MVLV_event_xmos_tt:1 "§R By building up a stockpile of 250 or more Tactical Surface Fighter, you can purchase the XM3 at the factory without paying. §!"
 mvlv_uni.12.f:1 "too high!"
 mvlv_uni.13.t:1 "Profit"
 mvlv_uni.13.d:1 "Dr. Kazuki's OS seems to have been attractive to member countries. This will help secure funds that can be diverted to various areas."
 mvlv_uni.13.a:1 "Just as I intended."
 mvlv_uni.14.t:1 "Mutual Assessment Test"
 mvlv_uni.14.d:1 "The Blue Flag exercise was held at the Yukon Air Force Base in Tokyo, where test units from around the world competed against each other to gain more insight into the development of Tactical Surface Fighter."
 mvlv_uni.14.a:1 "I hope there will be no accidents."
 mvlv_uni.15.t:1 "First Strike"
 mvlv_uni.15.d:1 "Yukon, bustling with activity during the Blue Flag exercise, is suddenly hit by a disaster. A mysterious organization steals the Tactical Surface Fighter from the base and takes over the base. In addition, there are reports that the BETA research facility has been attacked and that the captured research BETA has escaped..."
 mvlv_uni.15.a:1 "What is going on?!"
 mvlv_uni.16.t:1 "Statement"
 mvlv_uni.16.d:1 "We have taken over the Yukon base. The reason is to demand the release of refugees who are being treated cruelly all over the world. The UN is using the materials and resources that should be used for refugees for a game of mutual comparison exercises. This is absolutely unacceptable. Therefore, we are taking 100,000 Yukon citizens hostage and demanding that refugees be given the right to vote, that the members of the Refugee Liberation Front be released immediately, and that more aid be given to refugees."
 mvlv_uni.16.a:1 "Stop this damn video now!"
 mvlv_uni.17.t:1 "Source: UN Joint Command Military Staff Committee"
 mvlv_uni.17.d:1 "To: Area Command\nEach area command will provide one Tactical Surface Fighter regiment under the command of the United Nations Joint Command Direct Command."
 mvlv_uni.17.a:1 "It can't be helped..."
 mvlv_uni.18.t:1 "Expeditionary Force"
 mvlv_uni.18.d:1 "Even the United Nations, a country that is said to be losing influence, can easily gather equipment if it has Security Council privileges."
 mvlv_uni.18.a:1 "Of course."
 mvlv_uni.19.t:1 "Orbital Descent"
 mvlv_uni.19.d:1 "The orbital drop force that entered earlier is currently taking control of the area around SW115. However, we cannot be optimistic. §R Force losses have far exceeded expectations. §!We must decide immediately whether to enter the main force as planned§! or enter with the current orbit§!."
 mvlv_uni.19.a:1 "Enter with the current lap"
 mvlv_uni.19.b:1 "Enter on the next lap as planned"
 mvlv_uni.20.t:1 "Operation Sadogashima"
 mvlv_uni.20.d:1 "We will be conducting a practical operational test of the 00 unit. The first objective of this operation is to support XG-72b, who is leading the hive. Taking over the hive is not the main objective. We must absolutely avoid losing the 00 unit. I wish everyone the best of luck."
 mvlv_uni.20.a:1 "I wish you success in your exams"
 mvlv_uni.21.t:1 "Yokohama base is attacked"
 mvlv_uni.21.d:1 "Suddenly, the sound of gunfire echoed through the Imperial Capital, where people were celebrating the fall of the Sado Island Hive. BETA had appeared in Machida, near the Imperial Capital. They were believed to be remnants of the Sado Island Hive, and their goal was to retake the Yokohama Hive. The BETA must be eliminated at all costs."
 mvlv_uni.21.a:1 "Please send in reinforcements as soon as possible!"
 mvlv_uni.22.t:1 "Large-scale attack on Yokohama base"
 mvlv_uni.22.d:1 "Suddenly, the sound of gunfire echoed through the Imperial Capital, which was in mourning after the news of the failure to capture the Sado Island Hive. BETA had appeared in Machida, near the Imperial Capital. Furthermore, XG-72b was destroyed by BETA that had invaded the Great Depths. They were believed to be a group of BETA belonging to the Sado Island Hive, and their goal was thought to be to recapture the Yokohama Hive. The BETA must be eliminated at all costs."
 mvlv_uni.22.a:1 "Please send in reinforcements as soon as possible!"
 mvlv_uni.23.t:1 "Roar to the Future"
 mvlv_uni.23.d:1 "The BETA's tactics were superior to ours. Most of the advance forces that had rushed in were wiped out before A-04 could even land. It is no exaggeration to say that A-01 is the only unit left in the original hive. The fate of humanity rests in their hands."
 mvlv_uni.23.a:1 "All we can do now is pray..."
 mvlv_uni.24.t:1 "New A-01"
 mvlv_uni.24.d:1 "Due to repeated requests from Dr. Kazuki, many excellent people, including former Soviet soldiers and defectors from the United Nations, have gathered at the Yokohama base. They will be of great help in the promotion of the Fourth Plan."
 mvlv_uni.24.a:1 "That's a bit unexpected."
 mvlv_uni.25.t:1 "New OS demonstration test"
 mvlv_uni.25.d:1 "The new OS demonstration test proposed by Dr. Kazuki turned out to be a disaster. BETA escaped from the BETA research facility and attacked the training unit, causing devastating damage. The damage was too great for the number of BETA, so the headquarters requested an increase in the base's military strength."
 mvlv_uni.25.a:1 "I had no idea I was so complacent about peace!"
 mvlv_uni.26.t:1 "Request for preparation of original Hive attack plan"
 mvlv_uni.26.d:1 "Dr. Yuuko Kazuki, head of the Alternative Fourth Plan Command Headquarters, reported that the 00 Unit, which was thought to be impossible, had been completed. The 00 Unit is a trump card for reading the BETA and obtaining information, and its completion will also make it possible to use XG in actual combat. This makes a major counterattack against the BETA a reality. As a result, the United Nations has requested that all countries begin preparations for operations."
 mvlv_uni.26.a:1 "Get Ready"
 mvlv_uni.27.t:1 "UN Security Council Resolution 3666"
 mvlv_uni.27.d:1 "The Yokohama attack resulted in many casualties. To add to the wounds, a shocking truth was revealed. BETA has analyzed our information and it is highly likely that they will be able to take complete action within a few weeks. As a result, a resolution has now been passed to bring forward the long-planned operation to capture the A-type target. We must carry out a diversionary attack on all the hives on the front lines in accordance with the launch of Operation Ouka. This is the final battle that will decide the survival of humanity."
 mvlv_uni.27.a:1 "There is no time to waste"
 MVLV_ouka_setting_tt:1 "§R Gain core state bonuses during Operation Ohka. §!"
 mvlv_uni.27.b:1 "We will also take part in this desperate operation."
 MVLV_ouka_setting2_tt:1 "§R Get a small core bonus and airborne attack bonus during Operation Sakura. Make an airborne drop in Phase 2! §!"
 mvlv_uni.28.t:1 "Operation Ohka Phase 1"
 mvlv_uni.28.d:1 "With Operation Ohka Phase 1 now underway, we must carry out a diversionary attack on all Hives on the front lines."
 mvlv_uni.28.a:1 "Launch the operation"
 mvlv_uni.29.t:1 "Operation Ohka Phase 2"
 mvlv_uni.29.d:1 "With the announcement of Operation Ouka Phase 1, nations assigned to the operation will immediately descend on §Y `Gate` and the surrounding area§! to secure an entry point for the coming Phase 3 assault forces and conduct a §R diversion! §!"
 mvlv_uni.29.a:1 "Best of luck"
 mvlv_uni.30.t:1 "Operation Ohka: Final Stage"
 mvlv_uni.30.d:1 "Operation Ouka was a diversionary operation against all the hives on the front lines, and an orbital drop force was to attack the original hive. In an imperfect situation, the time finally came for it to be launched, thanks to the desperate efforts of the people. In early 2002, the original hive attack force, A-01, descended on the battlefield where the fate of all mankind depended, under the sacrifice of countless nameless soldiers."
 mvlv_uni.30.a:1 "Everything was entrusted to them"
 mvlv_uni.31.t:1 "Roar to the Future"
 mvlv_uni.31.d:1 "The BETA's tactics were superior to ours. Most of the advance forces that rushed in were wiped out before A-04 could even land. It is no exaggeration to say that the A-01 forces are the only ones left in the original hive. Moreover, they seem to have suffered heavy damage from the numerous beam-class interceptions... But even so, we have no choice but to believe them."
 mvlv_uni.31.a:1 "All we can do now is pray..."
 mvlv_uni.32.t:1 "[FROM.GetName] population growth"
 mvlv_uni.32.d:1 "It has been reported that the population of [FROM.GetName] appears to be increasing significantly based on information observed by the Surveillance Satellite Camera Information Center. If this is true, it is highly likely that there is a large-scale outbreak based on the statistics so far. Thinning may be necessary if necessary."
 mvlv_uni.32.a:1 "understood."
 mvlv_uni.33.t:1 "The requisition of Yokohama"
 mvlv_uni.33.d:1 "As a result of the UN resolution, it was announced that Yokohama would be seized and a base would be built there."
 mvlv_uni.33.a:1 "One step forward"
 mvlv_uni.33.b:1 "It can't be helped"
 mvlv_uni.34.t:1 "[FROM.GetName] population saturation!"
 mvlv_uni.34.d:1 "Information collected by the Satellite Camera Information Center has revealed that the population of [FROM.GetName] has reached saturation and is in a state of large-scale invasion. We must prepare our defenses immediately."
 mvlv_uni.34.a:1 "All hands, defense position!"

 mvlv_uni.35.t:1 "[FROM.GetName] population saturation!"
 mvlv_uni.35.d:1 "Intelligence collected by the Satellite Camera Intelligence Center has revealed that the population of [FROM.GetName] has reached saturation point and is launching a large-scale attack."
 mvlv_uni.35.a:1 "All hands, defense position!"
 
 mvlv_uni.36.t:1 "Signs of [FROM.GetName]'s Underground Invasion"
 mvlv_uni.36.d:1 "Sensors on the front lines have detected vibrations that appear to be an underground BETA invasion. We need to prepare our defenses immediately."
 mvlv_uni.36.a:1 "All hands, defense position!"
 
 mvlv_uni.37.t:1 "[FROM.GetName] Underground Invasion!"
 mvlv_uni.37.d:1 "BETA are invading from underground! Check the front line and begin defenses immediately!"
 mvlv_uni.37.a:1 "All hands, defense position!"
 
 mvlv_uni.39.t:1 "Decreasing momentum of [FROM.GetName]"
 mvlv_uni.39.d:1 "Information collected by the Surveillance Satellite Camera Information Center has revealed that the scale of [FROM.GetName]'s invasion is declining. It is believed that the large-scale invasion has subsided."
 mvlv_uni.39.a:1 "Don't let your guard down"
 
 mvlv_uni.40.t:1 "BETA erupts from occupied [FROM.GetName]"
 mvlv_uni.40.d:1 "The unit has reached the deepest part of [FROM.GetName]... Emergency communications have come in from all over the invading force. \nA large number of BETA have appeared out of nowhere. \nWe must deal with it immediately."
 mvlv_uni.40.a:1 "Deal with emergencies!"