l_english:

 GEU_focus_tree: "Greater East Asia Co-Prosperity Sphere National Focus Tree"
 geug_1: "Stop the Smuggling"
 geug_1_desc: "Drug organizations such as KODA are rampant within the Greater East Asia Co-Prosperity Sphere, wreaking havoc in the country, especially in the front-line areas. There are even stories about them selling drugs to the soldiers on the front lines. We have been investigating since '98, but it is extremely difficult to find them because they operate in areas close to the front lines. We should consider increasing our forces."
 geug_3: "Settlement"
 geug_3_desc: "For over a year, we have been crushing KODA's hideouts and sometimes even retreating, but we have finally found a place that seems to be their headquarters. Let's settle this here."
 geug_4: "Effective Utilization"
 geug_4_desc: "We were successful in taking out usable parts from the factory that KODA seemed to have used. The facilities are so well-equipped that it's hard to believe they're just terrorists, and there are suspicions of connections with RLF and others, but for now, let's celebrate the fact that we've removed a threat to us."
 geug_5: "Unexpected Profit"
 geug_5_desc: "A shocking report came in from the troops who are continuing to investigate KODA's headquarters. They discovered a facility where BETA had been captured and researched. We will immediately dispatch a scientific investigation team and relocate this to our research institution."
 geug_6: "Too Much"
 geug_6_desc: "We were able to find out the location of the resource accumulation site from KODA's prisoners, and we were faced with an incredibly shocking sight. We discovered a pile of construction materials at a simple port with many unidentified small transport ships. This could be useful for our national defense."
 geug_7: "Refugees or Terrorists"
 geug_7_desc: "There were more tribes living in the territory of the Shan State Republic, which was controlled by KODA, and members of KODA than expected. We can recruit soldiers from among them, but there are many who oppose adding former terrorists to the army."
 geug_8: "Former Terrorist Instruction Unit"
 geug_8_desc: "Many of the former members of KODA, who had been living in the front-line areas for a long time, had an unusually large amount of knowledge about anti-BETA warfare. It might be more beneficial to organize them into an instruction unit rather than assigning them directly to regular units."
 geug_9: "Researcher of Unknown Origin"
 geug_9_desc: "Former KODA researchers were assigned to the research institute where the BETA research facility was relocated. They have an unusually large amount of knowledge, but they did not speak at all about their origins. However, they proposed to cooperate with us on the condition of the safety of their identity."
 geu_join: "Seeking Aid"
 geu_join_desc: "It has been several years since we formed the Greater East Asia Co-Prosperity Sphere and moved away from the direct command of the United Nations, but we still cannot develop equipment or establish tactics on our own. The front line is gradually retreating and the union will collapse as it is. There are still many conflicts between member countries, and it takes a lot of time to unify their intentions. Shouldn't we seek help from outside the country?"
 geu_rep1: "Exchange with Japan"
 geu_rep1_desc: "Japan, which has just fought a homeland battle, should have the latest tactics. Japan, which has been actively investing in our territory, such as relocating factories, may be able to help us."
 geu_rep2: "Aid Supplies"
 geu_rep2_desc: "The United Nations, which could not bear our plight, notified us that they would provide us with funds. We did not have a good impression of the United Nations, but we cannot refuse this offer, which is more than anything else."
 geu_rep3: "Fundraising"
 geu_rep3_desc: "We have been actively lobbying in the diplomatic arena and have succeeded in drawing out considerable aid. With this, we can equip ourselves for the counterattack."
 geu_rep4: "Active Investment"
 geu_rep4_desc: "There are many resources dormant in Southeast Asia, where we are based. By actively exploring this, we can obtain additional sources of funds."
 geu_rep5: "Increase in Contributions"
 geu_rep5_desc: "The United Nations has asked for an increase in contributions. This is a return for the aid we have received so far, and at the same time, they say they will dispatch researchers. We, who have been receiving aid for free until now, have no choice but to accept this offer."
 geu_rep6: "Depleting Oil"
 geu_rep6_desc: "Oil, which we have been mining for many years, was our main export, but reports have come up that this is about to run out in some oil fields. If this continues, we will lose an important source of funds. The council decided to instruct companies to shift to gas extraction as a substitute."
 geu_rep7: "Tactical Surface Fighter Purchase"
 geu_rep7_desc: "With the funds prepared, we can purchase the latest Tactical Surface Fighters."
 geu_rep8: "Research Investment"
 geu_rep8_desc: "With the cooperation of the United Nations, our research institutions have been able to expand their scale significantly."
 geu_rep9: "Efficient Military Structure"
 geu_rep9_desc: "The latest tactics brought by the UN forces have greatly improved our army's mobility during combat."
 geu_rep10: "Jungle Highway"
 geu_rep10_desc: "Improve the supply route in areas with dense jungle."
 geu_rep11: "Establishment of Space Force"
 geu_rep11_desc: "We will establish the Greater East Asia Co-Prosperity Sphere Air and Space Force by inviting a tactical drop instruction team and purchasing retired armored destroyers from the UN Joint Forces."
 geu_rep12: "Together with the UN"
 geu_rep12_desc: "With repeated support from the United Nations, our feelings towards the United Nations have become very good. There are probably not many member countries who are dissatisfied with entering under the command of the United Nations as before. Now is the time for us to unite under the flag of the United Nations."
 geu_is_god: "Aiming for Unity"
 geu_is_god_desc: "We, the Greater East Asia Co-Prosperity Sphere, were formed as a community of East Asian countries, keeping a certain distance from the United Nations, but even after several years since its formation, the governments of each country cannot unify their intentions, and even the army is not under control. In this state, we will collapse due to pressure from the United Nations or BETA. We must unite to protect the principles of formation."
 geu_go1: "Refusal to Pay"
 geu_go1_desc: "The contributions we pay to the United Nations are a heavy burden for our small country union. Even if the support from the United Nations decreases, it would be a cheap price if we could avoid paying this."
 geu_go2: "Financial Integration"
 geu_go2_desc: "By managing the finances of the member countries in the union headquarters, we were able to find waste and secure a certain amount of funds."
 geu_go3: "Hold Out"
 geu_go3_desc: "Tactics relying on Tactical Surface Fighters are the mainstream worldwide, but in a small country like us, we can't afford Tactical Surface Fighters and the like. We should invest in establishing defense tactics with regular forces."
 geu_go4: "Change of Consciousness"
 geu_go4_desc: "As the union headquarters began to move actively, the member countries also gradually changed to a cooperative attitude. Information from the front line and tactical information that had not been reported to the headquarters until now began to be reported, and we were able to gain many tactical lessons."
 geu_go5: "Anti-Laser Tactics"
 geu_go5_desc: "Until now, we have relied on the United Nations for dealing with laser classes, but with the activation of the Mandalay Hive, the number of laser classes has increased and the UN forces alone cannot keep up with the response. We should also learn and invest."
 geu_go6: "Successful Call"
 geu_go6_desc: "The attempt to establish a joint staff office with the unanimous agreement of all member countries is on the verge of success. With the increase in supporters led by India and Korea, our army will become even stronger!"
 geu_go7: "Amended Jakarta Declaration"
 geu_go7_desc: "Today, the amendment to the Jakarta Declaration was approved by the council. Although this does not completely resolve the previous obstacles, it is certain that the establishment of a cooperation system among countries will accelerate further!"
 geu_go8: "Propaganda"
 geu_go8_desc: "With the cooperation between governments, the union has officially started propaganda to the people to seek unity."
 geu_go9: "Expansion"
 geu_go9_desc: "The wasteful mechanisms of the union have been improved, and the impact of being able to produce appropriate equipment and conscription has resulted in the establishment of many new units."
 geu_go10: "Increase in Firepower"
 geu_go10_desc: "Quickly annihilate BETA with improved surface suppression capability by shelling."
 geu_go11: "Improved Tax Revenue"
 geu_go11_desc: "The management of finances by the headquarters has led to an increase in tax revenue."
 geu_go12: "Final Solution"
 geu_go12_desc: "We are one step away, just one step away from becoming a truly unified union. Once that happens, we will be able to transform into a powerful union that can compete with the world."
 geu_go13: "Integrated Research Institute"
 geu_go13_desc: "The integration of research institutions in each country has improved our research efficiency more than ever before."
 geu_go14: "Amended Jakarta Declaration"
 geu_go14_desc: "Finally, the Jakarta Declaration has been amended, and centralization to the union headquarters has been stipulated. With this, we can overcome various vested interests and unite to advance towards the recovery of our homeland!"
 geu_go15: "Expansion of Influence"
 geu_go15_desc: "Our influence has also expanded in diplomatic terms. It is possible to obtain a lot of funds by working on various countries."
 geu_ghard1: "Emergency Deployment"
 geu_ghard1_desc: "In order to repel the BETA that is approaching, we will urgently deploy new Tactical Surface Fighters."
 geu_ghard2: "Emergency Conscription"
 geu_ghard2_desc: "We will increase the number of people in the factory as an emergency measure and rush to increase military supplies."
 geu_ghard3: "Import of Tactical Surface Fighters"
 geu_ghard3_desc: "We will urgently purchase used Tactical Surface Fighters from various countries and deploy them to the front line."
 geu_ghard4: "Emergency Investment"
 geu_ghard4_desc: "We will also urgently invest in basic industries that support the rear, dispatch conscripted personnel, and expand industries that support the front line."
 geu_ghard5: "Recruitment of Military Advisors"
 geu_ghard5_desc: "We can't afford to be formal in the face of the crisis of the union. We will call on talents from all over the world who can help us."
 geu_ghard8: "Internationalization of Research"
 geu_ghard8_desc: "By investing in global research institutions, we can also benefit."
 geu_ghard9: "National Unity"
 geu_ghard9_desc: "The people have no choice but to endure this situation, but we will not neglect propaganda efforts to dispel dissatisfaction and fear."
 geu_ghard10: "Unique Tactics"
 geu_ghard10_desc: "With the cooperation of the tribes who used to live in the remote areas of our union's territory, we have succeeded in establishing tactics in our territory. We should counterattack before the terrain is devastated by BETA."
