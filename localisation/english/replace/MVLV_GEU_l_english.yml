####ideas
 GEU_jp_support: "Factory Relocation by Japan"
 GEU_jp_support_desc: "Japan, which had its territory invaded by BETA, relocated many military supplies production bases to Southeast Asia. This also benefits the Greater East Asia Co-Prosperity Sphere, which is the relocation destination."
 GEU_ast_support: "Active Support from Australia"
 GEU_ast_support_desc: "For Australia, Southeast Asia is a shield to protect the country from BETA. Therefore, Australia is actively supporting the Greater East Asia Co-Prosperity Sphere."
 GEU_jacaruta: "Jakarta Declaration"
 GEU_jacaruta_desc: "The Greater East Asia Co-Prosperity Sphere is a community established jointly by Southeast Asia, India, and Korea, but because many countries gather, the equipment and operations in the military are not unified at all, causing significant obstacles to military actions. The Jakarta Declaration, which aimed to establish an institution to unify equipment and operations to solve this, was concluded. However, even the prospects for the establishment of the institution have not yet been established, and confusion is expected to continue for a while."
 GEU_KODA: "Shan State Republic Issue"
 GEU_KODA_desc: "In the 1980s, Southeast Asia was a lawless area where drug smuggling was rampant. The hearts of people who were decadent from the never-ending war were soaked in drugs. There are those who made a big profit from drug smuggling in Southeast Asia. The man named Khun Sa armed himself to cover up drug smuggling and made up a country. That's the Shan State Republic. And after Khun Sa left, this armed organization is operating under the name of KODA."
