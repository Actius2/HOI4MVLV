##events
 mvlv_chi.1.t: "The First Group of Refugees Has Evacuated"
 mvlv_chi.1.d: "There is a very long line from the northern part of Hainan Island to the southern port of Hainan Island. All the residents are dragging their families and carrying bags of various sizes filled with belongings, waiting to board the ship. Within one month, all the residents closest to the Qiongzhou Strait defense line boarded the ferry to Tainan at once."
 mvlv_chi.1.a: "Now, it's time to head west."
 mvlv_chi.2.t: "The Second Group of Refugees Has Evacuated"
 mvlv_chi.2.d: "There is a very long line from the western part of Hainan Island to the southern port of Hainan Island. All the residents are dragging their families and carrying bags of various sizes filled with belongings, waiting to board the ship. Within one month, all the residents of the western part of Hainan Island boarded the ferry to Tainan at once."
 mvlv_chi.2.a: "Next is the southeast."
 mvlv_chi.3.t: "The Third Group of Refugees Has Evacuated"
 mvlv_chi.3.d: "All the third group of evacuees from the southeastern part of Hainan Island boarded the ferry to Tainan. The remaining residents are happy to live or die on Hainan Island. The government respects their choice and provides support to all those who volunteer to stay. They are given weapons and receive militia training."
 mvlv_chi.3.a: "The evacuation is over. Should we continue to defend Hainan?"
 mvlv_chi.4.t: "Emergency Alert"
 mvlv_chi.4.d: "A large number of BETA crossing the sea and approaching the coast of Hainan Island have been detected!"
 mvlv_chi.4.a: "All defenders enter level 1 combat readiness"
 mvlv_chi.5.t: "The Hainan Defense Line is Standing Still"
 mvlv_chi.5.d: "After completing the evacuation mission, the Central Military Commission decided to continue holding Hainan Island in order to contain BETA in the Chongqing hive and reduce the defense pressure on the Taiwan Strait. Every few days per 100, the Central Military Commission visits the defense line itself to encourage the soldiers and brings back letters and condolences to the soldiers."
 mvlv_chi.5.a: "Comrades, you are all heroes"
 mvlv_chi.6.t: "Fall of Hainan"
 mvlv_chi.6.d: "Before completing the evacuation mission, BETA broke through the defense line and began to cause great confusion on Hainan Island. The places they passed were in chaos, and no one survived."
 mvlv_chi.6.a: "National Shame"
 mvlv_chi.6.b: "Let's Disappoint People"
 mvlv_chi.6.c: "We'll Do Our Best, But It's Still Not Enough"
 mvlv_chi.7.t: "Fall of Hainan"
 mvlv_chi.7.d: "After completing the evacuation mission, the central government believed that it could contain the BETA in the Chongqing hive and reduce the defense pressure on the Taiwan Strait by defending Hainan Island. However, there was no need to defend Hainan Island, and due to the strong pressure from BETA, it was decided to withdraw all forces from Hainan Island, and the fall of Hainan Island was announced."
 mvlv_chi.7.a: "If people are saved, land will be lost, and both people and land will survive."