 CHI_overseas_chinese_network: "Overseas Chinese Network"
 CHI_overseas_chinese_network_desc: "By networking with Chinese communities in Southeast Asia, North America, etc., and outsourcing the production of consumer goods to them, we have succeeded in mobilizing almost all factories in Taiwan for the war against BETA."
 CHI_one_country_two_systems: "Third Kuomintang-Communist Cooperation"
 CHI_one_country_two_systems_desc: "The third Kuomintang-Communist cooperation, which was established in 1986 by the signing of the Kuomintang-Communist joint anti-BETA treaty, has a large distortion in its power relationship due to the loss of the mainland by the Communist government."
