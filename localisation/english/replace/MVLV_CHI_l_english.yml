l_english:
 CHI_focus_tree: "China National Focus Tree"
 CHI_idea_00: "Strengthening the Defense of the Strait"
 CHI_idea_00_desc: "Taiwan is now the last human survival zone left to China, and its fall would mean the collapse of the nation. Therefore, it is natural to further repair and expand the fortress."
 CHI_idea_01: "Looking Ahead to Reclaim"
 CHI_idea_01_desc: "Activate the production facilities that successfully evacuated from the mainland in full swing. Everything is for China."
 CHI_idea_01_Ex1: "Repositioning of Research Institutions"
 CHI_idea_01_Ex1_desc: "Reposition the research institutions that were dispersed under the jurisdiction of the two parties to extract research resources more efficiently."
 CHI_idea_02: "Taipei Remodeling Plan"
 CHI_idea_02_desc: "Now that we have lost the mainland, Taiwan is the front line of the war against BETA and we don't know when it will become a battlefield. Therefore, we should thoroughly redevelop Taiwan for the war against BETA and prepare for the upcoming battle."
 CHI_idea_03: "Contact with Overseas Chinese Capital"
 CHI_idea_03_desc: "We should reach out to those with high social status among our compatriots abroad and have them set up our military factories locally."
 CHI_idea_04: "Tainan Remodeling Plan"
 CHI_idea_04_desc: "The plan is phased but thoroughly implemented. Tainan, which is relatively far from the war in Taiwan, is no exception."
 CHI_idea_05: "Support from Jewish Capital"
 CHI_idea_05_desc: "Even now that Israel has fallen, the power of Jewish capital in the world is still great. It would not be a waste of effort to try to get support from them again, with whom we once cooperated in the development of the J-10."
 CHI_idea_01_Ex2: "Large Development of Palau Islands"
 CHI_idea_01_Ex2_desc: "Thorough redevelopment of Taiwan has been carried out for the upcoming reclamation, but there is a limit to one island. Therefore, it would be quite natural to try to make effective use of the islands in the Pacific."
 CHI_idea_01_Ex3: "Benefits of Capital"
 CHI_idea_01_Ex3_desc: "The Taiwan economy, which had been forcibly remodeled for the war against BETA due to the introduction of capital from abroad, has greatly improved."
 CHI_idea_06: "Preliminary Preparations for Counterattack"
 CHI_idea_06_desc: "The backbone of the upcoming counterattack is in place. Next, we should secure the necessary items by making full use of the established production system."
 CHI_idea_01_Ex4: "Investment in the Philippines"
 CHI_idea_01_Ex4_desc: "Taiwan's defense system is strong, but it would not be a waste to prepare for the worst."
 CHI_idea_11: "China from Now On"
 CHI_idea_11_desc: "The internal conflict between the two parties with completely different political systems is serious, and if this continues, not only the counterattack on the mainland but also the defense of Taiwan will not be possible."
 CHI_idea_12_R1: "Take Control of the Reds"
 CHI_idea_12_R1_desc: "After the defeat in the civil war between the Kuomintang and the Communists, our jurisdiction was limited to Taiwan and a few islands. However, the current situation where the Reds are retreating from the mainland and losing power is a good opportunity for us to take control and the Kuomintang to take the initiative."
 CHI_idea_12_R1_tt: "§YUnited Chinese Front§! changes the country name to §YRepublic of China§! \n"
 CHI_idea_12_R2: "Convergence of Chaos"
 CHI_idea_12_R2_desc: "Even among the Reds, there seem to be wise guys who are aware of their own position and continue to resist our moves. To achieve a quick end, we should not hesitate to use strong measures."
 CHI_idea_12_R3: "With the West..."
 CHI_idea_12_R3_desc: "Although we encountered some resistance, our attempt to take control of China is largely successful. It would not be a bad choice to further deepen relations with the Western countries on this occasion."
 CHI_idea_12_R4: "Research Agreement with the United States"
 CHI_idea_12_R4_desc: "The United States, the leader of the Western countries, is at the forefront of technology, and drawing out their technology would be a great benefit. The Eastern technology left by the Communist Party could be a good bargaining chip."
 CHI_idea_12_R5: "Legitimacy of Outer Mongolia"
 CHI_idea_12_R5_desc: "It is clear that Outer Mongolia, where the Ulan Bator hive is located, is historically part of China. Now that we can secure the support of Western countries, there is no reason to refuse to claim ownership."
 CHI_idea_12_S1: "Coexistence"
 CHI_idea_12_S1_desc: "Since the Communist Party entered the Presidential Office, the unified government has shown a cooperative attitude on the surface, but intense political strife has been constant inside. It is not difficult to imagine the humiliation of the Communist Party, which originally intended to conquer Taiwan, but now the situation is reversed. Looking at the fact that the Kuomintang did not cooperate until such a situation occurred, one can understand the depth of resentment towards the Communist Party. However, we are not in a position to fight each other. We should establish a truly unified government at any sacrifice."
 CHI_idea_12_S2: "Sacrifice"
 CHI_idea_12_S2_desc: "There are factions in both the Kuomintang and the Communist Party that aim for the unification of the government. In response, collaborators also appeared from the military. This has started a plan to aim for the establishment of a unified government in earnest. First, get rid of the fools in the government and take control of the Presidential Office at once. Take advantage of the chaos to also eliminate the radicals in the military. It's worth any sacrifice."
 CHI_idea_12_S3: "Preparation for a Unified Government"
 CHI_idea_12_S3_desc: "The unification faction quickly seized power. Most of the military units are in agreement and have returned to their original units. We have finally begun to move towards true unification."
 CHI_idea_12_S4: "Technical Unification"
 CHI_idea_12_S4_desc: "The People's Liberation Army and the Republic of China Army have fundamentally different technical systems. The People's Liberation Army has the know-how of anti-BETA combat from the experience on the mainland with Soviet-style equipment, and the Republic of China Army has Western cutting-edge electronic technology with American-style equipment. And both have what each other lacks. We, who have started to move towards unification, can establish an efficient military by combining them."
 CHI_idea_12_S5: "Republic"
 CHI_idea_12_S5_desc: "We, who have achieved both the unification of the government and the military, can finally declare to the world the establishment of a true unified state by the Chinese people. We have achieved it."
 CHI_idea_12_S5_tt: "§YUnited Chinese Front§! changes the country name to §YChinese Republic§! \n"
 CHI_idea_12_L1: "Quiet Purge"
 CHI_idea_12_L1_desc: "After all, all Chinese people should be governed by the leadership of the Communist Party, which is the best choice considering the war against BETA, and there is no need for the Kuomintang in its leadership."
 CHI_idea_12_L1_tt: "§YUnited Chinese Front§! changes the country name to §YPeople's Republic of China§! \n"
 CHI_idea_12_L2: "Establishment of the Committee"
 CHI_idea_12_L2_desc: "After the humiliating retreat from the mainland, there are those in the party who are beginning to seek obedience to the Kuomintang. In parallel with pushing forward the purge, the leadership structure within the party should also be renewed."
 CHI_idea_12_L3: "Experience on the Mainland"
 CHI_idea_12_L3_desc: "We have many lessons learned from the battle on the mainland. In order to break the current situation of being pushed into Taiwan, we must know what we lost and what we gained from them."
 CHI_idea_12_L4: "Planned Economy Management"
 CHI_idea_12_L4_desc: "For a long time under the rule of the Kuomintang, most of the workers in this land have been poisoned by the capitalist economy. For the upcoming battle against BETA, we must guide them to follow a more optimal economic plan by the Communist Party."
 CHI_idea_12_L5: "Under Sacrifice"
 CHI_idea_12_L5_desc: "We have been forced to make many sacrifices by BETA and have lost a lot. But since there is nothing more to lose, all we have to do is take back what was taken from us by BETA. If we are united as China, it is possible."
 CHI_idea_13: "Reconstruction of South China"
 CHI_idea_13_desc: "While the landing on the mainland is progressing smoothly, we cannot avoid the supply problem at the same time. Therefore, we will rebuild South China and make it a bridgehead for the future reclamation of the mainland."
 CHI_idea_14: "Reconstruction of the Coastal Area"
 CHI_idea_14_desc: "The area around Fuzhou, which is opposite Taiwan, is necessary for the safety of Taiwan, and its reconstruction project is urgent."
 CHI_idea_15_A: "The City of Beginning"
 CHI_idea_15_A_desc: "We have finally won after a long battle. The place where we, who have successfully reclaimed the Chinese mainland, will triumph is Nanjing, the birthplace of the republic born from the Xinhai Revolution, which is appropriate."
 CHI_idea_15_B: "The Capital of China"
 CHI_idea_15_B_desc: "We have finally succeeded in reclaiming the Chinese mainland. For the reconstruction that will last for a long time, Beijing, which has been the capital of China for a long time, such as the Ming Dynasty, the Qing Dynasty, and the People's Republic of China, would be convenient."
 CHI_ReviewDiploandWarStrat: "Review of Foreign Relations and Anti-BETA Strategy"
 CHI_ReviewDiploandWarStrat_desc: "The battle with BETA has been going on for 26 years, and we have conducted joint operations with many countries' armies. Now that we are cornered on the island of Taiwan, we are worried that we alone may not be able to regain our homeland, and we should actively seek assistance from outside."
 CHI_InvestAUSRefugeeFactory: "Investment in Australian Refugee Factories"
 CHI_InvestAUSRefugeeFactory_desc: "By investing in factories on land leased in Australia, where many refugees are housed, we can supply the front line while maximizing the power of refugees and reducing the burden on the host country."
 CHI_MilitaryCoopWithJapan: "Military Cooperation with Japan"
 CHI_MilitaryCoopWithJapan_desc: "Japan is dispatching troops to support the homeland decisive battle, and there is a certain basis for cooperation. Japan has suffered serious damage from the invasion of its homeland by BETA, and we believe they will not refuse our offer."
 CHI_InvestSouthAmericaFactory: "Investment in South American Refugee Factories"
 CHI_InvestSouthAmericaFactory_desc: "In order to resettle refugees, we also have leases in South America. Although it is far from Taiwan, it is not bad to invest there and build factories."
 CHI_LearnFromEEA: "Traditional Manufacturing Methods of Eastern Europe"
 CHI_LearnFromEEA_desc: "Intense combat tests the reliability of Tactical Surface Fighters, and the Eastern European Socialist Federation, which prioritizes the preparation of Tactical Surface Fighters, should learn from it."
 CHI_SendGEUAdvisors: "Dispatch of Military Advisory Group to Greater East Asia"
 CHI_SendGEUAdvisors_desc: "The Greater East Asia front is long and jungle warfare is the mainstay. Dispatching a military advisory group to Greater East Asia, learning from their combat experience, and strengthening military ties that will be used for future homeland recovery."
 CHI_UFC_USSR_TechCoop: "Request for Technical Cooperation from the Soviet Union"
 CHI_UFC_USSR_TechCoop_desc: "We have introduced the Soviet MIG21 and SU27 and made improvements. The Soviet Union has a similar operational philosophy to us, and asking the Soviet Union for technical cooperation will help improve technology."
 CHI_ResultOfExternalTechAid: "Thunder Crossing the Strait"
 CHI_ResultOfExternalTechAid_desc: "The Tactical Surface Fighter jointly developed by the Communist Party and the Kuomintang, redesigned based on long-term combat experience and the integration of Soviet and American technology, will surely give BETA a thunderbolt."
 CHI_AbsorbUSTSFTech: "Introduction of American Tactical Surface Fighter Manufacturers"
 CHI_AbsorbUSTSFTech_desc: "Defeated in competition, American Tactical Surface Fighter manufacturers are looking overseas. On this occasion, it might be possible to invite American Tactical Surface Fighter manufacturers and have them cooperate in the development of new Tactical Surface Fighters."
 CHI_DemandAidFromUS: "Request for Assistance from the United States"
 CHI_DemandAidFromUS_desc: "The U.S. strategy prioritizes Europe over Asia, but if we are willing to pay sufficient compensation, the U.S. may not refuse our request for assistance."

