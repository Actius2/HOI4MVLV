 AFR_EUR: "Economic Impact of EU"
 AFR_EUR_desc: "As Europe increases its investment in Africa and tightens relations between the two countries, the United Africa can effectively regulate the actions of European companies in Africa, and Africa can gain more benefits from trade between the two countries, but in return, Africa needs to provide more returns to European investors."
