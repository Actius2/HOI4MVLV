l_english:
 AFR_focus_tree: "African Union National Focus Tree"
 AFR_SecureSuezFront: "Stabilize the Suez Line"
 AFR_SecureSuezFront_desc: "All future plans start with ensuring the safety of the Suez defense."
 AFR_ConsolidateCommandingSequence: "Consolidate Command Chain"
 AFR_ConsolidateCommandingSequence_desc: "Although we claim to be unified externally, the command chain is still too dispersed and needs to be corrected."
 AFR_EvaluateDefenceLineCapabaility: "Evaluate Defense Network"
 AFR_EvaluateDefenceLineCapabaility_desc: "The Red Sea defense line has overcome several battles, but is it meeting the needs of a potentially more intense defense battle in the future?"
 AFR_UnbreakableDefence: "Unbreakable Defense"
 AFR_UnbreakableDefence_desc: "15 years ago, we started a bloody battle with BETA in the Red Sea. 15 years after the bloodshed, the Suez Line still stands strong, our defense is as solid as gold, and there is no possibility of being broken through."
 AFR_FocusOnHomefront: "Focus on the Home Front"
 AFR_FocusOnHomefront_desc: "Since there is no need to invest more resources in the defense network for the time being, it may be better to allocate the surplus resources to the development of the rear."
 AFR_AttractInvestment: "Attract Investment"
 AFR_AttractInvestment_desc: "Our large hinterland, South Africa, has the best infrastructure in all of Africa, and we believe that if we can attract foreign investors to this country, we can further develop it."
 AFR_IncreaseResourcesProduction: "Resource Development"
 AFR_IncreaseResourcesProduction_desc: "The engine of war does not function without a stable supply of resources."
 AFR_ImportAdvancedProductionTech: "Introduction of Advanced Production Technology"
 AFR_ImportAdvancedProductionTech_desc: "After the collapse of Europe, we absorbed a considerable number of European exiles, but we have not yet been able to build a production line as advanced as other countries, and we need to digest the technology."
 AFR_LiftConsumerGoodsLimitation: "Lifting Consumer Goods Restrictions"
 AFR_LiftConsumerGoodsLimitation_desc: "The people are exhausted from years of war. Now that Africa is safe and all industries are thriving, it's time to abolish quotas on consumer goods and increase people's satisfaction. A safe environment will also attract more foreign investment to Africa."
 AFR_SafeContinent: "Safe Continent"
 AFR_SafeContinent_desc: "The African continent, like the American continent, can be predicted to become a pristine land for all mankind."
 AFR_FormOrbitalCorps: "Formation of Orbital Corps"
 AFR_FormOrbitalCorps_desc: "Now that the safety of the continent has been confirmed, we should start thinking about forming an army in orbit to pave the way for future hive capture operations."
 AFR_Re_evaluateOurPosition: "Re-evaluate Our Role in the United Nations"
 AFR_Re_evaluateOurPosition_desc: "It is undeniable that the African Union has become one of the world's major powers."
 AFR_SafeHomeFront: "Safe Home Front"
 AFR_SafeHomeFront_desc: "Thanks to the solid defense, the people of Africa are gradually escaping from the fear of the BETA war."
 AFR_PrepareForAllPossibilities: "Prepare for All Possibilities"
 AFR_PrepareForAllPossibilities_desc: "The fact that the Suez Line will not be broken for the time being is not a reason to rest on past glories."
 AFR_SecondaryDefenceLine: "Alternative Defense Line"
 AFR_SecondaryDefenceLine_desc: "If the line is broken through, there is no time to hastily organize another defense line."
 AFR_FortificationGroupTactics: "Fortification Tactics"
 AFR_FortificationGroupTactics_desc: "The fact that East Germany and the Chinese United Front relied on fortifications to delay tactics was a tactic that was proven a long time ago, as demonstrated in the Suez defense."
 AFR_RequestMilitaryAids: "Request for Military Aid"
 AFR_RequestMilitaryAids_desc: ""
 AFR_ParticipateInTSFDev: "Participation in Tactical Surface Fighter Development"
 AFR_ParticipateInTSFDev_desc: "There is the most intense desert combat in the world, which is different from the current mainstream direction of Tactical Surface Fighter development, and we should participate in international Tactical Surface Fighter development to meet the needs of combat."
 AFR_LocalizeTSFProduction: "Local Production of Tactical Surface Fighters"
 AFR_LocalizeTSFProduction_desc: "Depending on foreign armies for the production of Tactical Surface Fighters is ultimately not a long-term solution. However, considering the fragility of our industrial base, it is expected that the performance of parts will be insufficient."
 AFR_SeasonedDefenceDoctrine: "Proven Defense Theory"
 AFR_SeasonedDefenceDoctrine_desc: "Having fought BETA for many years, we have accumulated defense experience against BETA that is second to none in the world."
 AFR_PrepareForCounterAttack: "Preparation for Counterattack"
 AFR_PrepareForCounterAttack_desc: "The Amber Hive is the biggest threat, and we must prepare for a counterattack."
 AFR_TargetH09: "Sword to Amber"
 AFR_TargetH09_desc: "The time has come to reclaim the land that was once ours and wipe out the threat of the Amber Hive."
 AFR_NorthAfricaCoastalDefence: "North African Coastal Defense"
 AFR_NorthAfricaCoastalDefence_desc: "Considering that the North African coast will become the direct first front if the European Union forces cannot hold Sicily and receive an underground invasion from Gibraltar, we must immediately prepare for fortification."
 AFR_LessonsFromJihadUnionForce: "Experience of the Union Forces in the Middle East"
 AFR_LessonsFromJihadUnionForce_desc: "The Mujahideen in the Middle East were the first to fight BETA after the C.S.S. They fought well in the first battle, but ultimately could not recover from defeat."
 AFR_ReformAdministrativeSystem: "Administrative System Reform"
 AFR_ReformAdministrativeSystem_desc: "A complex and entangled administrative system only reduces efficiency. Efficiency is what recent government agencies need most, not being pulled by multiple forces."
 AFR_aNewAfricaUnion: "A Closer African Union"
 AFR_aNewAfricaUnion_desc: "The original governments of the countries that make up today's African Union have become more closely and efficiently cooperative through administrative system reform."
 AFR_IntimateEuropeanUnion: "Closer to the European Union"
 AFR_IntimateEuropeanUnion_desc: "We have always built a close cooperative relationship with the EU."
 AFR_IndependentAfricaUnion: "Independent Africa"
 AFR_IndependentAfricaUnion_desc: "EU cooperation has brought us many benefits, and many of the top brass have become accustomed to leaving some issues to EU discretion, but to carve out the future of the African Union, we must step out on the path of autonomy."
 AFR_ResourcesForIndustry: "Resources for Industry"
 AFR_ResourcesForIndustry_desc: "Compared to the EU, we have a considerable amount of resources at our disposal in the African continent, and we can probably exchange this advantage with the EU and gain additional industrial assistance."
 AFR_CoopDefenceSicily: "Contribution to Sicily Defense"
 AFR_CoopDefenceSicily_desc: "As a sign of sincerity to go hand in hand with the EU, we should be able to dispatch our own army to Sicily to support the defense of Sicily."
 AFR_PurchaseEuroTSFs: "Purchase European Tactical Surface Fighters"
 AFR_PurchaseEuroTSFs_desc: "The excellence of EU Tactical Surface Fighters is well known in the world, and to strengthen the Tactical Surface Fighter unit, it is considered as one option to introduce European-made Tactical Surface Fighters."
 AFR_SeekDevCoop: "Seeking Joint Research"
 AFR_SeekDevCoop_desc: "As a higher stage of deeper cooperation between the two countries, we will reach an agreement on joint research and development of science and technology with the EU."
 AFR_ProvideConsumableForEU: "Provide Consumer Goods to the European Union"
 AFR_ProvideConsumableForEU_desc: "The European Union (EU) currently lacks the capacity to supply consumer goods to its domestic population."
 AFR_JointH12Suppression: "Joint Suppression of Lyon Hive"
 AFR_JointH12Suppression_desc: "The threat of underground excavation by the hive is a threat not only to the EU, but also to the security around Algiers, and to eliminate this threat, we must start a campaign to wipe out the hive jointly with the EU."
 AFR_LimitedCoopWithEU: "Limited Cooperation with the European Union"
 AFR_LimitedCoopWithEU_desc: "Also, there are limits to cooperation with the European Union (EU)."
 AFR_IncreaseOurShare: "Increase Contribution"
 AFR_IncreaseOurShare_desc: "In order to further cooperate with the United Nations, we need to show sincerity."
 AFR_WorkWithUNIndustries: "Industrial Cooperation with the United Nations"
 AFR_WorkWithUNIndustries_desc: "The United Nations Integrated Forces need more regions to enhance their industrial capabilities, and likewise, we also need more factories."
 AFR_ParticipateInUNProject: "Participation in United Nations Project"
 AFR_ParticipateInUNProject_desc: "The results of the scientific research projects of the United Nations Integrated Forces are provided without discrimination to all member countries participating."
 AFR_Rewards: "Harvest"
 AFR_Rewards_desc: "The valuable data obtained from the Prominence Plan will greatly accelerate our Tactical Surface Fighter development program."
 AFR_VictoryInspiration: "Prospects for Victory"
 AFR_VictoryInspiration_desc: "After a harsh battle, we finally broke through the hive. This victory will be the starting point for the African Union to completely annihilate BETA!"
 AFR_EmployUSMilitaryAdvisors: "Participation of U.S. Military Advisors"
 AFR_EmployUSMilitaryAdvisors_desc: "The U.S. Army has the most extensive experience in the world in terms of horizontal coordination of ground forces that we lack, and hiring military advisors from the United States may be a solution to this problem."
 AFR_IncreaseWarthogImportAmount: "Expansion of A-10 Procurement"
 AFR_IncreaseWarthogImportAmount_desc: "The ability of the A-10 to suppress small species is evident in the world, and in order to meet the needs of Suez defense, it is necessary to expand the import of A-10."
 AFR_JoinNATOIntelNetwork: "Joining NATO Information System"
 AFR_JoinNATOIntelNetwork_desc: "The United States has made a new proposal to us to join the NATO information network system and jointly observe the movements of BETA. We lack high-tech surveillance equipment and have no reason to refuse."
 AFR_AcceptNATO_AfricaCoalitionForce: "Acceptance of NATO Africa Coalition Force"
 AFR_AcceptNATO_AfricaCoalitionForce_desc: "After joining NATO, we sent our troops to North America for training, and now, the elite forces trained in this NATO have finally returned home."

###ideas
 AFR_eu_support: "Active Support by the European Union"
 AFR_eu_support_desc: "Africa holds a lot of meaning for the European Union, and it is absolutely necessary to avoid the fall of Suez and Sicily. Therefore, the European Union is making a large investment in African countries."
 AFR_eua: "Economic Colony"
 AFR_eua_desc: "Africa receives a lot of support from Europe, which indicates that its voice in Europe and the world is declining. Even changing a line in a factory requires asking European companies, and it is said to be an economic re-colonization by the former colonial powers."
