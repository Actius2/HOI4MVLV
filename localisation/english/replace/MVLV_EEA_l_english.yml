 EEA_I_7_desc: ""
 EEA_P_1: "Reorganization of the Alliance"
 EEA_P_1_desc: "We are the Eastern European Socialist Alliance, but we are heavily dependent on East Germany alone, and the alliance's system is extremely unstable. Reform is essential in any form."
 EEA_P_2_A: "Progress Towards East-West Unification"
 EEA_P_2_A_desc: "The rapprochement between East and West that has been attempted in the past has not yet been realized. But the time spent is by no means in vain, and the problems that prevent unification are being resolved. Now is the time to take a step towards East-West unification."
 EEA_P_2_BB: "Industrial Support"
 EEA_P_2_BB_desc: "Export Japan's excellent industrial machinery to the Soviet Union to increase this influence."
 EEA_P_3_A: "Sharing of Military Knowledge"
 EEA_P_3_A_desc: "Military cooperation with the West German army is already underway, but when a truly unified nation is established, it is inevitable that the military command system will also be unified, and preparation is necessary."
 EEA_P_4_A: "Unification of East-West Equipment"
 EEA_P_4_A_desc: "West Germany is one of the main countries of the European Union, and their equipment is mainly made in the West. Even if not right now, future equipment unification will be necessary."
 EEA_P_5_A: "Research Agreement"
 EEA_P_5_A_desc: "It is natural for two close countries to jointly research in the war against BETA."
 EEA_P_6_A: "Lamp"
 EEA_P_6_A_desc: "The events that happened in Berlin in 1983 are etched in people's memories. The path we have shaped by a girl is just a little more to reach the ideal."
 EEA_P_7_A: "Achievement"
 EEA_P_7_A_desc: "The unification project has advanced to the final stage and the fire she lit is never extinguished. Let's prove it."
 EEA_P_8_A: "One Germany"
 EEA_P_8_A_desc: "Once a fire is lit, it cannot be extinguished."
 EEA_P_2_B: "Reapproach to the Soviet Union"
 EEA_P_2_B_desc: "The Eastern European Socialist Alliance is, as its name suggests, an alliance formed by socialist countries. The Soviet Union has been distancing itself since their retreat from the Far East, but reapproaching it would be a choice to protect socialism."
 EEA_P_3_B: "Equal Relationship"
 EEA_P_3_B_desc: "Former Eastern European countries were essentially subjugated to the Soviet Union, the leader of the alliance. But now that the Soviet Union is in trouble, it is possible to build a relationship as equal allies."
 EEA_P_4_B: "Military Support"
 EEA_P_4_B_desc: "Tactical Surface Fighter exports are a valuable source of foreign currency for the Soviet Union, and it is not a loss for the entire Warsaw Pact for us to buy a large number of machines."
 EEA_P_5_B: "Tactical Guide"
 EEA_P_5_B_desc: "It is quite possible that we will fight with the Soviet Union in future counteroffensive operations. They would not deny the convening of military advisors for that."
 EEA_P_6_B: "Production Support"
 EEA_P_6_B_desc: "In order to break the current situation where the production capacity of the alliance is mostly dependent on East Germany, factories are built in various places as shared property of the alliance."
 EEA_P_7_B: "Tactical Surface Fighter Redesign"
 EEA_P_7_B_desc: "Our main Tactical Surface Fighter is made in the Soviet Union, but it is hard to say that its design is in line with our actual situation. Therefore, each part of the aircraft is redesigned to reflect the combat lessons on the European front."
 EEA_P_8_B: "Under the Flag of Socialism"
 EEA_P_8_B_desc: "The time has come for the fruits of reform centered on the new Warsaw Pact to finally bear fruit. We, united under one doctrine, will only stop when BETA is annihilated."
 EEA_P_9: "City Lights"
 EEA_P_9_desc: "After a long battle, we finally set foot on the ground of Berlin. The reconstruction of this place, which has become a complete ruin, is fraught with great difficulties and hardships, but it is not impossible. This time we will create a light in the city."
