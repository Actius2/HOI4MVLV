####ideas
 EEA_DDR: "Union Based on East Germany"
 EEA_DDR_desc: "Most of the Eastern European countries, which were exposed to BETA invasion earlier than Western European countries, suffered devastating damage, and it is no exaggeration to say that East Germany, which was the only one to successfully maintain national power, is supporting the Eastern European Socialist Alliance. However, it is not uncommon for member country governments to resist this de facto East German lordship."
 EEA_WTO: "Warsaw Treaty Organization"
 EEA_WTO_desc: "The Warsaw Treaty Organization was originally a military alliance formed to counter NATO, with the Soviet Union as its leader. However, since the Soviet Union's retreat from the Far East and the loss of its influence in Europe, it has been closing the distance with Western European countries, such as military exchanges between East and West Germany."
 EEA_WTO_2: "Warsaw Treaty Organization"
 EEA_WTO_2_desc: "The Warsaw Treaty Organization was originally a military alliance formed to counter NATO, with the Soviet Union as its leader. However, since the Soviet Union's retreat from the Far East and the loss of its influence in Europe, it has been closing the distance with Western European countries, such as military exchanges between East and West Germany."
 EEA_UNI: "Dispersed Command System"
 EEA_UNI_desc: "The armies of Eastern European countries, which have lost their influence along with the loss of their territories, have been dispersed under the command of the United Nations and the European Union, making it difficult to plan consistent operations."
 EEA_I1: "Research Assistance"
 EEA_P1: "East-West Detente"
 EEA_P1_desc: "The unification of East and West Germany is a symbolic event that allows the entire Eastern European countries to take a new step."
 EEA_P2: "The Alliance is One"
 EEA_P3: "Redesign"
 EEA_M1: "Excellent Frontline Technicians"
 EEA_M2: "Mobile Support Team"
 EEA_M3: "Trench Defense"

####events
 mvlv_eea.1.t: "German Unification"
 mvlv_eea.1.d: "Through the resolutions of the People's Assembly and the Union Council, we have finally signed the East-West Unification Treaty. The unification declaration by the representatives of East and West Germany was made in front of many public eyes, and the people of East and West are holding hands and raising a toast. The establishment of a unified Germany is perceived as a major movement in Eastern European countries, and it seems that the reintegration of Poland, which, like us, is divided into East and West governments, is also being considered."
 mvlv_eea.1.a: "We are witnessing a historic moment"
 mvlv_eea.2.t: "German Unification"
 mvlv_eea.2.d: "The discussion on the unification of East and West Germany, which has been actively carried out in the past, has finally come to fruition and the declaration of unification to the international community was made today. As a result, the Eastern European Socialist Alliance as a whole is expanding its movement to explore closer ties with the European Union, and progress in East-West relations is expected in the future."
 mvlv_eea.2.a: "It's a joyous thing"
 mvlv_eea.3.t: "The European Union Demands Integration"
 mvlv_eea.3.d: "While maintaining the basic policy of approaching the West, the reunification of East and West Germany gradually progressed towards completion. After the reunification of both Germanys, the Eastern European Socialist Alliance strengthened its ties with the European Union in all aspects, and the voice for European integration gradually increased. Now that the European Union has formally requested the Eastern European Socialist Alliance to join the European Union, should the Eastern European Socialist Alliance join the European Union on the spot, or should it be put on hold for the time being?"
 mvlv_eea.3.a: "Alright, let's start the procedure to officially join the European Union."
 mvlv_eea.3.b: "Hold until the end of the BETA war."

