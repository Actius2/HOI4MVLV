l_english:

 EUR_focus_tree: "European Union National Focus Tree"
 EUR_FortifyChannelDefence: "Strengthen the Channel Defense Line"
 EUR_FortifyChannelDefence_desc: "Since the Battle of Britain, our defense has been in an unstable state and needs to be strengthened urgently."
 EUR_RebuildLondon: "Rebuild London"
 EUR_RebuildLondon_desc: "London has suffered significant damage from previous battles, and rebuilding the city will also give confidence to the people."
 EUR_ReinforceSicily: "Strengthen Sicily"
 EUR_ReinforceSicily_desc: "Sicily is the frontline base for future counterattacks on the Apennines and the largest military fortress in the Mediterranean."
 EUR_JointEuroCommand: "European Union Command"
 EUR_JointEuroCommand_desc: "Today's European Joint Forces are composed of all the old EU member countries' armies, but to coordinate such an army, a joint command across borders is necessary."
 EUR_aDealMadewithAfrica: "Deal with Non-Related Companies"
 EUR_aDealMadewithAfrica_desc: "After the collapse of Western Europe, there were quite a few people who traveled to Africa via Italy and France."
 EUR_exchangeIntel: "Exchange of Information"
 EUR_exchangeIntel_desc: "The veterans of Africa on the Red Sea front should have accumulated a lot of valuable information about BETA activities."
 EUR_NorthAfricaArmyGroup: "Dispatch to North Africa"
 EUR_NorthAfricaArmyGroup_desc: "To further strengthen the cooperative relationship with the African Union and as a proof of our goodwill, the land forces of the European Union will be immediately deployed from Sicily to North Africa."
 EUR_CoopWithUN: "Cooperation with the United Nations"
 EUR_CoopWithUN_desc: "After losing a lot of land and valuable resources, our ability to develop independently is in a predicament, and scientific cooperation with the UN Joint Forces is the best solution at this point."
 EUR_IncreaseOurShare: "Increase in Active Contributions"
 EUR_IncreaseOurShare_desc: "If we ask the International Federation for more research resources and technical support, we must show sincerity."
 EUR_ParticipateinAL4: "Covert Participation in Alternative 4"
 EUR_ParticipateinAL4_desc: "The research results of Alternative 4, led by Japan, may benefit us in the long run."
 EUR_IntimateEEA: "Getting Closer to Eastern Europe"
 EUR_IntimateEEA_desc: "Regardless of the era or ideology, there is an unfulfilled dream of unity in Europe. Now that the ties between the Eastern European Socialist Federation and the Soviet Union are weakening, offering them cooperation will lead to bringing Eastern Europe closer to us."
 EUR_AlienateEEA: "Alienation of Eastern Europe"
 EUR_AlienateEEA_desc: "We cannot coexist with the people of the red camp, regardless of the era."
 EUR_OfferAid: "Offer Aid"
 EUR_OfferAid_desc: "Aid is not a matter of lip service. What the people of the Eastern European Socialist Federation need is not the empty promises of politicians, but visible, tangible resources."
 EUR_OfferEuroMadeTSF: "Offer of European Tactical Surface Fighters"
 EUR_OfferEuroMadeTSF_desc: "The Eastern European Socialist Union countries have been using relatively old MiG-29s and other Soviet-made second-generation, and even first-generation Tactical Surface Fighters, but as a proof of our goodwill, we should offer more advanced third-generation models."
 EUR_IncreaseConsumableGoods: "Increase in Allocation of Consumer Goods"
 EUR_IncreaseConsumableGoods_desc: "After solving the problem of weapon shortage in the Eastern European Socialist Union countries, additional aid in the form of consumer goods is needed to supplement the shortage of civilian factories, which will undoubtedly incur the resentment of the people."
 EUR_ExchangeTactics: "Tactical Exchange"
 EUR_ExchangeTactics_desc: "The Tactical Surface Fighter units of the Eastern European Socialist Federation have unparalleled experience in close combat that our army lacks, and similarly lack experience in coordinated combat between units."
 EUR_PoliticalAffection: "Political Influence"
 EUR_PoliticalAffection_desc: "European countries should gather under one flag, and even if we come from different camps, we can rely on today's dynamics to exert some political influence on the countries of Eastern Europe."
 EUR_ReconcilingIdeologyDifference: "Reconciling Ideological Differences"
 EUR_ReconcilingIdeologyDifference_desc: "It is not easy for the countries of Eastern Europe to abandon their former ideological differences and become our comrades."
 EUR_TheTrueEuropeanUnion: "The True European Union"
 EUR_TheTrueEuropeanUnion_desc: "The European Union welcomes the comrades of the Eastern European Socialist Federation, and we will cooperate for a common victory."
 EUR_LimitedAid: "Limited Support"
 EUR_LimitedAid_desc: "We have done everything we can to maintain the front."
 EUR_IntimateUSA: "Getting Closer to the United States"
 EUR_IntimateUSA_desc: "It is undoubtedly a safer choice to get closer to the United States than to approach the Eastern camp."
 EUR_ExchangeCombatData: "Combat Data Trading"
 EUR_ExchangeCombatData_desc: "The US military should have a wealth of experience in artillery battles because we are very similar in terms of tactical drill codes, but they will definitely need experience in close combat."
 EUR_AidFromUS: "Aid from the United States"
 EUR_AidFromUS_desc: "Just by slightly indicating acceptance of Alternative 5, America threw in the towel, and we were rewarded."
 EUR_ExpandOrbitalDivers: "Expansion of Orbital Forces"
 EUR_ExpandOrbitalDivers_desc: "With support from the United States, we have the opportunity to expand the Orbital Paratrooper Corps. They will be the main force of Hive attacks when we recapture Western Europe in the future."
 EUR_AidCanada: "Aid to Canada"
 EUR_AidCanada_desc: "Now that we have drawn a line with Eastern Europe, it is time to consolidate our rear production and start aid to Canada."
 EUR_CanadaIndustrialInvestment: "Investment in Canadian Evacuation Industry"
 EUR_CanadaIndustrialInvestment_desc: "Investing in the industry of evacuation sites in Canada will improve our production capacity more directly."
 EUR_LessonsFromBattleofLondon: "Lessons from the Defense of London"
 EUR_LessonsFromBattleofLondon_desc: "As the capital of the UK, London suffered a lot of damage from this battle and many shortcomings were exposed."
 EUR_ReflectOnBattleofEurope: "Reflect on the Battle of Europe"
 EUR_ReflectOnBattleofEurope_desc: "We were confident in defending the Western European continent, but our arrogance was shattered in the face of facts. What was wrong, and how can we improve, is a question that needs reflection."
 EUR_ImportA10ProductionLine: "Introduction of A10 Production Line"
 EUR_ImportA10ProductionLine_desc: "The American A-10 Tactical Walking Attack Aircraft in the West German operation demonstrated a powerful anti-small species combat capability, which was reflected in the report of the West German army."
 EUR_InvestInA12Development: "Investment in A12 Project"
 EUR_InvestInA12Development_desc: "Considering that many amphibious landing operations are inevitable in future operations, we should participate in the development plan of the A-12 Avenger as early as possible at this opportunity, so that this new amphibious Tactical Surface Fighter can be deployed in actual combat as soon as possible."
 EUR_PromoteJA44Tactic: "Tactical Promotion of Cerberus"
 EUR_PromoteJA44Tactic_desc: "The JA44 Cerberus Brigade in West Germany is good at fighting BETA."
 EUR_TheNewGenKnights: "Training of New Knights"
 EUR_TheNewGenKnights_desc: "Every morning, a noble opportunity comes, and every opportunity nurtures a noble knight. They are ready to dedicate their lives and everything for the country in every way, on every occasion, just like the brave men who continue to hold this determination, they deserve our gratitude." - Excerpt from "We Will Fight on the Beach"
 EUR_ImproveMk57Cannon: "Improvement of Support Cannon"
 EUR_ImproveMk57Cannon_desc: "The Mk57 Squadron Support Cannon has undergone large-scale combat testing, and all aspects should be improved in light of this data."
 EUR_DeployModifiedHuman: "Deployment of Modified Humans"
 EUR_DeployModifiedHuman_desc: "There is always a big controversy about modification technology, but nothing beats the results of actual combat."
 EUR_AdvancedFieldMedicalTreatment: "Advanced Field Medical Treatment"
 EUR_AdvancedFieldMedicalTreatment_desc: "Human modification technology integrates extremely advanced medical technology, and if these medical technologies are popularized, the level of medical treatment on the spot will be greatly improved, and more soldiers will be given the possibility of survival."
 EUR_LimitedUsageOfHumanModification: "Limited Use of Human Modification"
 EUR_LimitedUsageOfHumanModification_desc: "Human modification technology is costly, and even though its reliability in actual combat has been proven, the initial plan of mass use should be changed to limited deployment."
 EUR_MilitaryCooperationWithJapan: "Military Exchange with Japan"
 EUR_MilitaryCooperationWithJapan_desc: "The Japanese Empire, far away from us, is currently in a situation very similar to ours. Therefore, we should have a detailed military exchange with the Japanese Empire, and by learning from each other's combat experience, we can better deal with the war against BETA."

