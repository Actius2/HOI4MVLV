 EUR_power: "European Union Council"

 EUR_power_desc: "The European Union Council is the highest decision-making body of the European Union, composed of the governments of the member countries of the European Union. Although the authority of the UK is increasing, it is the mainstay of all the people of Europe, and it keeps the people of Europe scattered all over the world under the BETA war."
