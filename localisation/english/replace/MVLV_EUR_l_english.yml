 EUR_eng: "EU for the UK"
 EUR_eng_desc: "The UK, the only major country in the European Union that holds territory, has enormous authority in the European Union and can freely use the resources of the European Union for its own country. Naturally, there are many member countries that oppose this, and the European Union is on the verge of splitting."
