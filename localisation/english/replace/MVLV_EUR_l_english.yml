####events
 mvlv_eur.100.t: "Integration of the Eastern European Socialist Federation into the European Union"
 mvlv_eur.100.d: "Since the unification of East and West Germany, the ties between the Eastern European Socialist Federation and the European Union have become increasingly close, and the concept of European unification has gradually become realistic. After a series of negotiation meetings, the Eastern European Socialist Federation finally agreed to join the European Union, and the old Eastern European army was integrated into the European Army system and placed under unified command."
 EUR.100.a: "Cheers to the unification of Europe!"
 mvlv_eur.101.t: "Eastern European Socialist Federation Refuses"
 mvlv_eur.101.d: "The Eastern European Socialist Federation has put our participation on hold, in other words, politely declined. Surprisingly,"
 mvlv_eur.101.a: "Is the unification of Europe still a distant future?"