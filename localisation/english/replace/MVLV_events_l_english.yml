 mvlv_generic.0.t: "Brief history"
 mvlv_generic.0.d: "1944: Japan surrenders conditionally, ending the Pacific War.\n1945: Germany is bombarded with nuclear weapons and surrenders unconditionally. Germany is divided into East and West, ending World War II.\n1958: The Viking 1 probe encounters life on Mars for the first time.\n1966: Project Alternative begins.\n1967: A Martian lifeform attacks a lunar base, starting the First Lunar War. The Martian lifeform is named -BETA- and Project Alternative II begins.\n1973: The BETA land in Kashgar, China, and completely withdraw from the lunar surface. Project Alternative III begins.\n1974: The F-4 Phantom, the first tactical aircraft in human history, enters the battlefield.\n1978: Operation Paleologos succeeds in penetrating the Minsk Hive rhizome, but is wiped out within hours. 1979: The Vancouver Agreement comes into effect, and the United Nations Unified Army is established. 1983: Operation Neptune, Berlin falls despite the efforts of the European Allied Forces. 1985: The Soviet Union moves its core national functions to Alaska. West Germany and France fall one after another, and the battle for the British mainland begins. 1990: The BETA in Kashi begins a full-scale eastward advance. 1992: Operation Swaraj, orbital bombardment and orbital drop forces are deployed. 1995: Plan Alternative 4 begins. 1996: Backup Plan Alternative 5 is called for. 1998: The BETA land in Japan, and after a month of fierce defense, Kyoto falls and the capital is moved to Tokyo."
 mvlv_generic.0.a: "This is common knowledge around the world"

 mvlv_generic.100.t: "Personnel changes completed"
 mvlv_generic.100.d: "When the last re-entry destroyer disappeared toward the Lagrange point, all the security personnel breathed a sigh of relief, and the people outside the barbed wire gradually quieted down. -Though I feel abandoned and betrayed, I have no choice but to accept my fate. Until then, let's increase the quota of consumer goods appropriately, this is the only thing we can do to appease them,- said a leader of the League of Nations remaining on Earth at the meeting.\nThere were places for national dignitaries and their families to board the ship, but some chose to give up their places and live and die with the people."
 mvlv_generic.100.a: "Good luck to them, good luck to us."
 mvlv_generic.100.b: "Good luck to them, good luck to us. Let's start preparing for Project Dawn."

 mvlv_LA.1.t: "Central and South American Union"
 mvlv_LA.1.d: "The situation is deteriorating, and BETA is getting closer to the American continent. The so-called security of the United States is nothing more than an excuse to deceive and exploit us. The Latin American countries, which have been tormented by US interference since before the war, should be aware of the reality that the end is near. The Latin American countries should unite, allocate resources, mobilize urgently, train troops, build fortresses, and resist BETA with their own power. Even if this is our end, we must fight until the last moment."
 mvlv_LA.1.a: "Let's protect ourselves from foreign enemies together"
