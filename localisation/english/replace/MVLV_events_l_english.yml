 mvlv_generic.16.b: "Disable deletion"
 
 mvlv_generic.17.t: "Welcome to Muv-Luv mod"
 mvlv_generic.17.d: "As the leader of our nation, you will fight back against the BETA invasion! The enemy is powerful, but we must use our wisdom to find the right time to strike back."
 mvlv_generic.17.a: "View tactical tips"
 mvlv_generic.17.b: "See Goal Tips"
 mvlv_generic.17.c: "View difficulty hints"
 mvlv_generic.17.e: "Close (Go to difficulty selection)"
 mvlv_generic.18.t: "Tactical Tips"
 mvlv_generic.18.d: "BETA is very powerful, so we need to counter it with powerful weapons.\nTactical aircraft are available for that purpose.\nTherefore, we recommend that you focus most of your weapons production on these weapons.\nAlso, even with these weapons, it is not easy to resist BETA.\nWe strongly recommend that you fight in advantageous terrain and tactics as much as possible, and wait for the opportunity until you have enough fighting power."
 mvlv_generic.18.a: "Return"
 mvlv_generic.19.t: "Goal Tips"
 mvlv_generic.19.d: "This mod is created with the success or failure of Operation Ohka taking place at the end of 2001 as the final goal. \nTo carry out this operation, you need to maintain or recapture the United Nations base in Yokohama, Japan. \nTherefore, we recommend that you play this as your top priority."
 mvlv_generic.19.a: "See hints for Operation Ko-21"
 mvlv_generic.19.b: "See hints for Operation Ohka"
 mvlv_generic.19.c: "Return"
 mvlv_generic.20.t: "Hints for Operation Ko 21"
 mvlv_generic.20.d: "In the final story, there is an event to capture the Sado Island Hive, also known as No. 21. \nThe strategic weapon XG-70b will be mobilized in this event. \nPlease use this weapon and other units in combination to carry out an amphibious operation. It is also a good idea to use artillery shells and paratroopers. \nWe recommend that units that cannot participate wait around Yokohama Base in preparation for the next operation."
 mvlv_generic.20.a: "Return"
 mvlv_generic.21.t: "Hints for Operation Ohka"
 mvlv_generic.21.d: "This Operation Ohka will proceed with simple decisions. \nThe morale boost in Operation Ohka will not last long, so we strongly recommend that you proceed quickly. \nThe key to this operation is to secure a location called the gate of the original hive. \nDrop a large parachute corps at this location. \nFailure is not an option, so be sure to issue a forceful command. \nThen drop the main force, including the XG-70d. \nThis operation is difficult, so we do not recommend using only the XG-70b. \nSend this XG-70d to the center of the original hive to end it all."
 mvlv_generic.21.a: "View additional tips"
 mvlv_generic.21.b: "Return"
 mvlv_generic.22.t: "Someone's notes on Operation Ohka"
 mvlv_generic.22.d: "Reincarnated one, have you seen the tragic future? Me too.\nI'm here to ensure that their sacrifices are not in vain. ---\nTo capture the gate, it is best to drop a 200-240 width of airborne forces on one.\nIt is especially important to secure the two points above and below on the left side.\nIf we can secure these points, the survival chances of the XG-70d should increase dramatically.\nIt would be best to accompany them partway to protect the main force.\nThe main force should land immediately, at this point. There is no time to waste.\nUnfortunately, I cannot participate this time. I wish you good luck."
 mvlv_generic.22.a: "Return"
 mvlv_generic.22.t: "Difficulty Hints"
 mvlv_generic.23.d: "This mod has four difficulty levels. \nIt's a good idea to check the hints other than Total Eclipse to choose the difficulty level that suits you."
 mvlv_generic.23.a: "See hints for difficulty <§GExtra§!>."
 mvlv_generic.23.b: "See hints for difficulty <§CAlternative§!>."
 mvlv_generic.23.c: "See hints for difficulty <§YAlternative IV§!>."
 mvlv_generic.23.e: "Return"
 mvlv_generic.23.f: "See hints for difficulty <§RTotal Eclipse§!>."

 mvlv_generic.24.t: "Hints for difficulty <§GExtra§!>"
 mvlv_generic.24.d: "Difficulty level Extra is a difficulty level set for For real Lacrosse Arc fans. \nThis difficulty level gives players many buffs. \nIt's just right for getting used to the mechanics of this world."
 mvlv_generic.24.a: "Time to go win Lacrosse!"
 mvlv_generic.25.t: "Hints for difficulty Alternative"
 mvlv_generic.25.d: "Difficulty level Alternative is a difficulty level set for relatively experienced players. \n At this difficulty level, players are given some buffs. \n It's just right for a little test of your skill."
 mvlv_generic.25.a: "Return"
 mvlv_generic.26.t: "Hints for difficulty Alternative IV"
 mvlv_generic.26.d: "Difficulty level Alternative IV is for experienced players. \nIn this difficulty level, the production speed of BETA increases. \nAlso, effective buffs for players are reduced. \nThis allows you to have the main line story feel of Muv Luv Alternative."
 mvlv_generic.26.a: "Return"
 mvlv_generic.27.t: "Creed of flight A-01 Isumi's Valkyries"
 mvlv_generic.27.d: "Make your death Count"
 mvlv_generic.27.a: "Kill the BETA, Retake Humanity"
 mvlv_generic.28.t: "Hints for difficulty Total Eclipse"
 mvlv_generic.28.d: "Be desperate to carry out your duty."
 mvlv_generic.28.a: "Close"
 mvlv_generic.29.t: "Hints for difficulty Total Eclipse"
 mvlv_generic.29.d: "Never die in vain"
 mvlv_generic.29.a: "close"
 mvlv_generic.30.t: "Hints for difficulty Total Eclipse"
 mvlv_generic.30.d: "Despair not until your last breath."
 mvlv_generic.30.a: "close"
 mvlv_generic.31.t: "Hints for difficulty Total Eclipse"
 mvlv_generic.31.d: "Achieve your mission with all your might."
 mvlv_generic.31.a: "close"
 
 mvlv_generic.34.t: "Condemnation of the G-bomb"
 mvlv_generic.34.d: "Although it is BETA occupied territory, the G-bomb, a new type of bomb, was dropped in our former territory.\nDespite the information blockade, the news has already spread to the public.\nIf we respond incorrectly, there is a possibility that riots will break out.\nWe must work with the United Nations and various other countries to condemn that country.\n"
 mvlv_generic.34.a: "Blame [FROM.GetName]"
 mvlv_generic.34.b: "No, I had no choice but to do this."
 mvlv_generic.35.t: "Accusation from [FROM.GetName]"
 mvlv_generic.35.d: "Even though we wiped out the BETA en masse, some ungrateful people have criticized our country.\nHowever, it seems that the surrounding countries are agreeing with us.\nPerhaps we should tread more carefully from now on.\n"
 mvlv_generic.35.a: "Ungrateful"
 mvlv_generic.36.t: "G-bomb results"
 mvlv_generic.36.d: "We have used that new type of bomb to annihilate the BETA in the area it was dropped on.\nThere have been reports of unknown effects, but these are insignificant compared to this step.\n"
 mvlv_generic.36.a: "Praise the G-bomb"
 mvlv_generic.37.t: "G-bomb tragedy"
 mvlv_generic.37.d: "There is no other option but to do this. We are cornered and can no longer afford to care about appearances. I'm sure the characters in the novel felt the same way.\n"
 mvlv_generic.37.a: "The End is Near"
 mvlv_generic.38.t: "Abnormal seismic zone"
 mvlv_generic.38.d: "Earthquakes were observed all over the world at the same time.\nIt seems they occurred in areas where earthquakes don't usually happen.\n"
 mvlv_generic.38.a: "What on earth is going on...?"
 mvlv_generic.39.t: "Emergency!"
 mvlv_generic.39.d: "Emergency! Emergency! \n BETA have suddenly appeared at the capital headquarters! \n Urgent reinforcements! Urgent reinforcements..."
 mvlv_generic.39.a: "...."
 
 stability.22.t: "Refugee Liberation Front"
 stability.22.desc.a: "Against the backdrop of the BETA Wars, refugees were forced to live a brutal life with extreme deterioration of law and order, and in order to maintain order, the refugee camps each formed self-police corps. However, these self-policing groups turn into hotbeds of terrorism and gradually launch attacks on receiving countries that do not protect them. At first, the attacks were sporadic and did not cause much damage, but according to recent reports, the "Refugee Liberation Front", an organization organized by the Christians of the Compassionate Sect, has brought together the vigilante groups of the refugee camps and begun to carry out attacks in an organized manner. This is on a scale that cannot be stopped by police organizations alone, and its impact is deepening. "
 stability.22.desc.b: "The attacks of the Refugee Liberation Front are becoming increasingly violent. Small-minded countermeasures do not seem to be having any effect. The Refugee Liberation Front is demanding better lives for refugees and the right to vote, and those who had refused to participate in terrorist activities have been inspired by the participants around them to join the Refugee Liberation Front. So far, relying on reserves, strikes on frontline supplies have been more or less subdued, but it is only a matter of time before this attack has an impact on the ability to execute the war. The Ministry of Defense has asked the government not to compromise on terrorism, but other factions within the government believe that the situation can be calmed by meeting the demands of the refugees. "
 stability.22.desc.c: "Terrorist attacks have spread throughout the country, affecting not only industries directly related to the war, but also the service sector. The fact that there are many former soldiers among the terrorists, although it is not known where they got the mechanized armored infantry and tactical machines to participate in the attacks has been confirmed. According to reports from the secret police, the production of weapons for the mass uprising seems to have begun in the occupied factories. The Army High Command believed that it could be suppressed with more decisive measures by loyalist forces, but the government's civilian officials believed that this would develop into a civil war that would surely fail. "
 stability.22.a: "Our supplies are precious and there is no surplus to give to terrorist organizations"
 stability.22.b: "Please publish an emphasis on support for refugees. This should buy time"
 stability.22.c: "Provide immediate assistance to refugee camps to reduce dissatisfaction"
 stability.22.d: "Make an example of terrorists and obsequious factions"
 stability.22.e: "Request the United Nations to send security forces"
 stability.22.f: "Take troops from the front line to maintain law and order"
 stability.22.g: "Provide quasi-citizenship to refugees"
 strikes_event.1.t: "Emergency meeting convened by the government"
 strikes_event.1.desc: "The government's stated policy of emphasizing support for refugees seems to be working. Out of a certain level of trust in the government, those who have participated in terrorist activities and those who have been asked to do so trust the government, stop participating in terrorist activities and return to their original camps. The Refugee Liberation Front (RLF) is considered to have accepted this demand before withdrawing from the country and will remain steady for some time. However, this policy is after all only temporary and if a long term program of improvement is not put in place soon, the Refugee Liberation Front will again launch attacks in our country."
 strikes_event.1.a: "The people are so simple when they back down after saying something like this. "
 strikes_event.2.t: "Failure of the emergency meeting."
 strikes_event.2.desc: "Last night, the government announced aid for refugees at an emergency press conference, but not a single person believed it. The words of the government, which so far has no support, mean nothing. The Refugee Liberation Front (RLF) took the opportunity to intensify its offensive and bring the refugees into its fold. As more attacks are expected to occur in the future, there is also a growing sense of unease among the nation. Improvement of the situation is expected to take a long time. It is also inevitable that the battle with BETA will go badly."
 strikes_event.2.a: "Not as expected. "
 strikes_event.3.t: "Support supplies."
 strikes_event.3.desc: "As long as there is plenty of food, a house, and clothes to wear, dissatisfaction will diminish. In the end, people will be satisfied as long as they have physical things in their hands. The support shipments that arrived at the camps were warmly welcomed by the refugees, delivering enough support to the camps to live on for several months. As a result, fewer refugees listened to the Refugee Liberation Front and it became difficult to carry out organized attacks in our country. The number of refugees assisting the government also began to increase, and the pace of social stabilization accelerated."
 strikes_event.3.a: "Fantastic. "
 strikes_event.4.t: "Making an example of the people."
 strikes_event.4.desc: "[Root.GetLeader] Today, refugees and Christian Compliant followers involved in terrorist activities were executed for treason. Terrorists aside, the news of the execution of adherents of the religious group Christian Deference is shocking, and condemnation of [Root.GetLeader] abounds, but it was enough to demoralize the refugees. With many refugees refusing to join not only the Refugee Liberation Front, but also the Christian Compassionate Sect, it is safe to say that the likelihood of an attack by terrorists is greatly reduced. But history has shown that terrorist oppression does not last. It is too optimistic to predict that there will be no problems in the future. The terrorists, led by the Refugee Liberation Front, have not stopped moving."
 strikes_event.4.a: "It can't be helped. "
 strikes_event.5.t: "Angry believers."
 strikes_event.5.desc: "[Root.GetLeader] Today, refugees and adherents of the Christian Compassionate Sect who were involved in terrorist activities were executed for treason. Terrorists aside, the news of the execution of the followers of the religious group Christian Compline has shocked believers in the country, who have been criticizing the government. They even began to openly call on believers to join the refugee liberation front and asked [Root.GetLeader] to know the wrath of God. The Refugee Liberation Front, which has gathered a large number of believers, also said, "The execution of the refugees who survived the Last Judgment is absurd and we cannot forgive it. We will launch larger attacks." The statement was issued by the FSLR, which is the only organization that has made a statement. Further strikes against the production base will be inevitable. "
 strikes_event.5.a: "What shall we do? "
 strikes_event.6.t: "The UN maintains the security forces"
 strikes_event.6.desc: " [Root.GetLeader] announced today that it will be receiving support from the UN peacekeeping force. As a result, in a few days UN troops will be deployed to refugee camps everywhere. Although the inability to suppress terrorist attacks in one's own country has been laughed at by various countries, it can be considered an effective countermeasure in the sense that it can be policed without using one's own country's resources. However, it is still doubtful whether the UN forces with no experience can fulfill the task perfectly, and it is still unknown whether the terrorists can be completely eliminated. "
 strikes_event.6.a: "Couldn't care less "
 strikes_event.7.t: "Operation Christopher."
 strikes_event.7.desc: "Live troops were stationed near the refugee camp all night, conducting large-scale maneuvers and light training. As the sun appeared on the horizon and the refugees who were constructing barricades pinned their hopes on support from the Refugee Liberation Front, the attacking columns moved. The exhausted refugees were late in organizing resistance. The army would eliminate the armed refugees, leaving a small force to protect the unarmed ones, and all the masterminds would be arrested, according to the lists in the camps. By noon, the army had complete control of the camps and declared a curfew. No further resistance could be expected. Most of the refugees would be released on terms that would assist the state, while the masterminds of the terrorist attacks would be detained and put on trial. The death penalty is a possibility. "
 strikes_event.7.a: "Requirements were changed. "
 strikes_event.8.t: "The Battle of Fort Riel."
 strikes_event.8.desc: "Troops were stationed outside the camp overnight, and the training in light and heavy penetration was appalling. When the troops moved, they found the refugees on the alert and ready. However, it was not possible to stop the attack of the army committed to mechanized armored infantry, and thus the operation to suppress the terrorists was considered successful, when suddenly the troops of tactical machines appeared. The army, which had not responded to the tactical equipment, suffered devastating losses. The commander in charge of the \n\n withdrew his troops to request reinforcements, but the Refugee Liberation Front took advantage of the situation and took the refugees, leaving them lost. Although a massive search will be launched tomorrow, the army commander who witnessed the terrorists' superior piloting skills in the Refugee Liberation Front's tactical planes no longer believes there is a chance of victory. "
 strikes_event.8.a: "There is less and less to do. "
 strikes_event.9.t: "Refugee Rights Protection Act"
 strikes_event.9.desc: "With tensions running high in the capital, [Roots.GetLeader] has finally published a new bill to protect the rights of refugees. The law, which includes guarantees of adequate food, citizenship for those who have worked for the country for years, and the right to vote, is unprecedented. Government sources believe that this is enough to bring the terrorists to their knees completely. The Refugee Liberation Front has completely retreated from the country. "
 strikes_event.9.a: "That's enough if it goes well. "
 improved_worker_conditions: "Refugee support policy"
 improved_worker_conditions_desc: "Although refugees are not our nationals, if we leave them alone they could become a breeding ground for terrorism. By formulating and implementing support policies, we can prevent terrorism from occurring. "

#news________________________________________________________________________________
 mvlv_news.1.t: "Successfully conquered the Hive"
 mvlv_news.1.d: "On this day, despite the great sacrifices made, humanity succeeded in taking [Root.GetName].\nThe soldiers and supplies lost will never be returned, but humanity has certainly taken a step towards a counterattack."
 mvlv_news.1.a: "well done!"
 mvlv_news.2.t: "BETA reoccupation of the Hive"
 mvlv_news.2.d: "[Root.GetName], which we had captured by consuming large amounts of expensive supplies and soldiers, has been reoccupied by the BETA.\n Victory for humanity is now further away."
 mvlv_news.2.a: "I can not believe that"
 mvlv_news.3.t: "Successfully conquered the Hive"
 mvlv_news.3.d: "On this day, despite the great sacrifices made, humanity succeeded in taking [Root.GetName].\nThe soldiers and supplies lost will never be returned, but humanity has certainly taken a step towards a counterattack."
 mvlv_news.3.a: "Don't let their sacrifices go to waste!"
 mvlv_news.3.b: "well done!"
 mvlv_news.4.t: "Dropping the G-bomb"
 mvlv_news.4.d: "The Yokohama Hive suffered devastating damage when America dropped G-bombs. This was a historic achievement, but there are also reports that many troops were caught up in it. In addition, the power of the bombs was less than expected, and there was contamination caused by an abnormal phenomenon that is difficult to explain, so there is a lot of talk about the threat of G-bombs in various countries."
 mvlv_news.4.a: "Oh my goodness"
 mvlv_news.5.t: "It's a brain!"
 mvlv_news.5.d: "We have received top secret information from an intelligence agency.\nThe guards have discovered a large number of human brains inside the Yokohama Hive.\nUnfortunately, no survivors have been confirmed.\nThis information is strictly forbidden to be made public, as it could have a major impact on soldier morale and public sentiment."
 mvlv_news.5.a: "I can not believe that···"
 mvlv_news.6.t: "Operation Myojo"
 mvlv_news.6.d.b: "The Empire of Japan has launched Operation Myojo, a large-scale counteroffensive. The success of this operation will be crucial in humanity's war against the BETA."
 mvlv_news.6.b: "Good Luck"
 mvlv_news.6.d.a: "We have done everything we can to prepare for this day. Now is the time to fight back."
 mvlv_news.6.a: "The counterattack begins!"
 mvlv_news.7.t: "[FROM.GetName] changed the difficulty"
 mvlv_news.7.d: ""
 mvlv_news.7.a: "Understood"

