mvlv_jap.27.t: "Breakthrough of coastal defense line"
mvlv_jap.27.d: "A super-expanded count of BETA on the upper coast, the entire coastal defense force has been destroyed, but it is impossible to prevent it from registering. The arrival of the imperial army in the presence of BETA is fierce."
mvlv_jap.27.a: "Imperial forces are still here, but the forces are expanding quickly."