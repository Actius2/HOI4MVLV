 mvlv_generic.5.t: "Mount Tengen eruption"
 mvlv_generic.5.d: "Information has come in that a volcano called Tengenzan in Japan has erupted. The Japanese government has requested assistance from the United Nations forces."
 mvlv_generic.5.a: "No need to lend a hand"
 mvlv_generic.5.b: "Send in a training squad."
 mvlv_generic.6.t: "Strategic Research Group"
 mvlv_generic.6.d: "Recently, a bipartisan organization called the Strategic Research Society was formed within the military. Its purpose is still unclear, but there is information that the United States and the United Nations are working behind the scenes, so caution is required."
 mvlv_generic.6.a: "Keep an eye on the trends"
 mvlv_generic.7.t: "Rising"
 mvlv_generic.7.d: "Earlier this morning, the First Tactical Armored Regiment, led by Captain Sagiri, rose up in the Imperial Capital! According to a statement, their goal is to overthrow the current administration that has been treating His Highness with contempt, and to return His Highness's rightful authority."
 mvlv_generic.7.a: "Make the defense of the Imperial Capital your top priority!"
 mvlv_generic.8.t: "Coup in Japan"
 mvlv_generic.8.d: "The CIA has been preparing for a coup in Japan for some time now, and it seems that it is about to be carried out. Now is the time to intervene."
 mvlv_generic.8.a: "Conducting large-scale interventions"
 mvlv_generic.8.b: "Let's send in the special forces."
 mvlv_generic.9.t: "Deadly Combat"
 mvlv_generic.9.d: "It turns out that His Highness has escaped the Imperial capital. The rebel forces are pursuing him towards the Izu Peninsula, where US and UN forces are stationed and a large-scale battle seems to be unfolding."
 mvlv_generic.9.a: "Hurry and grasp the situation!"
 mvlv_generic.10.t: "Fierce Fight"
 mvlv_generic.10.d: "It turns out that His Highness has escaped the Imperial capital. The rebel army is pursuing His Highness towards the Izu Peninsula, where UN forces have been deployed and a large-scale battle seems to be unfolding."
 mvlv_generic.10.a: "Hurry and grasp the situation!"
 mvlv_generic.12.t: "The outcome of the uprising"
 mvlv_generic.12.d: "After a fierce battle, the main force of the revolting army was annihilated. His Highness succeeded in escaping to the United Nations Yokohama Base and has already issued a statement. The remaining revolting army members have also surrendered and returned to their original units."
 mvlv_generic.12.a: "An audience with His Highness"
 mvlv_generic.13.t: "Successful uprising"
 mvlv_generic.13.d: "After a fierce battle, the rebel forces managed to capture His Highness. Captain Sagiri, the leader of the rebel forces, issued a statement announcing that all authority would be returned to His Highness."
 mvlv_generic.13.a: "Give His Highness his due authority!"
 mvlv_generic.14.t: "Death of Yuuhi"
 mvlv_generic.14.d: "Whether it was a stray bullet or a targeted one... The tactical aircraft carrying His Highness was hit while rushing to escape. The guard only suffered minor injuries thanks to his reinforced equipment, but His Highness was seriously injured. It seems that his chances of recovery are slim..."
 mvlv_generic.14.a: "Now let's mourn..."
